    for (const [in_, uit] of [
        ['R 1 1/4 "', '1 1/4"'], ['R 1"', '1"'], ['R 1/8 "', '1/8"'],
        ['R 3/4 "', '3/4"'], ['R  2  1/2  "', '2 1/2"'],
    ]) {
        check(`'${in_}' -> '${uit}'`, cat.en10255Maat(in_) === uit,
            `'${cat.en10255Maat(in_)}'`);
    }

    log('\n--- profiellabels per soort ---');
    const nep = (table, catalogue, extra = {}) =>
        ({ table, catalogue, name: 'HiCAD-naam', ...extra });
    for (const [omschrijving, p, uit] of [
        ['rond', nep('DIN_EN_10210-2_R', { DA: 48.3, S: 2.6 }), 'CHS 48.3x2.6'],
        ['rond, hele maten', nep('DIN_EN_10219-2_R', { DA: 60.0, S: 3.0 }), 'CHS 60x3'],
        ['vierkant', nep('DIN_EN_10219-2_HQ', { B: 40.0, S: 3.0 }), 'SHS 40x40x3'],
        ['rechthoekig', nep('DIN_EN_10210-2_HR', { A: 160.0, B: 80.0, S: 6.0 }),
            'RHS 160x80x6'],
        ['gasbuis heavy', nep('DIN_EN_10255', { SIZE: 'R 1"', TYPE: 'H', DA: 33.7, S: 4.0 }),
            '1" heavy – 33.7x4'],
        ['gasbuis medium',
            nep('DIN_EN_10255', { SIZE: 'R 1 1/4 "', TYPE: 'M', DA: 42.4, S: 3.2 }),
            '1 1/4" medium – 42.4x3.2'],
    ]) {
        check(`${omschrijving}: ${uit}`, cat.profielLabel(p) === uit, cat.profielLabel(p));
    }

    log('\n--- terugval voor mappen die er later bijkomen ---');
    // De opdracht noemt I/H, hoeklijn, U-profielen en strip als toekomst. Die
    // mogen niet omvallen: categorie uit het manifest-veld, mapnaam als
    // normlabel, BEZ_1090 als profiellabel.
    const toekomst = nep('DIN_EN_10056-1', { BEZ_1090: 'L 50x50x5' },
        { category: 'Angles' });
    check('onbekende map: categorie uit het manifest-veld',
        cat.categorieVan(toekomst).label === 'Angles',
        cat.categorieVan(toekomst).label);
    check('onbekende map: de mapnaam is het normlabel',
        cat.normLabel('DIN_EN_10056-1') === 'DIN_EN_10056-1',
        cat.normLabel('DIN_EN_10056-1'));
    check('onbekende map: BEZ_1090 is het profiellabel',
        cat.profielLabel(toekomst) === 'L 50x50x5', cat.profielLabel(toekomst));
    check('onbekende map zonder BEZ_1090: dan de HiCAD-naam',
        cat.profielLabel(nep('DIN_EN_X', {}, { category: 'Flats' })) === 'HiCAD-naam');
    check('Flats heet "Flat bars"',
        cat.categorieVan(nep('DIN_EN_X', {}, { category: 'Flats' })).label === 'Flat bars');
    check('een onbekende category valt terug op "Other"',
        cat.categorieVan(nep('DIN_EN_X', {}, { category: 'Verzonnen' })).label === 'Other');

    log('\n--- warm- of koudgevormd komt van de NORM, niet van HQ/HR ---');
    check('EN 10210-2 is warmgevormd',
        cat.vormgevingVan('DIN_EN_10210-2_HQ') === 'hot');
    check('EN 10219-2 is koudgevormd',
        cat.vormgevingVan('DIN_EN_10219-2_HQ') === 'cold');
    check('EN 10255 is geen van beide',
        cat.vormgevingVan('DIN_EN_10255') === 'geen');

    log('\n--- deduplicatie: gelijk label binnen een map = één profiel ---');
    const dubbelManifest = {
        format: 'hicad-catalogue-profiles/1',
        profiles: [
            { table: 'DIN_EN_10255', tableId: 1, file: 'a.stp', category: 'RoundTubesOther',
              name: '1 " H  DIN EN 10255', items: [{ itemId: 10, material: 'S235JRH' }],
              catalogue: { SIZE: 'R 1"', TYPE: 'H', DA: 33.7, S: 4.0 } },

    const geoDet = await win.eval("import('/profiel-geometrie.js')");

    // SHS 40x40x3: de catalogus zegt ASTEG 421. Gemeten is het 420,82. Dat
    // verschil van 0,18 is precies waarom ASTEG eruit moest - de kolom is op
    // drie cijfers afgerond.
    const shsProfiel = zoekBestand('DIN_EN_10219-2_HQ/HQ_40x40x3_EN_10219-2.stp');
    check('SHS 40x40x3 is op bestandsnaam te vinden', !!shsProfiel);
    const shsMeting = await geoDet.doorsnedeVan(shsProfiel);
    log(`SHS 40x40x3: gemeten ${shsMeting.oppervlak.toFixed(2)} mm², `
        + `catalogus ASTEG ${shsProfiel.bron.catalogue.ASTEG}`);
    check('de meting wijkt af van ASTEG — dat is de hele reden',
        Math.abs(shsMeting.oppervlak - shsProfiel.bron.catalogue.ASTEG) > 0.1,
        `${shsMeting.oppervlak.toFixed(4)} tegenover ${shsProfiel.bron.catalogue.ASTEG}`);
    check('maar scheelt wel minder dan een halve eenheid — ASTEG is afgerond',
        Math.abs(shsMeting.oppervlak - shsProfiel.bron.catalogue.ASTEG) < 0.5,
        Math.abs(shsMeting.oppervlak - shsProfiel.bron.catalogue.ASTEG).toFixed(4));

    log('\n--- het nulpunt is het doosje, NIET het zwaartepunt ---');
    // De correctie uit de tweede opdracht. Bij een koker vallen de twee samen,
    // bij hoekstaal niet. Zou de plaatsing het zwaartepunt voor het hart
    // aanzien, dan staat zo'n staander 15 mm scheef.
    check('een koker ligt wél om zijn zwaartepunt',
        Math.hypot(...shsMeting.zwaartepunt) < 0.01,
        shsMeting.zwaartepunt.map(v => v.toFixed(4)).join(', '));

    const hoekProfiel = zoekBestand('DIN_EN_10056-1_LG/L_EN_10056-1-50x50x5.stp');
    check('hoekstaal L 50x50x5 zit in de nieuwe catalogus', !!hoekProfiel);
    if (hoekProfiel) {
        const hoekMeting = await geoDet.doorsnedeVan(hoekProfiel);
        log(`L 50x50x5: doosje ${hoekMeting.doos.dx.toFixed(3)} x `
            + `${hoekMeting.doos.dy.toFixed(3)}, zwaartepunt `
            + hoekMeting.zwaartepunt.map(v => v.toFixed(3)).join(', '));
        check('het omhullende doosje is 50 x 50 en staat om de oorsprong',
            Math.abs(hoekMeting.doos.dx - 50) < 0.01
            && Math.abs(hoekMeting.doos.dy - 50) < 0.01,
            `${hoekMeting.doos.dx.toFixed(3)} x ${hoekMeting.doos.dy.toFixed(3)}`);
        check('maar het zwaartepunt ligt op (10,964; -10,964) — 15 mm ernaast',
            Math.abs(hoekMeting.zwaartepunt[0] - 10.964) < 0.01
            && Math.abs(hoekMeting.zwaartepunt[1] + 10.964) < 0.01,
            hoekMeting.zwaartepunt.map(v => v.toFixed(3)).join(', '));

        // Eén draad: dit profiel is massief. De uittrekcode moest dat aankunnen
        // en kan het ook - nagemeten in doorsnedeproef.html op alle 594.
        const hoekStaaf = await geoDet.maakStaaf(hoekProfiel, 1000);
        const hoekDoos = new ocDet.Bnd_Box_1();
        ocDet.BRepBndLib.Add(hoekStaaf, hoekDoos, false);
        const ha = hoekDoos.CornerMin(), hb = hoekDoos.CornerMax();
        log(`op 1000 getrokken: ${(hb.X() - ha.X()).toFixed(2)} x `
            + `${(hb.Y() - ha.Y()).toFixed(2)} x ${(hb.Z() - ha.Z()).toFixed(2)}`);
        check('op 1000 mm getrokken geeft 50 x 50 x 1000 — één draad werkt',
            Math.abs(hb.X() - ha.X() - 50) < 0.01
            && Math.abs(hb.Y() - ha.Y() - 50) < 0.01
            && Math.abs(hb.Z() - ha.Z() - 1000) < 0.01,
            `${(hb.X() - ha.X()).toFixed(3)} x ${(hb.Y() - ha.Y()).toFixed(3)} x `
            + `${(hb.Z() - ha.Z()).toFixed(3)}`);
        hoekDoos.delete();
    }

    log('\n--- de hoogte loopt langs +Y, niet "de lange zijde" ---');
    // De correctie uit de tweede opdracht. IPE 200 is 100 breed en 200 hoog;
    // zou de lange zijde langs Y lopen, dan kwam er 200 x 100 uit.
    const ipeProfiel = zoekBestand('DIN_1025-5/IPE_200.stp');
    check('IPE 200 zit in de catalogus', !!ipeProfiel);
    if (ipeProfiel) {
        const ipeMeting = await geoDet.doorsnedeVan(ipeProfiel);
        log(`IPE 200: doosje ${ipeMeting.doos.dx.toFixed(2)} x `
            + `${ipeMeting.doos.dy.toFixed(2)}, oppervlak `
            + `${ipeMeting.oppervlak.toFixed(2)} mm²`);
        check('breedte 100 langs X, hoogte 200 langs Y',
            Math.abs(ipeMeting.doos.dx - 100) < 0.01
            && Math.abs(ipeMeting.doos.dy - 200) < 0.01,
            `${ipeMeting.doos.dx.toFixed(3)} x ${ipeMeting.doos.dy.toFixed(3)}`);
        check('een I-profiel is symmetrisch, dus zwaartepunt op de oorsprong',
            Math.hypot(...ipeMeting.zwaartepunt) < 0.01,
            ipeMeting.zwaartepunt.map(v => v.toFixed(4)).join(', '));

        const ipeStaaf = await geoDet.maakStaaf(ipeProfiel, 1000);
        const ipeDoos = new ocDet.Bnd_Box_1();
        ocDet.BRepBndLib.Add(ipeStaaf, ipeDoos, false);
        const ia = ipeDoos.CornerMin(), ib = ipeDoos.CornerMax();
        check('op 1000 mm getrokken geeft 100 x 200 x 1000',
            Math.abs(ib.X() - ia.X() - 100) < 0.01
            && Math.abs(ib.Y() - ia.Y() - 200) < 0.01
            && Math.abs(ib.Z() - ia.Z() - 1000) < 0.01,
            `${(ib.X() - ia.X()).toFixed(2)} x ${(ib.Y() - ia.Y()).toFixed(2)} x `
            + `${(ib.Z() - ia.Z()).toFixed(2)}`);
        ipeDoos.delete();

        // Eén draad tegenover twee: een I-profiel is massief, een buis hol.
        const draden = (face) => {
            let n = 0;
            for (const we = new ocDet.TopExp_Explorer_2(face,
                     ocDet.TopAbs_ShapeEnum.TopAbs_WIRE,
                     ocDet.TopAbs_ShapeEnum.TopAbs_SHAPE); we.More(); we.Next()) n++;
            return n;
        };
        log(`draden: IPE 200 -> ${draden(ipeMeting.face)}, `
            + `SHS 40x40x3 -> ${draden(shsMeting.face)}`);
        check('het doorsnedevlak van IPE 200 heeft ÉÉN draad',
            draden(ipeMeting.face) === 1, draden(ipeMeting.face));
        check('en dat van een koker TWEE — buiten- en binnenkant',
            draden(shsMeting.face) === 2, draden(shsMeting.face));
    }

    log('\n--- snelfilters ---');

    const naKoud = [...boomVak.querySelectorAll('.pz_profiel')].map(b => b.textContent);
    log('koudgevormd + "40x40x3":', naKoud.join(' | '));
    check('filteren op koudgevormd laat er één over', naKoud.length === 1, naKoud.length);
    vormKeuze.value = 'alle';
    vormKeuze.dispatchEvent(new Event('change', { bubbles: true }));

    log('\n--- onzin zoeken geeft een nette melding ---');
    zoekVeld.value = 'bestaatniet';
    zoekVeld.dispatchEvent(new Event('input', { bubbles: true }));
    check('geen treffers: "Niets gevonden"', /Niets gevonden/.test(boomVak.textContent),
        boomVak.textContent.trim().slice(0, 40));
    check('en 0 van 2336 in de teller', /^0 van 2336/.test(aantalEl.textContent),
        aantalEl.textContent);

    log('\n--- kiezen levert een profielverwijzing op ---');
    zoekVeld.value = '40x40x3';
    zoekVeld.dispatchEvent(new Event('input', { bubbles: true }));
    // Het eerder gekozen profiel hoort nog gemarkeerd te staan, en PRECIES één
    // keer. "SHS 40x40x3" bestaat onder twee normen, dus wie de keuze op het
    // label onthoudt markeert ze allebei. Daarom hangt de tabel in de sleutel.
    check('de eerdere keuze staat nog gemarkeerd, precies één keer',
        boomVak.querySelectorAll('.pz_profiel.gekozen').length === 1,
        boomVak.querySelectorAll('.pz_profiel.gekozen').length + ' gemarkeerd');
    check('en het is de treffer onder de juiste norm',
        boomVak.querySelector('.pz_profiel.gekozen').textContent === 'SHS 40x40x3',
        boomVak.querySelector('.pz_profiel.gekozen').textContent);

    dialoog.close('ok');
    const verwijzing = await belofte;
    log('verwijzing:', JSON.stringify({
        englishLabel: verwijzing.englishLabel, standardLabel: verwijzing.standardLabel,
        table: verwijzing.table, tableId: verwijzing.tableId,
        items: verwijzing.items.length, pad: verwijzing.pad,
    }));

    check('er komt een verwijzing terug', verwijzing !== null);
    check('met het Engelse label', verwijzing.englishLabel === 'SHS 40x40x3',
        verwijzing.englishLabel);
    check('met het normlabel', /EN 10(210|219)-2/.test(verwijzing.standardLabel),
        verwijzing.standardLabel);
    check('met tableId erin (dat wijst de rij in HiCAD aan)',
        Number.isFinite(verwijzing.tableId), verwijzing.tableId);
    check('met de itemIds en staalsoorten',
        verwijzing.items.length > 0
        && verwijzing.items.every(i => Number.isFinite(i.itemId) && i.material),
        verwijzing.items.map(i => `${i.itemId}:${i.material}`).join(', '));
    check('met een absoluut pad naar het bestand',
        /^[A-Za-z]:\\/.test(verwijzing.pad) && verwijzing.pad.endsWith('.stp'),
        verwijzing.pad);
    check('met een url om het bestand op te halen',
        verwijzing.url.includes('/profielen/'), verwijzing.url);
    check('met de cataloguswaarden erbij',
        verwijzing.catalogus.B === 40 && verwijzing.catalogus.S === 3,
        JSON.stringify({ B: verwijzing.catalogus.B, S: verwijzing.catalogus.S }));

    // De opdracht wil de doorsnede in de verwijzing, of een functie die hem
    // haalt. Een functie: dan hoeft wie hem niet nodig heeft ook niets in te

    check('met een functie die de doorsnede ophaalt',
        typeof verwijzing.doorsnede === 'function');
    const uitVerwijzing = await verwijzing.doorsnede();
    check('en die functie levert een doorsnede van 40 x 40 mm op',

        `${uitVerwijzing.doos.dx.toFixed(3)} x ${uitVerwijzing.doos.dy.toFixed(3)}`);

    check('met een functie die er een staaf van maakt', typeof verwijzing.staaf === 'function');
    const uitStaaf = await verwijzing.staaf(1500);

    check('staaf(1500) levert een vorm op van 1500 mm lang',
        Math.abs(staafMaat - 1500) < 0.01, staafMaat);

    // Het bestand moet er ook echt zijn. De hoofdletters in het manifest wijken

    const bestandAntwoord = await win.fetch(verwijzing.url, { method: 'HEAD' });
    check('het STEP-bestand is op die url op te halen', bestandAntwoord.ok,
        `status ${bestandAntwoord.status}`);

    log('\n--- annuleren levert niets op ---');
    const tweedeBelofte = kiezer.kiesProfiel(catGeladen);
    check('het venster gaat weer open', dialoog.open);
    dialoog.close('annuleer');
    const geenKeuze = await tweedeBelofte;
    check('annuleren geeft null terug', geenKeuze === null, JSON.stringify(geenKeuze));

    log('\n--- tussenstaanders: geen veld langer dan de maximale afstand ---');
    // Verbeterpunt 1 uit VERBETERPUNTEN.md. In de HiCAD-voorbeeldbalustrade
    // staan drie staanders op exact 850 mm; wij zetten er tot nu toe alleen aan
    // de uiteinden.
    const padMod = await win.eval("import('/pad.js')");

    const spanAfstanden = (pt) => {
        const uit = [];
        for (let i = 1; i < pt.length; i++) {
            uit.push(Math.hypot(pt[i][0] - pt[i - 1][0], pt[i][1] - pt[i - 1][1],
                                pt[i][2] - pt[i - 1][2]));
        }
        return uit;
    };

    const verdicht = padMod.verdichtPad([[0, 0, 0], [2000, 0, 0]], false, 850);
    log('2000 mm bij max 850:', verdicht.map(pt => pt[0]).join(', '));
    check('2000 mm wordt opgedeeld in 3 velden', verdicht.length === 4, verdicht.length);
    check('geen veld langer dan 850', spanAfstanden(verdicht).every(d => d <= 850 + 1e-9),
        spanAfstanden(verdicht).map(d => d.toFixed(1)).join(', '));
    check('de stukken zijn gelijk, geen restje',
        new Set(spanAfstanden(verdicht).map(d => d.toFixed(6))).size === 1,
        spanAfstanden(verdicht).map(d => d.toFixed(2)).join(', '));
    check('begin- en eindpunt blijven staan',
        verdicht[0][0] === 0 && verdicht[verdicht.length - 1][0] === 2000);

    check('een kort veld blijft ongemoeid',
        padMod.verdichtPad([[0, 0, 0], [800, 0, 0]], false, 850).length === 2);
    check('precies op de grens geeft geen extra staander',
        padMod.verdichtPad([[0, 0, 0], [850, 0, 0]], false, 850).length === 2);

    const schuinVerdicht = padMod.verdichtPad([[0, 0, 0], [1200, 0, 900]], false, 850);
    log('schuin 1200 x 900 (rail 1500):', schuinVerdicht.length, 'punten');
    check('schuin: gemeten langs de rail, niet horizontaal',
        schuinVerdicht.length === 3,
        `${schuinVerdicht.length} punten bij een rail van 1500 mm`);

    const hoekVerdicht = padMod.verdichtPad(
        [[0, 0, 0], [2000, 0, 0], [2000, 2000, 0]], false, 850);
    check('een hoek blijft een hoek, en beide benen worden verdicht',
        hoekVerdicht.length === 7
        && hoekVerdicht.some(pt => pt[0] === 2000 && pt[1] === 0),
        hoekVerdicht.length + ' punten');

    const rondom = padMod.verdichtPad(
        [[0, 0, 0], [2000, 0, 0], [2000, 2000, 0], [0, 2000, 0]], true, 850);
    check('gesloten rondom: ook het laatste stuk terug wordt verdicht',
        rondom.length === 12, rondom.length + ' punten');

    log('\n--- en dat werkt door in de gebouwde balustrade ---');
    const bal5m = { ...regels.STANDAARD, lengte: 5000 };
    const delen5m = padMod.padDelen([[0, 0, 0], [5000, 0, 0]], false, bal5m);
    const staandersIn = delen5m.delen.filter(d => d.soort === 'staander');

    // Het hart van een blok is oorsprong + de helft van alle drie de assen, NIET
    // oorsprong + breedte/2. Bij de laatste staander wijst de deelhoek achteruit,
    // en dan ligt het hart 40 mm de andere kant op. Dat is in dit project al
    // drie keer misgegaan: de hoek van een blok vergelijken in plaats van waar
    // het blok doorheen loopt.
    const hartVan = (d) => [0, 1, 2].map(as =>
        d.oorsprong[as] + d.xAs[as] * d.dx / 2 + d.yAs[as] * d.dy / 2
                        + d.zAs[as] * d.dz / 2);
    const hartenX = staandersIn.map(d => hartVan(d)[0]).sort((a, b) => a - b);
    log('staanders bij 5 m:', hartenX.map(x => Math.round(x)).join(', '));
    check('een balustrade van 5 m krijgt tussenstaanders',
        staandersIn.length > 2, staandersIn.length + ' staanders');
    check('en geen enkele overspanning is groter dan 850',
        spanAfstanden(hartenX.map(x => [x, 0, 0])).every(d => d <= 850 + 1e-6),
        spanAfstanden(hartenX.map(x => [x, 0, 0])).map(d => d.toFixed(1)).join(', '));
    check('er zijn evenveel velden als staanders min één',
        delen5m.velden.length === staandersIn.length - 1,
        `${delen5m.velden.length} velden, ${staandersIn.length} staanders`);

    log('\n--- handregeloverstek aan de vrije uiteinden ---');
    // Verbeterpunt 2. In de HiCAD-voorbeeldbalustrade loopt de handregel van
    // 282,72 tot 2182,72 bij staanderharten op 382,75 en 2082,75: exact 100 mm
    // voorbij het HART aan beide kanten.
    const overstekMaten = { ...regels.STANDAARD, maxStaanderAfstand: EEN_VELD,
                            handregelOverstek: 100 };
    const rechtUit = padMod.padDelen([[0, 0, 0], [2000, 0, 0]], false, overstekMaten);
    const regels2 = rechtUit.delen.filter(d => d.soort === 'handregel');
    check('één veld geeft één handregel', regels2.length === 1, regels2.length);

    // Waar een blok in x doorheen loopt: over alle ACHT hoekpunten, niet over de
    // oorsprong en het einde van de x-as. Een handregel hangt scheef (hij zakt
    // loodrecht op de helling) en zijn breedte-as kan ook in x wijzen, dus de
    // oorsprong ligt niet op de uiterste x. Dat is in dit project nu vier keer
    // misgegaan.
    const xSpan = (d) => {
        const alle = [];
        for (const a of [0, 1]) for (const b of [0, 1]) for (const c of [0, 1]) {
            alle.push(d.oorsprong[0] + a * d.xAs[0] * d.dx
                                     + b * d.yAs[0] * d.dy
                                     + c * d.zAs[0] * d.dz);
        }
        return [Math.min(...alle), Math.max(...alle)];
    };
    const regelSpan = xSpan;
    const [rBegin, rEind] = regelSpan(regels2[0]);
    log(`handregel van ${rBegin.toFixed(2)} tot ${rEind.toFixed(2)} `
        + `(staanderharten op 0 en 2000)`);
    check('steekt 100 mm voorbij het eerste staanderhart',
        Math.abs(rBegin - (-100)) < 1e-9, rBegin.toFixed(3));
    check('steekt 100 mm voorbij het laatste staanderhart',
        Math.abs(rEind - 2100) < 1e-9, rEind.toFixed(3));
    check('de handregel is dus 2200 mm lang',
        Math.abs(regels2[0].dx - 2200) < 1e-9, regels2[0].dx.toFixed(3));

    const zonder = padMod.padDelen([[0, 0, 0], [2000, 0, 0]], false,
        { ...overstekMaten, handregelOverstek: 0 });
    const zonderSpan = regelSpan(zonder.delen.find(d => d.soort === 'handregel'));
    // Hier stond "op de binnenkant van de staander" (x = 20). Dat was de oude
    // opbouw, waarin de regel tússen de staanders lag. Nu ligt hij EROP, dus
    // zonder overstek eindigt hij op het HART van de buitenste staander.
    check('overstek 0 laat hem op het hart van de buitenste staander eindigen',
        Math.abs(zonderSpan[0]) < 1e-9, zonderSpan[0].toFixed(3));

    log('\n--- maar niet in een hoek, en niet bij een gesloten ronde ---');
    const hoekUit = padMod.padDelen(
        [[0, 0, 0], [2000, 0, 0], [2000, 2000, 0]], false, overstekMaten);
    const hoekRegels = hoekUit.delen.filter(d => d.soort === 'handregel');
    check('een hoek geeft twee handregels', hoekRegels.length === 2, hoekRegels.length);
    // De twee regels komen in de hoek op VERSTEK bij elkaar. Hier stond dat de
    // eerste vóór het hoekpunt moest eindigen - dat was de oude opbouw, waarin
    // de regels tússen de staanders lagen om elkaar niet te overlappen.
    //
    // Met verstek loopt hij juist tot voorbij het hart: bij 90 graden is het
    // verstekvlak 45 graden, en dan ligt de buitenste hoek van de snede precies
    // een halve regelbreedte voorbij het hoekpunt. Hier 40/2 = 20, dus 2020.
    // Dat de twee regels elkaar daarbij NIET overlappen wordt op de echte
    // geometrie gemeten; zie deel Z.
    const eersteEind = regelSpan(hoekRegels[0])[1];
    const halveRegel = regels.STANDAARD.handregelHoogte / 2;
    check('in de hoek loopt hij op verstek een halve regelbreedte voorbij het hart',
        Math.abs(eersteEind - (2000 + halveRegel)) < 1e-9, eersteEind.toFixed(3));
    check('en het verstekvlak staat op 45 graden',
        hoekRegels[0].verstek.length === 1
        && Math.abs(Math.abs(hoekRegels[0].verstek[0].richting[0]) - Math.SQRT1_2) < 1e-12,
        JSON.stringify(hoekRegels[0].verstek.map(v =>
            v.richting.map(w => +w.toFixed(4)))));
    check('maar aan het vrije begin wél 100 mm voorbij',
        Math.abs(regelSpan(hoekRegels[0])[0] - (-100)) < 1e-9,
        regelSpan(hoekRegels[0])[0].toFixed(3));

    const rondUit = padMod.padDelen(
        [[0, 0, 0], [2000, 0, 0], [2000, 2000, 0], [0, 2000, 0]], true, overstekMaten);
    const rondRegels = rondUit.delen.filter(d => d.soort === 'handregel');

    // NIET op de uiterste x kijken: de handregel is 40 mm breed en ligt op het
    // pad, dus op de benen die in y lopen steekt hij per definitie 20 mm in x
    // naar buiten. Dat is breedte, geen overstek.
    //
    // Wat we wél willen weten: is er OVERSTEK bijgekomen? Bij een gesloten lus
    // mag dat nergens, want daar sluit elke regel op de volgende aan.
    //
    // Hier stond `dx === vrijeLengte`: de oude opbouw, regel tussen de
    // staanders. Nu loopt hij van hart tot hart (2000 per zijde) plus aan
    // weerszijden de verstek-uitloop van een halve regelbreedte, dus 2040.
    // Overstek zou daar 100 per kant bovenop doen en dat is wat niet mag.
    check('gesloten rondom: vier handregels', rondRegels.length === 4, rondRegels.length);
    const rondVerwacht = 2000 + 2 * halveRegel;
    const teLang = rondRegels.filter(d => Math.abs(d.dx - rondVerwacht) > 1e-9);
    check('gesloten rondom: hart tot hart plus verstek, geen overstek',
        teLang.length === 0,
        teLang.map(d => d.dx.toFixed(3)).join(', ')
        || `alle ${rondRegels.length} precies ${rondRegels[0].dx.toFixed(2)} mm `
           + `(verwacht ${rondVerwacht})`);
    check('gesloten rondom: elke regel heeft aan BEIDE einden verstek',
        rondRegels.every(d => d.verstek.length === 2),
        rondRegels.map(d => d.verstek.length).join(','));

    log('\n--- op een helling loopt het overstek schuin mee ---');
    const schuinUit = padMod.padDelen([[0, 0, 0], [1200, 0, 900]], false,
        { ...overstekMaten, hoogteverschil: 900 });
    const schuinRegel = schuinUit.delen.find(d => d.soort === 'handregel');
    // Rail 1500 lang bij 1200 horizontaal: cos = 0,8. Horizontaal 100 mm voorbij
    // het hart is langs de rail 100/0,8 = 125 mm.
    // De BOVENKANT van de handregel is de maat die telt, dus die hoek pakken:
    // oorsprong plus de volle z-as (die staat loodrecht op de helling).
    const bovenStart = [0, 1, 2].map(as =>
        schuinRegel.oorsprong[as] + schuinRegel.zAs[as] * schuinRegel.dz);
    log(`schuine handregel, bovenkant begint op `
        + `${bovenStart.map(w => w.toFixed(1)).join(', ')}`);
    check('horizontaal 100 mm voorbij het hart, ook op een helling',
        Math.abs(bovenStart[0] - (-100)) < 1e-6, bovenStart[0].toFixed(3));
    // De rand stijgt 900 over 1200, dus 0,75 per mm. Op x = -100 ligt de rand op
    // z = -75, en de bovenkant van de handregel 1000 daarboven: 925.
    check('en hij loopt schuin door: de bovenkant volgt de helling',
        Math.abs(bovenStart[2] - 925) < 1e-6, bovenStart[2].toFixed(3));

    log('\n--- het 3D-voorbeeld ---');
    const geo = await win.eval("import('/profiel-geometrie.js')");
    geo.vergeetAlles();

    const testProfiel = cat.alleProfielen(catBoom)
        .find(p => p.label === 'SHS 40x40x3' && p.table === 'DIN_EN_10219-2_HQ');
    check('SHS 40x40x3 EN 10219-2 gevonden om mee te proeven', !!testProfiel);

    const snede = await geo.doorsnedeVan(testProfiel);
    log(`doorsnede : ${snede.doos.dx.toFixed(3)} x ${snede.doos.dy.toFixed(3)} x `
        + `${snede.doos.dz.toFixed(3)} mm`);
    check('de doorsnede is 40 x 40 mm', Math.abs(snede.doos.dx - 40) < 0.01
        && Math.abs(snede.doos.dy - 40) < 0.01,
        `${snede.doos.dx.toFixed(3)} x ${snede.doos.dy.toFixed(3)}`);
    check('en hij is plat: dikte 0 in z', Math.abs(snede.doos.dz) < 1e-6,
        snede.doos.dz);
    check('de doorsnede is bewaard', geo.aantalBewaard() === 1, geo.aantalBewaard());

    // Nog een keer opvragen mag niets nieuws inlezen.
    const nogEens = await geo.doorsnedeVan(testProfiel);
    check('tweede keer komt uit het geheugen, niet van schijf',
        geo.aantalBewaard() === 1 && nogEens.face === snede.face,
        geo.aantalBewaard() + ' bewaard');

    const staaf = await geo.maakStaaf(testProfiel, 1000);
    check('op 1000 mm getrokken levert een vorm op', !staaf.IsNull());
    check('en die is 1000 mm lang',
        Math.abs(api.grootteVan(await api.initOcct(), staaf) - 1000) < 0.01,
        api.grootteVan(await api.initOcct(), staaf));

    const voorbeeld = await geo.voorbeeldVan(testProfiel, 200);
    log(`voorbeeld : ${voorbeeld.meshes[0].index.array.length / 3} driehoeken, `
        + `lengte ${voorbeeld.lengte} mm`);
    check('het voorbeeld levert driehoeken op',
        voorbeeld.meshes[0].index.array.length > 0,
        voorbeeld.meshes[0].index.array.length / 3 + ' driehoeken');

    // De maten nameten uit de driehoeken: dat is wat de gebruiker ziet.
    const pos = voorbeeld.meshes[0].attributes.position.array;
    let vx = [Infinity, -Infinity], vy = [Infinity, -Infinity], vz = [Infinity, -Infinity];
    for (let i = 0; i < pos.length; i += 3) {
        vx = [Math.min(vx[0], pos[i]), Math.max(vx[1], pos[i])];
        vy = [Math.min(vy[0], pos[i + 1]), Math.max(vy[1], pos[i + 1])];
        vz = [Math.min(vz[0], pos[i + 2]), Math.max(vz[1], pos[i + 2])];
    }
    log(`in beeld  : ${(vx[1] - vx[0]).toFixed(2)} x ${(vy[1] - vy[0]).toFixed(2)} x `
        + `${(vz[1] - vz[0]).toFixed(2)} mm`);
    check('wat getekend wordt is 40 x 40 x 200 mm',
        Math.abs((vx[1] - vx[0]) - 40) < 0.1 && Math.abs((vy[1] - vy[0]) - 40) < 0.1
        && Math.abs((vz[1] - vz[0]) - 200) < 0.1,
        `${(vx[1] - vx[0]).toFixed(2)} x ${(vy[1] - vy[0]).toFixed(2)} x ${(vz[1] - vz[0]).toFixed(2)}`);

    log('\n--- een kapot profiel mag de kiezer niet omver halen ---');
    const kapot = { ...testProfiel, bestand: 'bestaat/niet.stp',
                    url: './profielen/bestaat/niet.stp' };
    let gooide = null;
    try { await geo.doorsnedeVan(kapot); } catch (err) { gooide = err.message; }
    log('foutmelding:', gooide);
    check('een ontbrekend bestand geeft een leesbare fout', gooide !== null, gooide);
    check('en noemt wat er mis is', /niet op te halen|status/.test(gooide || ''), gooide);
    check('een mislukking wordt NIET bewaard, zodat opnieuw proberen kan',
        geo.aantalBewaard() === 1, geo.aantalBewaard());

    log('\n--- de staander uit een echt profiel ---');
    // Verbeterpunt 3, stap 1. In de HiCAD-voorbeeldbalustrade zijn de staanders
    // CHS 48,3 x 2,6. Tot nu toe bouwden wij een MASSIEF blok van 40 x 40.
    const bouwMod = await win.eval("import('/build-balustrade.js')");

    const chs = cat.alleProfielen(catBoom)
        .find(p => p.label === 'CHS 48.3x2.6' && p.table === 'DIN_EN_10210-2_R');
    check('CHS 48.3x2.6 staat in de catalogus', !!chs);

    // Een profielverwijzing zoals de kiezer die aflevert.
    const chsRef = {
        url: './profielen/' + chs.bestand,
        boxSize: chs.bron.boxSize,
        englishLabel: chs.label,
    };
    log('boxSize uit het manifest:', JSON.stringify(chsRef.boxSize));

    // Zonder voetplaat: dit deel gaat over het PROFIEL van de staander, en een
    // voetplaat maakt de staander 10 mm korter. Dan zou "lengte 1000" hier een
    // andere vraag worden dan bedoeld is. De voetplaat heeft verderop zijn eigen
    // deel.
    const staanderMaten = {
        ...regels.STANDAARD, lengte: 2000, maxStaanderAfstand: EEN_VELD,
        handregelOverstek: 0, staanderProfiel: chsRef, voetplaatDikte: 0,
        // En zonder vulraamwerk: dit deel zoekt onderdelen op hun MAAT, en een
        // vulregel van 30 x 6 zou dan voor een handregel worden aangezien.
        vulraamwerk: 0,
    };
    const metProfiel = await bouwMod.bouwBalustrade(staanderMaten);

    // Nameten op de gebouwde vorm zelf, niet op de beschrijving. Alle solids
    // eruit halen en de staanders eruit vissen op hun hoogte.
    const ocApi = await api.initOcct();
    const solidsVan = (vorm) => {
        const uit = [];
        for (const v = new ocApi.TopExp_Explorer_2(vorm,
                 ocApi.TopAbs_ShapeEnum.TopAbs_SOLID,
                 ocApi.TopAbs_ShapeEnum.TopAbs_SHAPE); v.More(); v.Next()) {
            const doos = new ocApi.Bnd_Box_1();
            ocApi.BRepBndLib.Add(v.Current(), doos, false);
            const a = doos.CornerMin(), b = doos.CornerMax();
            uit.push({ vorm: v.Current(),
                       x: [a.X(), b.X()], y: [a.Y(), b.Y()], z: [a.Z(), b.Z()],
                       dx: b.X() - a.X(), dy: b.Y() - a.Y(), dz: b.Z() - a.Z() });
            doos.delete();
        }
        return uit;
    };

    const alleSolids = solidsVan(metProfiel.shape);
    // Een staander is het enige onderdeel dat rechtop staat en meer dan een
    // halve meter hoog is; de spijlen zijn hier 960 mm maar maar 20 mm breed.
    //
    // Hier stond `dz === 1000`: de staander liep toen tot de volle hoogte.
    // Sinds de handregel eroverheen loopt is hij een handregelhoogte korter,
    // en dan vond deze filter er NUL - waarna de regel eronder op undefined
    // stuklopp. Daarom nu op hoogte EN breedte zeven.
    const staanderHoogte = staanderMaten.hoogte - staanderMaten.handregelHoogte;
    const staanderSolids = alleSolids.filter(s => s.dz > 500 && s.dx > 40);
    log(`${alleSolids.length} solids, waarvan ${staanderSolids.length} `
        + `rechtopstaand en breder dan 40 mm`);
    check('er zijn twee staanders', staanderSolids.length === 2, staanderSolids.length);

    const st = staanderSolids[0];
    log(`staander: ${st.dx.toFixed(3)} x ${st.dy.toFixed(3)} x ${st.dz.toFixed(3)} mm, `
        + `x van ${st.x[0].toFixed(2)} tot ${st.x[1].toFixed(2)}`);

    check('DIAMETER: 48,3 mm in beide richtingen, niet 40',
        Math.abs(st.dx - 48.3) < 0.01 && Math.abs(st.dy - 48.3) < 0.01,
        `${st.dx.toFixed(3)} x ${st.dy.toFixed(3)}`);
    check(`LENGTE: ${staanderHoogte} mm, tot onder de handregel`,
        Math.abs(st.dz - staanderHoogte) < 1e-6, st.dz.toFixed(6));
    check(`POSITIE: staat op de vloer, van z=0 tot z=${staanderHoogte}`,
        Math.abs(st.z[0]) < 1e-6 && Math.abs(st.z[1] - staanderHoogte) < 1e-6,
        `${st.z[0].toFixed(3)} .. ${st.z[1].toFixed(3)}`);

    // WANDDIKTE meten waar het telt: de doorsnede is hol, dus het oppervlak van
    // een massieve staaf zou heel anders zijn. pi/4*(48,3^2 - 43,1^2) = 373,28.
    const eig = new ocApi.GProp_GProps_1();
    ocApi.BRepGProp.VolumeProperties_1(st.vorm, eig, false, false, false);
    const volume = eig.Mass();
    // Volume gedeeld door de LENGTE. Dat was hier hard 1000; sinds de staander
    // tot onder de handregel loopt is dat 960, en met 1000 kwam de doorsnede
    // 4 % te laag uit. Nu uit de gemeten hoogte, dus dit schuift niet meer.
    const oppervlak = volume / st.dz;
    eig.delete();
    log(`volume ${volume.toFixed(0)} mm3 -> doorsnede ${oppervlak.toFixed(2)} mm2`);
    check('WANDDIKTE: de doorsnede is 373,28 mm2, dus hol met 2,6 mm wand',
        Math.abs(oppervlak - 373.28) < 0.5, oppervlak.toFixed(2));
    check('en dus NIET massief: een blok van 48,3 zou 2333 mm2 zijn',
        oppervlak < 500, oppervlak.toFixed(2));

    // Het gewicht dat hier uit volgt, tegenover het oude massieve blok.
    const kg = oppervlak * 1000 * 7850 / 1e9;
    log(`gewicht per staander: ${kg.toFixed(2)} kg (massief 40x40 was `
        + `${(40 * 40 * 1000 * 7850 / 1e9).toFixed(2)} kg)`);
    check('een staander weegt nu 2,9 kg in plaats van 12,6',
        Math.abs(kg - 2.93) < 0.05, kg.toFixed(2));

    log('\n--- de handregel uit hetzelfde profiel ---');
    // De handregel LIGT: zijn lengte loopt langs xAs, niet langs zAs zoals bij
    // een staander. Dat is de echte test van draaiingVoor(): komt de staaf goed
    // te liggen, of staat hij rechtop?
    const metBeide = await bouwMod.bouwBalustrade(
        { ...staanderMaten, handregelProfiel: chsRef });

    const beideSolids = solidsVan(metBeide.shape);
    // De handregel is het enige onderdeel dat langer is dan 1000 mm in x.
    const hrSolids = beideSolids.filter(s => s.dx > 1000);
    check('er is één handregel', hrSolids.length === 1, hrSolids.length);

    const hr = hrSolids[0];
    log(`handregel: ${hr.dx.toFixed(2)} x ${hr.dy.toFixed(3)} x ${hr.dz.toFixed(3)} mm, `
        + `z van ${hr.z[0].toFixed(2)} tot ${hr.z[1].toFixed(2)}`);

    check('hij LIGT: de lengte zit in x, niet in z',
        hr.dx > 1000 && hr.dz < 100, `dx ${hr.dx.toFixed(1)}, dz ${hr.dz.toFixed(1)}`);
    check('DOORSNEDE: 48,3 mm in de dwarsrichting én in de hoogte',
        Math.abs(hr.dy - 48.3) < 0.01 && Math.abs(hr.dz - 48.3) < 0.01,
        `${hr.dy.toFixed(3)} x ${hr.dz.toFixed(3)}`);
    // Hier stond 2000 min twee halve buizen = 1951,7: de regel lag toen TUSSEN
    // de staanders. Nu ligt hij EROP en loopt hij van hart tot hart, dus 2000.
    check('LENGTE: van hart tot hart over de staanders = 2000 mm',
        Math.abs(hr.dx - 2000) < 0.01, hr.dx.toFixed(3));

    // De bovenkant van de handregel is de maat die telt: die moet op 1000 liggen.
    check('POSITIE: de bovenkant ligt op 1000 mm, de hoogte van de leuning',
        Math.abs(hr.z[1] - 1000) < 1e-6, hr.z[1].toFixed(4));
    check('en de onderkant dus op 1000 min 48,3',
        Math.abs(hr.z[0] - (1000 - 48.3)) < 1e-6, hr.z[0].toFixed(4));

    // Hol, net als de staander. Volume gedeeld door de lengte.
    const hrEig = new ocApi.GProp_GProps_1();
    ocApi.BRepGProp.VolumeProperties_1(hr.vorm, hrEig, false, false, false);
    const hrOpp = hrEig.Mass() / hr.dx;
    hrEig.delete();
    log(`doorsnede handregel: ${hrOpp.toFixed(2)} mm2`);
    check('WANDDIKTE: ook de handregel is hol, 373,28 mm2',
        Math.abs(hrOpp - 373.28) < 0.5, hrOpp.toFixed(2));

    log('\n--- en de spijlen worden er korter van ---');
    // De handregel is nu 48,3 hoog in plaats van 40, dus er blijft 8,3 mm minder
    // over voor de spijlen. Dat moet doorwerken, anders steken ze erdoorheen.
    const spijlMet = beideSolids.filter(s => Math.abs(s.dx - 20) < 1e-6
                                          && Math.abs(s.dy - 20) < 1e-6);
    const spijlZonder = solidsVan(metProfiel.shape)
        .filter(s => Math.abs(s.dx - 20) < 1e-6 && Math.abs(s.dy - 20) < 1e-6);
    log(`spijl met CHS-handregel: ${spijlMet[0].dz.toFixed(1)} mm, `
        + `met blok-handregel: ${spijlZonder[0].dz.toFixed(1)} mm`);
    check('de spijl is 1000 min 48,3 lang',
        Math.abs(spijlMet[0].dz - (1000 - 48.3)) < 1e-6, spijlMet[0].dz.toFixed(3));
    check('en steekt dus niet door de handregel heen',
        Math.abs(spijlMet[0].z[1] - hr.z[0]) < 1e-6,
        `spijl tot ${spijlMet[0].z[1].toFixed(2)}, handregel vanaf ${hr.z[0].toFixed(2)}`);

    log('\n--- de spijlen uit een profiel ---');
    // Marthijn maakt strip nog aan. Tot die tijd een koker van dezelfde
    // buitenmaat, zoals hij voorstelde: SHS 20x20x2 in plaats van strip 5 x 20.
    const shs20 = cat.alleProfielen(catBoom)
        .find(p => p.label === 'SHS 20x20x2' && p.table === 'DIN_EN_10219-2_HQ');
    check('SHS 20x20x2 staat in de catalogus', !!shs20);
    const shsRef = { url: './profielen/' + shs20.bestand,
                     boxSize: shs20.bron.boxSize, englishLabel: shs20.label };

    const metSpijlen = await bouwMod.bouwBalustrade(
        { ...staanderMaten, handregelProfiel: chsRef, spijlProfiel: shsRef });

    const spijlSolids = solidsVan(metSpijlen.shape)
        .filter(s => Math.abs(s.dx - 20) < 0.01 && Math.abs(s.dy - 20) < 0.01);
    log(`${spijlSolids.length} spijlen van ${spijlSolids[0].dz.toFixed(1)} mm`);
    check('de spijlen zijn 20 x 20 mm', spijlSolids.length > 0,
        `${spijlSolids[0].dx.toFixed(2)} x ${spijlSolids[0].dy.toFixed(2)}`);
    check('en staan rechtop op de vloer',
        Math.abs(spijlSolids[0].z[0]) < 1e-6, spijlSolids[0].z[0].toFixed(4));

    // Hol: een SHS 20x20x2 heeft 20^2 - 16^2 = 144 mm2 met scherpe hoeken, en
    // met de afrondingen iets minder. Een massieve 20x20 zou 400 mm2 zijn.
    const spEig = new ocApi.GProp_GProps_1();
    ocApi.BRepGProp.VolumeProperties_1(spijlSolids[0].vorm, spEig, false, false, false);
    const spOpp = spEig.Mass() / spijlSolids[0].dz;
    spEig.delete();
    log(`doorsnede spijl: ${spOpp.toFixed(2)} mm2 (massief zou 400 zijn)`);
    check('WANDDIKTE: de spijl is hol, ruim onder de 400 mm2 van massief',
        spOpp > 100 && spOpp < 200, spOpp.toFixed(2));

    log('\n--- spijlen uit platstaal, zoals in de voorbeeldbalustrade ---');
    // Verbeterpunt 5 uit VERBETERPUNTEN.md: daar zitten spijlen van strip 5 x 20
    // in, op hun kant, zodat je van voren dunne lijnen van 5 mm ziet en de
    // 20 mm in de diepte de stijfheid levert. Dat kon niet zolang er alleen
    // holle profielen in de catalogus zaten.
    const flProfiel = cat.alleProfielen(catBoom)
        .find(p => p.bestand === 'DIN_EN_10058/Fl_20x5.stp');
    check('platstaal FL 20x5 zit in de catalogus', !!flProfiel,
        flProfiel ? flProfiel.label : '(niet gevonden)');

    if (flProfiel) {
        log(`boxSize: ${JSON.stringify(flProfiel.bron.boxSize)} — `
            + `5 langs X, 20 langs Y`);
        const metStrip = await bouwMod.bouwBalustrade({
            ...staanderMaten,
            spijlProfiel: {
                url: './profielen/' + flProfiel.bestand,
                boxSize: flProfiel.bron.boxSize,
                englishLabel: flProfiel.label,
                standardLabel: cat.normLabel(flProfiel.table),
                items: flProfiel.items,
            },
        });

        // Op hoogte EN op breedte zeven. De hoogte alleen is niet genoeg meer:
        // sinds de handregel over de koppen loopt is een staander net zo lang
        // als een spijl (hier allebei 960 mm), en dan kwam de buis van 48,3 mm
        // als eerste "spijl" uit de lijst. Een spijl is hier 5 x 20.
        const stripSolids = solidsVan(metStrip.shape)
            .filter(s => Math.abs(s.dz - (staanderMaten.hoogte
                - staanderMaten.handregelHoogte)) < 0.01 && s.dx < 30);
        log(`${stripSolids.length} spijlen van `
            + `${stripSolids[0].dx.toFixed(2)} x ${stripSolids[0].dy.toFixed(2)} mm`);

        // Dit is het punt: de 5 mm staat DWARS op de leuning en de 20 mm gaat
        // de diepte in, niet andersom. Een strip plat gelegd zou net zo zwaar
        // zijn maar veel slapper.
        check('de spijl is 5 mm breed langs de leuning',
            Math.abs(stripSolids[0].dx - 5) < 0.01, stripSolids[0].dx.toFixed(3));
        check('en 20 mm diep — op zijn kant, niet plat',
            Math.abs(stripSolids[0].dy - 20) < 0.01, stripSolids[0].dy.toFixed(3));
        check('massief: één draad, dus geen holle doorsnede',
            stripSolids[0].dx * stripSolids[0].dy > 99, 'blok van 5 x 20');

        // Dunnere spijlen vullen zelf minder van de opening, dus er zijn er
        // MEER nodig om onder dezelfde maximale doorgang te blijven.
        log(`strip 5 mm : ${metStrip.spijlen.aantal} stuks, doorgang `
            + `${metStrip.spijlen.doorgang.toFixed(2)} mm`);
        log(`koker 20 mm: ${metSpijlen.spijlen.aantal} stuks, doorgang `
            + `${metSpijlen.spijlen.doorgang.toFixed(2)} mm`);
        check('een dunnere spijl geeft MEER spijlen',
            metStrip.spijlen.aantal > metSpijlen.spijlen.aantal,
            `${metStrip.spijlen.aantal} tegenover ${metSpijlen.spijlen.aantal}`);
        check('en de doorgang blijft onder het maximum',
            metStrip.spijlen.doorgang <= 100 + 1e-9,
            metStrip.spijlen.doorgang.toFixed(3));

        const stripRegel = metStrip.stuklijst.find(r => r.soort === 'spijl');
        check('de stuklijst noemt FL 20x5 met zijn norm',
            stripRegel.profiel === 'FL 20x5'
            && /10058/.test(stripRegel.norm),
            `${stripRegel.profiel} (${stripRegel.norm})`);
    }

    log('\n--- ELK soort profiel moet in ELKE rol te gebruiken zijn ---');
    // "maak in de app: wisselen naar strip of elk ander soort profiel."
    //
    // Niet één soort beproeven en aannemen dat de rest ook wel gaat. Een
    // hoekstaal is niet symmetrisch, een U-profiel is open, en vierkant staal
    // is massief - drie dingen die bij een buis niet spelen.
    //
    // Hier ging het ook echt mis: vierkant en rond staal van 8 mm werden
    // geweigerd met "staanderbreedte: 8 mm valt buiten 10-200 mm", terwijl er
    // in dat veld 40 stond. De grenzen van een invulveld werden toegepast op
    // een maat die uit de catalogus kwam. Twee van de tien soorten waren
    // daardoor niet als staander te kiezen.
    // Zo ziet een profielverwijzing uit de kiezer eruit. `table` en `categorie`
    // horen erbij: daar leest de app aan af of een doorsnede ROND is, en dat
    // bepaalt of de afdekkap rond of vierkant wordt. Lieten we ze hier weg, dan
    // testten we een verwijzing die de app nooit maakt - en kwam er stilletjes
    // een vierkant plaatje op een ronde paal.
    const soortRef = (p) => ({
        url: './profielen/' + p.bestand,
        boxSize: p.bron.boxSize,
        englishLabel: p.label,
        standardLabel: cat.normLabel(p.table),
        table: p.table,
        categorie: cat.categorieVan(p),
        items: p.items,
    });
    const eersteVanSoort = catBoom.categorieen.map(
        c => [c.sleutel, c.normen[0].profielen[0]]);
    check('er is van elke soort een profiel om mee te proeven',
        eersteVanSoort.length === 10, eersteVanSoort.length);

    for (const rol of ['staander', 'handregel', 'spijl']) {
        const mislukt = [];
        const scheef = [];
        for (const [soort, p] of eersteVanSoort) {
            try {
                const uit = await bouwMod.bouwBalustrade({
                    ...staanderMaten, [rol + 'Profiel']: soortRef(p),
                });
                const deel = uit.onderdelen.find(u => u.deel.soort === rol);
                const d = solidsVan(deel.vorm)[0];
                const bs = p.bron.boxSize;
                if (!d || Math.abs(d.dx - bs[0]) > 0.01
                       || Math.abs(d.dy - bs[1]) > 0.01) {
                    scheef.push(`${soort}/${p.label}: `
                        + `${d ? d.dx.toFixed(1) + 'x' + d.dy.toFixed(1) : 'niets'} `
                        + `i.p.v. ${bs[0]}x${bs[1]}`);
                }
            } catch (e) {
                mislukt.push(`${soort}/${p.label}: ${e.message.split('\n').join(' ')}`);
            }
        }
        check(`alle 10 soorten werken als ${rol}`, mislukt.length === 0,
            mislukt.join(' | '));
        check(`en komen er bij ${rol} uit op hun eigen buitenmaat`,
            scheef.length === 0, scheef.join(' | '));
    }

    // De grens van het INVULVELD moet blijven gelden zolang je zelf typt.
    check('een getypte staanderbreedte van 8 wordt nog steeds geweigerd',
        regels.valideer({ ...staanderMaten, staanderProfiel: null,
                          staanderBreedte: 8 }).length > 0);

    log('\n--- een profiel dat NIET past moet een leesbare melding geven ---');
    // Een HEB 1000 als handregel op een leuning van 1000 mm laat geen millimeter
    // over voor de spijlen. Dit kwam door de validatie heen - die keek naar de
    // 40 uit het invulveld - en liep daarna vast in OCCT met een kaal getal als
    // foutmelding: 19111856. Daar heeft niemand iets aan.
    const hebRef = soortRef(zoekBestand('DIN_1025-2/HEB_1000.stp'));
    check('HEB 1000 zit in de catalogus', !!hebRef.boxSize,
        JSON.stringify(hebRef.boxSize));
    const hrTeHoog = regels.valideer({ ...staanderMaten, handregelProfiel: hebRef });
    log('melding: ' + (hrTeHoog[0] || '(geen)'));
    check('een te hoge handregel wordt geweigerd', hrTeHoog.length > 0);
    check('en de melding noemt het profiel bij naam',
        /HEB 1000/.test(hrTeHoog[0] || ''), hrTeHoog[0]);
    check('en zegt waarom: er blijft geen spijl over',
        /spijl/.test(hrTeHoog[0] || ''), hrTeHoog[0]);

    // En hetzelfde profiel dat vlak nog wél past, past schuin niet meer: een
    // schuine handregel neemt meer VERTICALE ruimte in. HEB 800 is 800 mm hoog,
    // dus vlak blijft er 200 over; op 45 graden wordt dat 800 / cos 45 = 1131,
    // en dan past hij niet meer in een leuning van 1000.
    const heb800 = soortRef(zoekBestand('DIN_1025-2/HEB_800.stp'));
    check('HEB 800 zit in de catalogus', !!heb800.boxSize,
        JSON.stringify(heb800.boxSize));
    const vlak = regels.valideer({ ...staanderMaten, handregelProfiel: heb800,
                                   lengte: 1000, hoogteverschil: 0 });
    check('HEB 800 past vlak nog net in een leuning van 1000',
        vlak.length === 0, vlak.join('; '));
    const steil = regels.valideer({ ...staanderMaten, handregelProfiel: heb800,
                                    lengte: 1000, hoogteverschil: 1000 });
    log('op 45 graden: ' + (steil[0] || '(geen bezwaar)'));
    check('maar op 45 graden niet meer',
        steil.length > 0 && /schuin/.test(steil[0]), steil.join('; '));

    // En een staander die niet past werd al goed afgevangen; dat moet zo
    // blijven, want die melding komt uit een andere controle.
    let staanderFout = '';
    try {
        await bouwMod.bouwBalustrade({ ...staanderMaten, lengte: 400,
            staanderProfiel: hebRef });
    } catch (e) { staanderFout = e.message || String(e); }
    log('te brede staander: ' + staanderFout.split('\n')[0]);
    check('een staander die breder is dan het veld geeft ook een leesbare melding',
        /minimum is \d+ mm/.test(staanderFout), staanderFout.slice(0, 80));

    log('\n--- en de veiligheidsregel rekent met de ECHTE spijlbreedte ---');
    // Dit is het verschil met de staander en de handregel: de spijlbreedte gaat
    // de regel in. Kies je een breder profiel, dan passen er minder spijlen in
    // hetzelfde veld - anders wordt de doorgang te groot.
    const shs30 = cat.alleProfielen(catBoom)
        .find(p => p.label === 'SHS 30x30x2' && p.table === 'DIN_EN_10219-2_HQ');
    check('SHS 30x30x2 staat er ook in', !!shs30);

    const metBreed = await bouwMod.bouwBalustrade({
        ...staanderMaten, handregelProfiel: chsRef,
        spijlProfiel: { url: './profielen/' + shs30.bestand,
                        boxSize: shs30.bron.boxSize, englishLabel: shs30.label },
    });
    log(`20 mm spijl: ${metSpijlen.spijlen.aantal} stuks, doorgang `
        + `${metSpijlen.spijlen.doorgang.toFixed(2)} mm`);
    log(`30 mm spijl: ${metBreed.spijlen.aantal} stuks, doorgang `
        + `${metBreed.spijlen.doorgang.toFixed(2)} mm`);
    // Een bredere spijl vult zelf meer van de opening, dus er zijn er MINDER
    // nodig om onder dezelfde maximale doorgang te blijven. Uit de formule:
    // aantal = ceil((lengte - max) / (max + spijlbreedte)) - een grotere
    // spijlbreedte staat in de noemer.
    check('een bredere spijl geeft MINDER spijlen',
        metBreed.spijlen.aantal < metSpijlen.spijlen.aantal,
        `${metBreed.spijlen.aantal} tegenover ${metSpijlen.spijlen.aantal}`);
    check('en bij allebei blijft de doorgang onder het maximum',
        metSpijlen.spijlen.doorgang <= 100 + 1e-9
        && metBreed.spijlen.doorgang <= 100 + 1e-9,
        `${metSpijlen.spijlen.doorgang.toFixed(2)} en ${metBreed.spijlen.doorgang.toFixed(2)}`);

    // En nameten op het gebouwde model: staan de spijlen echt zo ver uit elkaar?
    const breedSolids = solidsVan(metBreed.shape)
        .filter(s => Math.abs(s.dx - 30) < 0.01 && Math.abs(s.dy - 30) < 0.01)
        .map(s => s.x).sort((a, b) => a[0] - b[0]);
    const spijlGaten = [];
    for (let k = 1; k < breedSolids.length; k++) {
        spijlGaten.push(breedSolids[k][0] - breedSolids[k - 1][1]);
    }
    const grootsteGat = Math.max(...spijlGaten);
    log(`gemeten openingen tussen de 30 mm spijlen: grootste ${grootsteGat.toFixed(2)} mm`);
    check('de gemeten opening blijft onder de 100 mm', grootsteGat <= 100 + 0.01,
        grootsteGat.toFixed(3));

    log('\n--- een profiel PER ONDERDEEL ---');
    // Eerst ging één gekozen profiel naar alle drie de onderdelen. Dat gaf een
    // leuning met 30 spijlen van 48,3 mm - even dik als de staanders. Een echte
    // leuning heeft een zware staander en een dunne spijl.
    const gemengd = await bouwMod.bouwBalustrade({
        ...staanderMaten,
        staanderProfiel: chsRef,      // CHS 48,3 x 2,6
        handregelProfiel: chsRef,
        spijlProfiel: shsRef,         // SHS 20x20x2
    });

    const gemengdeSolids = solidsVan(gemengd.shape);
    // Rechtopstaand en 48,3 mm breed. De hoogte was hier 1000; die is nu
    // 1000 - 48,3 = 951,7, want de handregel van 48,3 ligt op de kop. Op `dz >
    // 500` zeven in plaats van op een vast getal: dan zegt deze controle wat
    // hij bedoelt (dik en rechtop) en niet hoe lang een staander toevallig is.
    const dikke = gemengdeSolids.filter(s => Math.abs(s.dx - 48.3) < 0.01
                                          && s.dz > 500);
    const dunne = gemengdeSolids.filter(s => Math.abs(s.dx - 20) < 0.01);
    log(`${dikke.length} staanders van 48,3 mm, ${dunne.length} spijlen van 20 mm`);

    check('de staanders zijn 48,3 mm', dikke.length === 2, dikke.length);
    check('en de spijlen 20 mm — dus NIET hetzelfde profiel',
        dunne.length > 0, dunne.length);
    check('de spijlen zijn dunner dan de staanders',
        dunne[0].dx < dikke[0].dx, `${dunne[0].dx.toFixed(1)} tegenover ${dikke[0].dx.toFixed(1)}`);

    // Met dunne spijlen passen er meer in hetzelfde veld.
    const alleDik = await bouwMod.bouwBalustrade({
        ...staanderMaten, staanderProfiel: chsRef,
        handregelProfiel: chsRef, spijlProfiel: chsRef,
    });
    log(`spijlen van 20 mm: ${gemengd.spijlen.aantal} stuks, `
        + `van 48,3 mm: ${alleDik.spijlen.aantal} stuks`);
    check('dunne spijlen geven er meer dan dikke',
        gemengd.spijlen.aantal > alleDik.spijlen.aantal,
        `${gemengd.spijlen.aantal} tegenover ${alleDik.spijlen.aantal}`);

    log('\n--- één onderdeel kiezen laat de rest met rust ---');
    // staanderProfiel EXPLICIET op null: staanderMaten heeft hem al ingevuld,
    // en met een spread erft hij anders gewoon mee.
    const alleenSpijl = await bouwMod.bouwBalustrade(
        { ...staanderMaten, staanderProfiel: null, spijlProfiel: shsRef });
    const asSolids = solidsVan(alleenSpijl.shape);
    // dz was 1000; nu 1000 - 40 = 960, want de handregel ligt op de kop. Op
    // `dz > 500` zeven: deze controle gaat over de BREEDTE van de staander.
    check('zonder staanderprofiel blijft de staander een blok van 40 x 40',
        asSolids.some(s => Math.abs(s.dx - 40) < 1e-6 && s.dz > 500),
        asSolids.filter(s => s.dz > 500).map(s => s.dx.toFixed(1)).join(', '));
    check('terwijl de spijlen wél uit het profiel komen',
        alleenSpijl.stuklijst.find(r => r.soort === 'spijl').profiel === 'SHS 20x20x2',
        alleenSpijl.stuklijst.find(r => r.soort === 'spijl').profiel);

    log('\n--- het voorbeeld voorspelt wat er gebouwd wordt ---');
    // Dit is de valkuil: het paneel rekent via voorspelBalustrade en de bouwer
    // via bouwBalustrade. Leidt maar één van de twee de maten uit het profiel
    // af, dan zie je een ander aantal spijlen dan je krijgt.
    const voorspelling = bouwMod.voorspelBalustrade({
        ...staanderMaten, hoogteverschil: 0,
        staanderProfiel: chsRef, handregelProfiel: chsRef, spijlProfiel: shsRef,
    });
    log(`voorbeeld zegt ${voorspelling.spijlen.aantal} spijlen, `
        + `gebouwd zijn er ${gemengd.spijlen.aantal}`);
    check('voorbeeld en bouw geven hetzelfde aantal spijlen',
        voorspelling.spijlen.aantal === gemengd.spijlen.aantal,
        `${voorspelling.spijlen.aantal} tegenover ${gemengd.spijlen.aantal}`);
    check('en dezelfde doorgang',
        Math.abs(voorspelling.spijlen.doorgang - gemengd.spijlen.doorgang) < 1e-9,
        `${voorspelling.spijlen.doorgang.toFixed(3)} tegenover `
        + `${gemengd.spijlen.doorgang.toFixed(3)}`);

    log('\n--- de drie keuzes staan in het paneel ---');
    for (const onderdeel of ['staander', 'handregel', 'spijl']) {
        check(`er is een kies-knop voor de ${onderdeel}`,
            doc.getElementById('kies_' + onderdeel) !== null);
        check(`en een wis-knop voor de ${onderdeel}`,
            doc.getElementById('wis_' + onderdeel) !== null);
    }
    check('zonder keuze staat er "massief blok"',
        /massief blok/.test(doc.getElementById('pr_staander').textContent),
        doc.getElementById('pr_staander').textContent);

    log('\n--- de stuklijst noemt het echte profiel ---');
    // Tot nu toe stond er "48.3 × 48.3". Daar kun je niets mee bestellen: bij
    // die buitenmaat horen een stuk of twintig buizen met verschillende
    // wanddikten, elk met een ander gewicht.
    const volledig = { ...staanderMaten,
        staanderProfiel: { ...chsRef, standardLabel: 'EN 10210-2 – hot-finished',
                           items: [{ itemId: 1, material: 'S235JRH' }] },
        handregelProfiel: { ...chsRef, standardLabel: 'EN 10210-2 – hot-finished',
                            items: [{ itemId: 1, material: 'S235JRH' }] },
        spijlProfiel: { ...shsRef, standardLabel: 'EN 10219-2 – cold-formed',
                        items: [{ itemId: 2, material: 'S355J2H' }] },
    };
    const metLijst = await bouwMod.bouwBalustrade(volledig);
    for (const r of metLijst.stuklijst) {
        log(`  ${r.soort.padEnd(11)} ${r.profiel.padEnd(14)} ${r.norm.padEnd(30)} `
            + `${r.lengte.toFixed(1).padStart(8)} mm  ${r.aantal}x`);
    }

    const rijStaander = metLijst.stuklijst.find(r => r.soort === 'staander');
    const rijHandregel = metLijst.stuklijst.find(r => r.soort === 'handregel');
    const rijSpijl = metLijst.stuklijst.find(r => r.soort === 'spijl');

    check('de staander heet CHS 48.3x2.6, geen buitenmaat',
        rijStaander.profiel === 'CHS 48.3x2.6', rijStaander.profiel);
    check('met de norm erbij, want warm en koud zijn niet hetzelfde profiel',
        rijStaander.norm === 'EN 10210-2 – hot-finished', rijStaander.norm);
    check('en met de staalsoort, want zonder kun je niet bestellen',
        rijStaander.staalsoorten === 'S235JRH', rijStaander.staalsoorten);

    check('de spijl heet SHS 20x20x2', rijSpijl.profiel === 'SHS 20x20x2',
        rijSpijl.profiel);
    check('en staat onder een ANDERE norm dan de staander',
        rijSpijl.norm !== rijStaander.norm, rijSpijl.norm);

    // De zaaglengte moet langs de lengteas gemeten worden. Bij de handregel is
    // dat dx; "de langste maat" zou hier toevallig hetzelfde geven, maar bij
    // een kort stuk uit een dik profiel niet.
    // De handregel was 1951,7 (tussen de staanders) en is nu 2000 (van hart tot
    // hart erover); de staander was 1000 en is nu 1000 - 48,3 = 951,7, want de
    // buis van 48,3 ligt op zijn kop. Daarmee zijn de staander en de spijl hier
    // toevallig even lang - dat is geen fout maar het gevolg van allebei tot de
    // onderkant van dezelfde regel lopen.
    check('de zaaglengte van de handregel is 2000 mm, van hart tot hart',
        Math.abs(rijHandregel.lengte - 2000) < 0.01, rijHandregel.lengte.toFixed(2));
    check('de zaaglengte van de staander is 951,7 mm, tot onder de handregel',
        Math.abs(rijStaander.lengte - 951.7) < 0.01, rijStaander.lengte.toFixed(2));
    check('de zaaglengte van de spijl is 951,7 mm',
        Math.abs(rijSpijl.lengte - 951.7) < 0.01, rijSpijl.lengte.toFixed(2));

    const stuksTotaal = metLijst.stuklijst.reduce((s, r) => s + r.aantal, 0);
    check('de lijst telt evenveel stuks als er onderdelen gebouwd zijn',
        stuksTotaal === metLijst.aantalDelen,
        `${stuksTotaal} tegenover ${metLijst.aantalDelen}`);

    log('\n--- zonder profiel blijft de omschrijving een buitenmaat ---');
    const oudeLijst = (await bouwMod.bouwBalustrade(
        { ...staanderMaten, staanderProfiel: null })).stuklijst;
    const oudeStaander = oudeLijst.find(r => r.soort === 'staander');
    check('zonder profiel staat er nog gewoon 40 × 40',
        oudeStaander.profiel === '40 × 40', oudeStaander.profiel);
    check('en dan is er geen norm', oudeStaander.norm === '', `"${oudeStaander.norm}"`);

    log('\n--- zonder profiel blijft alles zoals het was ---');
    const zonderProfiel = await bouwMod.bouwBalustrade(
        { ...staanderMaten, staanderProfiel: null });
    // Rechtop en breder dan een spijl. Stond op dz === 1000; dat is nu
    // 1000 - 40 = 960, want de handregel ligt op de kop.
    const oudeStaanders = solidsVan(zonderProfiel.shape)
        .filter(s => s.dz > 500 && s.dx > 30);
    check('zonder profiel is de staander weer een blok van 40 x 40',
        Math.abs(oudeStaanders[0].dx - 40) < 1e-6
        && Math.abs(oudeStaanders[0].dy - 40) < 1e-6,
        `${oudeStaanders[0].dx.toFixed(2)} x ${oudeStaanders[0].dy.toFixed(2)}`);
    check('en er zijn evenveel onderdelen als met een profiel',
        zonderProfiel.aantalDelen === metProfiel.aantalDelen,
        `${zonderProfiel.aantalDelen} tegenover ${metProfiel.aantalDelen}`);

    log('\n--- de velden rekenen met de ECHTE staanderbreedte ---');
    // Kies je een buis van 48,3 terwijl het invulveld 40 zegt, dan moet de app
    // met 48,3 rekenen. Anders klopt de spijlverdeling niet.
    //
    // Dit werd hiervoor aan de HANDREGEL gemeten: die was 2000 min twee halve
    // buizen. Dat kan niet meer - de regel loopt nu van hart tot hart over de
    // staanders en is dus 2000 mm, wat de staander ook is. De maat die nog wél
    // van de staanderbreedte afhangt is de VRIJE VELDLENGTE, en die gaat de
    // veiligheidsregel in. Daar wordt het nu dus gemeten, aan de maat die
    // ertoe doet.
    const handregelMet = solidsVan(metProfiel.shape)
        .filter(s => Math.abs(s.dz - regels.STANDAARD.handregelHoogte) < 1e-6);
    check('er is één handregel', handregelMet.length === 1, handregelMet.length);
    const hrLengte = handregelMet[0].dx;
    log(`handregel ${hrLengte.toFixed(2)} mm van hart tot hart; `
        + `vrije veldlengte ${metProfiel.velden[0].vrijeLengte.toFixed(2)} mm `
        + `(2000 min een hele buis = ${(2000 - 48.3).toFixed(2)})`);
    check('de handregel loopt van hart tot hart, ongeacht de staanderbreedte',
        Math.abs(hrLengte - 2000) < 0.01, hrLengte.toFixed(3));
    check('het VELD is ingekort op de buisdiameter, niet op 40',
        Math.abs(metProfiel.velden[0].vrijeLengte - (2000 - 48.3)) < 0.01,
        metProfiel.velden[0].vrijeLengte.toFixed(3));

    log('\n--- het voorbeeld raakt het geladen model niet aan ---');
    // Dit is de valkuil: leest de kiezer profielen in met leesVorm(), dan
    // vervangt elk voorbeeldje het model van de gebruiker en exporteert de
    // knop "STEP exporteren" daarna een stukje profiel.
    const brep = await win.eval("import('/brep-edges.js')");
    const voorModel = await brep.laadStep(bytes);      // de kubus laden
    const voorTelling = JSON.stringify(voorModel.counts);
    await geo.voorbeeldVan(testProfiel, 200);         // en dan een profiel bekijken
    const naVorm = brep.huidigeVorm();
    const naUit = await brep.readBrepEdges(await brep.exportStep(), 300);
    log(`model voor: ${voorTelling}`);
    log(`model na  : ${JSON.stringify(naUit.counts)}`);
    check('het geladen model is nog steeds de kubus',
        naUit.counts.EDGE === 12 && naUit.counts.FACE === 6,
        JSON.stringify(naUit.counts));
    check('en er is nog steeds een vorm om te exporteren', naVorm !== null);

    log('\n--- Escape levert ook niets op ---');
    const derdeBelofte = kiezer.kiesProfiel(catGeladen);
    dialoog.close();   // sluiten zonder returnValue, zoals Escape doet
    check('sluiten zonder te kiezen geeft null', (await derdeBelofte) === null);
    check('het venster is dicht', !dialoog.open);

    // ============ DEEL N: gelijke onderdelen herkennen ======================
    log('\n\n======== DEEL N: gelijke productieonderdelen ========\n');

    const ond = await win.eval("import('/onderdelen.js')");
    const ocN = await api.initOcct();

    log('--- de kenmerken veranderen NIET door verplaatsen of draaien ---');
    const blokN = (x, y, z, dx, dy, dz) => new ocN.BRepPrimAPI_MakeBox_3(
        new ocN.gp_Pnt_3(x, y, z), dx, dy, dz).Shape();
    const basisBlok = blokN(0, 0, 0, 40, 40, 1000);
    const kBasis = { ...ond.kenmerken(ocN, basisBlok), draairichting: 1 };

    const verplaatst = { ...ond.kenmerken(ocN, blokN(-3000, 7000, 12, 40, 40, 1000)),
                         draairichting: 1 };
    check('hetzelfde blok 7 meter verderop is hetzelfde onderdeel',
        ond.gelijk(kBasis, verplaatst), 'niet herkend');

    const draaiN = (vorm, hoek, as) => {
        const t = new ocN.gp_Trsf_1();
        t.SetRotation_1(new ocN.gp_Ax1_2(new ocN.gp_Pnt_3(0, 0, 0),
            new ocN.gp_Dir_4(...as)), hoek);
        return new ocN.BRepBuilderAPI_Transform_2(vorm, t, true).Shape();
    };
    for (const [wat, hoek, as] of [
        ['90° om Z', Math.PI / 2, [0, 0, 1]],
        ['90° om X (ligt plat)', Math.PI / 2, [1, 0, 0]],
        ['37° om een schuine as', 0.6458, [0.3, 0.5, 0.81]],
    ]) {
        const k = { ...ond.kenmerken(ocN, draaiN(basisBlok, hoek, as)), draairichting: 1 };
        check(`gedraaid ${wat} is nog steeds hetzelfde onderdeel`, ond.gelijk(kBasis, k));
    }

    log('\n--- maar WEL door een echte verandering ---');
    for (const [wat, vorm] of [
        ['0,1 mm langer', blokN(0, 0, 0, 40, 40, 1000.1)],
        ['0,1 mm breder', blokN(0, 0, 0, 40.1, 40, 1000)],
    ]) {
        const k = { ...ond.kenmerken(ocN, vorm), draairichting: 1 };
        check(`${wat} is een ANDER onderdeel`, !ond.gelijk(kBasis, k));
    }

    // Een gat erin. Dit is de eis uit de opdracht: een bewerking moet verschil
    // maken, ook al blijven profiel en lengte gelijk.
    const asN = new ocN.gp_Ax2_3(new ocN.gp_Pnt_3(20, 20, -10),
                                 new ocN.gp_Dir_4(0, 0, 1));
    const boor = new ocN.BRepPrimAPI_MakeCylinder_3(asN, 6, 1020).Shape();
    const gatSnij = new ocN.BRepAlgoAPI_Cut_3(basisBlok, boor,
        new ocN.Message_ProgressRange_1());
    gatSnij.Build(new ocN.Message_ProgressRange_1());
    const kGatN = { ...ond.kenmerken(ocN, gatSnij.Shape()), draairichting: 1 };
    log(`zonder gat: ${JSON.stringify(kBasis.telling)}`);
    log(`met gat   : ${JSON.stringify(kGatN.telling)}`);
    check('een gat maakt er een ander onderdeel van', !ond.gelijk(kBasis, kGatN));
    check('en dat is ook aan de topologie te zien',
        kGatN.telling.FACE > kBasis.telling.FACE,
        `${kBasis.telling.FACE} tegenover ${kGatN.telling.FACE} vlakken`);

    // Verstek: het blok schuin afzagen. Topologie blijft gelijk, dus hier moeten
    // de GETALLEN het verschil maken.
    const mes = blokN(-50, -50, 980, 200, 200, 200);
    const mesT = new ocN.gp_Trsf_1();
    mesT.SetRotation_1(new ocN.gp_Ax1_2(new ocN.gp_Pnt_3(0, 0, 1000),
        new ocN.gp_Dir_4(0, 1, 0)), 0.35);
    const schuinMes = new ocN.BRepBuilderAPI_Transform_2(mes, mesT, true).Shape();
    const verstekSnij = new ocN.BRepAlgoAPI_Cut_3(basisBlok, schuinMes,
        new ocN.Message_ProgressRange_1());
    verstekSnij.Build(new ocN.Message_ProgressRange_1());
    const kVerstekN = { ...ond.kenmerken(ocN, verstekSnij.Shape()), draairichting: 1 };
    check('een verstek maakt er een ander onderdeel van', !ond.gelijk(kBasis, kVerstekN));
    check('terwijl de topologie GELIJK blijft — daarom tellen de getallen mee',
        JSON.stringify(kVerstekN.telling) === JSON.stringify(kBasis.telling),
        JSON.stringify(kVerstekN.telling));

    log('\n--- gespiegeld is niet hetzelfde onderdeel ---');
    check('een gespiegelde plaatsing geeft draairichting -1',
        ond.draairichting({ xAs: [1, 0, 0], yAs: [0, 1, 0], zAs: [0, 0, -1] }) === -1);
    check('en een gewone plaatsing +1',
        ond.draairichting({ xAs: [1, 0, 0], yAs: [0, 1, 0], zAs: [0, 0, 1] }) === 1);
    check('zelfde vorm maar gespiegeld geplaatst wordt NIET samengevoegd',
        !ond.gelijk(kBasis, { ...kBasis, draairichting: -1 }));

    log('\n--- het testplan uit de opdracht: de staanders ---');
    const staanderTest = { ...regels.STANDAARD, lengte: 2000,
        handregelOverstek: 0, staanderProfiel: chsRef };
    // 2000 mm bij maximaal 700 geeft ceil(2000/700) = 3 velden, en 3 velden
    // betekent 4 staanders. Let op het verschil tussen velden en staanders:
    // met 600 zou je 4 velden en dus 5 staanders krijgen.
    const metVier = await bouwMod.bouwBalustrade(
        { ...staanderTest, maxStaanderAfstand: 700 });

    const staanderOnd = metVier.onderdelen.filter(u => u.deel.soort === 'staander');
    log(`staanders: ${metVier.stuklijst.find(r => r.soort === 'staander').aantal} stuks, `
        + `${staanderOnd.length} uniek onderdeel`);
    check('vier gelijke staanders worden ÉÉN uniek onderdeel',
        staanderOnd.length === 1, staanderOnd.length + ' unieke');
    check('met aantal 4', staanderOnd[0] && staanderOnd[0].aantal === 4,
        staanderOnd[0] && staanderOnd[0].aantal);

    log('\n--- alle onderdelen van deze balustrade ---');
    for (const u of metVier.onderdelen) {
        log(`  ${ond.bestandsnaam(u.nummer)}  ${String(u.aantal).padStart(3)}x  `
            + `${u.deel.soort}`);
    }
    const somN = metVier.onderdelen.reduce((s, u) => s + u.aantal, 0);
    check('de aantallen tellen op tot het aantal gebouwde onderdelen',
        somN === metVier.aantalDelen, `${somN} tegenover ${metVier.aantalDelen}`);
    check('er zijn minder unieke onderdelen dan exemplaren',
        metVier.onderdelen.length < metVier.aantalDelen,
        `${metVier.onderdelen.length} uniek uit ${metVier.aantalDelen}`);

    log('\n--- en nu één staander bewust anders ---');
    // Een gat boren in de eerste staander. Dan moet het 3 + 1 worden.
    const lokaleStaander = staanderOnd[0].vorm;
    const boorAs = new ocN.gp_Ax2_3(new ocN.gp_Pnt_3(-30, 0, 500),
                                    new ocN.gp_Dir_4(1, 0, 0));
    const staanderBoor = new ocN.BRepPrimAPI_MakeCylinder_3(boorAs, 5, 60).Shape();
    const geboord = new ocN.BRepAlgoAPI_Cut_3(lokaleStaander, staanderBoor,
        new ocN.Message_ProgressRange_1());
    geboord.Build(new ocN.Message_ProgressRange_1());

    // De vier exemplaren nabouwen, maar bij één de geboorde vorm gebruiken.
    const geboordeSet = staanderOnd[0].exemplaren.map((d, i) => ({
        deel: d,
        vorm: i === 0 ? geboord.Shape() : lokaleStaander,
        kenmerken: {
            ...ond.kenmerken(ocN, i === 0 ? geboord.Shape() : lokaleStaander),
            draairichting: ond.draairichting(d),
        },
    }));
    const naBoren = ond.groepeer(geboordeSet);
    log(`na het boren: ${naBoren.length} unieke onderdelen, `
        + `aantallen ${naBoren.map(u => u.aantal).join(' en ')}`);
    check('één geboorde staander geeft TWEE unieke onderdelen',
        naBoren.length === 2, naBoren.length);
    check('met aantallen 3 en 1',
        naBoren.map(u => u.aantal).sort((a, b) => b - a).join(',') === '3,1',
        naBoren.map(u => u.aantal).join(','));

    log('\n--- één STEP per uniek onderdeel ---');
    const stepA = await api.schrijfStep(naBoren[0].vorm);
    const stepB = await api.schrijfStep(naBoren[1].vorm);
    log(`${ond.bestandsnaam(1)}: ${stepA.length.toLocaleString('nl')} bytes, `
        + `${ond.bestandsnaam(2)}: ${stepB.length.toLocaleString('nl')} bytes`);
    check('beide onderdelen leveren een STEP-bestand op',
        stepA.length > 0 && stepB.length > 0);
    check('en het geboorde bestand is groter — er zit meer geometrie in',
        Math.abs(stepA.length - stepB.length) > 100,
        `${stepA.length} tegenover ${stepB.length}`);

    // Het bestand moet ÉÉN onderdeel bevatten, niet vier op hun plek.
    const terug = await api.readBrepEdges(stepA, 1000);
    log(`in ${ond.bestandsnaam(1)}: ${JSON.stringify(terug.counts)}`);
    check('het STEP-bestand bevat één solid, niet vier exemplaren',
        terug.counts.SOLID === 1, terug.counts.SOLID);

    log('\n--- en nu de trap: treden en bomen ---');
    // De trap deed eerst niet mee: bouwTrap gaf geen onderdelenlijst, dus het
    // blok Productieonderdelen verdween zodra je een trap genereerde.
    const trapOnd = await trapBouw.bouwTrap({ ...trapRegels.STANDAARD });
    log(`de trap heeft ${trapOnd.aantalDelen} onderdelen, `
        + `${trapOnd.onderdelen.length} daarvan uniek`);
    for (const u of trapOnd.onderdelen) {
        log(`  ${ond.bestandsnaam(u.nummer)}  ${String(u.aantal).padStart(3)}x  `
            + `${u.deel.soort}`);
    }

    check('de trap levert een onderdelenlijst op',
        Array.isArray(trapOnd.onderdelen) && trapOnd.onderdelen.length > 0,
        trapOnd.onderdelen && trapOnd.onderdelen.length);

    const tredenUit = trapOnd.onderdelen.filter(u => u.deel.soort === 'trede');
    const tredenTotaal = trapOnd.stuklijst.find(r => r.soort === 'trede').aantal;
    check('alle gelijke treden worden ÉÉN uniek onderdeel',
        tredenUit.length === 1, tredenUit.length + ' unieke');
    check(`met aantal ${tredenTotaal}`,
        tredenUit[0] && tredenUit[0].aantal === tredenTotaal,
        tredenUit[0] && tredenUit[0].aantal);

    const somTrap = trapOnd.onderdelen.reduce((s, u) => s + u.aantal, 0);
    check('de aantallen tellen op tot het aantal gebouwde trapdelen',
        somTrap === trapOnd.aantalDelen,
        `${somTrap} tegenover ${trapOnd.aantalDelen}`);

    // Dít was de fout die het normaliseren van maakPlaat moest repareren: de
    // omtrek van een trapboom stond in WERELDcoordinaten, dus de linker en de
    // rechter boom - even groot, alleen op een andere y - kwamen eruit als twee
    // verschillende onderdelen.
    const bomenUit = trapOnd.onderdelen.filter(u => u.deel.soort === 'trapboom');
    check('de twee trapbomen zijn één onderdeel, twee keer te maken',
        bomenUit.length === 1 && bomenUit[0].aantal === 2,
        bomenUit.map(u => `${u.aantal}x`).join(' + '));

    log('\n--- een trapboom als los STEP-bestand ---');
    const boomStep = await schrijfStep(bomenUit[0].vorm);
    const boomTerug = await readBrepEdges(boomStep, 1000);
    log(`${boomStep.length.toLocaleString('nl')} bytes, `
        + JSON.stringify(boomTerug.counts));
    check('het bestand bevat één plaat, niet twee',
        boomTerug.counts.SOLID === 1, boomTerug.counts.SOLID);
    // De boom is afgeknipt op vloerpeil, dus zijn omtrek heeft vijf hoeken en
    // niet vier: vijf zijvlakken plus voor- en achterkant.
    check('de afgeknipte boom heeft meer dan de zes vlakken van een blok',
        boomTerug.counts.FACE > 6, boomTerug.counts.FACE);

    log('\n--- de trapleuning gebruikt nu hetzelfde profiel als de balustrade ---');
    // De leuningonderdelen komen bij de trap uit dezelfde padDelen als bij de
    // balustrade, maar werden daar als massief blok gebouwd. De stuklijst noemde
    // dan een buis en de geometrie leverde staf.
    const leuningMaten = { ...regels.STANDAARD, staanderProfiel: chsRef,
        handregelOverstek: 0 };
    const trapMetLeuning = await trapBouw.bouwTrap(
        { ...trapRegels.STANDAARD }, leuningMaten, 'links');
    const staanderOpTrap = trapMetLeuning.onderdelen
        .filter(u => u.deel.soort === 'staander');
    check('de trap heeft staanders in zijn onderdelenlijst',
        staanderOpTrap.length > 0, staanderOpTrap.length);
    log('staanders op de trap: '
        + staanderOpTrap.map(u => `${u.aantal}x`).join(' + '));

    // vlaksoorten komt uit OCCT als GETAL, niet als naam: {"0":2,"1":2}. Welk
    // getal welke soort is, vraag je aan de enum - niet aannemen.
    const soortNr = (e) =>
        String((e && typeof e === 'object' && 'value' in e) ? e.value : e);
    const platVlak = soortNr(ocN.GeomAbs_SurfaceType.GeomAbs_Plane);
    const cilVlak = soortNr(ocN.GeomAbs_SurfaceType.GeomAbs_Cylinder);
    log(`plat = ${platVlak}, cilinder = ${cilVlak}`);

    const holVlakken = staanderOpTrap[0]
        && ond.kenmerken(ocN, staanderOpTrap[0].vorm).vlaksoorten;
    log('vlaksoorten van de trapstaander: ' + JSON.stringify(holVlakken));
    // Een buis heeft twee cilinders - buitenkant en binnenkant - en twee ringen
    // als kopvlakken. Een massief blok heeft zes platte vlakken en nul cilinders.
    check('de staander op de trap is een echte buis: twee cilindervlakken',
        holVlakken && holVlakken[cilVlak] === 2,
        JSON.stringify(holVlakken));
    check('met twee ringen als kopvlakken',
        holVlakken && holVlakken[platVlak] === 2,
        JSON.stringify(holVlakken));

    const tredeVlakken = ond.kenmerken(ocN, tredenUit[0].vorm).vlaksoorten;
    check('en een trede is wél gewoon een blok: zes platte vlakken, geen cilinder',
        tredeVlakken[platVlak] === 6 && !tredeVlakken[cilVlak],
        JSON.stringify(tredeVlakken));

    // ============ DEEL O: voetplaten ========================================
    log('\n\n======== DEEL O: voetplaten ========\n');

    // Hiervoor zweefden de staanders: er zat geen enkele bevestiging aan de
    // vloer. Verbeterpunt 5 uit VERBETERPUNTEN.md.
    const vpMaten = { ...regels.STANDAARD, lengte: 2000, maxStaanderAfstand: 700,
                      handregelOverstek: 0 };
    const vp = regels.VOETPLAAT;
    const metPlaten = await bouwMod.bouwBalustrade(vpMaten);

    const plaatRegel = metPlaten.stuklijst.find(r => r.soort === 'voetplaat');
    const staanderRegel = metPlaten.stuklijst.find(r => r.soort === 'staander');
    log(`${staanderRegel.aantal} staanders, ${plaatRegel.aantal} voetplaten`);
    check('onder elke staander ligt precies één voetplaat',
        plaatRegel.aantal === staanderRegel.aantal,
        `${plaatRegel.aantal} platen tegenover ${staanderRegel.aantal} staanders`);
    check('de maat in de stuklijst is de plaat zelf, niet een profiel',
        plaatRegel.profiel === `${vpMaten.voetplaatDikte} × ${vp.breedte}`,
        plaatRegel.profiel);
    check(`en de zaaglengte is ${vp.lengte} mm`,
        Math.abs(plaatRegel.lengte - vp.lengte) < 1e-9, plaatRegel.lengte);

    log('\n--- de gaten zitten er echt in ---');
    const plaatOnd = metPlaten.onderdelen.filter(u => u.deel.soort === 'voetplaat');
    check('alle voetplaten zijn samen ÉÉN productieonderdeel',
        plaatOnd.length === 1 && plaatOnd[0].aantal === plaatRegel.aantal,
        plaatOnd.map(u => `${u.aantal}x`).join(' + '));

    const plaatKenmerk = ond.kenmerken(ocN, plaatOnd[0].vorm);
    log('topologie   : ' + JSON.stringify(plaatKenmerk.telling));
    log('vlaksoorten : ' + JSON.stringify(plaatKenmerk.vlaksoorten));
    check('twee gaten geven twee cilindervlakken',
        plaatKenmerk.vlaksoorten[cilVlak] === 2,
        JSON.stringify(plaatKenmerk.vlaksoorten));
    check('en dus acht vlakken in plaats van zes',
        plaatKenmerk.telling.FACE === 8, plaatKenmerk.telling.FACE);

    // Het volume is de echte controle: een plaat met twee gaten is lichter dan
    // een volle plaat, en precies zoveel lichter als er uit geboord is.
    const vol = vp.lengte * vp.breedte * vpMaten.voetplaatDikte
              - 2 * Math.PI * (vp.gat / 2) ** 2 * vpMaten.voetplaatDikte;
    log(`volume ${plaatKenmerk.volume.toFixed(2)} mm3, berekend ${vol.toFixed(2)}`);
    check('het volume klopt met twee doorboringen',
        Math.abs(plaatKenmerk.volume - vol) < 1e-6,
        `${plaatKenmerk.volume.toFixed(4)} tegenover ${vol.toFixed(4)}`);
    check('en is dus kleiner dan een volle plaat',
        plaatKenmerk.volume < vp.lengte * vp.breedte * vpMaten.voetplaatDikte,
        `${plaatKenmerk.volume.toFixed(0)} < ${vp.lengte * vp.breedte * vpMaten.voetplaatDikte}`);

    log('\n--- een voetplaat als los STEP-bestand ---');
    const plaatStep = await schrijfStep(plaatOnd[0].vorm);
    const plaatTerug = await readBrepEdges(plaatStep, 200);
    log(`${plaatStep.length.toLocaleString('nl')} bytes, `
        + JSON.stringify(plaatTerug.counts));
    check('één plaat in het bestand', plaatTerug.counts.SOLID === 1,
        plaatTerug.counts.SOLID);
    check('met ronde ribben erin — dat zijn de boutgaten',
        plaatTerug.edges.some(e => e.curveType === 'Circle'),
        [...new Set(plaatTerug.edges.map(e => e.curveType))].join(','));

    log('\n--- dikte 0 betekent geen voetplaat ---');
    const zonderPlaat = await bouwMod.bouwBalustrade(
        { ...vpMaten, voetplaatDikte: 0 });
    check('zonder voetplaat staat er geen plaat in de stuklijst',
        !zonderPlaat.stuklijst.some(r => r.soort === 'voetplaat'),
        zonderPlaat.stuklijst.map(r => r.soort).join(','));
    // "Over de volle hoogte" is sinds de doorlopende handregel niet meer de
    // leuninghoogte: de regel ligt op de kop, dus die gaat er nog steeds af.
    // Zonder voetplaat staat de staander wél op de vloer in plaats van erop.
    check('en de staander loopt dan tot onder de handregel, vanaf de vloer',
        Math.abs(zonderPlaat.stuklijst.find(r => r.soort === 'staander').lengte
                 - (vpMaten.hoogte - vpMaten.handregelHoogte)) < 1e-9,
        zonderPlaat.stuklijst.find(r => r.soort === 'staander').lengte);
    check('er zijn precies evenveel delen minder als er staanders zijn',
        zonderPlaat.aantalDelen === metPlaten.aantalDelen - staanderRegel.aantal,
        `${zonderPlaat.aantalDelen} tegenover ${metPlaten.aantalDelen}`);

    log('\n--- gaten die niet op de plaat passen worden geweigerd ---');
    // Zonder deze controle levert de uitsnede een vorm op die er alleen maar
    // raar uitziet, zonder dat iemand een foutmelding krijgt.
    const teKort = regels.valideer({ ...vpMaten,
        voetplaat: { lengte: 100, breedte: 50, gat: 20, gatAfstand: 90 } });
    log('melding: ' + (teKort[0] || '(geen)'));
    check('een te korte plaat voor die gatafstand geeft een foutmelding',
        teKort.length > 0 && /rand van de voetplaat/.test(teKort[0]), teKort.join('; '));
    const teSmal = regels.valideer({ ...vpMaten,
        voetplaat: { lengte: 150, breedte: 15, gat: 20, gatAfstand: 90 } });
    check('een gat breder dan de plaat ook',
        teSmal.some(f => /breder dan de voetplaat/.test(f)), teSmal.join('; '));
    check('en de standaardmaten zelf geven géén melding',
        regels.valideer(vpMaten).length === 0, regels.valideer(vpMaten).join('; '));
