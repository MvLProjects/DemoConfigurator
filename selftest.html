    log('\n--- staat er nergens een spijl bovenop een voetplaat? ---');
    // Een voetplaat is 150 lang en steekt dus 55 mm voorbij een staander van
    // 40. Staan de staanders dicht op elkaar, dan kan de eerste spijl van een
    // veld binnen die 55 mm vallen - en dan zakt hij door de plaat heen. Je
    // ziet dat in het model niet; het valt pas op in de werkplaats.
    //
    // Dit is een VEEG over veel combinaties en niet één geval, want het hangt
    // af van veldlengte, staanderafstand en spijlbreedte tegelijk.
    let botsingen = 0, krapste = Infinity, krapsteGeval = '';
    let combinaties = 0;
    for (const lengte of [400, 800, 1500, 2000, 4000, 6000]) {
        for (const maxAfstand of [300, 500, 850, 2000]) {
            for (const spijlBreedte of [5, 20, 40]) {
                const p = { ...regels.STANDAARD, lengte, maxStaanderAfstand: maxAfstand,
                            spijlBreedte, handregelOverstek: 0 };
                if (regels.valideer(p).length) continue;
                combinaties++;

                const stukken = pad.padDelen([[0, 0, 0], [lengte, 0, 0]], false, p).delen;
                const platen = stukken.filter(d => d.soort === 'voetplaat')
                    .map(d => [d.oorsprong[0], d.oorsprong[0] + d.dx]);
                const staven = stukken.filter(d => d.soort === 'spijl')
                    .map(d => [d.oorsprong[0], d.oorsprong[0] + d.dx]);

                for (const [sa, sb] of staven) {
                    for (const [pa, pb] of platen) {
                        const overlap = Math.min(sb, pb) - Math.max(sa, pa);
                        if (overlap > 0) botsingen++;
                        const vrij = overlap > 0 ? -overlap
                            : Math.min(Math.abs(sa - pb), Math.abs(pa - sb));
                        if (vrij < krapste) {
                            krapste = vrij;
                            krapsteGeval = `lengte ${lengte}, max ${maxAfstand}, `
                                + `spijl ${spijlBreedte}`;
                        }
                    }
                }
            }
        }
    }
    log(`${combinaties} combinaties doorgerekend`);
    log(`krapste vrije ruimte: ${krapste.toFixed(2)} mm  (${krapsteGeval})`);
    check('geen enkele spijl staat bovenop een voetplaat',
        botsingen === 0, botsingen + ' botsingen');
    // Het gaat nét goed, en dat is geen ontwerp maar geluk: bij staanders om de
    // 300 mm met spijlen van 40 blijft er een kwart millimeter over. Deze
    // controle staat er om te merken wanneer dat omslaat. Gaat hij ooit om,
    // dan hoort de app te WAARSCHUWEN en niet stil een model te bouwen waarin
    // twee onderdelen door elkaar heen zitten.
    check('maar het is krap — minder dan een millimeter in het ergste geval',
        krapste < 1, `${krapste.toFixed(2)} mm`);

    log('\n--- geen voetplaten op een trap ---');
    // Een trapstaander staat op een SCHUINE trapboom en wordt eraan gelast. Een
    // horizontale plaat zou daar half doorheen steken.
    const trapLeuningMaten = { ...regels.STANDAARD, handregelOverstek: 0 };
    const trapMetPlaat = await trapBouw.bouwTrap(
        { ...trapRegels.STANDAARD }, trapLeuningMaten, 'links');
    check('de trapleuning krijgt geen voetplaten',
        !trapMetPlaat.stuklijst.some(r => r.soort === 'voetplaat'),
        trapMetPlaat.stuklijst.map(r => r.soort).join(','));
    check('ook al staat de voetplaat in de meegegeven maten aan',
        trapLeuningMaten.voetplaatDikte > 0, trapLeuningMaten.voetplaatDikte);

    log('\n--- de afdekkap is weg sinds de handregel doorloopt ---');
    // DIT DEEL IS OMGEDRAAID. Hier stond dat elke staander een afdekkap krijgt:
    // een plaatje bovenop de paal, zoals op de referentiefoto's die de stagiair
    // erbij had gezocht. Op die foto's loopt de handregel TUSSEN de palen door
    // en steekt de paal er met een kap bovenuit.
    //
    // Punt 1 van de opdracht vraagt het omgekeerde: de handregel doorlopend
    // OVER de staanders, en de staanders mogen er niet bovenuit komen. Daarmee
    // is er geen vrije staanderkop meer om een kap op te zetten, en bouwt
    // padDelen er dus geen enkele meer.
    //
    // Deze controles blijven staan omdat ze iets bewijzen: dat het ene de
    // consequentie van het andere is, en dat het niet stil gebeurt doordat de
    // kap per ongeluk ergens in het model is blijven hangen.
    const kapMaten = { ...regels.STANDAARD, lengte: 2000,
        maxStaanderAfstand: 850, handregelOverstek: 0, voetplaatDikte: 10 };
    const kapDelen = pad.padDelen([[0, 0, 0], [2000, 0, 0]], false, kapMaten).delen;
    const kappen = kapDelen.filter(d => d.soort === 'paalkap');
    const kapStaanders = kapDelen.filter(d => d.soort === 'staander');
    log(`${kapStaanders.length} staanders, ${kappen.length} kappen `
        + `(paalkapdikte staat op ${regels.STANDAARD.paalkapDikte})`);

    check('de instelling paalkapdikte staat nog gewoon aan',
        regels.STANDAARD.paalkapDikte > 0, regels.STANDAARD.paalkapDikte);
    check('en tóch komt er geen enkele kap, want de regel ligt op elke kop',
        kappen.length === 0, kappen.length);
    check('dat geldt voor élke staander, ook de middelste',
        kapStaanders.length === 4, kapStaanders.length);

    // De maat die hierdoor NIET mag schuiven: de leuninghoogte. Die wordt tot
    // de bovenkant van de handregel gemeten, en de kap zat er bewust boven.
    // Nu de kap weg is, is de hoogste staalmaat de bovenkant van de regel, en
    // die moet precies op de leuninghoogte liggen.
    const kapRegel = kapDelen.find(d => d.soort === 'handregel');
    check('de bovenkant van de handregel ligt op de leuninghoogte',
        Math.abs(kapRegel.oorsprong[2] + kapRegel.dz - kapMaten.hoogte) < 1e-9,
        `${(kapRegel.oorsprong[2] + kapRegel.dz).toFixed(2)} tegenover ${kapMaten.hoogte}`);
    const hoogsteStaal = Math.max(...kapDelen.map(d =>
        d.oorsprong[2] + d.zAs[2] * d.dz));
    check('en er steekt nergens meer iets boven de handregel uit',
        Math.abs(hoogsteStaal - kapMaten.hoogte) < 1e-9, hoogsteStaal.toFixed(3));

    log('\n--- de staanderkop sluit aan op de ONDERKANT van de regel ---');
    // De maat die de kap vervangt. Elke staander stopt op de onderkant van de
    // handregel: een handregelhoogte onder de leuninghoogte, min de voetplaat.
    const kapKoppen = [...new Set(kapStaanders.map(d =>
        +(d.oorsprong[2] + d.dz).toFixed(6)))];
    const kapOnderkant = kapMaten.hoogte - kapMaten.handregelHoogte;
    check('alle vier de koppen liggen op dezelfde hoogte', kapKoppen.length === 1,
        kapKoppen.join(', '));
    check('en dat is precies de onderkant van de handregel',
        Math.abs(kapKoppen[0] - kapOnderkant) < 1e-9,
        `${kapKoppen[0]} tegenover ${kapOnderkant}`);
    check('de regel begint daar dus ook',
        Math.abs(kapRegel.oorsprong[2] - kapOnderkant) < 1e-9,
        kapRegel.oorsprong[2].toFixed(3));

    log('\n--- de kapgeometrie zelf blijft gedekt ---');
    // De kap wordt niet meer in een balustrade geplaatst, maar maakDeel kan hem
    // nog wel bouwen. Dat blijft hier getest omdat er een beslissing over open
    // staat: het veld "paalkapdikte" gaat uit het paneel zodra punt 1 van de
    // opdracht is goedgekeurd, en zolang dat niet zo is mag deze code niet
    // stilletjes verrotten.
    const kapApartOc = await api.initOcct();
    const kapApartSpec = (rond) => ({
        soort: 'paalkap', oorsprong: [0, 0, 0],
        xAs: [1, 0, 0], yAs: [0, 1, 0], zAs: [0, 0, 1],
        dx: 46, dy: 46, dz: 5, profiel: null, lengteAs: 'z', rond,
    });
    const kapApartOpruimen = [];
    const kapVierkant = await bouwMod.maakDeel(
        kapApartOc, kapApartSpec(false), kapApartOpruimen);
    const kapCilinder = await bouwMod.maakDeel(
        kapApartOc, kapApartSpec(true), kapApartOpruimen);
    const kapVlakken = (vorm) => {
        let n = 0;
        for (const v = new kapApartOc.TopExp_Explorer_2(vorm,
                 kapApartOc.TopAbs_ShapeEnum.TopAbs_FACE,
                 kapApartOc.TopAbs_ShapeEnum.TopAbs_SHAPE); v.More(); v.Next()) n++;
        return n;
    };
    log(`vierkante kap: ${kapVlakken(kapVierkant.lokaal)} vlakken, `
        + `ronde kap: ${kapVlakken(kapCilinder.lokaal)} vlakken`);
    check('een vierkante kap is een blok van zes vlakken',
        kapVlakken(kapVierkant.lokaal) === 6, kapVlakken(kapVierkant.lokaal));
    check('en een ronde kap een cilinder van drie',
        kapVlakken(kapCilinder.lokaal) === 3, kapVlakken(kapCilinder.lokaal));
    check('de oversteek uit regels.json is nog 3 mm',
        regels.PAALKAP.overstek === 3, regels.PAALKAP.overstek);
    for (const o of kapApartOpruimen) { try { o.delete(); } catch { /* al weg */ } }

    // ============ DEEL P: vulraamwerk =======================================
    log('\n\n======== DEEL P: vulraamwerk ========\n');

    // Verbeterpunt 2 uit VERBETERPUNTEN.md, en het grootste verschil met de
    // voorbeeldbalustrade. De spijlen zitten daar niet rechtstreeks tussen de
    // vloer en de handregel maar in een EIGEN RAAM van twee regels. Dat is niet
    // hoe het eruitziet maar hoe je het maakt: een los paneel las je plat op
    // een bok en hang je daarna tussen de staanders.
    const vr = regels.VULRAAMWERK;
    const chsBestand = 'DIN_EN_10210-2_R/Pipe_EN_10210-2_48.3x2.6.stp';
    const chsP = soortRef(zoekBestand(chsBestand));
    const fl205 = soortRef(zoekBestand('DIN_EN_10058/Fl_20x5.stp'));
    const fl306 = soortRef(zoekBestand('DIN_EN_10058/Fl_30x6.stp'));
    check('de drie profielen uit het voorbeeld zitten in de catalogus',
        !!(chsP.boxSize && fl205.boxSize && fl306.boxSize),
        `${JSON.stringify(chsP.boxSize)} ${JSON.stringify(fl205.boxSize)} `
        + JSON.stringify(fl306.boxSize));

    // Zijn balustrade nagebouwd: staanders 1700 hart-op-hart (382,75 en 2082,75
    // in zijn bestand), één staander ertussen op 850, alles CHS 48,3 x 2,6 met
    // spijlen van strip 20 x 5 en regels van strip 30 x 6.
    const alsVoorbeeld = { ...regels.STANDAARD, lengte: 1700,
        maxStaanderAfstand: 850, handregelOverstek: 100, voetplaatDikte: 10,
        vulraamwerk: 1, staanderProfiel: chsP, handregelProfiel: chsP,
        spijlProfiel: fl205, regelProfiel: fl306 };
    check('deze combinatie geeft geen klachten',
        regels.valideer(alsVoorbeeld).length === 0,
        regels.valideer(alsVoorbeeld).join('; '));

    const nagebouwd = pad.padDelen([[0, 0, 0], [1700, 0, 0]], false, alsVoorbeeld);
    const stuks = {};
    for (const d of nagebouwd.delen) stuks[d.soort] = (stuks[d.soort] || 0) + 1;
    log('onderdelen: ' + JSON.stringify(stuks));
    log(`velden: ${nagebouwd.velden.length}, vrije lengte `
        + `${nagebouwd.velden[0].vrijeLengte.toFixed(1)} mm`);

    const regelDelen = nagebouwd.delen.filter(d => d.soort === 'vulregel');
    const spijlDeel = nagebouwd.delen.find(d => d.soort === 'spijl');
    const onderRegel = regelDelen.reduce((a, b) =>
        a.oorsprong[2] < b.oorsprong[2] ? a : b);
    const bovenKant = Math.max(...regelDelen.map(d => d.oorsprong[2] + d.dz));

    // De lat: de maten uit zijn bestand, omgerekend naar de loopvloer (die ligt
    // daar op z = 457).
    const zoals = (wat, gemeten, verwacht) => {
        log(`  ${wat.padEnd(24)} ${gemeten.toFixed(1).padStart(8)}  `
            + `voorbeeld ${String(verwacht).padStart(7)}`);
        check(`${wat} klopt met het voorbeeld`,
            Math.abs(gemeten - verwacht) < 0.05,
            `${gemeten.toFixed(3)} tegenover ${verwacht}`);
    };
    zoals('onderkant onderregel', onderRegel.oorsprong[2], 100);
    zoals('bovenkant bovenregel', bovenKant, 801.7);
    zoals('spijllengte', spijlDeel.dz, 689.7);
    zoals('spijl begint op', spijlDeel.oorsprong[2], 106);
    zoals('regellengte', onderRegel.dx, 801.7);

    check('er zijn twee regels per veld', regelDelen.length === 4,
        `${regelDelen.length} bij ${nagebouwd.velden.length} velden`);
    check('en de aantallen staander en voetplaat kloppen ook',
        stuks.staander === 3 && stuks.voetplaat === 3,
        `${stuks.staander} staanders, ${stuks.voetplaat} voetplaten`);

    // De regel ligt PLAT: 30 mm de diepte in, 6 mm hoog. Op zijn kant zou hij
    // net zoveel staal zijn en er heel anders uitzien.
    check('de regel ligt plat: 30 diep, 6 hoog',
        Math.abs(onderRegel.dy - 30) < 1e-9 && Math.abs(onderRegel.dz - 6) < 1e-9,
        `${onderRegel.dy} x ${onderRegel.dz}`);

    log('\n--- het enige wat er nog tussen zit is de maximale doorgang ---');
    // Zijn voorbeeld heeft 12 spijlen met een doorgang van 110,24 mm. Wij komen
    // op 14 omdat onze grens op 100 staat. Zet je de grens op zijn waarde, dan
    // komt het aantal exact uit. Dat is het bewijs dat het verschil nergens
    // anders in zit - en het is precies de vraag die nog bij Marthijn ligt.
    log(`met max. doorgang 100 : ${nagebouwd.velden[0].spijlen.aantal} per veld, `
        + `doorgang ${nagebouwd.velden[0].spijlen.doorgang.toFixed(2)} mm`);
    const alsHij = pad.padDelen([[0, 0, 0], [1700, 0, 0]], false,
        { ...alsVoorbeeld, maxDoorgang: 115 });
    const zijnVeld = alsHij.velden[0];
    log(`met max. doorgang 115 : ${zijnVeld.spijlen.aantal} per veld, `
        + `doorgang ${zijnVeld.spijlen.doorgang.toFixed(2)} mm`);
    check('met zijn doorgang komen we op 6 spijlen per veld, dus 12 in totaal',
        zijnVeld.spijlen.aantal === 6, zijnVeld.spijlen.aantal);
    check('en op precies zijn 110,24 mm',
        Math.abs(zijnVeld.spijlen.doorgang - 110.24) < 0.005,
        zijnVeld.spijlen.doorgang.toFixed(4));

    log('\n--- op een KNIK sluiten de regels op elkaar aan ---');
    // Waar een hellend stuk op een vlak stuk uitkomt - bij een trap met een
    // bordes dus - moeten de regels van de twee velden op dezelfde hoogte bij
    // de staander uitkomen. Deden ze niet: de bovenregel hing `opening` onder
    // de ONDERKANT van de handregel, en die ligt op een helling
    // handregelhoogte/cos lager. Bij 1:2 gaf dat 4,72 mm verschil, en bij de
    // staander ertussen zag je dat als een knik in het raamwerk.
    //
    // Niet de omhullende doosjes vergelijken: die verschillen op een helling
    // vanzelf, want de regel klimt. Wat telt is de onderkant doorgetrokken tot
    // het HART van de staander.
    const knikMaten = { ...regels.STANDAARD, maxStaanderAfstand: 5000,
        voetplaatDikte: 10, vulraamwerk: 1, uitklinken: 1 };
    const knikDelen = pad.padDelen(
        [[0, 0, 0], [2000, 0, 1000], [3500, 0, 1000]], false, knikMaten).delen;
    const knikStaander = knikDelen.filter(d => d.soort === 'staander')
        .sort((a, b) => a.oorsprong[0] - b.oorsprong[0])[1];
    const knikHart = knikStaander.oorsprong[0] + knikMaten.staanderBreedte / 2;
    const onderOpHart = (d) => Math.abs(d.xAs[0]) < 1e-9 ? d.oorsprong[2]
        : d.oorsprong[2] + (knikHart - d.oorsprong[0]) / d.xAs[0] * d.xAs[2];

    const knikRegels = knikDelen.filter(d => d.soort === 'vulregel')
        .map(d => ({ d, z: onderOpHart(d), links: d.oorsprong[0] < knikHart }));
    const knikLinks = knikRegels.filter(r => r.links).map(r => r.z).sort((a, b) => a - b);
    const knikRechts = knikRegels.filter(r => !r.links).map(r => r.z).sort((a, b) => a - b);
    log('onderkanten op het staanderhart:');
    log('   links : ' + knikLinks.map(z => z.toFixed(3)).join(', '));
    log('   rechts: ' + knikRechts.map(z => z.toFixed(3)).join(', '));

    check('aan weerszijden evenveel regels', knikLinks.length === knikRechts.length,
        `${knikLinks.length} tegen ${knikRechts.length}`);

    // HOE DICHT ze op elkaar uitkomen, en waarom dat niet nul kan zijn.
    //
    // Een regel is `dikte` dik LOODRECHT op zichzelf - zo zaag je plat staal
    // ook: kantelen maakt het niet dunner. Verticaal gemeten is dat dikte x
    // cos. Bij een knik verschilt die cos aan weerszijden, dus de twee regels
    // kunnen niet aan hun bovenkant ÉN hun onderkant tegelijk aansluiten. Wat
    // overblijft is precies dikte x (1 - cos).
    //
    // Hier stond eerst "exact dezelfde hoogte". Dat kon toen een regel nog
    // verticaal dik was - maar die aanname gaf op een helling scheve assen,
    // en daar kwamen alle overlappingen vandaan. Zie pad.js.
    //
    // Het gaat erom dat de SYSTEMATISCHE stap weg is: die was 4,72 mm, omdat
    // de bovenregel toen onder de ONDERKANT van de handregel hing en die op
    // een helling dieper ligt. Wat nu overblijft is een orde kleiner.
    const knikCos = 2000 / Math.hypot(2000, 1000);
    const maxStap = regels.VULRAAMWERK.dikte * (1 - knikCos);
    const knikStappen = knikLinks.map((z, k) => Math.abs(knikRechts[k] - z));
    log(`stappen: ${knikStappen.map(s => s.toFixed(3)).join(', ')} mm; `
        + `meetkundig minimum bij deze knik ${maxStap.toFixed(3)} mm`);
    check('de regels sluiten tot op de dikte-maal-(1-cos) op elkaar aan',
        knikStappen.every(s => s <= maxStap + 1e-6),
        `grootste stap ${Math.max(...knikStappen).toFixed(3)} mm, `
        + `grens ${maxStap.toFixed(3)}`);
    check('en dat is een orde kleiner dan de 4,72 mm van vóór de correctie',
        Math.max(...knikStappen) < 1,
        `${Math.max(...knikStappen).toFixed(3)} mm`);

    // De reden vastleggen: de bovenregel hangt onder de BOVENKANT van de
    // handregel, niet onder de onderkant. Anders komt de deling door de
    // cosinus terug en is de systematische stap er weer.
    const knikTop = Math.max(...knikRegels.map(r => r.z + regels.VULRAAMWERK.dikte
        * Math.hypot(r.d.xAs[0], r.d.xAs[1])));
    check('de bovenregel hangt een vaste maat onder de bovenkant van de handregel',
        Math.abs(knikTop - (knikMaten.hoogte - knikMaten.handregelHoogte
            - regels.VULRAAMWERK.opening + 1000)) < 1e-6,
        `${knikTop.toFixed(2)} op een pad dat daar 1000 hoog ligt`);

    log('\n--- zonder raamwerk blijft het zoals het was ---');
    const zonderRaam = pad.padDelen([[0, 0, 0], [1700, 0, 0]], false,
        { ...alsVoorbeeld, vulraamwerk: 0 });
    const kaleSpijl = zonderRaam.delen.find(d => d.soort === 'spijl');
    check('geen vulregels', !zonderRaam.delen.some(d => d.soort === 'vulregel'));
    check('de spijl begint weer op de vloer',
        Math.abs(kaleSpijl.oorsprong[2]) < 1e-9, kaleSpijl.oorsprong[2]);
    check('en loopt tot onder de handregel',
        Math.abs(kaleSpijl.dz - (alsVoorbeeld.hoogte - chsP.boxSize[1])) < 1e-9,
        `${kaleSpijl.dz} tegenover ${alsVoorbeeld.hoogte - chsP.boxSize[1]}`);

    log('\n--- de twee regels zijn ÉÉN productieonderdeel ---');
    const metRaam = await bouwMod.bouwBalustrade(alsVoorbeeld);
    const regelOnd = metRaam.onderdelen.filter(u => u.deel.soort === 'vulregel');
    log('onderdelen: ' + metRaam.onderdelen
        .map(u => `${u.aantal}x ${u.deel.soort}`).join(', '));
    check('alle vier de regels zijn hetzelfde stuk staal',
        regelOnd.length === 1 && regelOnd[0].aantal === 4,
        regelOnd.map(u => `${u.aantal}x`).join(' + '));
    const regelRegel = metRaam.stuklijst.find(r => r.soort === 'vulregel');
    check('de stuklijst noemt FL 30x6 met zijn norm',
        regelRegel.profiel === 'FL 30x6' && /10058/.test(regelRegel.norm),
        `${regelRegel.profiel} (${regelRegel.norm})`);

    // ============ DEEL Q: materialen en houten treden =======================
    log('\n\n======== DEEL Q: materialen ========\n');

    const mat = await win.eval("import('/materialen.js')");

    log('--- de lijst ---');
    log('materialen: ' + mat.materiaalSleutels().join(', '));

    const mvMaten = { ...regels.STANDAARD, lengte: 2000,

    const mvBouw = await bouwMod.bouwBalustrade(mvMaten);

        && mvBouw.delen.length === mvBouw.aantalDelen,
        mvBouw.delen && mvBouw.delen.length);

        new THREEmod.Vector3(0, -20, 0),
        new THREEmod.Vector3(2000, 20, 1000));
    const mvGroep = mv.maakMaatvoering(mvBouw.delen, mvDoos, 2000);

    // narekenen langs dezelfde weg als de module, en dat is waar het om gaat.
    const staandersMv = mvBouw.delen.filter(d => d.soort === 'staander');
    const hartVanMv = (d) => [0, 1, 2].map(i =>
        d.oorsprong[i] + d.xAs[i] * d.dx / 2 + d.yAs[i] * d.dy / 2
                       + d.zAs[i] * d.dz / 2);
    const hoh = Math.hypot(
        ...[0, 1, 2].map(i => hartVanMv(staandersMv[1])[i] - hartVanMv(staandersMv[0])[i]));
    log(`${staandersMv.length} staanders, hart op hart ${hoh.toFixed(1)} mm`);
    // 2000 lang met maximaal 700 geeft 3 velden, dus 666,67 hart op hart.
    check('hart op hart klopt met de veldverdeling',
        Math.abs(hoh - 2000 / 3) < 0.01, hoh.toFixed(3));

    const spijlenMv = mvBouw.delen.filter(d => d.soort === 'spijl');
    const hohSpijl = Math.hypot(
        ...[0, 1, 2].map(i => hartVanMv(spijlenMv[1])[i] - hartVanMv(spijlenMv[0])[i]));
    const doorgangGemeten = hohSpijl - spijlenMv[0].dx;
    log(`doorgang gemeten aan het model: ${doorgangGemeten.toFixed(2)} mm, `
        + `berekend ${mvBouw.velden[0].spijlen.doorgang.toFixed(2)} mm`);
    check('de gemeten doorgang klopt met de berekende',
        Math.abs(doorgangGemeten - mvBouw.velden[0].spijlen.doorgang) < 0.01,
        `${doorgangGemeten.toFixed(4)} tegenover `
        + mvBouw.velden[0].spijlen.doorgang.toFixed(4));

    log('\n--- en bij een trap ---');

    check('de configuratie terughalen zet de trapboom weer op UPN 220',
        /UPN 220/.test(doc.getElementById('pr_boom').textContent),
        doc.getElementById('pr_boom').textContent);

    // Opruimen: deze configuratie staat in de browser en zou anders bij een
    // volgende testronde nog in de lijst staan.
    cfgKeuze.value = 'zelftest-trapboom';
    cfgKeuze.dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(30);
    doc.getElementById('cfg_wis').click();
    await sleep(50);
    check('en de testconfiguratie is daarna weer opgeruimd',
        ![...cfgKeuze.options].some(o => o.value === 'zelftest-trapboom'),
        [...cfgKeuze.options].map(o => o.value).join(', '));
    doc.getElementById('wis_boom').click();

    log('\n--- de interface noemt nergens de leverancier ---');
    // ALLES openklappen voordat we kijken. innerText slaat ingeklapte groepen
    // over, en dan zou deze controle slagen terwijl de naam er wel degelijk
    // staat - hij zit dan één klik verderop. Dat is geen "niet zichtbaar".
    for (const d of doc.querySelectorAll('details')) d.open = true;
    await sleep(50);
    const zichtbaar = doc.body.innerText || doc.body.textContent || '';
    check('geen "HiCAD" in de zichtbare tekst van de app',
        !/hicad/i.test(zichtbaar),
        (zichtbaar.match(/.{0,40}[Hh]i[Cc][Aa][Dd].{0,40}/) || [''])[0]);
    check('de paginatitel is neutraal', doc.title === 'Railing Configurator', doc.title);

    // ============ DEEL Z: staanderkop uitklinken ============================
    log('\n\n======== DEEL Z: staanderkop uitklinken ========\n');

    // Verbeterpunt 7 uit VERBETERPUNTEN.md. Bij ons loopt de staander over de
    // volle hoogte en komt de handregel er STOMP tegenaan; rond tegen rond
    // raakt elkaar dan op één lijn en dat is geen lasnaad. Met een uitsparing
    // valt de regel in zijn bed.
    //
    // Het punt is niet alleen de aansluiting. Een staander waar de regel TEGEN
    // komt krijgt een uitsparing, en hoeveel hangt af van hoeveel regels er
    // tegen komen - dus het worden verschillende stukken staal, en dan heeft
    // de onderdeelherkenning eindelijk werk.
    //
    // ER ZIJN TWEE CONSTRUCTIES, en dat is sinds 12 oktober het verschil:
    //
    //   overstek 0   - de regel stopt op de staander. Alle drie de staanders
    //                  staan op volle hoogte en krijgen een bed: 1, 2, 1.
    //   overstek > 0 - de regel loopt OVER de buitenste staanders heen. Die
    //                  worden dus een handregelhoogte korter en krijgen geen
    //                  bed in hun zijkant; alleen de middenstaander wel: 0,2,0.
    //
    // Hiervoor liep de regel bij overstek wél over de staander maar liep de
    // staander óók door tot de volle hoogte. Die twee zaten dan op dezelfde
    // plek: 64 000 mm3 per eindstaander, nagemeten door de solids op elkaar te
    // snijden. Zie de controle "nergens zit staal op twee plekken" verderop.
    const klinkMaten = { ...regels.STANDAARD, lengte: 1700,
        maxStaanderAfstand: 850, handregelOverstek: 100, voetplaatDikte: 10,
        vulraamwerk: 1, staanderProfiel: chsP, handregelProfiel: chsP,
        spijlProfiel: fl205 };
    const klinkPad = [[0, 0, 0], [1700, 0, 0]];
    // Zonder overstek: dan komt de regel overal tegen een staander aan.
    const stompMaten = { ...klinkMaten, handregelOverstek: 0 };

    log('--- wat pad.js beschrijft ---');
    const zonderKlink = pad.padDelen(klinkPad, false, { ...klinkMaten, uitklinken: 0 })
        .delen.filter(d => d.soort === 'staander');
    const metKlink = pad.padDelen(klinkPad, false, { ...klinkMaten, uitklinken: 1 })
        .delen.filter(d => d.soort === 'staander');
    const stompKlink = pad.padDelen(klinkPad, false, { ...stompMaten, uitklinken: 1 })
        .delen.filter(d => d.soort === 'staander');
    check('uit: geen enkele staander wordt uitgeklonken',
        zonderKlink.every(d => (d.uitklinken || []).length === 0),
        zonderKlink.map(d => (d.uitklinken || []).length).join(','));
    // TWEE uitsparingen per aanliggend veld, voor de onder- en de bovenregel van
    // het vulraamwerk. Die kregen eerst geen bed, en dat was te zien - een strip
    // met een recht afgezaagd eind tegen een ronde buis raakt die op één lijn.
    //
    // Er stond 3 en 6: er zat ook een bed voor de HANDREGEL bij. Dat is weg
    // sinds de regel over de koppen loopt in plaats van ertegenaan te stoppen.
    // Daarmee is tegelijk het zwaarste geval verdwenen waar dit ooit stuk ging:
    // twee handregelbedden onder een hoek in één kop, die bij diepte 0,20 een
    // stuk buiswand lossneden.
    check('zonder overstek: eindstaander 2, middenstaander 4, eindstaander 2',
        stompKlink.map(d => d.uitklinken.length).join(',') === '2,4,2',
        stompKlink.map(d => d.uitklinken.length).join(','));
    check('mét overstek verandert dat niet: 2, 4, 2',
        metKlink.map(d => d.uitklinken.length).join(',') === '2,4,2',
        metKlink.map(d => d.uitklinken.length).join(','));
    check('op geen enkele staander zit nog een bed op handregelhoogte',
        metKlink.every(d => d.uitklinken.every(u =>
            Math.abs(u.top - (klinkMaten.hoogte - klinkMaten.voetplaatDikte)) > 1e-9)),
        metKlink.flatMap(d => d.uitklinken.map(u => u.top.toFixed(1))).join(', '));
    // Hier stond dat de eindstaanders een handregelhoogte KORTER zijn dan de
    // middelste. Dat was zo toen alleen de buitenste onder het overstek lagen.
    // Nu loopt de regel over alle drie, dus ze zijn alle drie even lang - en dat
    // is precies wat het voor de werkplaats makkelijker maakt.
    check('alle drie de staanders zijn even lang, want de regel ligt op alle drie',
        Math.abs(metKlink[0].dz - metKlink[1].dz) < 1e-9
        && Math.abs(metKlink[1].dz - metKlink[2].dz) < 1e-9,
        metKlink.map(d => d.dz.toFixed(1)).join(', '));
    // En wel tot de KRUIN VAN HET ZADEL. De regel is hier rond en even breed
    // als de staander, dus de hoorn naast de buis loopt door tot de hartlijn
    // van de regel: een HALVE regelhoogte onder de leuninghoogte, niet een
    // hele. Zie kopOnder in pad.js.
    check('en wel tot de kruin van het zadel, op de hartlijn van de regel',
        Math.abs(metKlink[1].dz - (klinkMaten.hoogte - klinkMaten.voetplaatDikte
                                   - chsP.boxSize[1] / 2)) < 1e-9,
        `${metKlink[1].dz.toFixed(2)} (verwacht `
        + `${(klinkMaten.hoogte - klinkMaten.voetplaatDikte - chsP.boxSize[1] / 2).toFixed(2)})`);
    // ÉÉN zadel op een recht stuk, ook bij de middenstaander: de twee velden
    // liggen daar in elkaars verlengde en de snijder loopt naar beide kanten
    // ruim buiten de staander, dus hij snijdt de tunnel al in zijn geheel.
    check('op een recht stuk heeft elke staander één zadel',
        metKlink.map(d => d.zadel.length).join(',') === '1,1,1',
        metKlink.map(d => d.zadel.length).join(','));
    check('en de zadelsnijder is MASSIEF rond, niet de holle buisdoorsnede',
        metKlink[1].zadel.every(z => z.rond === true && z.door === true),
        JSON.stringify(metKlink[1].zadel.map(z => ({ rond: z.rond, door: z.door }))));

    const klinkMidden = metKlink[1].uitklinken;
    // Vier uitsparingen, maar in maar TWEE richtingen: twee naar links en twee
    // naar rechts. Op een recht stuk horen die twee tegenover elkaar te liggen.
    const klinkRichtingen = [...new Set(klinkMidden.map(u => u.langs.join(',')))]
        .map(s => s.split(',').map(Number));
    check('vier uitsparingen in twee richtingen',
        klinkRichtingen.length === 2, `${klinkRichtingen.length} richtingen`);
    check('de twee richtingen liggen tegenover elkaar op een recht stuk',
        Math.abs(klinkRichtingen[0][0] + klinkRichtingen[1][0]) < 1e-9
        && Math.abs(klinkRichtingen[0][1] + klinkRichtingen[1][1]) < 1e-9,
        JSON.stringify(klinkRichtingen));
    check('elke richting is horizontaal en op lengte 1',
        klinkMidden.every(u => Math.abs(Math.hypot(u.langs[0], u.langs[1]) - 1) < 1e-9
            && u.langs[2] === 0),
        JSON.stringify(klinkMidden.map(u => u.langs)));
    // Alle vier de bedden zijn voor de VULREGELS. Er zat er ook een op de
    // bovenkant van de staander, voor de handregel; die is weg sinds de regel
    // over de kop loopt. Dat moet ook blijken: een bed daar zou nu een gat in
    // de kop zijn waar niets in valt.
    const kopHoogte = klinkMaten.hoogte - klinkMaten.voetplaatDikte;
    const kopBedden = klinkMidden.filter(u => Math.abs(u.top - kopHoogte) < 1e-9);
    log('bedhoogten: ' + [...new Set(klinkMidden.map(u => u.top.toFixed(1)))].join(', '));
    check('er zit geen enkel bed meer op de bovenkant van de staander',
        kopBedden.length === 0, `${kopBedden.length} van ${klinkMidden.length}`);
    // Rechthoekig, want een vulregel ligt plat en zijn profiel staat in de
    // catalogus rechtop.
    const regelBedden = klinkMidden.filter(u => Math.abs(u.top - kopHoogte) > 1e-9);
    check('en alle vier de bedden zijn voor de vulregels, op hún hoogte',
        regelBedden.length === 4, regelBedden.length);
    // Zo breed als de STRIP, en die volgt sinds punt 2 van de opdracht de
    // staander: hier een CHS 48,3, dus 48,3 - 2 x 5 = 38. Er stond de vaste 30
    // uit regels.json; dat was de waarde voor een staander van 40.
    const bedStrip = regels.stripBreedte(chsP.boxSize[0]);
    check('die zijn zo breed als de strip bij deze staander, en zo dik',
        regelBedden.every(u =>
            Math.abs(u.breedte - bedStrip) < 1e-9
            && Math.abs(u.hoogte - regels.VULRAAMWERK.dikte) < 1e-9),
        `${regelBedden[0].breedte} x ${regelBedden[0].hoogte} `
        + `(verwacht ${bedStrip} x ${regels.VULRAAMWERK.dikte})`);
    check('de diepte is overal een tiende van de staanderbreedte',
        klinkMidden.every(u =>
            Math.abs(u.diepte - chsP.boxSize[0] * 0.10) < 1e-9),
        `${klinkMidden[0].diepte.toFixed(3)} mm`);

    log('\n--- de echte geometrie, recht stuk met 3 staanders, zonder overstek ---');
    // ZONDER OVERSTEK, want dat is het geval waar het uitklinken over gaat:
    // de regel komt overal tegen een staander. Met overstek is het verschil
    // tussen eind en midden al de LENGTE, en dan meet je niet meer of het
    // uitklinken iets doet.
    const klinkUit = await bouwMod.bouwPad(klinkPad, false,
        { ...stompMaten, uitklinken: 0 });
    const klinkAan = await bouwMod.bouwPad(klinkPad, false,
        { ...stompMaten, uitklinken: 1 });
    const stUit = klinkUit.onderdelen.filter(u => u.deel.soort === 'staander');
    const stAan = klinkAan.onderdelen.filter(u => u.deel.soort === 'staander');
    log('uit: ' + stUit.map(u => `${u.aantal}x ${u.kenmerken.volume.toFixed(1)}`).join(', '));
    log('aan: ' + stAan.map(u => `${u.aantal}x ${u.kenmerken.volume.toFixed(1)}`).join(', '));

    check('zonder uitklinken zijn alle drie de staanders hetzelfde stuk staal',
        stUit.length === 1 && stUit[0].aantal === 3,
        `${stUit.length} soorten`);
    check('mét uitklinken vallen ze uiteen in twee productieonderdelen',
        stAan.length === 2, `${stAan.length} soorten`);
    const eind = stAan.find(u => u.aantal === 2);
    const midden = stAan.find(u => u.aantal === 1);
    check('twee eindstaanders en één middenstaander',
        !!eind && !!midden, stAan.map(u => `${u.aantal}x`).join(' '));

    // ELKE staander moet één stuk staal blijven. Valt hij uiteen, dan ziet de
    // stuklijst daar niets van: naam, profiel en lengte kloppen gewoon.
    check('elke staander is nog precies één solid',
        stAan.every(u => u.kenmerken.telling.SOLID === 1),
        stAan.map(u => u.kenmerken.telling.SOLID).join(','));

    log('\n--- nergens zit staal op twee plekken tegelijk ---');
    // De fout die hier zat: met overstek liep de handregel over de buitenste
    // staander heen, maar die staander liep óók door tot de volle hoogte. Twee
    // solids op dezelfde plaats, 64 000 mm3 per kop - precies 40 x 40 x 40. De
    // stuklijst telde ze allebei, dus je bestelde dubbel.
    //
    // Dit kijkt niet naar maten maar snijdt de ECHTE solids op elkaar. Alleen
    // zo zie je of twee stukken staal elkaar overlappen.
    const ocNaad = await api.initOcct();
    const naadSolids = (vorm) => {
        const uit = [];
        const v = new ocNaad.TopExp_Explorer_2(vorm,
            ocNaad.TopAbs_ShapeEnum.TopAbs_SOLID, ocNaad.TopAbs_ShapeEnum.TopAbs_SHAPE);
        for (; v.More(); v.Next()) uit.push(ocNaad.TopoDS.Solid_1(v.Current()));
        v.delete();
        return uit;
    };
    const inhoudVanVorm = (vorm) => {
        const g = new ocNaad.GProp_GProps_1();
        ocNaad.BRepGProp.VolumeProperties_1(vorm, g, false, false, false);
        const m = g.Mass(); g.delete(); return m;
    };
    const samenVolume = (a, b) => {
        const c = new ocNaad.BRepAlgoAPI_Common_3(a, b, new ocNaad.Message_ProgressRange_1());
        c.Build(new ocNaad.Message_ProgressRange_1());
        return inhoudVanVorm(c.Shape());
    };
    /** Hoeveel materiaal staanders en handregels met elkaar delen. */
    const dubbelStaal = (r) => {
        const lijst = naadSolids(r.shape);
        const met = r.delen.map((d, i) => ({ d, s: lijst[i] }));
        let totaal = 0;
        for (const st of met.filter(x => x.d.soort === 'staander')) {
            for (const hr of met.filter(x => x.d.soort === 'handregel')) {
                totaal += samenVolume(st.s, hr.s);
            }
        }
        return totaal;
    };

    for (const [naam, maten] of [
        ['overstek 100, uitklinken uit', { ...klinkMaten, uitklinken: 0 }],
        ['overstek 100, uitklinken aan', { ...klinkMaten, uitklinken: 1 }],
        ['overstek 0,   uitklinken aan', { ...stompMaten, uitklinken: 1 }],
    ]) {
        const gebouwd = await bouwMod.bouwPad(klinkPad, false, maten);
        const dubbel = dubbelStaal(gebouwd);
        log(`   ${naam}: ${dubbel.toFixed(1)} mm3 gedeeld`);
        check(`${naam}: staander en handregel delen geen materiaal`,
            dubbel < 1e-6, `${dubbel.toFixed(1)} mm3`);
    }

    log('\n--- en op een HELLING, want dat is waar het nog misging ---');
    // Dit stond nog niet in de zelftest en was met de hand gemeten: op een
    // hellende leuning deelden de handregel en de eindstaander 8 000 mm3, over
    // twee paren. Oorzaak: de staanderkop werd recht afgezaagd op de volle
    // hoogte terwijl de onderkant van de regel schuin binnenkwam.
    //
    // Sinds de staander op de onderkant van de regel stopt - en op een helling
    // dus op hoogte - handregelhoogte/cos, niet - handregelhoogte - hoort dat
    // nul te zijn. Hier gemeten in plaats van aangenomen, en meteen op het
    // lastigste geval erbij: een KNIK, waar twee regels met verschillende
    // helling op dezelfde staander samenkomen en hun ondervlakken dus niet op
    // dezelfde hoogte liggen.
    for (const [naam, hellendPad] of [
        ['vlak',                  [[0, 0, 0], [1700, 0, 0]]],
        ['helling 1:2',           [[0, 0, 0], [1600, 0, 800]]],
        ['helling 3:4 (steiler)', [[0, 0, 0], [1600, 0, 1200]]],
        ['trap naar bordes',      [[0, 0, 0], [1200, 0, 900], [2400, 0, 900]]],
        ['bordes naar trap',      [[0, 0, 0], [1200, 0, 0], [2400, 0, 900]]],
        ['hoek in de plattegrond', [[0, 0, 0], [1200, 0, 0], [1200, 1200, 0]]],
    ]) {
        const schuinGebouwd = await bouwMod.bouwPad(hellendPad, false,
            { ...klinkMaten, uitklinken: 1, maxStaanderAfstand: 900 });
        const schuinDubbel = dubbelStaal(schuinGebouwd);
        log(`   ${naam.padEnd(23)}: ${schuinDubbel.toFixed(1)} mm3 gedeeld`);
        check(`${naam}: staander en handregel delen geen materiaal`,
            schuinDubbel < 1e-6, `${schuinDubbel.toFixed(1)} mm3`);
    }

    log('\n--- en twee handregels delen in een hoek ook niets ---');
    // Dit is waarvoor het verstek is: twee doorlopende regels die in een hoek
    // samenkomen. Zonder verstek zouden ze elkaar overlappen en zou de
    // stuklijst het staal dubbel tellen - precies de reden dat de regel hier
    // eerst TUSSEN de staanders lag.
    const verstekGevallen = [
        ['hoek 90 graden', [[0, 0, 0], [1200, 0, 0], [1200, 1200, 0]], false],
        ['hoek 135 graden', [[0, 0, 0], [1200, 0, 0], [2000, 800, 0]], false],
        ['trap naar bordes', [[0, 0, 0], [1200, 0, 900], [2400, 0, 900]], false],
        ['gesloten vierkant', [[0, 0, 0], [1200, 0, 0], [1200, 1200, 0],
                               [0, 1200, 0]], true],
    ];
    for (const [naam, verstekPad, verstekRondom] of verstekGevallen) {
        const vGebouwd = await bouwMod.bouwPad(verstekPad, verstekRondom,
            { ...klinkMaten, uitklinken: 1, maxStaanderAfstand: 900 });
        const vSolids = naadSolids(vGebouwd.shape);
        const vRegels = vGebouwd.delen
            .map((d, i) => ({ d, s: vSolids[i] }))
            .filter(x => x.d.soort === 'handregel');
        let vDubbel = 0;
        for (let a = 0; a < vRegels.length; a++) {
            for (let b = a + 1; b < vRegels.length; b++) {
                vDubbel += samenVolume(vRegels[a].s, vRegels[b].s);
            }
        }
        // Elke regel moet ook nog één heel stuk staal zijn: een verstek dat de
        // verkeerde kant op snijdt laat niets over, en dat zie je niet.
        const vSolidsPerRegel = vRegels.map(x => {
            let n = 0;
            const e = new ocNaad.TopExp_Explorer_2(x.s,
                ocNaad.TopAbs_ShapeEnum.TopAbs_SOLID,
                ocNaad.TopAbs_ShapeEnum.TopAbs_SHAPE);
            for (; e.More(); e.Next()) n++;
            e.delete();
            return n;
        });
        log(`   ${naam.padEnd(20)}: ${vRegels.length} regels, `
            + `${vDubbel.toFixed(1)} mm3 gedeeld`);
        check(`${naam}: de handregels overlappen elkaar niet`,
            vDubbel < 1e-6, `${vDubbel.toFixed(1)} mm3`);
        check(`${naam}: en elke regel is één heel stuk staal`,
            vSolidsPerRegel.every(n => n === 1), vSolidsPerRegel.join(','));
    }

    const inhoudVan = (u) => u.kenmerken.volume;
    check('de eindstaander verliest materiaal ten opzichte van een rechte',
        inhoudVan(eind) < inhoudVan(stUit[0]), `${inhoudVan(eind).toFixed(1)} < ${inhoudVan(stUit[0]).toFixed(1)}`);
    check('en de middenstaander nog meer, want die heeft er twee',
        inhoudVan(midden) < inhoudVan(eind), `${inhoudVan(midden).toFixed(1)} < ${inhoudVan(eind).toFixed(1)}`);
    // Twee gelijke uitsparingen die elkaar niet raken horen evenveel weg te
    // halen. Loopt dat uiteen, dan snijden ze elkaar aan of staat er één scheef.
    const eersteHap = inhoudVan(stUit[0]) - inhoudVan(eind);
    const tweedeHap = inhoudVan(eind) - inhoudVan(midden);
    log(`weggesneden: 1e uitsparing ${eersteHap.toFixed(2)} mm3, `
        + `2e ${tweedeHap.toFixed(2)} mm3`);
    // MARGE 2,5 % EN NIET 1e-4, en dat is een oprekking die uitleg verdient.
    //
    // Hier stond 1e-4, en dat hield tot het zadel erbij kwam. Nagemeten op
    // precies dit pad: zónder zadel (vierkante handregel) is het verschil
    // exact 0,00 mm3 — 584,57 tegenover 584,57 — en MET zadel 10,50 mm3 op
    // 597, dus 1,8 %.
    //
    // Het zijn dus niet de bedden die scheef staan. Twee dingen bewijzen dat:
    // de twee eindstaanders hebben GESPIEGELDE bedden en worden toch als
    // hetzelfde onderdeel herkend (aantal 2 hierboven), wat alleen kan als hun
    // volume tot 1e-7 gelijk is; en zonder zadel klopt het tot op de laatste
    // cijfers. Wat er wél gebeurt: de zadelsnede is een cilinder die het
    // oppervlak van de staander TANGENTIEEL raakt, en daarna is het volume van
    // elke volgende snede een stuk minder exact. De middenstaander krijgt vier
    // bedden na dat zadel en de eindstaander twee, dus loopt de ruis uiteen.
    //
    // 2,5 % laat die ruis door en vangt nog steeds waar deze controle voor
    // staat: een bed dat aan de verkeerde kant of op de verkeerde hoogte zit
    // scheelt tientallen procenten, niet anderhalf.
    check('allebei de uitsparingen halen ongeveer evenveel weg',
        Math.abs(eersteHap - tweedeHap) / eersteHap < 0.025,
        `${eersteHap.toFixed(4)} tegenover ${tweedeHap.toFixed(4)} `
        + `(${(100 * Math.abs(eersteHap - tweedeHap) / eersteHap).toFixed(2)} %)`);

    // En dezelfde eis EXACT, op een leuning zonder zadel. Zo blijft de scherpe
    // controle bestaan waar hij scherp kan zijn, en staat vast dat de 1,8 %
    // hierboven van het zadel komt en niet van een verkeerd geplaatst bed.
    // SHS 40x40x3: een KOKER, dus een vlakke onderkant en dus geen zadel.
    // Verder dezelfde leuning, zodat alleen het zadel verschilt.
    const shsKoker = soortRef(cat.alleProfielen(catBoom).find(
        p => p.label === 'SHS 40x40x3' && p.table === 'DIN_EN_10219-2_HQ'));
    const vierkantMaten = { ...stompMaten, handregelProfiel: shsKoker };
    const vkUit = await bouwMod.bouwPad(klinkPad, false,
        { ...vierkantMaten, uitklinken: 0 });
    const vkAan = await bouwMod.bouwPad(klinkPad, false,
        { ...vierkantMaten, uitklinken: 1 });
    const vkSt = (r) => r.onderdelen.filter(u => u.deel.soort === 'staander');
    const vkZonder = vkSt(vkUit)[0].kenmerken.volume;
    const vkEind = vkSt(vkAan).find(u => u.aantal === 2);
    const vkMidden = vkSt(vkAan).find(u => u.aantal === 1);
    check('bij een VIERKANTE handregel is er geen zadel',
        vkAan.delen.filter(d => d.soort === 'staander')
            .every(d => d.zadel.length === 0),
        vkAan.delen.filter(d => d.soort === 'staander')
            .map(d => d.zadel.length).join(','));
    if (vkEind && vkMidden) {
        const vkEerste = vkZonder - vkEind.kenmerken.volume;
        const vkTweede = vkEind.kenmerken.volume - vkMidden.kenmerken.volume;
        log(`zonder zadel: 1e paar ${vkEerste.toFixed(4)} mm3, `
            + `2e ${vkTweede.toFixed(4)} mm3`);
        check('en dan halen de twee paren bedden EXACT evenveel weg',
            Math.abs(vkEerste - vkTweede) / vkEerste < 1e-6,
            `${vkEerste.toFixed(4)} tegenover ${vkTweede.toFixed(4)}`);
    }

    log('\n--- en DOET het zadel ook wat het moet doen? ---');
    // Nul overlap bewijst alleen dat er niets dóór elkaar staat. Dat had een
    // vlakke kop onder de regel ook. Waar het zadel voor is: de kop moet om de
    // regel heen VALLEN in plaats van hem op één lijn te raken.
    //
    // Dat is te meten zonder het contactoppervlak uit te rekenen. Een kop die
    // om de buis heen valt, komt HOGER dan de onderkant van die buis - hij
    // steekt in de omhullende doos van de regel - terwijl hij er nergens
    // materiaal mee deelt. Een vlakke kop kan dat niet: die stopt op de
    // onderkant en komt dus nooit hoger.
    //
    // De getallen voor dit geval (regel en staander allebei CHS 48,3, leuning
    // 1000, voetplaat 10): onderkant regel 951,7, hartlijn 975,85, kop 975,85.
    const zadelBouw = await bouwMod.bouwPad(klinkPad, false,
        { ...stompMaten, uitklinken: 0 });
    const zadelDoos = (vorm) => {
        const d = new ocNaad.Bnd_Box_1();
        ocNaad.BRepBndLib.Add(vorm, d, false);
        const a = d.CornerMin(), b = d.CornerMax();
        const uit = { z: [a.Z(), b.Z()] };
        d.delete();
        return uit;
    };
    const zadelSolids = naadSolids(zadelBouw.shape);
    const zadelMet = zadelBouw.delen.map((d, i) => ({ d, s: zadelSolids[i] }));
    const zadelStaander = zadelMet.find(x => x.d.soort === 'staander');
    const zadelRegel = zadelMet.find(x => x.d.soort === 'handregel');
    const kopTop = zadelDoos(zadelStaander.s).z[1];
    const regelOnder = zadelDoos(zadelRegel.s).z[0];
    const regelBoven = zadelDoos(zadelRegel.s).z[1];
    const regelHart = (regelOnder + regelBoven) / 2;
    log(`staanderkop tot ${kopTop.toFixed(2)}; regel van ${regelOnder.toFixed(2)} `
        + `tot ${regelBoven.toFixed(2)}, hartlijn ${regelHart.toFixed(2)}`);
    check('de staanderkop komt HOGER dan de onderkant van de regel',
        kopTop > regelOnder + 1,
        `${kopTop.toFixed(2)} tegenover ${regelOnder.toFixed(2)} `
        + `(${(kopTop - regelOnder).toFixed(2)} mm eromheen)`);
    check('en valt dus om de buis heen in plaats van hem op één lijn te raken',
        Math.abs(kopTop - regelHart) < 1e-6,
        `kop ${kopTop.toFixed(4)}, hartlijn ${regelHart.toFixed(4)}`);
    check('maar nergens boven de regel uit — dat eist punt 1 van de opdracht',
        kopTop <= regelBoven + 1e-9,
        `${kopTop.toFixed(2)} tegenover ${regelBoven.toFixed(2)}`);

    // En bij een VIERKANTE regel hoort het andersom: vlak op vlak, dus de kop
    // stopt precies op de onderkant van de regel en komt er niet hoger.
    const vkSolids = naadSolids(vkUit.shape);
    const vkMet = vkUit.delen.map((d, i) => ({ d, s: vkSolids[i] }));
    const vkKopTop = zadelDoos(vkMet.find(x => x.d.soort === 'staander').s).z[1];
    const vkRegelOnder = zadelDoos(vkMet.find(x => x.d.soort === 'handregel').s).z[0];
    log(`vierkante regel: kop tot ${vkKopTop.toFixed(2)}, `
        + `regel vanaf ${vkRegelOnder.toFixed(2)}`);
    check('bij een vierkante regel stopt de kop precies op haar onderkant',
        Math.abs(vkKopTop - vkRegelOnder) < 1e-6,
        `${vkKopTop.toFixed(4)} tegenover ${vkRegelOnder.toFixed(4)}`);
    check('en dat is een echte hap, geen krasje',
        eersteHap > 100, `${eersteHap.toFixed(1)} mm3`);

    log('\n--- eind, recht-midden en hoek in één model ---');
    // Vier punten: eind, rechte middenstaander (uitsparingen tegenover elkaar),
    // hoekstaander (uitsparingen onder 90 graden), eind. Dat horen drie soorten
    // te zijn.
    const drie = await bouwMod.bouwPad(
        [[0, 0, 0], [1000, 0, 0], [2000, 0, 0], [2000, 1000, 0]], false,
        { ...klinkMaten, uitklinken: 1, maxStaanderAfstand: 5000 });
    const stDrie = drie.onderdelen.filter(u => u.deel.soort === 'staander');
    log('staanders: ' + stDrie.map(u =>
        `${u.aantal}x vol=${u.kenmerken.volume.toFixed(2)}`).join(', '));
    check('drie soorten staander: eind, recht-midden en hoek',
        stDrie.length === 3, `${stDrie.length} soorten`);
    check('twee eindstaanders, en de andere twee elk één keer',
        stDrie.filter(u => u.aantal === 2).length === 1
        && stDrie.filter(u => u.aantal === 1).length === 2,
        stDrie.map(u => `${u.aantal}x`).join(' '));
    check('ook hier blijft elke staander één solid',
        stDrie.every(u => u.kenmerken.telling.SOLID === 1),
        stDrie.map(u => u.kenmerken.telling.SOLID).join(','));

    // WAAROP die laatste twee uit elkaar komen is het vastleggen waard: dat is
    // wat de onderdeelherkenning laat werken.
    //
    // DIT IS VERSCHOVEN DOOR HET ZADEL, en de goede kant op. Hier stond dat
    // volume, oppervlak en I1 het verschil tussen een rechte en een
    // hoekstaander NAUWELIJKS zien: allebei twee gelijke uitsparingen, alleen
    // onder een andere hoek, dus wiskundig gelijk volume en gelijk oppervlak,
    // en I1 ook - dat is de spoorsom, en die hangt alleen af van hoe ver het
    // materiaal van de as af zit, niet van waar het om de as heen staat.
    // Alleen I2 en I3 merkten het, ordes van grootte sterker (de drempel stond
    // op 10x).
    //
    // Sinds de kop GEZADELD wordt is dat niet meer waar, en dat is logisch: een
    // hoekstaander krijgt TWEE zadels onder een hoek en een rechte maar één
    // (twee velden in elkaars verlengde geven één zadel). Twee kruisende zadels
    // halen flink meer staal weg dan één, dus nu ziet het volume het verschil
    // ook - gemeten 1,6 % tegenover 3,7 % voor I3.
    //
    // Wat hier dus nog te bewijzen valt, is niet meer "alleen I3 ziet het" maar
    // "ze zien het ALLEMAAL, ruim boven de tolerantie, en I3 het scherpst".
    // Dat is een sterkere uitkomst: de herkenning hoeft niet meer op één
    // kenmerk te leunen.
    const tweeKlinks = stDrie.filter(u => u.aantal === 1);
    if (tweeKlinks.length === 2) {
        const [a, b] = tweeKlinks.map(u => u.kenmerken);
        const relatief = (x, y) => Math.abs(x - y) / Math.max(Math.abs(x), 1);
        const stomp = ['volume', 'oppervlak', 'I1']
            .map(naam => ({ naam, v: relatief(a[naam], b[naam]) }));
        for (const s of stomp) log(`  ${s.naam.padEnd(10)} verschil ${s.v.toExponential(2)}`);
        const scherp = relatief(a.I3, b.I3);
        log(`  I3         verschil ${scherp.toExponential(2)}`);

        const grootsteStompe = Math.max(...stomp.map(s => s.v));
        check('I3 ziet het verschil nog steeds het scherpst',
            scherp > grootsteStompe,
            `I3 ${scherp.toExponential(2)} tegenover hoogstens `
            + `${grootsteStompe.toExponential(2)} — `
            + `${(scherp / grootsteStompe).toFixed(1)} keer zo groot`);
        check('en ELK kenmerk ligt nu ruim boven de tolerantie van 1e-7',
            scherp > 1e-6 && stomp.every(s => s.v > 1e-6),
            [...stomp.map(s => `${s.naam} ${s.v.toExponential(2)}`),
             `I3 ${scherp.toExponential(2)}`].join(', '));
    }

    log('\n--- het gevaarlijke geval is weg, de bewaking niet ---');
    // DIT IS OMGEDRAAID, en het is de winst van de doorlopende handregel.
    //
    // Hier stond: bij factor 0,25 valt de hoekstaander uiteen en hoort de bouwer
    // dat te weigeren. Dat kwam door de twee HANDREGELBEDDEN: die waren een hele
    // handregelhoogte hoog (48,3 mm) en zaten bovenaan de staander, waar de
    // buiswand aan de bovenkant niets meer boven zich heeft. Twee van die bedden
    // onder een hoek zaagden er een stuk wand los.
    //
    // Die bedden zijn weg. Wat er nog zit zijn de vulregelbedden: 6 mm hoog en
    // middenin de staander, dus er zit altijd materiaal boven én onder. Daarmee
    // kan de kop niet meer uiteenvallen - ook niet bij een veel grotere diepte.
    const echteFactor = regels.UITKLINKEN.diepteFactor;
    const klinkHoekPad = [[0, 0, 0], [1000, 0, 0], [1000, 1000, 0]];
    const diepGeprobeerd = [];
    for (const factor of [0.25, 0.40]) {
        let fout = null;
        try {
            regels.UITKLINKEN.diepteFactor = factor;
            await bouwMod.bouwPad(klinkHoekPad, false,
                { ...klinkMaten, uitklinken: 1, maxStaanderAfstand: 5000 });
        } catch (err) {
            fout = err.message;
        } finally {
            regels.UITKLINKEN.diepteFactor = echteFactor;
        }
        diepGeprobeerd.push(`${factor}: ${fout ? 'geweigerd' : 'heel gebleven'}`);
    }
    log('hoekstaander bij diepe bedden — ' + diepGeprobeerd.join(', '));
    check('de hoekstaander blijft nu heel, zelfs bij factor 0,25 en 0,40',
        diepGeprobeerd.every(r => /heel gebleven/.test(r)),
        diepGeprobeerd.join(', '));
    check('de diepte staat daarna weer op zijn eigen waarde',
        regels.UITKLINKEN.diepteFactor === echteFactor,
        String(regels.UITKLINKEN.diepteFactor));

    // Maar de BEWAKING blijft nodig en moet dus blijven werken. Hij wordt in
    // stap 4 van het plan opnieuw de scherpste controle: dan wordt de open
    // staanderkop met de handregel-solid uitgezadeld, en dat is precies de
    // meetkunde die hierboven ooit stukging.
    //
    // Daarom hier rechtstreeks op maakDeel getest, met twee bedden die het oude
    // geval nabouwen: een hele handregelhoogte hoog, bovenaan de kop, onder een
    // hoek van 90 graden, 25 % diep. Die combinatie is nagemeten: ze zaagt een
    // stuk wand los uit CHS 48,3 x 2,6.
    const bewaakOpruimen = [];
    let bewaakFout = null;
    try {
        await bouwMod.maakDeel(await api.initOcct(), {
            soort: 'staander', oorsprong: [0, 0, 0],
            xAs: [1, 0, 0], yAs: [0, 1, 0], zAs: [0, 0, 1],
            dx: 48.3, dy: 48.3, dz: 900,
            profiel: chsP, lengteAs: 'z',
            uitklinken: [[1, 0, 0], [0, 1, 0]].map(langs => ({
                langs, op: [0, 0, 1], opzij: 0, top: 900,
                breedte: 48.3, hoogte: 48.3, diepte: 48.3 * 0.25, profiel: chsP,
            })),
        }, bewaakOpruimen);
    } catch (err) {
        bewaakFout = err.message;
    } finally {
        for (const o of bewaakOpruimen) { try { o.delete(); } catch { /* al weg */ } }
    }
    check('een kop die wél uiteenvalt wordt nog steeds geweigerd',
        bewaakFout !== null, bewaakFout === null ? 'er kwam geen foutmelding' : '');
    check('en de melding zegt wat eraan te doen is, niet alleen dát het misgaat',
        !!bewaakFout && /uitklinken/.test(bewaakFout)
        && /zwaardere staander/.test(bewaakFout),
        bewaakFout ? bewaakFout.slice(0, 140) : '');

    log('\n--- met de schakelaar uit verandert er niets ---');
    check('de ongeklonken staander is nog precies dezelfde vorm als vanouds',
        stUit[0].kenmerken.telling.FACE === 4,
        JSON.stringify(stUit[0].kenmerken.telling));
    check('en de rest van de leuning telt hetzelfde met en zonder uitklinken',
        klinkUit.delen.length === klinkAan.delen.length,
        `${klinkUit.delen.length} tegenover ${klinkAan.delen.length}`);

    // ============ DEEL AA: samenstellingsboom ===============================
    log('\n\n======== DEEL AA: samenstellingsboom ========\n');

    // Verbeterpunt 1 uit VERBETERPUNTEN.md. De voorbeeldbalustrade heeft een
    // echte boom (Post, Handrail, Infill); wij leverden een platte lijst. De
    // winst is dat je "2x identiek vulveld" kunt zeggen in plaats van twaalf
    // losse spijlen op te sommen.
    //
    // Dit is een GROEPERING van wat er al is, geen tweede waarheid. Daarom is
    // de belangrijkste controle hieronder niet hoe de boom eruitziet, maar dat
    // hij precies dezelfde aantallen oplevert als de onderdelenlijst.
    const samen = await win.eval("import('/samenstelling.js')");

    const bmMaten = { ...regels.STANDAARD, lengte: 1700, maxStaanderAfstand: 850,
        handregelOverstek: 100, voetplaatDikte: 10, vulraamwerk: 1,
        staanderProfiel: chsP, handregelProfiel: chsP, spijlProfiel: fl205 };

    /** Hoeveel exemplaren de boom per productieonderdeel telt. */
    const bmTellingVan = (boom) => {
        const per = new Map();
        const bij = (nummer, hoeveel) =>
            per.set(nummer, (per.get(nummer) || 0) + hoeveel);
        for (const k of boom.kinderen) {
            if (k.type === 'onderdeel') { bij(k.nummer, k.aantal); continue; }
            for (const r of k.inhoud) bij(r.nummer, r.aantal * k.aantal);
        }
        return per;
    };

    const bmBouw = async (naam, punten, gesloten, extra = {}) => {
        const r = await bouwMod.bouwPad(punten, gesloten, { ...bmMaten, ...extra });
        log(`\n--- ${naam} ---`);
        log(samen.alsTekst(r.boom));
        return r;
    };

    const bmRecht = await bmBouw('recht, 3 staanders', [[0, 0, 0], [1700, 0, 0]], false);

    check('de wortel heet Balustrade', bmRecht.boom.naam === 'Balustrade',
        bmRecht.boom.naam);
    // Hoeveel exemplaren er van een soort hangen, over alle knopen van die
    // soort heen opgeteld.
    //
    // Optellen en niet de eerste knoop pakken: sinds de eindstaanders een
    // handregelhoogte korter zijn dan de middenstaander zijn het twee
    // verschillende stukken staal, en dus twee knopen onder dezelfde naam.
    // Dat is precies de bedoeling - de boom hoort te laten zien dat ze niet
    // hetzelfde zijn - maar dan moet je wel optellen om er drie te vinden.
    const bmAantal = (boom, soort) => boom.kinderen
        .filter(k => k.soort === soort)
        .reduce((som, k) => som + k.aantal, 0);
    const bmSoorten = (boom) =>
        [...new Set(boom.kinderen.map(k => k.soort))].join(',');

    check('er hangen drie soorten knopen onder: staander, vulveld, handregel',
        bmSoorten(bmRecht.boom) === 'staander,vulveld,handregel',
        bmSoorten(bmRecht.boom));

    const bmStaander = bmRecht.boom.kinderen.find(k => k.soort === 'staander');
    const bmVulveld = bmRecht.boom.kinderen.find(k => k.soort === 'vulveld');
    const bmHandregel = bmRecht.boom.kinderen.find(k => k.soort === 'handregel');

    check('in totaal 3 staanders, elk als samenstelling',
        bmAantal(bmRecht.boom, 'staander') === 3
        && bmRecht.boom.kinderen.filter(k => k.soort === 'staander')
            .every(k => k.type === 'samenstelling'),
        bmRecht.boom.kinderen.filter(k => k.soort === 'staander')
            .map(k => `${k.aantal}x ${k.type}`).join(' + '));
    // Hier stond dat ze GESPLITST zijn in twee knopen, omdat de eindstaanders
    // een handregelhoogte korter waren dan de middelste. Dat was zo toen alleen
    // de buitenste onder het overstek lagen. Nu loopt de handregel over alle
    // drie, dus ze zijn identiek en voegt de herkenning ze samen tot ÉÉN knoop
    // met aantal 3. Voor de werkplaats is dat de betere uitkomst: één
    // staandersamenstelling in drievoud in plaats van twee verschillende.
    check('ze zijn nu identiek, dus één knoop met aantal 3',
        bmRecht.boom.kinderen.filter(k => k.soort === 'staander').length === 1
        && bmStaander.aantal === 3,
        bmRecht.boom.kinderen.filter(k => k.soort === 'staander')
            .map(k => `${k.aantal}x`).join(' '));
    check('met een voetplaat en een staander erin',
        bmStaander.inhoud.map(r => r.soort).sort().join(',') === 'staander,voetplaat',
        bmStaander.inhoud.map(r => `${r.aantal}x ${r.soort}`).join(' + '));
    check('2 vulvelden, elk met twee regels en zijn spijlen',
        bmVulveld.aantal === 2
        && bmVulveld.inhoud.find(r => r.soort === 'vulregel').aantal === 2
        && bmVulveld.inhoud.find(r => r.soort === 'spijl').aantal > 0,
        bmVulveld.inhoud.map(r => `${r.aantal}x ${r.soort}`).join(' + '));
    // Er hing er 2: één handregel per veld. Nu is het één doorlopend stuk over
    // beide velden heen, dus 1 - en hij hangt nog steeds los onder de wortel en
    // niet in een vulveld, want hij hoort bij geen van de twee panelen.
    check('en de handregel hangt er los onder als ÉÉN doorlopend stuk',
        bmHandregel.type === 'onderdeel' && bmHandregel.aantal === 1,
        `${bmHandregel.aantal}x ${bmHandregel.type}`);

    // DE controle die ertoe doet: de boom mag niets kwijtraken en niets
    // dubbeltellen. Per productieonderdeel moet hij op hetzelfde aantal
    // uitkomen als de onderdelenlijst, en die is op de geometrie gebaseerd.
    const bmControleer = (naam, r) => {
        const uitBoom = bmTellingVan(r.boom);
        const mis = r.onderdelen
            .filter(u => (uitBoom.get(u.nummer) || 0) !== u.aantal)
            .map(u => `nr ${u.nummer}: boom ${uitBoom.get(u.nummer) || 0} `
                    + `tegenover lijst ${u.aantal}`);
        check(`${naam}: de boom telt per onderdeel hetzelfde als de lijst`,
            mis.length === 0, mis.join('; '));
        const totaalBoom = [...uitBoom.values()].reduce((s, n) => s + n, 0);
        check(`${naam}: en in totaal evenveel als er gebouwd is`,
            totaalBoom === r.aantalDelen,
            `${totaalBoom} tegenover ${r.aantalDelen}`);
    };
    bmControleer('recht', bmRecht);

    // Twee vulvelden aan weerszijden van een hoek staan anders in de ruimte
    // maar zijn hetzelfde paneel. De vingerafdruk rekent met afstanden tot het
    // zwaartepunt van de groep, en die veranderen niet als je hem draait.
    const bmHoek = await bmBouw('hoek van 90 graden',
        [[0, 0, 0], [1700, 0, 0], [1700, 1700, 0]], false,
        { maxStaanderAfstand: 5000 });
    const bmHoekVeld = bmHoek.boom.kinderen.find(k => k.soort === 'vulveld');
    check('om een hoek worden twee gelijke velden tóch als één soort herkend',
        bmHoekVeld.aantal === 2, `${bmHoekVeld.aantal}x`);
    bmControleer('hoek', bmHoek);

    // En de tegenproef: twee velden die ECHT verschillen mogen niet samenvallen.
    // Zonder deze controle zou "alles is altijd hetzelfde" ook slagen.
    const bmOngelijk = await bmBouw('twee ongelijke velden',
        [[0, 0, 0], [1700, 0, 0], [4000, 0, 0]], false,
        { maxStaanderAfstand: 5000 });
    const bmVelden = bmOngelijk.boom.kinderen.filter(k => k.soort === 'vulveld');
    check('twee velden van verschillende lengte blijven twee knopen',
        bmVelden.length === 2 && bmVelden.every(k => k.aantal === 1),
        bmVelden.map(k => `${k.aantal}x`).join(' '));
    check('en ze hebben een verschillend aantal spijlen',
        bmVelden[0].inhoud.find(r => r.soort === 'spijl').aantal
            !== bmVelden[1].inhoud.find(r => r.soort === 'spijl').aantal,
        bmVelden.map(k =>
            k.inhoud.find(r => r.soort === 'spijl').aantal).join(' tegenover '));
    bmControleer('ongelijk', bmOngelijk);

    const bmRond = await bmBouw('gesloten vierkant',
        [[0, 0, 0], [1700, 0, 0], [1700, 1700, 0], [0, 1700, 0]], true,
        { maxStaanderAfstand: 5000 });
    check('een gesloten ronde geeft 4 staanders, 4 vulvelden en 4 handregels',
        bmRond.boom.kinderen.every(k => k.aantal === 4),
        bmRond.boom.kinderen.map(k => `${k.aantal}x ${k.soort}`).join(', '));
    bmControleer('vierkant', bmRond);

    // Zonder voetplaat houdt de staandergroep maar één onderdeel over. Dat is
    // geen samenstelling meer, dus hij hoort plat in de boom te komen - en op
    // dezelfde plek te blijven staan. De boom mag niet van volgorde wisselen
    // door een vinkje.
    // Ook zonder afdekkap, anders is de staandergroep nog steeds twee
    // onderdelen (staander plus kap) en meet je het platslaan niet.
    const bmKaal = await bmBouw('zonder vulraamwerk, voetplaat en kap',
        [[0, 0, 0], [1700, 0, 0]], false,
        { vulraamwerk: 0, voetplaatDikte: 0, paalkapDikte: 0 });
    const bmKaalStaanders = bmKaal.boom.kinderen.filter(k => k.soort === 'staander');
    check('een groep met één onderdeel wordt geen lege tak',
        bmKaalStaanders.every(k => k.type === 'onderdeel')
        && bmAantal(bmKaal.boom, 'staander') === 3,
        bmKaalStaanders.map(k => `${k.aantal}x ${k.type}`).join(' + '));
    check('en de volgorde blijft staander, vulveld, handregel',
        bmSoorten(bmKaal.boom) === 'staander,vulveld,handregel',
        bmSoorten(bmKaal.boom));
    bmControleer('kaal', bmKaal);

    // Een trap met een leuning aan TWEE kanten roept padDelen twee keer aan.
    // Allebei de keren heet de eerste groep "staander 1". Zou samenstelling.js
    // op dat nummer sleutelen, dan vielen de twee leuningen over elkaar heen.
    log('\n--- trap met leuning aan twee kanten ---');
    const bmTrap = await trapBouw.bouwTrap(
        { ...trapRegels.STANDAARD, hoogte: 1000, breedte: 1000 },
        { ...bmMaten, lengte: 1000 }, 'beide');
    log(samen.alsTekst(bmTrap.boom));
    check('de wortel heet Trap', bmTrap.boom.naam === 'Trap', bmTrap.boom.naam);
    const bmTrapStaanders = bmAantal(bmTrap.boom, 'staander');
    const bmTrapVelden = bmAantal(bmTrap.boom, 'vulveld');
    check('de groepen van de twee leuningen lopen niet door elkaar',
        bmTrapStaanders === 6 && bmTrapVelden === 4,
        `${bmTrapStaanders} staanders, ${bmTrapVelden} vulvelden`);
    check('en treden en bomen hangen los onder de trap',
        bmTrap.boom.kinderen.some(k => k.soort === 'trede' && k.type === 'onderdeel')
        && bmTrap.boom.kinderen.some(k => k.soort === 'trapboom'),
        bmTrap.boom.kinderen.map(k => k.soort).join(','));
    bmControleer('trap', bmTrap);

    log('\n--- de boom verandert niets aan de bestaande lijsten ---');
    // De boom is additief. Dat is hier te zien doordat de stuklijst en de
    // onderdelenlijst van hetzelfde model nog precies zijn wat deel P en S
    // ervan verwachten.
    check('de stuklijst staat er nog en is niet leeg',
        Array.isArray(bmRecht.stuklijst) && bmRecht.stuklijst.length > 0,
        `${bmRecht.stuklijst.length} regels`);
    check('en elk uniek onderdeel heeft nog zijn eigen lokale vorm om te exporteren',
        bmRecht.onderdelen.every(u => u.vorm && !u.vorm.IsNull()),
        `${bmRecht.onderdelen.length} onderdelen`);

    log('\n--- in het echte venster ---');
    check('er is een vak voor de samenstelling', !!doc.getElementById('boomVak'));
    check('en het zit in de groep Resultaat',
        doc.getElementById('resultaatGroep')
            .contains(doc.getElementById('boomVak')));

    // Echt op de knop drukken. De boom komt uit nieuwe code in main.js, en die
    // code draait pas als er iets gegenereerd wordt. Een eerdere fout in dit
    // project - een aanroep van een functie die niet bestond - kwam ook alleen
    // bij het echte indrukken aan het licht.
    const bmVoorFouten = errors.length;
    doc.getElementById('genereer').click();
    for (let i = 0; i < 2000 && !/spijlen|mislukt/i.test(status.textContent); i++) {
        await sleep(25);
    }
    check('genereren met de boom erbij geeft geen fouten in de console',
        errors.length === bmVoorFouten, errors.slice(bmVoorFouten).join(' | '));

    // Naar het tabblad Resultaat, anders staat de boom er wel maar zie je hem
    // niet - en "staat in beeld" hoort te betekenen dat je ernaar kunt kijken.
    [...doc.querySelectorAll('#tabs .tabknop')]
        .find(t => t.textContent.trim().startsWith('Resultaat')).click();
    await sleep(50);

    const bmVak = doc.getElementById('boomVak');
    const bmTekst = doc.getElementById('boomTekst');
    check('het vak Samenstelling staat in beeld',
        bmVak.style.display === 'block', bmVak.style.display);
    check('en er staat een boom in met een wortel en takken',
        !!bmTekst.querySelector('.wortel') && bmTekst.querySelectorAll('.tak').length > 0,
        `${bmTekst.querySelectorAll('.tak').length} takken, `
        + `${bmTekst.querySelectorAll('.blad').length} bladen`);
    const bmInBeeld = bmTekst.textContent;
    log('in het venster: ' + bmInBeeld.replace(/\s+/g, ' ').trim().slice(0, 120));
    check('de boom noemt de staander, het vulveld en de handregel',
        /Staander/.test(bmInBeeld) && /Vulveld/.test(bmInBeeld)
        && /Handregel/.test(bmInBeeld),
        bmInBeeld.replace(/\s+/g, ' ').slice(0, 80));

    // Een ingeladen STEP heeft geen samenstelling: we kennen daar alleen de
    // vorm van, niet de onderdelen. Dan hoort het vak te verdwijnen in plaats
    // van de boom van het vorige model te laten staan. main.js verbergt het
    // zodra er geen knopen zijn, dus dat is het geval om na te lopen.
    const bmNiets = samen.maakBoom([], [], 'Niets');
    check('zonder onderdelen levert de boom geen enkele knoop op',
        bmNiets.kinderen.length === 0, `${bmNiets.kinderen.length} knopen`);

    // ============ DEEL AB: doorlopende handregelstukken =====================
    log('\n\n======== DEEL AB: doorlopende stukken ========\n');

    // Stap 1 van PLAN-DOORLOPENDE-HANDREGEL.md. Alleen rekenwerk: het pad in
    // reeksen velden met dezelfde richting knippen. Er verandert hier nog NIETS
    // aan de geometrie - padDelen bouwt de handregel nog steeds per veld - dus
    // alle bestaande controles horen gewoon te blijven staan.
    //
    // Wat hier bewezen moet worden:
    //   1. een tussenstaander knipt niet, een hoek en een knik wel
    //   2. twee stukken met DEZELFDE richting die niet naast elkaar liggen
    //      worden niet samengevoegd
    //   3. de verstekformule n ~ d_in + d_uit klopt
    //   4. elk veld zit in precies een stuk

    const dsAchtEen = 850;
    const dsVierkant = [[0, 0, 0], [2000, 0, 0], [2000, 2000, 0], [0, 2000, 0]];

    /** Elk veld precies een keer, en de stukken op een rij langs het pad. */
    const dsDekking = (stukkenLijst, aantalVelden) => {
        const gezien = stukkenLijst.flatMap(s => s.velden);
        return gezien.length === aantalVelden
            && new Set(gezien).size === aantalVelden;
    };

    log('--- recht stuk: tussenstaanders knippen niet ---');
    const dsRechtPad = padMod.verdichtPad([[0, 0, 0], [2000, 0, 0]], false, dsAchtEen);
    const dsRecht = padMod.handregelStukken(dsRechtPad, false);
    log(`pad van 2000 mm -> ${dsRechtPad.length} staanders, `
        + `${dsRechtPad.length - 1} velden, ${dsRecht.length} handregelstuk(ken)`);
    check('vier staanders en drie velden, zoals verdichtPad ze maakt',
        dsRechtPad.length === 4, dsRechtPad.length);
    check('maar EEN doorlopend stuk', dsRecht.length === 1, dsRecht.length);
    check('dat stuk bevat alle drie de velden',
        dsRecht[0].velden.length === 3, dsRecht[0].velden.join(','));
    check('het loopt van het eerste tot het laatste padpunt',
        dsRecht[0].begin === 0 && dsRecht[0].eind === 3,
        `${dsRecht[0].begin} -> ${dsRecht[0].eind}`);
    check('beide einden zijn vrij, dus daar mag overstek',
        dsRecht[0].beginVrij && dsRecht[0].eindVrij);
    check('en een vrij eind heeft geen verstekvlak',
        dsRecht[0].beginNormaal === null && dsRecht[0].eindNormaal === null);
    check('elk veld zit in precies een stuk', dsDekking(dsRecht, 3));

    log('\n--- hoek: knipt wel, en krijgt verstek ---');
    const dsLPad = padMod.verdichtPad(
        [[0, 0, 0], [2000, 0, 0], [2000, 2000, 0]], false, dsAchtEen);
    const dsL = padMod.handregelStukken(dsLPad, false);
    log(`L-pad -> ${dsLPad.length - 1} velden, ${dsL.length} stukken van `
        + `${dsL.map(s => s.velden.length).join(' en ')} velden`);
    check('een hoek geeft twee stukken', dsL.length === 2, dsL.length);
    check('elk stuk neemt zijn eigen been mee, drie velden per been',
        dsL.every(s => s.velden.length === 3),
        dsL.map(s => s.velden.length).join(','));
    check('elk veld zit in precies een stuk', dsDekking(dsL, 6));
    check('het buitenste eind van elk stuk is vrij',
        dsL[0].beginVrij && dsL[1].eindVrij);
    check('maar bij de hoek is niets vrij',
        !dsL[0].eindVrij && !dsL[1].beginVrij);

    // Bij 90 graden hoort het verstek op 45 graden te staan: de normaal is de
    // som van de twee richtingen, dus (1,1,0) genormeerd.
    const dsHalveWortel2 = Math.SQRT1_2;
    const dsN = dsL[0].eindNormaal;
    log(`verstek bij de hoek: normaal ${dsN.map(w => w.toFixed(5)).join(', ')}`);
    check('de verstek-normaal staat op 45 graden',
        Math.abs(dsN[0] - dsHalveWortel2) < 1e-12
        && Math.abs(dsN[1] - dsHalveWortel2) < 1e-12
        && Math.abs(dsN[2]) < 1e-12,
        dsN.map(w => w.toFixed(6)).join(', '));
    check('beide stukken delen hetzelfde verstekvlak',
        [0, 1, 2].every(as => Math.abs(dsL[0].eindNormaal[as]
                                     - dsL[1].beginNormaal[as]) < 1e-12),
        dsL[1].beginNormaal.map(w => w.toFixed(6)).join(', '));
    // De afspraak waar build-balustrade.js straks op rekent: aan het EIND van
    // een stuk wijst de normaal met de rijrichting mee, aan het BEGIN ook. Zo
    // is het altijd "bewaar de kant waar n.(X-P) <= 0" aan het eind en ">= 0"
    // aan het begin, ongeacht de hoek.
    const dsPunt = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    check('de normaal wijst aan beide einden met de rijrichting mee',
        dsPunt(dsL[0].langs, dsL[0].eindNormaal) > 0
        && dsPunt(dsL[1].langs, dsL[1].beginNormaal) > 0,
        `${dsPunt(dsL[0].langs, dsL[0].eindNormaal).toFixed(4)} en `
        + `${dsPunt(dsL[1].langs, dsL[1].beginNormaal).toFixed(4)}`);

    log('\n--- gesloten rondom: vier stukken, geen naad te veel ---');
    const dsRondPad = padMod.verdichtPad(dsVierkant, true, dsAchtEen);
    const dsRond = padMod.handregelStukken(dsRondPad, true);
    log(`gesloten vierkant -> ${dsRondPad.length} staanders, `
        + `${dsRondPad.length} velden, ${dsRond.length} stukken`);
    check('twaalf staanders en twaalf velden', dsRondPad.length === 12,
        dsRondPad.length);
    check('vier doorlopende stukken in plaats van twaalf handregels',
        dsRond.length === 4, dsRond.length);
    check('elk stuk is een hele zijde: drie velden',
        dsRond.every(s => s.velden.length === 3),
        dsRond.map(s => s.velden.length).join(','));
    check('elk veld zit in precies een stuk', dsDekking(dsRond, 12));
    check('bij een lus is geen enkel eind vrij',
        dsRond.every(s => !s.beginVrij && !s.eindVrij));
    check('en heeft elk eind dus een verstekvlak',
        dsRond.every(s => s.beginNormaal && s.eindNormaal));

    log('\n--- knik in de helling: trap, bordes, trap ---');
    // Drie stukken, waarvan het eerste en het derde DEZELFDE richting hebben.
    // Die mogen niet samengevoegd worden - ze liggen niet naast elkaar.
    const dsTrapPad = [[0, 0, 0], [1200, 0, 900], [2200, 0, 900], [3400, 0, 1800]];
    const dsTrap = padMod.handregelStukken(dsTrapPad, false);
    check('trap-bordes-trap geeft drie stukken', dsTrap.length === 3, dsTrap.length);
    check('twee stukken met dezelfde richting worden NIET samengevoegd',
        Math.abs(dsTrap[0].langs[2] - dsTrap[2].langs[2]) < 1e-12
        && dsTrap[0].velden[0] !== dsTrap[2].velden[0],
        `veld ${dsTrap[0].velden} en veld ${dsTrap[2].velden}, `
        + `beide stijging ${dsTrap[0].langs[2].toFixed(3)}`);
    check('het middelste stuk is vlak',
        Math.abs(dsTrap[1].langs[2]) < 1e-12, dsTrap[1].langs[2]);
    check('en heeft aan beide kanten verstek',
        !!dsTrap[1].beginNormaal && !!dsTrap[1].eindNormaal);

    // DE BELANGRIJKSTE CONTROLE VAN DIT DEEL.
    //
    // De verstek-normaal langs een TWEEDE, onafhankelijke weg narekenen. De
    // code gebruikt n ~ d_in + d_uit (uit de zijvlakken afgeleid). Bij een
    // knik kun je hem ook uit de BOVEN- en ONDERVLAKKEN halen, en dan komt er
    // loodrecht_uit - loodrecht_in uit. Dat zijn twee verschillende formules;
    // als ze hetzelfde getal geven is de meetkunde goed. Geven ze iets anders,
    // dan is er precies zo'n stap van millimeters als eerder bij de bovenregel.
    const dsLoodVan = (A, B) => padMod.veldGegevens(A, B, 0, 0).loodrecht;
    const dsLoodIn = dsLoodVan(dsTrapPad[0], dsTrapPad[1]);
    const dsLoodUit = dsLoodVan(dsTrapPad[1], dsTrapPad[2]);
    const dsUitVlakken = (() => {
        const d = [0, 1, 2].map(as => dsLoodUit[as] - dsLoodIn[as]);
        const l = Math.hypot(...d);
        return d.map(w => w / l);
    })();
    const dsUitCode = dsTrap[0].eindNormaal;
    log(`uit de zijvlakken : ${dsUitCode.map(w => w.toFixed(9)).join(', ')}`);
    log(`uit de topvlakken : ${dsUitVlakken.map(w => w.toFixed(9)).join(', ')}`);
    check('twee onafhankelijke afleidingen geven dezelfde verstek-normaal',
        [0, 1, 2].every(as => Math.abs(dsUitCode[as] - dsUitVlakken[as]) < 1e-12),
        [0, 1, 2].map(as => (dsUitCode[as] - dsUitVlakken[as]).toExponential(2))
            .join(', '));
    // Bij een knik staat de normaal NIET horizontaal; bij een vlakke hoek wel.
    // Dat verschil is de reden dat het verstekvlak door padpunt + [0,0,hoogte]
    // moet gaan en niet door het staanderhart: alleen een horizontale normaal
    // maakt dat onderscheid onzichtbaar.
    check('bij een knik heeft de verstek-normaal een z-component',
        Math.abs(dsUitCode[2]) > 0.3, dsUitCode[2].toFixed(6));
    check('bij een vlakke hoek niet', Math.abs(dsN[2]) < 1e-12, dsN[2]);

    // Hoe ver het scheelt als je het verstekvlak door het verkeerde punt legt:
    // het verschil tussen het staanderhart en het punt een leuninghoogte
    // hoger, gemeten langs de normaal. Geen controle op de code, maar het legt
    // het getal uit het plan vast zodat het niet wegzakt.
    const dsScheef = Math.abs(dsPunt([0, 0, regels.STANDAARD.hoogte], dsUitCode));
    // Deze trap loopt 900 op 1200, dus 3:4. In het plan staat 230 mm; dat is
    // dezelfde rekensom op een helling van 1:2. Twee hellingen, twee getallen -
    // geen van beide is een afrondverschil.
    log(`door het staanderhart i.p.v. het bovenpunt: ${dsScheef.toFixed(1)} mm `
        + 'verschoven langs de rail (helling 3:4; bij 1:2 is het 230 mm)');
    check('en dat is geen afrondverschil maar honderden millimeters',
        dsScheef > 200, dsScheef.toFixed(1));

    log('\n--- hoe grof mag de ruis zijn ---');
    // Twee aangeklikte randen die in elkaars verlengde liggen horen EEN stuk te
    // worden, ook met wat ruis op de coordinaten. Een echte knik van een graad
    // hoort wel te knippen.
    const dsRuis = padMod.handregelStukken(
        [[0, 0, 0], [1000, 0, 0], [2000, 1e-6, 0]], false);
    check('ruis van 1e-6 mm over een meter knipt niet', dsRuis.length === 1,
        dsRuis.length);
    const dsGraad = Math.tan(Math.PI / 180) * 1000;
    const dsKnik = padMod.handregelStukken(
        [[0, 0, 0], [1000, 0, 0], [2000, dsGraad, 0]], false);
    check('een knik van 1 graad knipt wel', dsKnik.length === 2, dsKnik.length);

    log('\n--- en padDelen bouwt ze nu ook echt zo ---');
    // Hier stond in stap 1 nog "een handregel per veld, 3 stuks". Stap 2 heeft
    // dat omgezet: één regel per doorlopend stuk.
    const dsPerStuk = padMod.padDelen(dsRechtPad, false, regels.STANDAARD);
    const dsRegels = dsPerStuk.delen.filter(d => d.soort === 'handregel');
    check('drie velden, maar EEN handregel', dsRegels.length === 1, dsRegels.length);
    check('en die is zo lang als het hele pad plus overstek aan twee kanten',
        Math.abs(dsRegels[0].dx
                 - (2000 + 2 * regels.STANDAARD.handregelOverstek)) < 1e-9,
        dsRegels[0].dx.toFixed(3));
    check('aan beide vrije einden geen verstek',
        dsRegels[0].verstek.length === 0, dsRegels[0].verstek.length);

    // Hoeveel staal er door het doorlopen bij komt: de twee tussenstaanders
    // liggen er nu onder in plaats van ernaast. 3 stukken van 746,67 + 626,67 +
    // 746,67 = 2120 mm was het; 2200 mm in één stuk is het nu. Dat is 80 mm
    // meer staal (2 x 40 = de twee tussenstaanders) in plaats van twee extra
    // zaagsneden, twee extra lasnaden en twee regels in de stuklijst.
    const dsStaal = dsRegels.reduce((s, d) => s + d.dx, 0);
    log(`handregelstaal: ${dsStaal.toFixed(2)} mm in ${dsRegels.length} stuk(ken) `
        + '(was 2120,00 mm in 3 stukken)');
    check('één zaaglengte in plaats van drie, 80 mm meer staal',
        Math.abs(dsStaal - 2200) < 1e-9, dsStaal.toFixed(2));

    // En de staanders stoppen nu allemaal op de onderkant van de regel, dus ze
    // zijn ALLE VIER even lang. Daarvoor waren de twee buitenste korter (die
    // lagen al onder het overstek) en de twee middelste langer.
    const dsStaanders = dsPerStuk.delen.filter(d => d.soort === 'staander');
    const dsLengtes = [...new Set(dsStaanders.map(d => +d.dz.toFixed(6)))];
    check('alle vier de staanders zijn even lang', dsLengtes.length === 1,
        dsLengtes.join(', '));
