    // ============ DEEL AY: de bezig-melding =================================
    log('\n\n======== DEEL AY: de bezig-melding ========\n');

    const ayVak = doc.getElementById('bezigVak');
    check('het bezig-vak bestaat', !!ayVak);
    check('het ligt over de viewport',
        !!ayVak && ayVak.parentElement.id === 'viewport');
    check('in rust is het verborgen', !!ayVak && ayVak.hidden);

    const ayBladen = [doc.getElementById('bezigBlad1'),
                      doc.getElementById('bezigBlad2')];
    const ayVeeg = doc.querySelector('.ringVeeg');
    check('de twee voortgangshelften en de draaiende veeg staan er',
        !!ayBladen[0] && !!ayBladen[1] && !!ayVeeg);

    // DIT IS DE KERN VAN HET ONTWERP, en daarom staat er een controle op.
    // De veeg blijft draaien terwijl OCCT de hoofddraad blokkeert, omdat
    // Chrome een animatie op `transform` op de compositor-draad afhandelt.
    // Zet iemand daar ooit `left`, `width` of `margin` bij, dan valt de
    // melding stil op precies het moment dat je hem nodig hebt. Dat zie je
    // niet aan de code - alleen aan het scherm, en dan nog alleen als je
    // ernaar zit te kijken.
    const ayEigenschappen = [];
    for (const blad of doc.styleSheets) {
        let regels;
        try { regels = blad.cssRules; } catch (e) { continue; }
        for (const regel of regels) {
            if (regel.type !== CSSRule.KEYFRAMES_RULE) continue;
            if (regel.name !== 'bezigDraai') continue;
            for (const kader of regel.cssRules) {
                for (const naam of kader.style) ayEigenschappen.push(naam);
            }
        }
    }
    check('de veeg-animatie bestaat', ayEigenschappen.length > 0);
    check('en raakt alleen transform aan (anders bevriest hij)',
        ayEigenschappen.length > 0
            && ayEigenschappen.every((n) => n === 'transform'),
        ayEigenschappen.join(', '));
    const ayVeegStijl = ayVeeg ? win.getComputedStyle(ayVeeg) : null;
    check('de veeg draait ook echt met die animatie',
        !!ayVeegStijl && ayVeegStijl.animationName === 'bezigDraai',
        ayVeegStijl ? ayVeegStijl.animationName : '-');

    // DE VOORTGANG MAG ALLEEN AAN transform VLOEIEN. Een overgang op
    // stroke-dasharray, width of een conic-gradient loopt over de hoofddraad
    // en bevriest dus halverwege - op een stand die nergens op slaat.
    for (const [i, blad] of ayBladen.entries()) {
        const st = blad ? win.getComputedStyle(blad) : null;
        check(`helft ${i + 1} vloeit alleen aan transform`,
            !!st && st.transitionProperty === 'transform',
            st ? st.transitionProperty : '-');
        check(`helft ${i + 1} heeft een overgang die iets voorstelt`,
            !!st && parseFloat(st.transitionDuration) > 0,
            st ? st.transitionDuration : '-');
    }

    // Het in- en uitvagen hoort aan `opacity` te hangen, om dezelfde reden.
    const ayVakStijl = win.getComputedStyle(ayVak);
    check('het vak vaagt met opacity in en uit',
        ayVakStijl.transitionProperty === 'opacity',
        ayVakStijl.transitionProperty);

    const ayBron = await (await fetch('./main.js')).text();
    // Een bouw van 0,4 s liet de melding opflitsen en weer verdwijnen; dat
    // leest als een storing. De minimale toontijd hoort te blijven staan.
    const ayMin = ayBron.match(/BEZIG_MINIMAAL\s*=\s*(\d+)/);
    check('er is een minimale toontijd', !!ayMin && Number(ayMin[1]) >= 200,
        ayMin ? ayMin[1] + ' ms' : 'niet gevonden');
    // En de ring wordt alleen op de GOEDE afloop volgedraaid, niet in de
    // finally: een mislukte bouw die op 100% eindigt liegt.
    check('de ring wordt niet in de finally volgedraaid',
        !/finally\s*\{[^}]*zetRing\(1\)/.test(ayBron));

    // Een controle op de bron, bij gebrek aan beter: of de melding ook
    // weggaat als het MISgaat, kun je hier niet naspelen zonder een echte
    // bouw af te wachten. Wat wel kan is kijken of het opruimen in een
    // `finally` staat en niet achter de goede afloop.
    const ayFinally = (ayBron.match(/finally\s*\{[^}]*bezigKlaar\(\)/g) || []).length;
    check('beide bouwwegen ruimen de melding op in een finally',
        ayFinally >= 2, ayFinally + ' gevonden');
    check('de getypte opdracht meldt zich ook',
        /await bezigStart\('Balustrade bouwen'\)/.test(ayBron)
            && /await bezigStart\('Trap bouwen'\)/.test(ayBron));

    // Op 22-10 bleef de hele bouw hangen omdat `adem()` op een frame wachtte
    // dat nooit kwam: in een tabblad op de achtergrond tekent Chrome niet
    // meer, en onder --virtual-time-budget vuurt rAF precies één keer. Deze
    // twee uitwegen moeten blijven staan.
    check('het wachten op een frame heeft een vangnet',
        /setTimeout\(eenmaal, \d+\)/.test(ayBron)
            && /if \(document\.hidden\) return Promise\.resolve\(\);/.test(ayBron));

    // ============ DEEL AZ: geen vaktaal op het scherm =======================
    log('\n\n======== DEEL AZ: geen vaktaal op het scherm ========\n');

    // WAAROM DIT EEN CONTROLE IS. De app rekent met OCCT, b-rep-topologie en
    // driehoeken, en die woorden kropen vanzelf de knoppen en meldingen in -
    // "Selected edge: 7", "12 b-rep edges", "Balustrade bouwen met OCCT...".
    // Voor wie een balustrade tekent zegt dat niets. In de broncode, de
    // console en de logs blijft het staan; op het scherm niet.
    const AZ_VAKTAAL = /\b(OCCT|OpenCascade|b-?rep|tessellat\w*|GLB|three\.?js|WebAssembly|wasm|mesh(es)?|vertex|vertices|faces?|edges?|BufferGeometry|raycast\w*|shader|solid[s]?\b)\b/i;
    // Woorden die eruit zien als vaktaal maar het hier niet zijn: STEP, DXF,
    // CSV, PDF en ZIP staan op knoppen omdat de gebruiker het juiste bestand
    // moet kunnen kiezen. Die horen te blijven.

    function azLoopTekst(wortel) {
        const buit = [];
        const loper = doc.createTreeWalker(wortel, NodeFilter.SHOW_TEXT, {
            acceptNode(n) {
                const ouder = n.parentElement;
                if (!ouder) return NodeFilter.FILTER_REJECT;
                const soort = ouder.tagName;
                // De broncode in <script> en de css in <style> zijn geen
                // schermtekst. HTML-commentaar is geen tekstknoop, dus de
                // toelichtingen in de bron komen hier vanzelf niet langs.
                if (soort === 'SCRIPT' || soort === 'STYLE'
                    || soort === 'NOSCRIPT' || soort === 'TEMPLATE') {
                    return NodeFilter.FILTER_REJECT;
                }
                return n.textContent.trim()
                    ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
            },
        });
        for (let n = loper.nextNode(); n; n = loper.nextNode()) {
            const t = n.textContent.trim();
            const m = AZ_VAKTAAL.exec(t);
            if (m) {
                buit.push(`"${m[0]}" in <${n.parentElement.tagName.toLowerCase()}`
                    + (n.parentElement.id ? '#' + n.parentElement.id : '')
                    + `>: ${t.slice(0, 60)}`);
            }
        }
        return buit;
    }

    const azTeksten = azLoopTekst(doc.body);
    check('geen vaktaal in de zichtbare teksten', azTeksten.length === 0,
        azTeksten.slice(0, 6).join(' | '));

    // Ook wat je niet leest maar wel krijgt voorgelezen of ziet zweven.
    const azAttributen = [];
    for (const el of doc.querySelectorAll(
        '[title],[placeholder],[aria-label],button,summary,label,option')) {
        for (const naam of ['title', 'placeholder', 'aria-label']) {
            const w = el.getAttribute(naam);
            const m = w && AZ_VAKTAAL.exec(w);
            if (m) azAttributen.push(`${naam}="${w.slice(0, 50)}"`);
        }
    }
    check('geen vaktaal in tooltips, labels en placeholders',
        azAttributen.length === 0, azAttributen.slice(0, 6).join(' | '));

    // ALLEEN WAT ER LETTERLIJK STAAT. Een melding wordt in de bron opgebouwd
    // uit tekst én code, en `edge.curveType` is geen schermtekst maar een
    // variabelenaam. Zonder dit onderscheid valt deze controle over code
    // waar niets mis mee is - en dat is precies wat hier gebeurde. De
    // ${...}-stukken gaan er dus uit; wat tussen de aanhalingstekens
    // overblijft is wat de gebruiker leest.
    function azAlleenTekst(bron) {
        const stukken = [];
        for (const m of bron.matchAll(/'([^']*)'|"([^"]*)"|`([^`]*)`/g)) {
            const t = m[1] !== undefined ? m[1]
                : m[2] !== undefined ? m[2] : (m[3] || '');
            stukken.push(t.replace(/\$\{[^}]*\}/g, ' '));
        }
        return stukken.join(' ');
    }

    // Eerst de controle zelf op de proef stellen. Een bewaking die niet kán
    // afgaan bewaakt niets, en een die over code struikelt ook niet.
    check('de taalcontrole betrapt vaktaal in een melding',
        AZ_VAKTAAL.test(azAlleenTekst('`${n} b-rep edges gevonden`')));
    check('en laat een variabelenaam met rust',
        !AZ_VAKTAAL.test(azAlleenTekst('`Rand ${edge.edgeId} geselecteerd`')));

    // De meldingen die tijdens het werk verschijnen staan niet in de pagina
    // maar in main.js. Die dus apart nalopen, op de plek waar ze gezet worden.
    const azMeldingen = [
        ...[...ayBron.matchAll(
            /(?:statusEl|edgeStatusEl)\.textContent\s*=\s*([\s\S]{0,220}?);/g)]
            .map(m => m[1]),
        // De voortgang van het productiepakket loopt via meld(); die komt
        // langs dezelfde statusregel op het scherm terecht.
        ...[...ayBron.matchAll(/meld\(([^)]{0,160})\)/g)].map(m => m[1]),
    ].filter(t => AZ_VAKTAAL.test(azAlleenTekst(t.replace(/\/\/[^\n]*/g, ''))));
    check('geen vaktaal in de status- en randmeldingen',
        azMeldingen.length === 0,
        azMeldingen.slice(0, 3).map(t => t.replace(/\s+/g, ' ').slice(0, 70)).join(' | '));

    // En de stappen van de bezig-melding: die leest de gebruiker het vaakst.
    const azBouwBron = await (await fetch('./build-balustrade.js')).text();
    const azStappen = [...azBouwBron.matchAll(/await stap\(\d+,\s*([^)]*)\)/g)]
        .map(m => m[1]).filter(t => AZ_VAKTAAL.test(azAlleenTekst(t)));
    check('geen vaktaal in de stappen tijdens het bouwen',
        azStappen.length === 0, azStappen.join(' | '));

    // ============ DEEL BA: het voorbeeld zonder OCCT ========================
    log('\n\n======== DEEL BA: voorbeeld zonder OCCT ========\n');

    // Het voorbeeld rekent niets uit; het tekent de delenlijst. Dan hoort elk
    // onderdeel in beeld precies het doosje te beslaan dat de lijst noemt.
    // Wijkt dat af, dan laat het voorbeeld iets anders zien dan er gebouwd
    // wordt - en dat is de valkuil uit PLAN-SNELHEID.md § 5.
    //
    // Vergeleken wordt met de DELENLIJST, niet met de OCCT-solid. Die
    // vergelijking (fase 3) moet de sneden nog uit elkaar houden; deze niet.
    const baTHREE = await win.eval("import('/vendor/three.module.js')");
    const { trapDelen: baTrapDelen } = await win.eval("import('/build-trap.js')");
    const { maakVoorbeeld } = await win.eval("import('/preview.js')");
    const { STANDAARD: baTrap } = await win.eval("import('/trap-regels.js')");
    const { STANDAARD: baBal } = await win.eval("import('/balustrade-rules.js')");

    // De acht hoekpunten van een deel, of van een plaat de omtrek over zijn dikte.
    function baDoosVanDeel(d) {
        const b = new baTHREE.Box3();
        if (d.omtrek) {
            for (const [x, z] of d.omtrek) {
                b.expandByPoint(new baTHREE.Vector3(x, d.y, z));
                b.expandByPoint(new baTHREE.Vector3(x, d.y + d.dikte, z));
            }
            return b;
        }
        for (const i of [0, 1]) for (const j of [0, 1]) for (const k of [0, 1]) {
            b.expandByPoint(new baTHREE.Vector3(...[0, 1, 2].map(a => d.oorsprong[a]
                + i * d.dx * d.xAs[a] + j * d.dy * d.yAs[a] + k * d.dz * d.zAs[a])));
        }
        return b;
    }

    // Alle doosjes in het voorbeeld, één per getekend exemplaar.
    function baDozenVanVoorbeeld(groep) {
        const uit = [];
        for (const m of groep.children) {
            m.geometry.computeBoundingBox();
            if (!m.isInstancedMesh) { uit.push(m.geometry.boundingBox.clone()); continue; }
            for (let i = 0; i < m.count; i++) {
                const mat = new baTHREE.Matrix4();
                m.getMatrixAt(i, mat);
                uit.push(m.geometry.boundingBox.clone().applyMatrix4(mat));
            }
        }
        return uit;
    }

    for (const [naam, p, bal, leuning] of [
        ['kale trap', { ...baTrap }, null, 'geen'],
        ['eiken treden, RAL 7016', { ...baTrap, tredeMateriaal: 'eiken', afwerking: '7016' },
            null, 'geen'],
        ['trap met bordes', { ...baTrap, hoogte: 3200, bordesNa: 8, bordesLengte: 1000 },
            null, 'geen'],
        ['leuning aan beide kanten', { ...baTrap }, { ...baBal }, 'beide'],
    ]) {
        const { delen } = baTrapDelen(p, bal, leuning);
        const groep = maakVoorbeeld(delen);
        const dozen = baDozenVanVoorbeeld(groep);
        check(`${naam}: één vorm per deel`, dozen.length === delen.length,
            `${dozen.length} vormen, ${delen.length} delen`);

        // Elk deel zoekt zijn doosje; volgorde doet er niet toe, want het
        // voorbeeld bundelt per materiaal.
        let slechtste = 0, slechtsteSoort = '';
        for (const d of delen) {
            const doel = baDoosVanDeel(d);
            let beste = -1, besteAfw = Infinity;
            dozen.forEach((b, i) => {
                const afw = Math.max(...['x', 'y', 'z'].flatMap(a =>
                    [Math.abs(b.min[a] - doel.min[a]), Math.abs(b.max[a] - doel.max[a])]));
                if (afw < besteAfw) { besteAfw = afw; beste = i; }
            });
            if (besteAfw > slechtste) { slechtste = besteAfw; slechtsteSoort = d.soort; }
            if (beste >= 0) dozen.splice(beste, 1);
        }
        check(`${naam}: elk deel staat in beeld waar de lijst het zegt`,
            slechtste < 0.01, `grootste afwijking ${slechtste.toFixed(4)} mm`
                + (slechtsteSoort ? ` (${slechtsteSoort})` : ''));
        check(`${naam}: gebundeld per materiaal`, groep.children.length <= 6,
            `${delen.length} delen in ${groep.children.length} tekenopdrachten`);
    }

    // En in de viewer zelf: een trapmaat wijzigen zet een voorbeeld neer,
    // zonder op Genereer te drukken, en zegt erbij dat het een voorbeeld is.
    const baHoogte = doc.getElementById('t_hoogte');
    const baOud = baHoogte.value;
    baHoogte.value = 2800;
    baHoogte.dispatchEvent(new win.Event('input'));
    await sleep(200);
    const baStatus = doc.getElementById('status').textContent;
    check('een trapmaat wijzigen zet een voorbeeld in beeld',
        /^Voorbeeld van de trap/.test(baStatus), baStatus.slice(0, 70));
    check('een voorbeeld wist de onderdelen van de vorige bouw',
        /Genereer eerst/.test(await (async () => {
            doc.getElementById('productie').click();
            await sleep(100);
            return doc.getElementById('status').textContent;
        })()));
    baHoogte.value = baOud;
    baHoogte.dispatchEvent(new win.Event('input'));

    // ============ DEEL BB: alles van de balustrade op de trap ===============
    log('\n\n======== DEEL BB: trapleuning, tredesoorten en trapdelen ========\n');

    // De opdracht: alles wat de losse balustrade kan, ook op de trap - en de
    // trap zelf compleet maken met tredesoorten en losse onderdelen. Bij het
    // nalopen kwamen er vier gaten boven die geen bestaand deel zag; elk staat
    // hieronder met het getal dat er toen gemeten werd.
    const bbTrap = { ...trapRegels.STANDAARD };
    const bbBordes = { ...bbTrap, hoogte: 3200, bordesNa: 8, bordesLengte: 1000 };
    const bbBal = { ...regels.STANDAARD };
    const bbHea = soortRef(zoekBestand('DIN_1025-3/HEA_200.stp'));
    const bbKoker = soortRef(zoekBestand('DIN_EN_10210-2_HR/HR_200x100x6_EN_10210-2.stp'));

    log('--- 1. de leuningmaten worden net zo streng gekeurd ---');
    // Een doorgang van 400 mm werd bij de balustrade geweigerd en op de trap
    // gewoon gebouwd: precies de veiligheidsregel.
    let bbFout = '';
    try { await trapBouw.bouwTrap(bbTrap, { ...bbBal, maxDoorgang: 400 }, 'rechts'); }
    catch (e) { bbFout = e.message; }
    check('een trapleuning met 400 mm doorgang wordt geweigerd',
        /doorgang/.test(bbFout), bbFout.split('\n')[0] || 'bouwde gewoon');
    let bbGeen = '';
    try { await trapBouw.bouwTrap(bbTrap, { ...bbBal, maxDoorgang: 400 }, 'geen'); }
    catch (e) { bbGeen = e.message; }
    check('zonder leuning doen de leuningmaten er niet toe', bbGeen === '', bbGeen);

    log('\n--- 2. sierpunt, bordes en profielbomen: geen staal op twee plekken ---');
    // Sierpunt: stond op de hartlijn van de regel en zakte aan de bergkant
    // erin, 15 326 mm3. Bordes: de boom van vlucht 1 stak haaks door de
    // bordesboom, 393 423 mm3 bij een plaat en 306 655 mm3 bij een UNP.
    adMeet('trap + sierpunt (CHS)', await trapBouw.bouwTrap(bbTrap,
        { ...bbBal, staanderProfiel: chsP, handregelProfiel: chsP, sierpunt: 'bol-rond' }, 'rechts'));
    adMeet('bordes, plaat', await trapBouw.bouwTrap(bbBordes, null, 'geen'));
    adMeet('bordes, UNP 220', await trapBouw.bouwTrap(
        { ...bbBordes, boomProfiel: unpRef }, null, 'geen'));
    adMeet('bordes, HEA 200', await trapBouw.bouwTrap(
        { ...bbBordes, boomProfiel: bbHea }, null, 'geen'));

    // Een profielboom stond met zijn laagste hoek 16 mm BOVEN de vloer: hij
    // begon haaks op de helling bij de eerste neus. Nu loopt hij door en is
    // hij op de vloer afgezaagd.
    //
    // Gemeten met VOLUMES en niet met de omhullende doos: die is bij gebogen
    // vlakken - de afrondingen van een UNP of een koker - een paar mm te ruim
    // en meldde daardoor 10 mm onder de vloer waar niets zat.
    const bbLaag = (z0, z1) => new adOc.BRepPrimAPI_MakeBox_3(
        new adOc.gp_Pnt_3(-5000, -5000, z0), 20000, 10000, z1 - z0).Shape();
    for (const [naam, prof] of [['UNP 220', unpRef], ['koker 200x100', bbKoker]]) {
        const r = await trapBouw.bouwTrap({ ...bbTrap, boomProfiel: prof });
        const s = adSolids(r.shape)[r.delen.findIndex(d => d.soort === 'trapboom')];
        const eronder = adSamen(s, bbLaag(-1000, 0));
        const opDeVloer = adSamen(s, bbLaag(0, 1));
        check(`${naam}-boom steekt niet door de vloer`, eronder < 1e-3,
            `${eronder.toFixed(3)} mm3 onder z = 0`);
        check(`${naam}-boom rust met zijn voet op de vloer`, opDeVloer > 100,
            `${opDeVloer.toFixed(0)} mm3 in de onderste millimeter`);
    }

    log('\n--- 3. tredesoorten ---');
    const bbTr = await win.eval("import('/treden.js')");
    for (const s of bbTr.TREDESOORTEN) {
        check(`${s.naam} mag als trede en heeft een dikte binnen de grenzen`,
            mat.mag('trede', s.materiaal)
            && s.dikte >= trapRegels.GRENZEN.tredeDikte[0]
            && s.dikte <= trapRegels.GRENZEN.tredeDikte[1], `${s.dikte} mm`);
    }
    // Wat alleen als trede bestaat, hoort nergens anders te kunnen.
    check('een rooster mag niet als spijl', !mat.mag('spijl', 'rooster'));
    check('beton mag niet als handregel', !mat.mag('handregel', 'beton'));
    // Coaten: een ruit kwam bij RAL 7016 als dichte antraciete plaat in beeld.
    check('glas wordt niet gecoat', !mat.magCoaten({ soort: 'ruit', materiaal: 'glas' }));
    check('een stenen trede niet, een stenen baluster wel',
        !mat.magCoaten({ soort: 'trede', materiaal: 'steen' })
        && mat.magCoaten({ soort: 'spijl', materiaal: 'steen' }));
    check('een verzinkt rooster niet', !mat.magCoaten({ soort: 'trede', materiaal: 'rooster' }));

    // De kostenraming: houten treden vielen er stil uit - geen staal en geen
    // bestelwerk. Nu is elke bestelde trede een eigen post.
    ks.zetTarieven(await (await fetch('./tarieven.json')).json());
    for (const [materiaal, post] of [['eiken', 'trede:hout'], ['glas', 'trede:glas'],
                                      ['rooster', 'trede:rooster'], ['beton', 'trede:beton']]) {
        const r = await trapBouw.bouwTrap({ ...bbTrap, tredeMateriaal: materiaal,
            tredeDikte: bbTr.tredeSoortVan(materiaal).dikte });
        const h = ks.hoeveelheden(r.onderdelen);
        check(`een ${materiaal} trede staat als ${post} in de raming`,
            h.besteld[post] === r.trap.treden, JSON.stringify(h.besteld));
    }
    {
        const r = await trapBouw.bouwTrap({ ...bbTrap, tredeMateriaal: 'glas', tredeDikte: 32 });
        const h = ks.hoeveelheden(r.onderdelen);
        const tr1 = r.delen.find(d => d.soort === 'trede');
        const verwacht = r.trap.treden * tr1.dx * tr1.dy / 1e6;
        check('een glazen trede gaat per m2 loopvlak',
            Math.abs(h.m2['trede:glas'] - verwacht) < 1e-6,
            `${h.m2['trede:glas']} tegen ${verwacht}`);
    }

    log('\n--- 4. tredehoeken, stootborden, voet- en kopplaten, wandleuning ---');
    {
        const telSoort = (delen, s) => delen.filter(d => d.soort === s).length;
        const { delen: dGlas, trap: tGlas } = trapBouw.trapDelen({ ...bbTrap, tredeMateriaal: 'glas', tredeDikte: 32 });
        check('een glazen trede ligt op twee hoeken', telSoort(dGlas, 'tredehoek') === 2 * tGlas.treden,
            `${telSoort(dGlas, 'tredehoek')} hoeken, ${tGlas.treden} treden`);
        const { delen: dStaal } = trapBouw.trapDelen(bbTrap);
        check('een stalen trede is gelast, zonder hoeken', telSoort(dStaal, 'tredehoek') === 0);

        const { delen: dSb, trap: tSb } = trapBouw.trapDelen({ ...bbBordes, stootborden: true });
        check('met bordes een stootbord per trede plus een voor het bordes',
            telSoort(dSb, 'stootbord') === tSb.treden, `${telSoort(dSb, 'stootbord')} tegen ${tSb.treden}`);

        const { delen: dPl } = trapBouw.trapDelen({ ...bbTrap, platen: true });
        const voet = dPl.filter(d => d.soort === 'voetplaat');
        const kop = dPl.filter(d => d.soort === 'kopplaat');
        check('twee voetplaten en twee kopplaten, elk met twee gaten',
            voet.length === 2 && kop.length === 2
            && [...voet, ...kop].every(d => d.gaten.length === 2 && Number.isFinite(d.dx)),
            `${voet.length} voet, ${kop.length} kop`);

        let wf = '';
        try { trapBouw.trapDelen({ ...bbTrap, wandleuning: 'rechts' }, bbBal, 'rechts'); }
        catch (e) { wf = e.message; }
        check('een wandleuning aan de leuningkant wordt geweigerd', /leuning/.test(wf), wf);
        const { delen: dWl } = trapBouw.trapDelen({ ...bbBordes, wandleuning: 'links' });
        check('een wandleuning knikt mee met het bordes: drie stukken met verstek',
            telSoort(dWl, 'wandleuning') === 3
            && dWl.filter(d => d.soort === 'wandleuning')[1].verstek.length === 2);
        check('op muurhouders met een rozet', telSoort(dWl, 'muurhouder') >= 2
            && telSoort(dWl, 'muurhouder') === telSoort(dWl, 'rozet'));
    }
    log('\n--- 5. de trap in woorden ---');
    {
        const bbZin = await win.eval("import('/command-parser.js')");
        const bbCat = { profielen: cat.alleProfielen(catBoom) };
        const g = bbZin.parseer('trap van 3,2 meter hoog en 1200 breed met trapbomen UPN 220, '
            + 'een bordes van 1200 na stap 8, glazen treden, stootborden, voet- en kopplaten, '
            + 'leuning rechts en een wandleuning links', null, bbCat);
        const p = g.params || {};
        check('een lange trapzin wordt helemaal begrepen',
            g.actie === 'trap' && p.hoogte === 3200 && p.breedte === 1200
            && p.bordesNa === 8 && p.bordesLengte === 1200
            && p.tredeMateriaal === 'glas' && p.tredeDikte === 32
            && p.stootborden && p.platen && p.wandleuning === 'links' && g.leuning === 'rechts'
            && g.profielen.boom && g.profielen.boom.label === 'UPN 220',
            g.fout || g.uitleg);
        // "maak hem 200 hoger" werd een H-balk HEM 200 als staander.
        const h = bbZin.parseer('maak hem 200 hoger', g, bbCat);
        check('"maak hem 200 hoger" is geen profiel HEM 200',
            h.params && h.params.hoogte === 3400 && !(h.profielen && h.profielen.staander),
            h.fout || h.uitleg);
        const hem = bbZin.parseer('balustrade van 2 meter met staanders HEM 200', null, bbCat);
        check('maar "staanders HEM 200" is het nog wel',
            hem.profielen && hem.profielen.staander && hem.profielen.staander.label === 'HEM 200',
            hem.uitleg);
        const hout = bbZin.parseer('trap van 3 meter hoog met houten treden', null, bbCat);
        check('"houten treden" vraagt welk hout in plaats van te raden',
            hout.params.tredeMateriaal === 'staal' && /Welk hout/.test(hout.genegeerd.join(' ')));
        const vrij = bbZin.parseer('trap van 3 meter hoog met leuning rechts en wandleuning', null, bbCat);
        check('een wandleuning zonder kant komt aan de kant zonder leuning',
            vrij.params.wandleuning === 'links', vrij.uitleg);
        const midden = bbZin.parseer('trap van 3 meter hoog met een bordes', null, bbCat);
        check('"met een bordes" zonder stap komt halverwege',
            midden.params.bordesNa === 8, midden.uitleg);
        const ov = bbZin.parseer('trap van 3 meter hoog met leuning links en 80 mm spijloverstek', null, bbCat);
        check('wat over de leuning gezegd wordt gaat mee naar de balustradematen',
            ov.leuningMaten && ov.leuningMaten.spijlOverstek === 80, JSON.stringify(ov.leuningMaten));
    }

    // En alles tegelijk, met een leuning, een UNP-boom en een bordes: de
    // zwaarste combinatie die het paneel kan maken.
    adMeet('trap met ALLES', await trapBouw.bouwTrap({ ...bbBordes, boomProfiel: unpRef,
        tredeMateriaal: 'eiken', tredeDikte: 40, stootborden: true, platen: true,
        wandleuning: 'links', afwerking: '7016' },
        { ...bbBal, staanderProfiel: chsP, handregelProfiel: chsP, spijlProfiel: fl205 }, 'rechts'));

    log('\n' + (failures === 0
        ? '*** ALLE CONTROLES GESLAAGD ***'
        : `*** ${failures} CONTROLE(S) MISLUKT ***`));
} catch (e) {
    failures++;
    log('FOUT: ' + (e && e.message ? e.message : String(e)));
    log(e && e.stack ? e.stack : '');
}
log('=== EINDE ===');
</script>
