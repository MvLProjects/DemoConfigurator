    check('en wel tot de onderkant van de handregel',
        Math.abs(dsLengtes[0] - (regels.STANDAARD.hoogte
            - regels.STANDAARD.handregelHoogte
            - regels.STANDAARD.voetplaatDikte)) < 1e-9,
        dsLengtes[0]);

    log('\n--- en de zager ziet het verstek in de stuklijst ---');
    // Punt 4 van de opdracht: de BOM moet blijven werken. Dit is meer dan dat -
    // het is winst. zaaghoeken() meet aan de ECHTE B-Rep, aan de langste rechte
    // rib en de kopvlakken daaromheen. Een verstek van 45 graden hoort daar dus
    // vanzelf uit te komen, zonder dat er iets over verstek in onderdelen.js
    // staat. Als dat niet gebeurt, zaagt de werkplaats hem recht af.
    const dsHoekBouw = await bouwMod.bouwPad(
        [[0, 0, 0], [1200, 0, 0], [1200, 1200, 0]], false,
        { ...regels.STANDAARD, maxStaanderAfstand: 2000, handregelOverstek: 100,
          vulraamwerk: 0, voetplaatDikte: 0 });
    const dsHoekRegels = dsHoekBouw.onderdelen.filter(u => u.deel.soort === 'handregel');
    for (const u of dsHoekRegels) {
        log(`   handregel ${u.deel.dx.toFixed(1)} mm: zaaghoeken `
            + `${ond.zaaghoekTekst(u.zaaghoeken)}`);
    }
    check('een handregel met verstek meldt een hoek van 45 graden',
        dsHoekRegels.some(u => u.zaaghoeken.some(h => Math.abs(h - 45) < 0.1)),
        dsHoekRegels.map(u => ond.zaaghoekTekst(u.zaaghoeken)).join(' | '));
    check('en aan het vrije eind met overstek nog steeds een rechte kop',
        dsHoekRegels.some(u => u.zaaghoeken.some(h => Math.abs(h - 90) < 0.1)),
        dsHoekRegels.map(u => ond.zaaghoekTekst(u.zaaghoeken)).join(' | '));

    // En een rechte leuning zonder hoeken hoort nog gewoon "recht" te melden.
    const dsRechtBouw = await bouwMod.bouwPad([[0, 0, 0], [1700, 0, 0]], false,
        { ...regels.STANDAARD, maxStaanderAfstand: 900, handregelOverstek: 100,
          vulraamwerk: 0, voetplaatDikte: 0 });
    const dsRechtRegel = dsRechtBouw.onderdelen.find(u => u.deel.soort === 'handregel');
    check('zonder hoek staat er nog gewoon "recht"',
        ond.zaaghoekTekst(dsRechtRegel.zaaghoeken) === 'recht',
        ond.zaaghoekTekst(dsRechtRegel.zaaghoeken));

    // ============ DEEL AC: stripbreedte uit de staanderbreedte ==============
    log('\n\n======== DEEL AC: stripbreedte ========\n');

    // Punt 2 van de tweede opdracht: de app stelt een passende stripbreedte
    // voor bij het gekozen staanderprofiel, de gebruiker kan hem met de hand
    // overrulen, en hij rekent mee als de profielmaten wijzigen.
    //
    // De schouder van 5 mm is een keuze, maar wel een die op de TWEE bekende
    // datapunten past: staander 50 geeft 40 (het voorbeeld uit de opdracht) en
    // staander 40 geeft 30 (de waarde die er al stond). Die twee liggen hier
    // vast, want zij zijn de reden dat het een schouder is en geen verhouding.

    log('--- de regel zelf ---');
    check('schouder 5 en minimum 10 staan in regels.json',
        regels.STRIP.schouder === 5 && regels.STRIP.minimum === 10,
        JSON.stringify(regels.STRIP));
    for (const [staander, verwacht, waarom] of [
        [50, 40, 'het voorbeeld uit de opdracht'],
        [40, 30, 'precies de waarde die er al stond'],
        [60, 50, ''],
        [100, 90, ''],
        [48.3, 38, 'CHS 48,3 — afgerond op hele millimeters'],
        [20, 10, 'op het minimum'],
        [15, 10, 'onder het minimum, dus afgekapt'],
        [10, 10, 'ook afgekapt, nooit smaller dan 10'],
    ]) {
        const uit = regels.stripBreedte(staander);
        check(`staander ${staander} geeft strip ${verwacht}`
            + (waarom ? ` — ${waarom}` : ''),
            uit === verwacht, uit);
    }
    // Waarom het GEEN verhouding is. Dit legt de afweging vast, zodat niemand
    // er later stilletjes 0,8 van maakt omdat dat "ook klopt".
    check('een verhouding van 0,8 zou de bestaande standaard wél breken',
        Math.round(40 * 0.8) !== regels.stripBreedte(40),
        `0,8 geeft ${Math.round(40 * 0.8)}, de schouder geeft ${regels.stripBreedte(40)}`);
    check('maar op het voorbeeld uit de opdracht geven ze hetzelfde',
        Math.round(50 * 0.8) === regels.stripBreedte(50),
        `allebei ${regels.stripBreedte(50)}`);

    log('\n--- en zo komt hij ook in de geometrie terecht ---');
    const acRegels = (maten) => padMod.padDelen([[0, 0, 0], [2000, 0, 0]], false,
        { ...regels.STANDAARD, maxStaanderAfstand: 6000, vulraamwerk: 1,
          ...maten }).delen.filter(d => d.soort === 'vulregel');
    const acBreedte = (maten) => {
        const r = acRegels(maten);
        return r.length ? r[0].dy : null;
    };

    check('standaard: staander 40 geeft strips van 30 — ongewijzigd',
        acBreedte({}) === 30, acBreedte({}));
    check('staander 50 geeft strips van 40, zonder iets anders te wijzigen',
        acBreedte({ staanderBreedte: 50 }) === 40,
        acBreedte({ staanderBreedte: 50 }));
    check('staander 100 geeft strips van 90',
        acBreedte({ staanderBreedte: 100 }) === 90,
        acBreedte({ staanderBreedte: 100 }));

    log('\n--- de rangorde: profiel > handmatig > de regel ---');
    check('handmatig 25 overruled de afgeleide 40',
        acBreedte({ staanderBreedte: 50, stripBreedte: 25 }) === 25,
        acBreedte({ staanderBreedte: 50, stripBreedte: 25 }));
    check('en 0 betekent "uit de staander afleiden", niet "breedte 0"',
        acBreedte({ staanderBreedte: 50, stripBreedte: 0 }) === 40,
        acBreedte({ staanderBreedte: 50, stripBreedte: 0 }));
    // Een regelprofiel gaat voor op allebei. De catalogus legt de breedte langs
    // X en de hoogte langs Y; een regel ligt plat, dus de HOOGTE van het
    // profiel wordt de diepte van de strip. Fl 30x6 is dus 30 diep.
    const acProfielBreedte = acBreedte({
        staanderBreedte: 50, stripBreedte: 25, regelProfiel: fl306 });
    log(`staander 50 + handmatig 25 + profiel Fl 30x6 -> ${acProfielBreedte} mm`);
    check('een gekozen regelprofiel gaat voor op allebei',
        Math.abs(acProfielBreedte - fl306.boxSize[1]) < 1e-9,
        `${acProfielBreedte} tegenover ${fl306.boxSize[1]} uit het manifest`);

    // DE LETTERLIJKE EIS uit de opdracht: "de aansluiting rekent automatisch
    // opnieuw als de profielmaten wijzigen". Dus niet alleen bij een getypte
    // staanderbreedte maar ook bij een ander staanderPROFIEL.
    const acBuis = acBreedte({ staanderProfiel: chsP });
    const acKoker = acBreedte({ staanderProfiel: shsKoker });
    log(`staanderprofiel CHS 48,3 -> strip ${acBuis}; SHS 40x40x3 -> ${acKoker}`);
    check('een ander staanderPROFIEL geeft meteen een andere stripbreedte',
        acBuis === regels.stripBreedte(chsP.boxSize[0])
        && acKoker === regels.stripBreedte(40) && acBuis !== acKoker,
        `${acBuis} tegenover ${acKoker}`);

    log('\n--- de strip blijft smaller dan de staander, en ligt er MIDDEN op ---');
    // Dat is waar de hele regel voor is. Over een reeks staandermaten heen
    // gemeten, niet op één geval: de strip mag nooit breder zijn dan de paal,
    // en zijn hart moet samenvallen met dat van de paal.
    //
    // Hier stond "zijn voorkant moet samenvallen met die van de paal". Dat was
    // de oude opzet, waarin het hele vulveld tegen de voorkant werd geduwd. Op
    // een ronde paal gaf dat een vulveld dat 14 mm uit het hart stond en er
    // scheef uitzag; een vlakke strip tegen een cilinder levert ook geen
    // gelijkliggend vlak op. Zie vulveldHoek in pad.js.
    let acTeBreed = 0, acNietVlak = 0, acGevallen = 0;
    for (const staanderBreedte of [15, 20, 25, 30, 40, 50, 60, 80, 100, 150]) {
        const maten = { ...regels.STANDAARD, maxStaanderAfstand: 6000,
            vulraamwerk: 1, staanderBreedte };
        if (regels.valideer(maten).length) continue;
        acGevallen++;
        const delen = padMod.padDelen([[0, 0, 0], [2000, 0, 0]], false, maten).delen;
        const strip = delen.find(d => d.soort === 'vulregel');
        const staander = delen.find(d => d.soort === 'staander');
        if (strip.dy > staanderBreedte + 1e-9) acTeBreed++;
        // Het HART van beide, langs de dwarsrichting van het pad (de y-as).
        const stripHart = strip.oorsprong[1] + strip.dy / 2;
        const staanderHart = staander.oorsprong[1] + staanderBreedte / 2;
        if (Math.abs(stripHart - staanderHart) > 1e-9) acNietVlak++;
    }
    log(`${acGevallen} staandermaten nagelopen`);
    check('geen enkele strip is breder dan zijn staander', acTeBreed === 0,
        `${acTeBreed} van ${acGevallen}`);
    check('en bij elke maat ligt de strip MIDDEN op de staander',
        acNietVlak === 0, `${acNietVlak} van ${acGevallen}`);

    log('\n--- en het paneel toont wat er gebouwd wordt ---');
    // Niet opnieuw uitgerekend in main.js maar uit padDelen zelf, zodat het
    // voorbeeld niet iets anders kan beweren dan de geometrie.
    const acVeld = padMod.padDelen([[0, 0, 0], [2000, 0, 0]], false,
        { ...regels.STANDAARD, maxStaanderAfstand: 6000, vulraamwerk: 1,
          staanderBreedte: 50 }).velden[0];
    check('het veld meldt de stripbreedte die er gebouwd wordt',
        acVeld.stripBreedte === 40, acVeld.stripBreedte);
    const acZonderRaam = padMod.padDelen([[0, 0, 0], [2000, 0, 0]], false,
        { ...regels.STANDAARD, maxStaanderAfstand: 6000, vulraamwerk: 0 }).velden[0];
    check('zonder vulraamwerk meldt hij null in plaats van een getal',
        acZonderRaam.stripBreedte === null, String(acZonderRaam.stripBreedte));

    // En in het echte scherm. Het veld moet bestaan, 0 moeten tonen, en het
    // vak Berekend moet de afgeleide maat laten zien.
    const acVeldEl = doc.getElementById('p_stripBreedte');
    const acStripEl = doc.getElementById('a_strip');
    check('het paneel heeft een veld stripbreedte', !!acVeldEl);
    check('en het staat op 0, dus op "uit de staander afleiden"',
        !!acVeldEl && acVeldEl.valueAsNumber === 0,
        acVeldEl ? acVeldEl.value : '(geen veld)');
    // GEEN vast getal verwachten. Eerdere delen van deze zelftest kiezen in het
    // echte scherm profielen, en op dit punt staat er een CHS 48,3 als staander
    // - dus leidt de app 38 af en geen 30. Dat is juist goed: een gekozen
    // profiel gaat voor op het getypte veld. Wat hier te bewijzen valt, is dat
    // de WIRING werkt; de regel zelf is hierboven exact nagelopen.
    const acAuto = acStripEl ? acStripEl.textContent : '';
    const acAutoMm = parseFloat(acAuto.replace(',', '.'));
    log(`Berekend leidt nu ${acAuto} af`);
    check('Berekend toont een afgeleide maat in millimeters',
        /\d+([,.]\d+)? mm/.test(acAuto), acAuto);
    check('en die maat is een uitkomst van de regel',
        regels.stripBreedte(acAutoMm + 2 * regels.STRIP.schouder) === acAutoMm,
        `${acAutoMm} hoort bij staander ${acAutoMm + 2 * regels.STRIP.schouder}`);

    // Met de hand overrulen, en terug. Dit is wat de opdracht vraagt: de
    // gebruiker kan de voorgestelde maat overschrijven, en 0 zet hem terug op
    // automatisch. Tijdens het typen, zonder op een knop te drukken.
    acVeldEl.value = '25';
    acVeldEl.dispatchEvent(new win.Event('input', { bubbles: true }));
    await sleep(60);
    log(`handmatig 25 ingevuld -> Berekend zegt ${acStripEl.textContent}`);
    check('een handmatige 25 komt meteen in Berekend terecht',
        /25([,.]0)? mm/.test(acStripEl.textContent), acStripEl.textContent);
    acVeldEl.value = '0';
    acVeldEl.dispatchEvent(new win.Event('input', { bubbles: true }));
    await sleep(60);
    check('en 0 zet hem terug op de afgeleide maat',
        acStripEl.textContent === acAuto,
        `${acStripEl.textContent} tegenover ${acAuto}`);

    // ============ DEEL AD: ALLES tegen ALLES ================================
    log('\n\n======== DEEL AD: geen staal op twee plekken ========\n');

    // DIT DEEL BESTAAT OMDAT DE ZELFTEST EEN GAT HAD, en dat gat heeft een
    // echte fout doorgelaten tot op het scherm van de gebruiker.
    //
    // Deel Z meet staander-tegen-handregel en handregel-tegen-handregel. Die
    // stonden op nul, en daar is toen "geen overlap" van gemaakt. Maar de
    // SPIJLEN waren nooit gemeten en een TRAP al helemaal niet. Op een trap
    // staken de spijlen dwars door de bovenregel heen: 10 453 mm3 over 60
    // paren, plus 2 310 mm3 staander-in-vulregel. Op een vlakke leuning was er
    // niets van te zien, want daar liggen de regels horizontaal.
    //
    // Daarom hier geen keuze meer welke paren interessant zijn: ELK paar
    // soorten tegen ELK ander paar, op een reeks modellen waar een helling in
    // zit. Een nieuw onderdeel wordt vanzelf meegenomen.
    const adOc = await api.initOcct();
    const adSolids = (vorm) => {
        const uit = [];
        const v = new adOc.TopExp_Explorer_2(vorm,
            adOc.TopAbs_ShapeEnum.TopAbs_SOLID, adOc.TopAbs_ShapeEnum.TopAbs_SHAPE);
        for (; v.More(); v.Next()) uit.push(adOc.TopoDS.Solid_1(v.Current()));
        v.delete();
        return uit;
    };
    const adSamen = (a, b) => {
        const c = new adOc.BRepAlgoAPI_Common_3(a, b,
            new adOc.Message_ProgressRange_1());
        c.Build(new adOc.Message_ProgressRange_1());
        const g = new adOc.GProp_GProps_1();
        adOc.BRepGProp.VolumeProperties_1(c.Shape(), g, false, false, false);
        const m = g.Mass(); g.delete(); return m;
    };

    /**
     * De omhullende doos van een solid, met een beetje speling.
     *
     * Voorfilter: twee delen waarvan de DOZEN elkaar niet raken kunnen elkaar
     * zeker niet snijden. Dat scheelt hier het overgrote deel van de booleaanse
     * sneden - zonder die filter liep dit deel in de minuten in plaats van in
     * seconden, en een zelftest die niemand afwacht is geen zelftest.
     */
    const adDoos = (vorm) => {
        const d = new adOc.Bnd_Box_1();
        adOc.BRepBndLib.Add(vorm, d, false);
        const a = d.CornerMin(), b = d.CornerMax();
        const uit = [a.X(), a.Y(), a.Z(), b.X(), b.Y(), b.Z()];
        d.delete();
        return uit;
    };
    const adRaken = (p, q) => p[0] <= q[3] && q[0] <= p[3]
                           && p[1] <= q[4] && q[1] <= p[4]
                           && p[2] <= q[5] && q[2] <= p[5];

    /** Elk paar solids tegen elkaar, opgeteld per paar SOORTEN. */
    const adMeet = (naam, r, negeer = []) => {
        const lijst = adSolids(r.shape);
        // Bij een trap staat de trap zelf vóór de leuning in de compound.
        const verschuiving = lijst.length - r.delen.length;
        const met = r.delen.map((d, i) => ({ d, s: lijst[i + verschuiving] }))
            .filter(x => x.s)
            .map(x => ({ ...x, doos: adDoos(x.s) }));
        const paren = new Map();
        for (let i = 0; i < met.length; i++) {
            for (let j = i + 1; j < met.length; j++) {
                if (!adRaken(met[i].doos, met[j].doos)) continue;
                const v = adSamen(met[i].s, met[j].s);
                if (v < 1e-6) continue;
                const sl = [met[i].d.soort, met[j].d.soort].sort().join(' ∩ ');
                paren.set(sl, (paren.get(sl) || 0) + v);
            }
        }
        const erg = [...paren.entries()].filter(([s]) => !negeer.includes(s));
        const tekst = erg.length
            ? erg.map(([s, v]) => `${s} ${v.toFixed(1)} mm3`).join('; ')
            : 'niets';
        log(`   ${naam.padEnd(26)}: ${tekst}`);
        check(`${naam}: nergens staal op twee plekken`, erg.length === 0, tekst);
    };

    const adMaten = { ...regels.STANDAARD, handregelOverstek: 0,
        staanderProfiel: chsP, handregelProfiel: chsP, spijlProfiel: fl205 };

    for (const [naam, punten, rondom] of [
        ['vlak', [[0, 0, 0], [1700, 0, 0]], false],
        ['helling 1:2', [[0, 0, 0], [1600, 0, 800]], false],
        ['helling 3:4', [[0, 0, 0], [1600, 0, 1200]], false],
        ['trap naar bordes', [[0, 0, 0], [1200, 0, 900], [2400, 0, 900]], false],
        ['bordes naar trap', [[0, 0, 0], [1200, 0, 0], [2400, 0, 900]], false],
        ['hoek 90 graden', [[0, 0, 0], [1200, 0, 0], [1200, 1200, 0]], false],
        ['gesloten vierkant', [[0, 0, 0], [1200, 0, 0], [1200, 1200, 0],
                               [0, 1200, 0]], true],
    ]) {
        adMeet(naam, await bouwMod.bouwPad(punten, rondom, adMaten));
    }

    // Met uitklinken aan is het een andere vorm, dus apart nalopen.
    adMeet('helling 1:2 + uitklinken',
        await bouwMod.bouwPad([[0, 0, 0], [1600, 0, 800]], false,
            { ...adMaten, uitklinken: 1 }));
    // En zonder vulraamwerk, want dan lopen de spijlen tot de handregel.
    adMeet('helling 1:2 zonder raamwerk',
        await bouwMod.bouwPad([[0, 0, 0], [1600, 0, 800]], false,
            { ...adMaten, vulraamwerk: 0 }));

    // EN EEN ECHTE TRAP. Dat is wat er op het scherm stond toen dit misging.
    //
    // `staander ∩ trapboom` stond hier als BEKEND PUNT: de leuningstaander dook
    // 4,15 mm in de zijkant van de trapboom, 136 mm3 per staander. De oorzaak
    // was dat build-trap.js de leuning opzij zette met het INVULVELD
    // staanderbreedte in plaats van met de echte profielmaat - bij CHS 48,3
    // tegenover een ingevulde 40 scheelt dat precies 4,15 mm. Opgelost; de
    // uitzondering is daarom weg en de trap moet nu net zo schoon zijn als de
    // rest.
    const adTrap = await trapBouw.bouwTrap({ ...trapRegels.STANDAARD },
        { ...adMaten }, 'links');
    adMeet('TRAP met leuning', adTrap);

    // En het oude punt expliciet op nul, zodat het niet kan terugsluipen.
    const adTrapSolids = adSolids(adTrap.shape);
    const adVerschuiving = adTrapSolids.length - adTrap.delen.length;
    const adMet = adTrap.delen.map((d, i) => ({ d, s: adTrapSolids[i + adVerschuiving] }))
        .filter(x => x.s)
        .map(x => ({ ...x, doos: adDoos(x.s) }));
    let adBoom = 0;
    for (const st of adMet.filter(x => x.d.soort === 'staander')) {
        for (const tb of adMet.filter(x => x.d.soort === 'trapboom')) {
            if (adRaken(st.doos, tb.doos)) adBoom += adSamen(st.s, tb.s);
        }
    }
    log(`   staander in trapboom: ${adBoom.toFixed(1)} mm3 (was 818)`);
    // Dezelfde drempel als adMeet hierboven: alles boven 1e-6 mm3 telt mee.
    check('de staander duikt NIET meer in de trapboom — hij staat ertegenaan',
        adBoom < 1e-6, `${adBoom.toFixed(4)} mm3`);

    // ============ DEEL AE: de verbindingen ==================================
    log('\n\n======== DEEL AE: verbindingen ========\n');

    // Stap 1 van de derde opdracht. padDelen wist altijd al welk deel tegen
    // welk komt en hóe - dat zit in elke berekening - maar gaf alleen een
    // platte lijst doosjes terug. Daarmee kan geen enkele controle weten dat
    // een handregel een staander hoort af te dekken.
    //
    // Hier verandert nog NIETS aan de geometrie. Dat is ook het eerste wat
    // hieronder gecontroleerd wordt.
    const aeTel = (v, soort) => v.filter(x => x.soort === soort).length;
    const aeBouw = (punten, gesloten, extra = {}) => padMod.padDelen(punten,
        gesloten, { ...regels.STANDAARD, maxStaanderAfstand: 850, ...extra });

    log('--- een recht stuk: 4 staanders, 3 velden, 1 handregel ---');
    const aeRecht = aeBouw([[0, 0, 0], [2000, 0, 0]], false);
    const aeV = aeRecht.verbindingen;
    const aeSoorten = [...new Set(aeV.map(x => x.soort))].sort();
    log(`   ${aeV.length} verbindingen, soorten: ${aeSoorten.join(', ')}`);

    check('er komen verbindingen uit padDelen', Array.isArray(aeV) && aeV.length > 0,
        aeV.length);
    check('elke verbinding wijst naar twee BESTAANDE delen',
        aeV.every(x => aeRecht.delen[x.a] && aeRecht.delen[x.b] && x.a !== x.b),
        aeV.filter(x => !aeRecht.delen[x.a] || !aeRecht.delen[x.b]).length + ' fout');
    check('elke verbinding heeft een soort, een punt en een richting',
        aeV.every(x => x.soort && Array.isArray(x.punt) && Array.isArray(x.richting)),
        aeSoorten.join(','));

    // DE CONTROLE DIE ERTOE DOET: de handregel ligt op ÉLKE staander die hij
    // overspant, dus ook op de tussenstaanders. Juist die werden gemist toen
    // de regel per veld gebouwd werd, en juist daar steekt een te smalle
    // handregel naast uit.
    const aeStaanders = aeRecht.delen.filter(d => d.soort === 'staander').length;
    check('vier staanders op dit pad', aeStaanders === 4, aeStaanders);
    check('de handregel ligt op ALLE VIER de staanders, niet alleen de buitenste',
        aeTel(aeV, 'ligt-op') === 4, aeTel(aeV, 'ligt-op'));
    check('elke staander staat op zijn voetplaat',
        aeTel(aeV, 'op-plaat') === 4, aeTel(aeV, 'op-plaat'));
    // 3 velden x 2 regels x 2 staanders
    check('elke vulregel komt aan twee kanten tegen een staander',
        aeTel(aeV, 'stomp') === 12, aeTel(aeV, 'stomp'));
    // elke spijl tussen de twee regels van zijn eigen veld
    const aeSpijlen = aeRecht.delen.filter(d => d.soort === 'spijl').length;
    check('elke spijl klemt tussen de twee regels van zijn veld',
        aeTel(aeV, 'tussen') === 2 * aeSpijlen,
        `${aeTel(aeV, 'tussen')} bij ${aeSpijlen} spijlen`);
    check('op een recht stuk is er geen verstek',
        aeTel(aeV, 'verstek') === 0, aeTel(aeV, 'verstek'));

    // NIETS MAG VERWEESD ZIJN. Een deel dat in geen enkele verbinding
    // voorkomt, hangt in de lucht - of er is een aansluiting vergeten op te
    // schrijven, en dan kan de controle hem ook niet nalopen.
    const aeGenoemd = new Set(aeV.flatMap(x => [x.a, x.b]));
    const aeWees = aeRecht.delen
        .map((d, i) => ({ d, i }))
        .filter(x => !aeGenoemd.has(x.i));
    check('geen enkel onderdeel hangt los: alles zit in minstens één verbinding',
        aeWees.length === 0,
        aeWees.map(x => `${x.d.soort} #${x.i}`).join(', ') || 'alles verbonden');

    log('\n--- een hoek en een gesloten ronde: verstek ---');
    const aeHoek = aeBouw([[0, 0, 0], [2000, 0, 0], [2000, 2000, 0]], false);
    check('een hoek geeft één verstekverbinding tussen twee handregels',
        aeTel(aeHoek.verbindingen, 'verstek') === 1,
        aeTel(aeHoek.verbindingen, 'verstek'));
    const aeRond = aeBouw([[0, 0, 0], [2000, 0, 0], [2000, 2000, 0],
                           [0, 2000, 0]], true);
    check('een gesloten ronde geeft er vier',
        aeTel(aeRond.verbindingen, 'verstek') === 4,
        aeTel(aeRond.verbindingen, 'verstek'));
    check('en de hoekstaander draagt twee handregels',
        aeTel(aeHoek.verbindingen, 'ligt-op') >= 2,
        aeTel(aeHoek.verbindingen, 'ligt-op'));

    log('\n--- de soort aansluiting volgt de instellingen ---');
    const aeKlink = aeBouw([[0, 0, 0], [2000, 0, 0]], false, { uitklinken: 1 });
    check('met uitklinken zakt de vulregel in een BED in plaats van stomp',
        aeTel(aeKlink.verbindingen, 'in-bed') === 12
        && aeTel(aeKlink.verbindingen, 'stomp') === 0,
        `in-bed ${aeTel(aeKlink.verbindingen, 'in-bed')}, `
        + `stomp ${aeTel(aeKlink.verbindingen, 'stomp')}`);
    const aeGeenRaam = aeBouw([[0, 0, 0], [2000, 0, 0]], false, { vulraamwerk: 0 });
    const aeGeenRaamSpijl = aeGeenRaam.delen.filter(d => d.soort === 'spijl').length;
    check('zonder vulraamwerk klemt de spijl tussen vloer en HANDREGEL',
        aeTel(aeGeenRaam.verbindingen, 'tussen') === aeGeenRaamSpijl,
        `${aeTel(aeGeenRaam.verbindingen, 'tussen')} bij ${aeGeenRaamSpijl} spijlen`);
    check('en er zijn dan geen vulregels om tegenaan te komen',

    // ============ DEEL AG: het productiepakket ==============================
    log('\n\n======== DEEL AG: productiepakket ========\n');

    const pdfMod = await win.eval("import('/pdf.js')");

    // Eerst zelf een model bouwen in plaats van leunen op wat een eerder deel

    // byte-positie, en daar MOET "<nummer> 0 obj" staan. Eén byte ernaast en
    // elke lezer weigert het bestand.
    const agCanvas = doc.createElement('canvas');
    agCanvas.width = 160; agCanvas.height = 120;
    const agCtx = agCanvas.getContext('2d');
    agCtx.fillStyle = '#ddd'; agCtx.fillRect(0, 0, 160, 120);

    const agPlaatje = pdfMod.jpegVanCanvas(agCanvas);

    const agPdf = pdfMod.maakPdf([{
        formaat: 'A3',
        tekeningen: [
            { soort: 'tekst', x: 20, y: 20, tekst: 'proef (met haakje)', vet: true },
            { soort: 'lijn', x1: 10, y1: 40, x2: 280, y2: 40 },
            { soort: 'rechthoek', x: 10, y: 50, b: 60, h: 30 },
            { soort: 'afbeelding', x: 100, y: 50, b: 80, h: 60, ...agPlaatje },
        ],
    }]);
    const agTekst = new TextDecoder('latin1').decode(agPdf);
    check('het is een PDF van begin tot eind',
        agTekst.startsWith('%PDF-') && agTekst.trimEnd().endsWith('%%EOF'));
    check('een haakje in de tekst wordt ontsnapt, anders breekt het bestand',
        agTekst.includes('(proef \\(met haakje\\))'),
        (agTekst.match(/\(proef[^\n]*/) || [])[0]);

    // LEESTEKENS. De lettertypen staan op WinAnsiEncoding, en daar heeft een
    // kastlijntje nummer 0x97 en een beletselteken 0x85. In Unicode staan ze
    // boven 255. Werd daar niet op omgezet, dan stond er op het blad letterlijk
    // "NIET OP SCHAAL ? maten in mm" en een ? achter elke afgekapte naam.
    const agProefTekst = 'a—b…c’d é × °';
    const agLeesteken = pdfMod.maakPdf([{ formaat: 'A4', tekeningen: [
        { soort: 'tekst', x: 10, y: 10, tekst: agProefTekst },
    ] }]);
    // NAAR DE RUWE BYTES KIJKEN, niet naar een omgezette tekst. TextDecoder
    // ('latin1') is in de webstandaard een alias voor windows-1252 en zet 0x97
    // keurig terug om naar een kastlijntje - dus een controle op de omgezette
    // tekst slaagt ook als er iets heel anders in het bestand staat.
    let agLtOp = -1;
    for (let i = 0; i < agLeesteken.length - 2; i++) {
        if (agLeesteken[i] === 0x28 && agLeesteken[i + 1] === 0x61) { agLtOp = i + 1; break; }
    }
    const agBytes = [...agLeesteken.slice(agLtOp, agLtOp + agProefTekst.length)];
    check('elk teken wordt precies één byte — geen UTF-8 in de stroom',
        agLtOp > 0 && agBytes.length === agProefTekst.length
        && agLeesteken[agLtOp + agProefTekst.length] === 0x29,
        agBytes.map(b => b.toString(16)).join(' '));
    check('een kastlijntje wordt 0x97', agBytes[1] === 0x97,
        agBytes[1] && agBytes[1].toString(16));
    check('een beletselteken wordt 0x85', agBytes[3] === 0x85);
    check('een krulaanhalingsteken wordt 0x92', agBytes[5] === 0x92);
    // a — b … c ’ d _ é _ × _ °   →  é op 8, × op 10, ° op 12
    check('en wat al in Latin-1 zit houdt zijn eigen nummer: é × °',
        agBytes[8] === 0xE9 && agBytes[10] === 0xD7 && agBytes[12] === 0xB0,
        [agBytes[8], agBytes[10], agBytes[12]].map(b => b && b.toString(16)).join(' '));
    check('er staat nergens een vraagteken: niets is weggevallen',
        !agBytes.includes(0x3F));

    /** Loopt de kruisverwijzingstabel na. Geeft het aantal missers terug. */
    const agXrefMissers = (bytes) => {
        const s = new TextDecoder('latin1').decode(bytes);
        const m = /startxref\s+(\d+)/.exec(s);
        if (!m) return -1;
        const xref = Number(m[1]);
        if (s.slice(xref, xref + 4) !== 'xref') return -1;
        const aantal = Number(/xref\s+0 (\d+)\s/.exec(s.slice(xref))[1]);
        // De eerste ingang is de verplichte VRIJE ingang voor object 0; de
        // ingang van object i staat dus op i x 20. Daar ging deze controle
        // eerst de mist in, en dat zag er precies uit als een kapot bestand.
        const start = xref + s.slice(xref).indexOf('\n',
            s.slice(xref).indexOf('\n') + 1) + 1;
        if (s.slice(start, start + 20) !== '0000000000 65535 f \n') return -1;
        let mis = 0;
        for (let i = 1; i < aantal; i++) {
            const pos = Number(s.slice(start + i * 20, start + i * 20 + 10));
            if (s.slice(pos, pos + `${i} 0 obj`.length) !== `${i} 0 obj`) mis++;
        }
        return mis;
    };
    check('alle verwijzingen wijzen naar hun eigen object',
        agXrefMissers(agPdf) === 0, agXrefMissers(agPdf) + ' fout');
    // De /Length van een stroom is waarmee een lezer hem terugvindt.
    let agStroomMis = 0, agStromen = 0;
    for (const s of agTekst.matchAll(/\/Length (\d+) >>\s*stream\r?\n/g)) {
        agStromen++;
        const eind = s.index + s[0].length + Number(s[1]);
        if (agTekst.slice(eind, eind + 11) !== '\nendstream\n') agStroomMis++;
    }
    check(`de lengte van alle ${agStromen} stromen klopt`, agStroomMis === 0,
        agStroomMis);
    const agWaar = [...agPdf].findIndex((w, i) => w === 0xFF
        && agPdf[i + 1] === 0xD8 && agPdf[i + 2] === agPlaatje.jpeg[2]);
    check('de JPEG zit er byte voor byte ongewijzigd in',
        agWaar >= 0 && agPlaatje.jpeg.every((w, k) => agPdf[agWaar + k] === w),
        agWaar < 0 ? 'niet gevonden' : 'op ' + agWaar);

    log('\n--- 2. de DXF van een plaatdeel ---');
    const agOnderdelen = mainMod.laatsteOnderdelenNu() || [];
    const agPlaat = agOnderdelen.find(u => u.deel.soort === 'voetplaat');
    check('het laatst gebouwde model heeft een voetplaat', !!agPlaat,
        agOnderdelen.map(u => u.deel.soort).join(', '));
    const agDxf = agPlaat && dxfMod.maakDxf(agPlaat.deel);
    check('er komt een DXF uit', !!agDxf && agDxf.length > 50,
        agDxf && agDxf.length + ' tekens');
    check('met een ENTITIES-sectie en een EOF',
        !!agDxf && agDxf.startsWith('0\nSECTION\n2\nENTITIES')
        && agDxf.trimEnd().endsWith('EOF'));
    const agLijnen = (agDxf.match(/^LINE$/gm) || []).length;
    const agCirkels = (agDxf.match(/^CIRCLE$/gm) || []).length;
    check('vier lijnen voor de omtrek en twee cirkels voor de boutgaten',
        agLijnen === 4 && agCirkels === 2, `${agLijnen} lijnen, ${agCirkels} cirkels`);
    // Eigen lagen: veel snijbesturingen werken laag voor laag, en je wilt de
    // gaten vóór de buitenomtrek. Valt het deel er eerst uit, dan verschuift
    // het en staan de gaten scheef.
    check('gaten en omtrek staan op een eigen laag',
        agDxf.includes('GATEN') && agDxf.includes('OMTREK'));
    // DE MATEN KOMEN UIT HET ONDERDEEL, niet uit een herberekening.
    const agX = [...agDxf.matchAll(/^10\n(-?[\d.]+)$/gm)].map(m => Number(m[1]));
    check('de omtrek is precies zo breed als de plaat',
        Math.abs(Math.max(...agX) - agPlaat.deel.dx) < 0.01,
        `${Math.max(...agX)} tegenover ${agPlaat.deel.dx}`);
    check('een PROFIEL levert GEEN dxf op — dat wordt gezaagd, niet gesneden',
        dxfMod.maakDxf(agOnderdelen.find(u => u.deel.soort === 'staander').deel)
        === null);

    log('\n--- 3. de vier aanzichten ---');
    const agBeelden = mainMod.AANZICHTEN.map(a => {
        const beeld = mainMod.rendersAanzicht(a.richting, 500, 350);
        return beeld ? { naam: a.naam, ...beeld } : null;
    });
    log('   ' + agBeelden.map(b => b ? `${b.naam} ${b.jpeg.length}B` : 'MISLUKT')
        .join(', '));
    check('vier aanzichten, allemaal met een JPEG',
        agBeelden.every(b => b && b.jpeg.length > 500),
        agBeelden.map(b => b && b.jpeg.length).join(', '));
    // Vier keer hetzelfde zou betekenen dat de camera niet draait - en bij het
    // BOVENaanzicht kijkt hij langs zijn eigen omhoog-as, wat zonder
    // tegenmaatregel NaN en een leeg beeld geeft.
    check('ze verschillen van elkaar: de camera draait echt',
        new Set(agBeelden.map(b => b && b.jpeg.length)).size > 1);
    // En het beeld moet daarna staan zoals het stond, anders lijkt het alsof
    // de exportknop het model heeft verplaatst.
    const agCanvasEl = doc.querySelector('canvas');
    check('het canvas heeft daarna weer zijn eigen formaat',
        agCanvasEl.width > 100 && agCanvasEl.height > 100,
        `${agCanvasEl.width}x${agCanvasEl.height}`);

    log('\n--- 4. het productieblad ---');
    const agBom = agOnderdelen.map(ond.bomRegel);
    const agBlad = prodMod.maakProductieblad({
        formaat: 'A3', aanzichten: agBeelden.filter(Boolean), bom: agBom,
        titel: { bedrijf: 'MvL Progress', opdracht: 'zelftest', nummer: 'T-001',
                 omschrijving: 'Balustrade', getekend: 'test', datum: '13-10-2026' },
    });
    const agBladTekst = new TextDecoder('latin1').decode(agBlad);
    check('het blad is A3 liggend',
        /MediaBox \[0 0 1190\.5\d 841\.8\d\]/.test(agBladTekst),
        (agBladTekst.match(/MediaBox \[[^\]]+\]/) || [])[0]);
    // ÉÉN afbeelding, en dat is een wijziging. Er stonden er vier - voor, zij,
    // boven en isometrisch - maar sinds de getekende samenstelling in het
    // pakket zit lieten die precies hetzelfde zien. Wat een render wél kan en
    // een lijntekening niet, is kleur en materiaal tonen; daarvoor is één
    // beeld genoeg.
    check('er staat één afbeelding op, niet vier',
        (agBladTekst.match(/\/Subtype \/Image/g) || []).length === 1,
        (agBladTekst.match(/\/Subtype \/Image/g) || []).length);
    check('en het is het isometrische beeld dat kleur laat zien',
        agBladTekst.includes('(Zo ziet het eruit)'));
    check('het titelblok staat erop', agBladTekst.includes('T-001'));
    // DIT MOET EROP STAAN. Het beeld is gerenderd, geen geprojecteerde
    // tekening: de maten in de stuklijst kloppen, maar wat je met een liniaal
    // op het plaatje meet niet. Een afbeelding waar iemand op gaat meten
    // terwijl dat niet mag is gevaarlijker dan geen afbeelding.
    check('en de waarschuwing dat het beeld niet op schaal is',
        /niet op schaal/.test(agBladTekst)
        && /niet opmeten/.test(agBladTekst));
    check('de verwijzingen kloppen ook in dit grotere bestand',
        agXrefMissers(agBlad) === 0, agXrefMissers(agBlad) + ' fout');

    log('\n--- 5. het pakket en de ZIP ---');
    const agPakket = await mainMod.maakProductiepakket(() => {});
    log('   ' + agPakket.map(b => b.naam).join(', '));
    check('de STEP van het geheel zit erin',
        agPakket.some(b => b.naam === 'balustrade.stp'));
    check('een STEP per uniek onderdeel',
        agPakket.filter(b => b.naam.startsWith('step/')).length
        === agOnderdelen.length,
        agPakket.filter(b => b.naam.startsWith('step/')).length);
    check('een DXF voor elk plaatdeel',
        agPakket.filter(b => b.naam.startsWith('dxf/')).length > 0,
        agPakket.filter(b => b.naam.startsWith('dxf/')).length);
    check('het productieblad en de stuklijst',
        agPakket.some(b => b.naam === 'productieblad.pdf')
        && agPakket.some(b => b.naam === 'bom.csv'));
    // DE KOPPELING is waar een pakket om draait: zonder dat moet de ontvanger
    // uitzoeken welk bestand bij welke regel hoort.
    const agCsv = agPakket.find(b => b.naam === 'bom.csv').data;
    const agEersteDxf = agPakket.find(b => b.naam.startsWith('dxf/'));
    const agNr = agEersteDxf.naam.match(/(\d{3})/)[1];
    check('de nummers van DXF, STEP en stuklijst horen bij hetzelfde stuk staal',
        agPakket.some(b => b.naam === `step/onderdeel_${agNr}.stp`)
        && agCsv.includes(`\n${agNr};`), `onderdeel_${agNr}`);

    const agZip = zipMod.maakZip(agPakket);
    log(`   ZIP: ${(agZip.length / 1024).toFixed(0)} kB, ${agPakket.length} bestanden`);
    check('de ZIP begint met PK', agZip[0] === 0x50 && agZip[1] === 0x4B);
    const agDv = new DataView(agZip.buffer, agZip.byteOffset);
    const agEind = agZip.length - 22;
    check('het einde van de centrale map staat op zijn plek',
        agDv.getUint32(agEind, true) === 0x06054b50);
    const agAantal = agDv.getUint16(agEind + 10, true);
    check('de ZIP noemt evenveel bestanden als erin gestopt zijn',
        agAantal === agPakket.length, `${agAantal} tegenover ${agPakket.length}`);
    // DE CONTROLE DIE ERTOE DOET: een uitpakker leest de centrale map, niet de
    // lokale ingangen. Klopt daar één positie niet, dan is de ZIP onbruikbaar.
    let agPos = agDv.getUint32(agEind + 16, true), agMis = 0;
    for (let i = 0; i < agAantal; i++) {
        if (agDv.getUint32(agPos, true) !== 0x02014b50) { agMis++; break; }
        if (agDv.getUint32(agDv.getUint32(agPos + 42, true), true) !== 0x04034b50) {
            agMis++;
        }
        agPos += 46 + agDv.getUint16(agPos + 28, true)
               + agDv.getUint16(agPos + 30, true) + agDv.getUint16(agPos + 32, true);
    }
    check('elke ingang in de centrale map wijst naar een echte lokale ingang',
        agMis === 0, `${agMis} fout`);
    // CRC32 is wat een uitpakker gebruikt om te zeggen "beschadigd".
    check('het controlegetal van een lege invoer is 0',
        zipMod.crc32(new Uint8Array(0)) === 0, zipMod.crc32(new Uint8Array(0)));
    check('en van "123456789" de bekende waarde 0xCBF43926',
        zipMod.crc32(new TextEncoder().encode('123456789')) === 0xCBF43926,
        zipMod.crc32(new TextEncoder().encode('123456789')).toString(16));

    check('het hele pakket maken geeft geen enkele fout in de console',
        errors.length === agVoor, errors.slice(agVoor).join(' | '));

    // ============ DEEL AH: de zaaglijst =====================================
    log('\n\n======== DEEL AH: zaaglijst ========\n');

    // De stuklijst zegt WAT je nodig hebt, de zaaglijst HOE je het uit stangen
    // zaagt. Eerst met verzonnen stukken, zodat elk getal met de hand na te
    // rekenen is; daarna op het echte model.
    const zl = await win.eval("import('/zaaglijst.js')");
    const ahZaag = { stanglengte: 6000, snede: 3 };

    /** Een stuk om in te pakken, zonder profiel uit de catalogus. */
    const ahStuk = (nummer, aantal, lengte, profiel = null) => ({
        nummer, aantal, zaaghoeken: [90, 90],
        deel: { soort: 'proef', dx: 50, dy: 50, dz: lengte, lengteAs: 'z',
                zaaglengte: lengte, ...(profiel ? { profiel } : {}) },
    });

    log('--- 1. met de hand na te rekenen ---');
    // 3 x 2000 in stangen van 6000 met een snede van 3. Twee stukken passen
    // samen (2000 + 3 + 2000 = 4003), drie niet (6006 > 6000). Dus TWEE
    // stangen, en dat is de hele reden dat de zaagsnede meegerekend wordt: op
    // het oog zou 3 x 2000 precies in een stang van 6000 gaan.
    const ahDrie = zl.maakZaaglijst([ahStuk(1, 3, 2000)], ahZaag);
    check('drie stukken van 2000 passen niet in een stang van 6000',
        ahDrie.aantalStangen === 2, ahDrie.aantalStangen + ' stangen');
    check('de eerste stang heeft twee stukken en een snede',
        ahDrie.groepen[0].stangen[0].stukken.length === 2
        && ahDrie.groepen[0].stangen[0].zaagverlies === 3,
        `${ahDrie.groepen[0].stangen[0].stukken.length} stukken, `
        + `${ahDrie.groepen[0].stangen[0].zaagverlies} mm snede`);
    check('en houdt 1997 mm over', ahDrie.groepen[0].stangen[0].rest === 1997,
        ahDrie.groepen[0].stangen[0].rest);
    check('de tweede stang heeft een stuk en GEEN snede — een stang heeft al '
        + 'een recht einde',
        ahDrie.groepen[0].stangen[1].zaagverlies === 0,
        ahDrie.groepen[0].stangen[1].zaagverlies);
    check('netto staal 6000, zaagverlies 3, rest 5997',
        ahDrie.netLengte === 6000 && ahDrie.zaagverlies === 3
        && ahDrie.restLengte === 5997,
        `${ahDrie.netLengte} / ${ahDrie.zaagverlies} / ${ahDrie.restLengte}`);
    check('afval is precies de helft: één stang wordt nauwelijks gebruikt',
        Math.abs(ahDrie.afvalDeel - 5997 / 12000 - 3 / 12000) < 1e-9,
        (ahDrie.afvalDeel * 100).toFixed(2) + '%');

    // HET GEVAL DAT DE REKENWIJZE BEPAALDE. Een stuk van precies een hele stang
    // kost GEEN snede. Werd er een snede per stuk gerekend in plaats van per
    // tussenruimte, dan paste dit stuk in geen enkele stang en kwam er een
    // negatieve rest uit.
    const ahHeel = zl.maakZaaglijst([ahStuk(1, 1, 6000)], ahZaag);
    check('een stuk van precies 6000 past in één stang',
        ahHeel.aantalStangen === 1 && ahHeel.teLang.length === 0,
        `${ahHeel.aantalStangen} stangen, ${ahHeel.teLang.length} te lang`);
    check('met rest 0 en niet met een negatieve rest',
        ahHeel.groepen[0].stangen[0].rest === 0,
        ahHeel.groepen[0].stangen[0].rest);

    const ahLang = zl.maakZaaglijst([ahStuk(7, 2, 6001)], ahZaag);
    check('een stuk van 6001 wordt GEMELD en niet stil ingepland',
        ahLang.teLang.length === 2 && ahLang.aantalStangen === 0,
        `${ahLang.teLang.length} gemeld, ${ahLang.aantalStangen} stangen`);
    check('de melding noemt het positienummer',
        ahLang.teLang[0].positie === '007', ahLang.teLang[0].positie);

    const ahLeeg = zl.maakZaaglijst([], ahZaag);
    check('een leeg model geeft een lege lijst en geen fout',
        ahLeeg.aantalStangen === 0 && ahLeeg.groepen.length === 0);
    check('en afval 0 in plaats van NaN',
        ahLeeg.afvalDeel === 0, ahLeeg.afvalDeel);

    let ahGooide = false;
    try { zl.maakZaaglijst([ahStuk(1, 1, 100)], { stanglengte: 0, snede: 3 }); }
    catch (e) { ahGooide = true; }
    check('een stanglengte van 0 wordt geweigerd in plaats van oneindig '
        + 'doorlopen', ahGooide);

    log('\n--- 2. waarop stukken bij elkaar mogen ---');
    const ahProfA = { bestand: 'X/a.stp', englishLabel: 'CHS 48,3x2,6',
                      catalogus: { GEW: 2.93 } };
    const ahProfB = { bestand: 'X/b.stp', englishLabel: 'FL 20x5',
                      catalogus: { GEW: 0.785 } };
    const ahTwee = zl.maakZaaglijst(
        [ahStuk(1, 1, 1000, ahProfA), ahStuk(2, 1, 1000, ahProfB)], ahZaag);
    check('twee verschillende profielen worden twee groepen',
        ahTwee.groepen.length === 2, ahTwee.groepen.length);
    check('en dus twee stangen, want je zaagt geen strip uit een buis',
        ahTwee.aantalStangen === 2, ahTwee.aantalStangen);

    // AFWERKING IS GEEN SCHEIDING: poedercoaten gebeurt na het zagen.
    const ahRal1 = ahStuk(1, 1, 1000, ahProfA);
    const ahRal2 = ahStuk(2, 1, 1000, ahProfA);
    ahRal1.deel.afwerking = '9005';
    const ahRal = zl.maakZaaglijst([ahRal1, ahRal2], ahZaag);
    check('twee kleuren uit hetzelfde profiel komen uit ÉÉN stang',

    check('het gewicht komt uit de catalogus: 2 m CHS 48,3 x 2,93 kg/m',
        Math.abs(ahRal.groepen[0].gewicht - 5.86) < 0.01,
        ahRal.groepen[0].gewicht + ' kg');
    check('en zonder catalogusprofiel is het gewicht null, niet 0',
        ahDrie.groepen[0].gewicht === null, ahDrie.groepen[0].gewicht);
    check('dat wordt ook gemeld: het totaalgewicht is dan niet volledig',
        ahDrie.gewichtVolledig === false && ahRal.gewichtVolledig === true);

    log('\n--- 3. regels die altijd moeten gelden ---');
    // Op een reeks lengtes die niets met elkaar te maken hebben, zodat het niet
    // één gelukkig geval is.
    const ahWillekeur = [1234, 2500, 780, 5999, 345, 2500, 1234, 99, 4321, 600]
        .map((lengte, i) => ahStuk(i + 1, (i % 3) + 1, lengte));
    const ahVeel = zl.maakZaaglijst(ahWillekeur, ahZaag);
    log(`   ${ahVeel.aantalStukken} stukken in ${ahVeel.aantalStangen} stangen, `
        + `${(ahVeel.afvalDeel * 100).toFixed(1)}% afval`);

    // DE OPTELSOM. Per stang: staal + zaagverlies + rest = de hele stang. Gaat
    // dit mis, dan is er materiaal uit de lucht komen vallen of verdwenen.
    let ahSomMis = 0, ahStangen = 0, ahTeVol = 0;
    for (const g of ahVeel.groepen) {
        for (const s of g.stangen) {
            ahStangen++;

            if (s.rest < 0) ahTeVol++;
        }
    }
    check(`staal + zaagverlies + rest is in alle ${ahStangen} stangen precies `
        + 'de stanglengte', ahSomMis === 0, ahSomMis + ' fout');
    check('geen enkele stang is overvol', ahTeVol === 0, ahTeVol);

    const ahVerwacht = ahWillekeur.reduce((n, u) => n + u.aantal, 0);
    check('geen stuk kwijt en geen stuk dubbel',
        ahVeel.aantalStukken + ahVeel.teLang.length === ahVerwacht,
        `${ahVeel.aantalStukken} + ${ahVeel.teLang.length} tegenover ${ahVerwacht}`);
    // De ondergrens: minder stangen dan het staal erin past kan niet. Dit is
    // geen bewijs dat de indeling de beste is - dat belooft de module ook niet.
    check('het aantal stangen zit niet onder de rekenkundige ondergrens',
        ahVeel.aantalStangen >= Math.ceil(ahVeel.netLengte / 6000),
        `${ahVeel.aantalStangen} tegenover minstens `
        + Math.ceil(ahVeel.netLengte / 6000));
    // Dezelfde invoer moet dezelfde uitvoer geven, anders is er in een test
    // niets vast te leggen en verandert een pakket zonder dat je iets wijzigt.
    check('twee keer dezelfde invoer geeft exact dezelfde indeling',
        JSON.stringify(zl.maakZaaglijst(ahWillekeur, ahZaag))
        === JSON.stringify(ahVeel));

    log('\n--- 4. op het echte model ---');
    // Deel AG heeft hier net een balustrade gebouwd; deze controles gaan over
    // dat model. Staat er niets, dan is dat een fout en geen reden om over te
    // slaan.
    const ahOnderdelen = mainMod.laatsteOnderdelenNu() || [];
    check('er staat een model om de zaaglijst van te meten',
        ahOnderdelen.length > 0, ahOnderdelen.length + ' onderdelen');
    const ahEcht = mainMod.laatsteZaaglijstNu();
    check('de app heeft er zelf een zaaglijst van gemaakt', !!ahEcht);
    log(`   ${ahEcht.aantalStangen} stangen, ${ahEcht.aantalStukken} stukken, `
        + `${(ahEcht.afvalDeel * 100).toFixed(1)}% afval, `
        + `${ahEcht.gewicht} kg staal`);
    for (const g of ahEcht.groepen) {
        log(`     ${g.profiel}: ${g.aantalStangen} stang(en), `
            + `${g.aantalStukken} stuk(ken)`);
    }

    // DE CONTROLE WAAR HET OM GAAT. Een onderdeel wordt gezaagd of gesneden,
    // nooit beide en nooit geen van beide. Zou er een derde geval bijkomen -
    // een deel zonder profiel en zonder omtrek - dan valt het hier uit de boot
    // en staat het in geen van de twee lijsten van het productiepakket.
    const ahGezaagd = ahOnderdelen.filter(u => zl.wordtGezaagd(u.deel));
    const ahGesneden = ahOnderdelen.filter(u => dxfMod.maakDxf(u.deel) !== null);
    const ahBeide = ahOnderdelen.filter(u =>
        zl.wordtGezaagd(u.deel) && dxfMod.maakDxf(u.deel) !== null);
    check('elk onderdeel zit in precies één van de twee lijsten',
        ahGezaagd.length + ahGesneden.length === ahOnderdelen.length
        && ahBeide.length === 0,
        `${ahGezaagd.length} gezaagd + ${ahGesneden.length} gesneden `
        + `= ${ahOnderdelen.length}, ${ahBeide.length} in beide`);
    check('de zaaglijst noemt precies de gezaagde onderdelen',
        ahEcht.aantalStukken
        === ahGezaagd.reduce((n, u) => n + u.aantal, 0) - ahEcht.teLang.length,
        `${ahEcht.aantalStukken} tegenover `
        + ahGezaagd.reduce((n, u) => n + u.aantal, 0));
    check('en de platen staan er apart bij, zodat niemand ze mist',
        ahEcht.platen.length === ahGesneden.length,
        `${ahEcht.platen.length} tegenover ${ahGesneden.length}`);

    log('\n--- 5. op het scherm en in de CSV ---');
    check('het vak is zichtbaar', doc.getElementById('zaaglijstVak')
        .style.display === 'block');
    const ahBalken = [...doc.querySelectorAll('#zaaglijstInhoud .zlBalk')];
    check('er staat een balk per stang',
        ahBalken.length === ahEcht.aantalStangen,
        `${ahBalken.length} tegenover ${ahEcht.aantalStangen}`);
    // De balken staan OP SCHAAL van de stanglengte. Telden de breedtes niet op
    // tot wat er werkelijk in de stang ligt, dan zou het beeld gunstiger
    // uitvallen dan de getallen - precies wat een balk niet mag doen.
    let ahBreedteMis = 0;
    ahBalken.forEach((balk, i) => {
        const som = [...balk.children].reduce((n, el) =>
            n + parseFloat(el.style.width), 0);
        const stang = ahEcht.groepen.flatMap(g => g.stangen)[i];
        const hoort = stang.gebruikt / ahEcht.stanglengte * 100;

    });
    check('elke balk is precies zo vol als de stang werkelijk is',

    check('de aannames staan erbij, zodat niemand het voor gemeten aanziet',

    const ahCsv = zl.zaaglijstAlsCsv(ahEcht);

    // Alleen over de GETALLEN die deze module schrijft, niet over de hele regel:

    const ahGetallen = ahRegels

    // ELKE KNOP IN HET VAK WAAR HIJ HOORT. Bij het invoegen van de zaaglijst

        }

    log('\n--- 6. het zaagplan op papier ---');
    // Hetzelfde productieblad, nu mét zaaglijst: dan hoort er een tweede blad

    const ahBlad = prodMod.maakProductieblad({
        formaat: 'A3', aanzichten: agBeelden.filter(Boolean), bom: agBom,

    const ahBladTekst = new TextDecoder('latin1').decode(ahBlad);
    check('het blad met zaagplan telt TWEE pagina\'s',

    check('het tweede blad heet Zaagplan', ahBladTekst.includes('(Zaagplan)'));
    check('en de bladen zijn genummerd',

    // DIT IS HET VERSCHIL MET BLAD 1. Daar staat "niet op schaal", want het

    // te tekenen - dus daar hoort een schaal te staan en geen waarschuwing.

    const ahSchaal = /lengte op schaal 1:(\d+)/.exec(ahBladTekst);
    check('en blad 2 noemt een echte lengteschaal', !!ahSchaal,

    // Narekenen: de tekenbreedte is bladbreedte min de marges, min de ruimte

    // de balken niet op de schaal die eronder gedrukt staat - en dan mag je er
    // niet op meten terwijl het blad zegt van wel.
    const ahTekenB = 420 - 10 - 26 - (10 + 9);
    check('die schaal klopt met de breedte waarop de stangen getekend zijn',
        Number(ahSchaal[1]) === Math.round(ahEcht.stanglengte / ahTekenB),
        `1:${ahSchaal[1]} tegenover 1:${Math.round(ahEcht.stanglengte / ahTekenB)}`);
    check('de doorsnede wordt er uitdrukkelijk buiten gehouden',
        /doorsnede niet op schaal/.test(ahBladTekst));
    check('elke stang staat als balk op het blad',
        (ahBladTekst.match(/ re S/g) || []).length
        >= ahEcht.aantalStangen + ahEcht.aantalStukken,
        (ahBladTekst.match(/ re S/g) || []).length + ' rechthoeken');
    check('de verwijzingen kloppen ook in dit blad van twee pagina\'s',
        agXrefMissers(ahBlad) === 0, agXrefMissers(ahBlad) + ' fout');

    // Een stuk dat niet past moet op het BLAD staan, niet alleen op het scherm:
    // het papier gaat naar de werkplaats, het scherm niet.
    const ahBladLang = prodMod.maakProductieblad({
        formaat: 'A3', aanzichten: [], bom: [],
        zaaglijst: zl.maakZaaglijst([ahStuk(7, 1, 6001)], ahZaag),
        titel: { omschrijving: 'proef' },
    });
    check('een stuk dat niet in een stang past staat op het zaagblad',
        /PAST NIET IN EEN STANG/.test(new TextDecoder('latin1').decode(ahBladLang)));

    log('\n--- 7. in het productiepakket ---');
    const ahPakket = await mainMod.maakProductiepakket(() => {});
    check('de zaaglijst zit als CSV in het pakket',
        ahPakket.some(b => b.naam === 'zaaglijst.csv'),

    const ahPdf = ahPakket.find(b => b.naam === 'productieblad.pdf').data;
    check('en het productieblad in het pakket heeft het zaagplan erbij',
        new TextDecoder('latin1').decode(ahPdf).includes('(Zaagplan)'));
    // Niet "één meer dan in deel AG": dat pakket is met dezelfde knop gemaakt

    const ahHoortIn = ['balustrade.stp', 'productieblad.pdf', 'bom.csv',
                       'zaaglijst.csv'];
    const ahMist = ahHoortIn.filter(n => !ahPakket.some(b => b.naam === n));
    check('het pakket bevat alle vier de vaste bestanden',

    check('plus een STEP per onderdeel en een DXF per plaatdeel, en niets anders',
        ahPakket.length === ahHoortIn.length + ahOnderdelen.length

        `${ahPakket.length} tegenover ${ahHoortIn.length} + `
        + `${ahOnderdelen.length} + ${ahEcht.platen.length}`);

    check('de hele zaaglijst geeft geen fout in de console',
        errors.length === agVoor, errors.slice(agVoor).join(' | '));

    // ============ DEEL AI: de 2D-projectie ==================================
    log('\n\n======== DEEL AI: projectie (hidden line removal) ========\n');

    // De aanzichten op het productieblad zijn RENDERS en daar kan geen schaal
    // op. Dit is de meetkunde die daarvoor in de plaats kan komen: echte
    // geprojecteerde lijnen, met onderscheid tussen wat je ziet en wat
    // erachter zit. Getoetst op vormen waarvan het antwoord van tevoren
    // vastligt - een doos van 100 x 60 x 40 heeft van voren geen mening.
    const pr = await win.eval("import('/projectie.js')");
    const aiOc = await api.initOcct();

    log('--- 1. een doos, waar het antwoord van vaststaat ---');
    const aiDoos = new aiOc.BRepPrimAPI_MakeBox_2(100, 60, 40).Shape();
    const aiVoor = pr.projecteer(aiOc, aiDoos, [0, -1, 0]);
    check('van voren: vier zichtbare lijnen, het voorvlak',
        aiVoor.zichtbaar.length === 4, aiVoor.zichtbaar.length);
    // DIT IS DE CONTROLE DIE BEWIJST DAT HLR ECHT DRAAIT. Zou het algoritme
    // niets wegstrepen, dan kwam alles als zichtbaar terug en was dit 0.
    check('en vier verborgen lijnen, het achtervlak',
        aiVoor.verborgen.length === 4, aiVoor.verborgen.length);
    // Twaalf ribben, waarvan er vier in de kijkrichting liggen en dus op een
    // punt projecteren. Die horen weg te vallen, niet als streepje te blijven.
    check('de vier ribben in de kijkrichting vallen weg, niet 12 maar 8 lijnen',
        aiVoor.zichtbaar.length + aiVoor.verborgen.length === 8);
    check('de omvatting is precies 100 x 40 mm — de hoogte 60 zit in de diepte',
        Math.abs(aiVoor.breedte - 100) < 1e-6 && Math.abs(aiVoor.hoogte - 40) < 1e-6,
        `${aiVoor.breedte} x ${aiVoor.hoogte}`);
    const aiHoeken = new Set(aiVoor.zichtbaar.flat()
        .map(([x, y]) => `${x.toFixed(3)},${y.toFixed(3)}`));
    check('met de hoekpunten op (0,0) en (100,40)',
        aiHoeken.has('0.000,0.000') && aiHoeken.has('100.000,40.000'),
        [...aiHoeken].join(' '));
    // Het achtervlak ligt in de projectie exact over het voorvlak heen.
    const aiAchter = pr.projecteer(aiOc, aiDoos, [0, -1, 0]);
    check('de verborgen lijnen beslaan dezelfde rechthoek als de zichtbare',
        Math.abs(Math.min(...aiAchter.verborgen.flat().map(p => p[0]))) < 1e-6
        && Math.abs(Math.max(...aiAchter.verborgen.flat().map(p => p[1])) - 40) < 1e-6);

    log('\n--- 2. draaien doet wat het hoort ---');
    const aiBoven = pr.projecteer(aiOc, aiDoos, [0, 0, 1]);
    check('van boven zie je 100 x 60', Math.abs(aiBoven.breedte - 100) < 1e-6
        && Math.abs(aiBoven.hoogte - 60) < 1e-6,
        `${aiBoven.breedte} x ${aiBoven.hoogte}`);
    // Recht van boven valt "omhoog op het blad" samen met de kijkrichting. In
    // de viewer gaf datzelfde geval NaN en een leeg beeld; hier is het
    // opgevangen door dan het noorden omhoog te leggen.
    check('en dat levert geen NaN op, ondanks de samenvallende assen',
        aiBoven.zichtbaar.flat().every(([x, y]) =>
            Number.isFinite(x) && Number.isFinite(y)));
    const aiZij = pr.projecteer(aiOc, aiDoos, [1, 0, 0]);
    check('van opzij zie je 60 x 40', Math.abs(aiZij.breedte - 60) < 1e-6
        && Math.abs(aiZij.hoogte - 40) < 1e-6,
        `${aiZij.breedte} x ${aiZij.hoogte}`);

    log('\n--- 3. een ronde vorm ---');
    // Een buis is het gewone geval in dit project. De omtreklijn van een
    // cilinder is geen rib van het model: hij bestaat alleen in deze
    // kijkrichting, en HLR hoort hem er zelf bij te verzinnen.
    const aiCil = new aiOc.BRepPrimAPI_MakeCylinder_1(20, 100).Shape();
    const aiC = pr.projecteer(aiOc, aiCil, [0, -1, 0]);
    check('een cilinder r20 h100 is van opzij 40 breed en 100 hoog',
        Math.abs(aiC.breedte - 40) < 0.01 && Math.abs(aiC.hoogte - 100) < 0.01,
        `${aiC.breedte.toFixed(2)} x ${aiC.hoogte.toFixed(2)}`);
    check('en levert lijnen op die er in het model niet als rib in zitten',
        aiC.zichtbaar.length >= 3, aiC.zichtbaar.length);

    log('\n--- 4. op de echte balustrade ---');
    const aiVorm = api.huidigeVorm();
    check('er staat een vorm om te projecteren', !!aiVorm && !aiVorm.IsNull());
    const aiB = pr.projecteer(aiOc, aiVorm, [0, -1, 0]);
    log(`   vooraanzicht: ${aiB.zichtbaar.length} zichtbaar, `
        + `${aiB.verborgen.length} verborgen, `
        + `${aiB.breedte.toFixed(0)} x ${aiB.hoogte.toFixed(0)} mm`);
    // DE MAAT MOET KLOPPEN MET HET MODEL, anders is de schaal straks een leugen.
    // 2000 lang plus twee keer 100 overstek van de handregel = 2200.
    const aiDoos3d = new aiOc.Bnd_Box_1();
    aiOc.BRepBndLib.Add(aiVorm, aiDoos3d, false);
    const aiHoek1 = aiDoos3d.CornerMin(), aiHoek2 = aiDoos3d.CornerMax();
    check('de breedte van de projectie is de breedte van het model',
        Math.abs(aiB.breedte - (aiHoek2.X() - aiHoek1.X())) < 0.01,
        `${aiB.breedte.toFixed(2)} tegenover `
        + `${(aiHoek2.X() - aiHoek1.X()).toFixed(2)}`);
    check('en de hoogte ook',
        Math.abs(aiB.hoogte - (aiHoek2.Z() - aiHoek1.Z())) < 0.01,
        `${aiB.hoogte.toFixed(2)} tegenover `
        + `${(aiHoek2.Z() - aiHoek1.Z()).toFixed(2)}`);
    check('er zijn verborgen lijnen: de spijlen achter de voorste staan erin',
        aiB.verborgen.length > 0, aiB.verborgen.length);
    check('twee keer projecteren geeft hetzelfde aantal lijnen',
        pr.projecteer(aiOc, aiVorm, [0, -1, 0]).zichtbaar.length
        === aiB.zichtbaar.length);

    log('\n--- 5. wat er fout kan ---');
    let aiGooide = false;
    try { pr.projecteer(aiOc, aiDoos, [0, 0, 0]); } catch (e) { aiGooide = true; }
    check('een richting van nul wordt geweigerd in plaats van NaN op te leveren',
        aiGooide);
    check('de projectie geeft geen fout in de console',
        errors.length === agVoor, errors.slice(agVoor).join(' | '));

    // ============ DEEL AJ: polylijnen en streepjeslijnen ====================
    log('\n\n======== DEEL AJ: polylijnen in de PDF ========\n');

    // Een geprojecteerde tekening bestaat uit honderden lijnstukken, waarvan de
    // verborgen gestreept horen te zijn. De PDF-schrijver kende alleen losse
    // rechte lijnen met een vaste dikte.
    const ajBlad = (tekeningen) => {
        const b = pdfMod.maakPdf([{ formaat: 'A4', tekeningen }]);
        const s = new TextDecoder('latin1').decode(b);
        const m = /\/Length \d+ >>\s*stream\r?\n([\s\S]*?)\nendstream/.exec(s);
        return m[1];
    };

    log('--- 1. de punten komen op de goede plek ---');
    // A4 liggend is 297 x 210 mm. Een punt op 10 mm van boven ligt dus op
    // 200 mm van onder, en PDF rekent in punten: 200 x 72/25,4 = 566,93.
    const ajStroom = ajBlad([{ soort: 'polylijn',
        punten: [[0, 10], [100, 10], [100, 20]] }]);
    log('   ' + ajStroom.split('\n').join(' | '));
    check('drie punten geven één m en twee l',
        (ajStroom.match(/ m\b/g) || []).length === 1
        && (ajStroom.match(/ l\b/g) || []).length === 2,
        ajStroom);
    check('en worden met één S getrokken, niet drie',
        (ajStroom.match(/ S\b/g) || []).length === 1);
    check('x = 0 mm wordt 0,00 punt', /\b0\.00 566\.93 m/.test(ajStroom),
        (ajStroom.match(/[\d.]+ [\d.]+ m/) || [])[0]);
    check('de y wordt omgeklapt: 10 mm van BOVEN is 566,93 punt van ONDER',
        ajStroom.includes('566.93'),
        (ajStroom.match(/[\d.]+ [\d.]+ m/) || [])[0]);
    check('100 mm wordt 283,46 punt', ajStroom.includes('283.46'));
    // 20 mm van boven = 190 van onder = 538,58 punt.
    check('en het laatste punt staat 10 mm lager', ajStroom.includes('538.58'));

    check('minder dan twee punten levert geen half pad op',
        !/ m\b/.test(ajBlad([{ soort: 'polylijn', punten: [[5, 5]] }]))
        && !/ m\b/.test(ajBlad([{ soort: 'polylijn', punten: [] }])));
    check('gesloten voegt een h toe, zodat de omtrek dichtloopt',
        / h S/.test(ajBlad([{ soort: 'polylijn', gesloten: true,
            punten: [[0, 0], [10, 0], [10, 10]] }])));

    log('\n--- 2. de streepjeslijn ---');
    const ajStreep = ajBlad([
        { soort: 'polylijn', punten: [[0, 0], [10, 0]] },
        { soort: 'polylijn', punten: [[0, 5], [10, 5]], streep: [2, 1.5] },
        { soort: 'polylijn', punten: [[0, 9], [10, 9]] },
    ]);
    log('   ' + ajStreep.split('\n').join(' | '));
    // 2 mm = 5,67 punt, 1,5 mm = 4,25 punt.
    check('een streepjespatroon komt in punten in de stroom',
        ajStreep.includes('[5.67 4.25] 0 d'),
        (ajStreep.match(/\[[^\]]*\] 0 d/g) || []).join(' '));
    // DIT IS DE VALKUIL: zonder terugzetten loopt het streepjespatroon door
    // over alles wat erna komt, en dan is de hele tekening gestreept.
    check('en wordt daarna teruggezet naar doorgetrokken',
        ajStreep.lastIndexOf('[] 0 d') > ajStreep.indexOf('[5.67 4.25] 0 d'));

    log('\n--- 3. de stijl wordt niet bij elke lijn herhaald ---');
    const ajVeel = ajBlad(Array.from({ length: 50 }, (_, i) =>
        ({ soort: 'polylijn', punten: [[0, i], [10, i]], dik: 0.25 })));
    check('vijftig lijnen van dezelfde dikte zetten die dikte één keer',
        (ajVeel.match(/ w\b/g) || []).length === 1,
        (ajVeel.match(/ w\b/g) || []).length + ' keer');
    check('en het streepjespatroon ook één keer',
        (ajVeel.match(/\] 0 d/g) || []).length === 1);
    const ajWissel = ajBlad([
        { soort: 'polylijn', punten: [[0, 0], [1, 0]], dik: 0.25 },
        { soort: 'polylijn', punten: [[0, 1], [1, 1]], dik: 0.5 },
        { soort: 'polylijn', punten: [[0, 2], [1, 2]], dik: 0.25 },
    ]);
    check('maar bij een andere dikte wél opnieuw',
        (ajWissel.match(/ w\b/g) || []).length === 3,
        (ajWissel.match(/[\d.]+ w/g) || []).join(' '));

    log('\n--- 4. de bestaande soorten doen nog hetzelfde ---');
    // Lijn en rechthoek zetten hun dikte eerst zélf; nu gaat dat door dezelfde

    const ajGemengd = ajBlad([
        { soort: 'rechthoek', x: 0, y: 0, b: 10, h: 10, dik: 0.8 },

    ]);
    check('een polylijn na een rechthoek krijgt zijn eigen dikte',

        (ajGemengd.match(/[\d.]+ w/g) || []).join(' '));
    check('en een dikte van 0 wordt 0,20: niet "zo dun als de printer kan"',
        /0\.20 w/.test(ajBlad([{ soort: 'lijn', x1: 0, y1: 0, x2: 1, y2: 1,
                                 dik: 0 }])));
    check('de PDF met polylijnen is nog steeds geldig',
        agXrefMissers(pdfMod.maakPdf([{ formaat: 'A3', tekeningen: [
            { soort: 'polylijn', punten: [[0, 0], [10, 10], [20, 0]] },
            { soort: 'tekst', x: 5, y: 5, tekst: 'proef' },
        ] }])) === 0);

    log('\n--- 5. een echte projectie op papier ---');
    // 320 lijnstukken uit het vooraanzicht van de balustrade. Niet om te
    // bewijzen dat het mooi is - dat ziet niemand hier - maar dat het past en
    // dat het bestand geldig blijft.
    const ajTekeningen = [
        ...aiB.zichtbaar.map(l => ({ soort: 'polylijn', punten: l, dik: 0.35 })),
        ...aiB.verborgen.map(l => ({ soort: 'polylijn', punten: l, dik: 0.18,
                                     streep: [2, 1.5] })),
    ];
    const ajEcht = pdfMod.maakPdf([{ formaat: 'A3', tekeningen: ajTekeningen }]);
    log(`   ${ajTekeningen.length} lijnen → ${(ajEcht.length / 1024).toFixed(0)} kB`);
    // Tellen in de STROOM en niet in het hele bestand: in de structuur eromheen
    // staat ook een hoofdletter S (/Subtype, /Size) en dan telt de controle mee
    // wat er niet bij hoort.
    const ajEchtStroom = /\/Length \d+ >>\s*stream\r?\n([\s\S]*?)\nendstream/
        .exec(new TextDecoder('latin1').decode(ajEcht))[1];
    check('alle lijnen staan erin',
        (ajEchtStroom.match(/ S\b/g) || []).length === ajTekeningen.length,
        (ajEchtStroom.match(/ S\b/g) || []).length);
    check('de zichtbare zijn dikker dan de verborgen',
        ajEchtStroom.includes('0.35 w') && ajEchtStroom.includes('0.18 w'));
    check('en de verborgen zijn gestreept', ajEchtStroom.includes('[5.67 4.25] 0 d'));
    check('en het bestand klopt nog', agXrefMissers(ajEcht) === 0);
    check('de polylijnen geven geen fout in de console',
        errors.length === agVoor, errors.slice(agVoor).join(' | '));

    // ============ DEEL AK: de werkplaatstekening ============================

    const akVakVan = (naam) => akBlad.tekeningen.find(o =>

    const akPunten = (o) =>
        o.soort === 'polylijn' ? o.punten
        : o.soort === 'lijn' ? [[o.x1, o.y1], [o.x2, o.y2]]
        : o.soort === 'rechthoek' ? [[o.x, o.y], [o.x + o.b, o.y + o.h]]
        : [[o.x, o.y]];
    // De getekende modellijnen: polylijnen zonder vulling. De pijlpunten van
    // een maatlijn zijn ook polylijnen, maar die zijn gevuld, en de maatlijnen
    // zelf zijn gewone lijnen. Zonder dit onderscheid zou de opmeting hieronder
    // de pijlpunten meerekenen en een te grote tekening meten.
    const akLijnen = akBlad.tekeningen.filter(o =>

    check('en alles staat binnen de 420 x 297 van een A3',

    log('\n--- 3. de maten op papier kloppen met het model ---');

    const akX = akVoorLijnen.flatMap(l => l.punten.map(p => p[0]));

    const akBreedPapier = Math.max(...akX) - Math.min(...akX);
    const akHoogPapier = Math.max(...akY) - Math.min(...akY);

    log('\n--- 4. wat er op het blad staat ---');

    check('maar niet bij het isometrische — daar staat dat je niet moet meten',

    check('op dit blad staat GEEN "niet op schaal" — hier mag je wel meten',

    check('de vier namen staan erop',
        ['Vooraanzicht', 'Zijaanzicht', 'Bovenaanzicht', 'Isometrisch']
            .every(n => akT.includes(`(${n})`)));
    check('en het is een geldige PDF', agXrefMissers(akPdf) === 0);

    log('\n--- 4b. de maatvoering ---');
    // DE MATEN KOMEN UIT DEZELFDE BRON als die in het 3D-beeld: maatvoering.js.
    // Stonden ze op twee plekken, dan zou het scherm op een dag iets anders

    const akMv = await win.eval("import('/maatvoering.js')");

    const akDefs = akMv.maatDefinities(akDelen, [0, 0, 0], [2200, 50, 1000], 0);
    log('   ' + akDefs.map(d => d.tekst || Math.round(d.waarde)).join(', '));
    check('maatDefinities levert de buitenmaten plus h.o.h. en doorgang',

    check('en geeft ze als zuivere getallen, niet als tekening',

    const akMaatBlad = tk.werkplaatsblad(aiOc, aiVorm,

    const akTeksten = akMaatBlad.tekeningen.filter(o => o.soort === 'tekst')

    check('de buitenmaten staan op het blad',

    // ELKE MAAT PRECIES ÉÉN KEER. Dezelfde maat in twee aanzichten is niet

    check('en elk precies één keer, niet in twee aanzichten',

    // GEEN DUIZENDTALSCHEIDING: "2.700" op een tekening kan gelezen worden als

    check('zonder duizendtalpunt in het getal',
        !akTeksten.some(s => /^\d{1,3}\.\d{3}$/.test(s)),

    check('de hoogte staat in het VOORaanzicht, niet in het bovenaanzicht',

    // De diepte is in het vooraanzicht de kijkrichting en projecteert daar op

    check('en de diepte niet in het vooraanzicht — daar valt hij samen met de '

    // De maatlijn moet op papier precies waarde / schaal lang zijn, anders

    const akPijlen = akMaatBlad.tekeningen.filter(o =>

    // EN HET BLAD ZEGT HET ERBIJ. Lijnen weglaten zonder het te melden is het

    check('en zegt erbij dat ze niet getekend zijn',

    log('\n--- 6. in het productiepakket ---');
    const akPakket = await mainMod.maakProductiepakket(() => {});
    const akBladPdf = akPakket.find(b => b.naam === 'productieblad.pdf').data;
    const akBladT = new TextDecoder('latin1').decode(akBladPdf);
    // Vier bladen: samenstelling, onderdelen, stuklijst, zaagplan. Vijf

    // onderdeelbladen het zijn hangt van de onderdelen af, dus dat getal komt
    // hier uit de tekening zelf en niet uit een aanname.
    const akBladen = (akBladT.match(/\/Type \/Page\b/g) || []).length;
    check('het productieblad telt minstens vier pagina\'s: samenstelling, '
        + 'onderdelen, stuklijst, zaagplan', akBladen >= 4, akBladen);
    check('en de paginaboom noemt datzelfde aantal',
        akBladT.includes(`/Count ${akBladen}`),
        (akBladT.match(/\/Count \d+/) || [])[0]);
    check('blad 1 is de samenstellingstekening',
        akBladT.includes('(Vooraanzicht)') && /\(schaal 1:\d+\)/.test(akBladT));
    check('daarna de onderdelenbladen',
        akBladT.includes('(Onderdelen)')
        && akBladT.includes('(elk stuk apart, met zijn eigen schaal en maten)'));
    check('dan de stuklijst met het beeld',
        akBladT.includes('(Stuklijst)') && akBladT.includes('(Zo ziet het eruit)'));
    check('en als laatste het zaagplan', akBladT.includes('(Zaagplan)'));
    // DE NUMMERING MOET DOORLOPEN. Dat is precies waar het eerder misging: de
    // samenstelling werd eerst getekend en moest het totaal rádén.
    const akNrs = (akBladT.match(/\(blad (\d+) van (\d+)\)/g) || []);
    check('en ze zijn doorlopend genummerd, met overal hetzelfde totaal',
        akNrs.length === akBladen
        && [...Array(akBladen).keys()].every(i =>
            akBladT.includes(`(blad ${i + 1} van ${akBladen})`)),
        akNrs.join(' '));
    check('de werkplaatstekening geeft geen fout in de console',
        errors.length === agVoor, errors.slice(agVoor).join(' | '));

    // ============ DEEL AL: de onderdelentekeningen ==========================
    log('\n\n======== DEEL AL: elk onderdeel apart ========\n');

    // Op de samenstelling zie je hoe het in elkaar zit, maar niet hoe je één
    // stuk maakt: de spijlen vallen samen en de staander zit achter de

    const alBladen = tk.onderdelenbladen(aiOc, ahOnderdelen, {
        formaat: 'A3', voorAantal: 1, naAantal: 2,
        titel: { omschrijving: 'Balustrade', nummer: 'T-004' },
    });
    log(`   ${ahOnderdelen.length} onderdelen op ${alBladen.length} blad(en)`);

    const alTotaal = 1 + alBladen.length + 2;
    const alNummers = alBladen.map((b, i) => b.tekeningen.some(o =>

    check('elk onderdeelblad draagt het juiste nummer van het hele pakket',
        alNummers.every(Boolean), alBladen.map(b =>
            (b.tekeningen.find(o => /^blad \d+ van/.test(o.tekst || '')) || {}).tekst)
            .join(' | '));

    const alOps = alBladen.flatMap(b => b.tekeningen);
    const alVakken = [...new Set(alOps.map(o => o.vak).filter(Boolean))];
    check('elk onderdeel heeft een eigen strook, precies één keer',
        alVakken.length === ahOnderdelen.length, alVakken.join(', '));
    // De stroken worden over de hoogte verdeeld in plaats van bovenaan
    // gestapeld: een blad dat bovenaan vol staat en onderaan leeg is ziet

    const alKaders = alBladen[0].tekeningen.filter(o =>

    if (alKaders.length >= 2) {
        const alGaten = alKaders.slice(1).map((k, i) =>

        check('de ruimte tussen de stroken is overal gelijk',

    log('\n--- 1. wat er per onderdeel op staat ---');
    const alTekst = alOps.filter(o => o.soort === 'tekst').map(o => o.tekst);

    // Het nummer met de naam, en het AANTAL als apart tekstelement ernaast.

        check(`${pos} noemt het aantal (${u.aantal}×), uitgelijnd in een eigen kolom`,

    // De voetplaat heeft twee boutgaten. Die staan niet apart getekend: HLR

    const alPlaat = ahOnderdelen.find(u => u.deel.soort === 'voetplaat');
    const alPlaatOps = alOps.filter(o => o.soort === 'polylijn' && !o.vul

    // Een cirkel wordt door de bemonstering een polylijn met veel punten; een
