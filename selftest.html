<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Zelftest edge-selectie</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>
<style>
    body { font-family: ui-monospace, Consolas, monospace; margin: 16px; }
    pre { font: inherit; }
    iframe { width: 900px; height: 600px; border: 1px solid #ccc; }
</style>
</head>
<body>
<pre id="out">bezig...</pre>
<iframe id="app" src="./index.html"></iframe>

<script type="module">
// Zelftest voor stap 3 van de PoC.
//
// Deel A draait de echte viewer in een iframe en klikt het hele beeld af.
// Deel B controleert daarna brep-edges.js rechtstreeks: komt de topologie die OCCT
// teruggeeft overeen met wat er letterlijk in sample/cube.stp staat, en is het
// aantoonbaar geen tessellatie.
//
// Deel B hergebruikt bewust de module-instantie VAN DE IFRAME (via win.eval). Twee
// losse OCCT-instanties van 50 MB in een tabblad lopen vast, en zo test deel B
// bovendien precies de instantie die de viewer zelf gebruikt.
//
// Draaien:  powershell -ExecutionPolicy Bypass -File serve.ps1
//           http://localhost:8000/selftest.html

const out = document.getElementById('out');
const log = (...a) => { out.textContent += a.join(' ') + '\n'; };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

let failures = 0;
const check = (name, ok, detail) => {
    if (!ok) failures++;
    log((ok ? '  OK   ' : '  FAIL ') + name + (detail !== undefined ? '  -> ' + detail : ''));
};

try {
    out.textContent = '';
    const THREE = await import('three');
    const bytes = new Uint8Array(await (await fetch('./sample/cube.stp')).arrayBuffer());

    // ======================= DEEL A: de echte viewer =======================
    log('======== DEEL A: viewer end-to-end ========\n');

    const frame = document.getElementById('app');
    if (frame.contentDocument.readyState !== 'complete') {
        await new Promise(r => frame.addEventListener('load', r, { once: true }));
    }
    const win = frame.contentWindow, doc = frame.contentDocument;

    const errors = [];
    // OrbitControls roept setPointerCapture aan; dat kan niet met kunstmatige
    // PointerEvents zonder echte pointer. Testartefact, geen viewerfout.
    const noise = /setPointerCapture/;
    win.addEventListener('error', e => { if (!noise.test(e.message)) errors.push(e.message); });
    win.console.error = (...a) => {
        const s = a.join(' '); if (!noise.test(s)) errors.push(s);
    };

    // Eerst OCCT laten laden, en daar ECHT op wachten. Wachten met een lus vol
    // setTimeout werkt hier niet: in een geautomatiseerde browser loopt de klok
    // versneld, dus zo'n lus is in een oogwenk op terwijl de 50 MB wasm nog
    // staat te compileren. Een promise heeft daar geen last van.
    const api = await win.eval("import('/brep-edges.js')");
    await api.initOcct();

    // Het startscherm staat ervoor en blokkeert alles eronder, net als bij een
    // gebruiker. Eerst de vraag beantwoorden; deel U controleert het scherm
    // zelf, hier moet het alleen weg.
    log('\n--- het startscherm ---');
    const startDlg = doc.getElementById('startDialoog');
    check('bij het openen staat het startscherm er', startDlg && startDlg.open,
        startDlg ? 'open=' + startDlg.open : '(niet gevonden)');
    // De begintekst stuurde de gebruiker eerst naar een STEP-bestand, terwijl
    // bouwen in het paneel het normale begin is. Hij hoort te zeggen wat je nú
    // moet doen, en mee te bewegen met de keuze uit het startscherm.
    check('de statusregel vraagt niet om een bestand',
        !/STEP-bestand/.test(doc.getElementById('status').textContent),
        doc.getElementById('status').textContent);
    doc.getElementById('startBalustrade').click();
    check('en is weg na een keuze', !startDlg.open, 'open=' + startDlg.open);
    check('de statusregel wijst naar de juiste knop',
        /Genereer balustrade/.test(doc.getElementById('status').textContent),
        doc.getElementById('status').textContent);

    const dt = new DataTransfer();
    dt.items.add(new File([bytes], 'cube.stp'));
    const input = doc.getElementById('file');
    input.files = dt.files;
    input.dispatchEvent(new Event('change'));

    const status = doc.getElementById('status');
    const edgeStatus = doc.getElementById('edgeStatus');
    for (let i = 0; i < 4000 && !/hoekpunten/.test(status.textContent); i++) await sleep(25);

    const loadStatus = status.textContent; // wordt zo door de kliks overschreven
    log('status na laden   :', loadStatus);
    check('viewer laadde zonder fouten', errors.length === 0, errors.join(' | '));
    // De getallen blijven, de vaktaal niet: hier stond "12 b-rep edges".
    check('status meldt 12 randen', /12 randen/.test(loadStatus), loadStatus);
    check('en geen vaktaal in de statusregel',
        !/b-rep|mesh|vertices|faces|OCCT/i.test(loadStatus), loadStatus);
    check('begintekst is "Geen rand geselecteerd"',
        edgeStatus.textContent === 'Geen rand geselecteerd', edgeStatus.textContent);

    const canvas = doc.querySelector('canvas');
    // EERST WACHTEN TOT DE CANVAS EEN MAAT HEEFT. Hij bestaat al voordat de
    // layout rond is, en met een maat van 0 loopt de veegslag hieronder nul keer
    // - dan lijkt het of er niets raakbaar is, terwijl de viewer niets mankeert.
    // Dat is een meetfout van de test. De maat gaat mee in de log, zodat een
    // volgende keer te zien is wat er stond in plaats van te moeten gokken.
    let rect = canvas.getBoundingClientRect();
    for (let i = 0; i < 400 && (rect.width < 50 || rect.height < 50); i++) {
        await sleep(25);
        rect = canvas.getBoundingClientRect();
    }
    log('canvas            :', Math.round(rect.width) + ' x ' + Math.round(rect.height));
    check('de canvas heeft een maat om op te klikken',
        rect.width >= 50 && rect.height >= 50,
        Math.round(rect.width) + ' x ' + Math.round(rect.height));

    const clickAt = (x, y) => {
        for (const type of ['pointerdown', 'pointerup']) {
            canvas.dispatchEvent(new PointerEvent(type,
                { clientX: x, clientY: y, bubbles: true, cancelable: true }));
        }
        return edgeStatus.textContent;
    };

    const hits = new Map();
    let faceClicks = 0;
    for (let py = rect.top + 4; py < rect.bottom - 4; py += 12) {
        for (let px = rect.left + 4; px < rect.right - 4; px += 12) {
            const m = /^Rand (\d+) geselecteerd$/.exec(clickAt(px, py));
            if (m) hits.set(+m[1], (hits.get(+m[1]) || 0) + 1);
            else if (/^Vlak \d+/.test(status.textContent)) faceClicks++;
        }
    }
    const found = [...hits.keys()].sort((a, b) => a - b);
    log('aangeklikte edges :', found.join(', '), `(${found.length} uniek)`);
    log('kliks op een vlak :', faceClicks, '\n');

    check('er is op edges geklikt', found.length > 0, found.length);
    // Vanuit een hoekstandpunt zijn precies 9 van de 12 ribben zichtbaar; de 3 aan
    // de achterkant horen NIET raakbaar te zijn, anders klopt de occlusiecontrole niet.
    check('precies de 9 zichtbare ribben zijn raakbaar', found.length === 9, found.length);
    check('alle ids liggen in 1..12', found.every(id => id >= 1 && id <= 12), found.join(','));
    check('face-selectie werkt nog', faceClicks > 0, faceClicks);

    clickAt(rect.left + 3, rect.bottom - 3);
    check('klik naast het model wist de randselectie',
        edgeStatus.textContent === 'Geen rand geselecteerd', edgeStatus.textContent);

    log('\n--- instellingen bewaren en terughalen ---');
    // Een maat veranderen, opslaan, iets anders invullen, en weer laden.
    const lengteVeld = doc.getElementById('p_lengte');
    const trapHoogteVeld = doc.getElementById('t_hoogte');
    const leuningKeuze = doc.getElementById('t_leuning');

    lengteVeld.value = 3456;
    trapHoogteVeld.value = 2750;
    leuningKeuze.value = 'links';
    lengteVeld.dispatchEvent(new Event('input', { bubbles: true }));
    trapHoogteVeld.dispatchEvent(new Event('input', { bubbles: true }));

    // De downloadstap onderscheppen, zodat er geen bestand op schijf belandt.
    let bewaard = null;
    const echteCreate = win.URL.createObjectURL;
    win.URL.createObjectURL = (blob) => { bewaard = blob; return 'blob:test'; };
    const echteClick = win.HTMLAnchorElement.prototype.click;
    win.HTMLAnchorElement.prototype.click = function () { /* niet downloaden */ };
    doc.getElementById('instelOpslaan').click();
    win.URL.createObjectURL = echteCreate;
    win.HTMLAnchorElement.prototype.click = echteClick;

    check('opslaan levert een bestand op', bewaard !== null);
    const opgeslagen = JSON.parse(await bewaard.text());
    check('de gewijzigde maten staan erin',
        opgeslagen.balustrade.lengte === 3456
        && opgeslagen.trap.hoogte === 2750
        && opgeslagen.leuning === 'links',
        JSON.stringify({ l: opgeslagen.balustrade.lengte,
                         h: opgeslagen.trap.hoogte, k: opgeslagen.leuning }));

    // Nu iets anders invullen en het bestand terugladen.
    lengteVeld.value = 1111;
    trapHoogteVeld.value = 1111;
    leuningKeuze.value = 'geen';
    const invoer = doc.getElementById('instelBestand');
    const dt2 = new DataTransfer();
    dt2.items.add(new File([JSON.stringify(opgeslagen)], 'instellingen.json',
        { type: 'application/json' }));
    invoer.files = dt2.files;
    invoer.dispatchEvent(new Event('change'));
    for (let i = 0; i < 200 && lengteVeld.valueAsNumber !== 3456; i++) await sleep(10);

    check('laden zet de maten terug',
        lengteVeld.valueAsNumber === 3456
        && trapHoogteVeld.valueAsNumber === 2750
        && leuningKeuze.value === 'links',
        `${lengteVeld.value} / ${trapHoogteVeld.value} / ${leuningKeuze.value}`);

    log('\n--- de knop Genereer trap, in de echte viewer ---');
    // Dit is de weg die geen enkele andere controle raakt: de knop indrukken en
    // kijken of er iets in beeld komt. Sinds de bouwers een OCCT-vorm teruggeven
    // in plaats van STEP-bytes gaat de viewer niet meer langs een bestand. Als
    // die korte weg stuk is, ziet de gebruiker het meteen en de tests niet -
    // tenzij hier.
    trapHoogteVeld.value = 1000;
    trapHoogteVeld.dispatchEvent(new Event('input', { bubbles: true }));
    leuningKeuze.value = 'beide';
    leuningKeuze.dispatchEvent(new Event('change', { bubbles: true }));

    const foutenVoorTrap = errors.length;
    doc.getElementById('genereerTrap').click();
    for (let i = 0; i < 2000 && !/treden|mislukt/i.test(status.textContent); i++) {
        await sleep(25);
    }
    log('status    :', status.textContent);

    check('de knop Genereer trap levert een trap op',
        /treden/.test(status.textContent), status.textContent);
    check('genereren gaf geen fouten in de console',
        errors.length === foutenVoorTrap, errors.slice(foutenVoorTrap).join(' | '));
    // De losse knop "STEP exporteren" in de bovenbalk is weg. Het
    // productiepakket onder Resultaat levert diezelfde STEP van het geheel én
    // een STEP per onderdeel, de DXF's en de stuklijst. Hier vastgelegd, zodat
    // hij niet ongemerkt terugkomt naast de knop die meer doet.
    check('er staat geen losse STEP-knop meer in de bovenbalk',
        doc.getElementById('exportStep') === null);
    check('het productiepakket is de weg naar buiten, ook voor een trap',
        !!doc.getElementById('productie'));

    const rijen = [...doc.getElementById('stuklijstTabel').querySelectorAll('tbody tr')];
    log('stuklijst :', rijen.length, 'regels');
    check('er staat een stuklijst in het paneel', rijen.length > 0, rijen.length);

    // Dit blok verdween eerst zodra je een trap genereerde: bouwTrap gaf geen
    // onderdelenlijst terug, dus er was niets om te tonen en niets om los te
    // exporteren. Een trap is net zo goed iets dat gemaakt moet worden.
    const ondRijen = [...doc.getElementById('onderdelenTabel')
        .querySelectorAll('tbody tr')];
    log('onderdelen:', ondRijen.length, 'unieke onderdelen in het paneel');
    check('ook een trap vult het blok Productieonderdelen',
        doc.getElementById('onderdelenVak').style.display !== 'none'
        && ondRijen.length > 0, ondRijen.length);
    check('en elk uniek onderdeel heeft zijn eigen STEP-knop',
        ondRijen.every(r => r.querySelector('button')),
        ondRijen.filter(r => !r.querySelector('button')).length + ' zonder knop');

    // De randen komen nu rechtstreeks uit de vorm, zonder STEP ertussen. Als die
    // weg stuk is, staat er wel een model in beeld maar valt er niets aan te
    // klikken. Dus: echt klikken.
    let geraakt = 0;
    for (let py = rect.top + 6; py < rect.bottom - 6; py += 9) {
        for (let px = rect.left + 6; px < rect.right - 6; px += 9) {
            if (/^Rand \d+ geselecteerd$/.test(clickAt(px, py))) { geraakt++; }
        }
    }
    check('de randen van de gegenereerde trap zijn aan te klikken', geraakt > 0, geraakt);

    // Wat in beeld staat moet ook zijn wat je exporteert. Het beeld komt uit
    // tessellateer(), het bestand uit schrijfStep() - twee wegen uit dezelfde
    // vorm. De stuklijst komt uit een derde bron: de beschrijving van de delen.
    const uitViewer = await api.exportStep();
    const heen = await api.readBrepEdges(uitViewer, 1000);
    // Kolommen: onderdeel | profiel | lengte | st
    const stuksInPaneel = rijen.reduce((s, tr) => s + Number(tr.cells[3].textContent), 0);
    log('export    :', JSON.stringify(heen.counts), '| stuklijst', stuksInPaneel, 'stuks');
    check('de export bevat evenveel solids als de stuklijst stuks noemt',
        heen.counts.SOLID === stuksInPaneel,
        `${heen.counts.SOLID} solids tegenover ${stuksInPaneel} stuks`);

    // ======================= DEEL B: brep-edges.js =========================
    log('\n\n======== DEEL B: b-rep topologie ========\n');

    // Dezelfde module-instantie als de viewer, dus dezelfde al geladen OCCT.
    const { readBrepEdges, countMeshEdges, laadStep, laadVorm, schrijfStep } = api;

    // Eén aanroep levert nu alles: driehoeken, randen en de maat van het model.
    const geladen = await laadStep(bytes);
    const meshResult = { meshes: geladen.meshes };
    const maxDim = geladen.maat;
    const edges = geladen.edges;
    const counts = geladen.counts;

    const box = new THREE.Box3();
    for (const m of meshResult.meshes) {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position',
            new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
        g.computeBoundingBox();
        box.union(g.boundingBox);
    }
    const size = box.getSize(new THREE.Vector3());
    log('bounding box uit de driehoeken:',
        JSON.stringify(size.toArray().map(v => +v.toFixed(2))));
    check('de driehoeken beslaan het hele model',
        Math.abs(Math.max(size.x, size.y, size.z) - maxDim) < 1e-6,
        `${Math.max(size.x, size.y, size.z)} tegenover ${maxDim} uit de b-rep`);

    log('topologie         :', JSON.stringify(counts), '\n');

    log('--- komt overeen met de inhoud van cube.stp ---');
    // Het bestand bevat letterlijk 6 ADVANCED_FACE, 12 EDGE_CURVE, 8 VERTEX_POINT.
    check('6 faces', counts.FACE === 6, counts.FACE);
    check('12 edges', counts.EDGE === 12, counts.EDGE);
    check('8 vertices', counts.VERTEX === 8, counts.VERTEX);
    check('12 polylines opgeleverd', edges.length === 12, edges.length);

    log('\n--- dit is topologie, geen tessellatie ---');
    const meshEdgeCount = countMeshEdges(meshResult.meshes);
    check('mesh-randen wijken af van b-rep edges',
        meshEdgeCount !== counts.EDGE, `b-rep ${counts.EDGE} vs mesh ${meshEdgeCount}`);
    check('elke edge is een analytische Line',
        edges.every(e => e.curveType === 'Line'),
        [...new Set(edges.map(e => e.curveType))].join(','));
    check('een rechte edge is 2 punten, niet meer',
        edges.every(e => e.points.length === 6),
        [...new Set(edges.map(e => e.points.length / 3))].join(','));
    check('alle 12 ribben exact 300 mm',
        edges.every(e => Math.abs(e.length - 300) < 1e-6),
        [...new Set(edges.map(e => +e.length.toFixed(6)))].join(','));

    log('\n--- ijkpunten: rekenen webapp en Python hetzelfde? ---');
    // Deze uitkomsten staan in regels.json en worden ook door
    // onshape-ai/stap5_balustrade.py gecontroleerd. Zolang beide kanten hier
    // doorheen komen, is de formule in JavaScript en Python gelijk gebleven.
    const regelsNu = await win.eval("import('/balustrade-rules.js')");
    for (const punt of regelsNu.IJKPUNTEN) {
        const r = regelsNu.berekenSpijlen(punt);
        const goed = r.aantal === punt.aantal
            && Math.abs(r.doorgang - punt.doorgang) < 1e-6;
        check(`lengte ${punt.lengte}, spijl ${punt.spijlBreedte}, max ${punt.maxDoorgang}`,
            goed, `${r.aantal} spijlen, doorgang ${r.doorgang.toFixed(6)} `
                + `(verwacht ${punt.aantal}, ${punt.doorgang})`);
    }

    log('\n--- edgeId is een lokale index 1..N ---');
    const ids = edges.map(e => e.edgeId);
    check('1..12 zonder gaten of dubbelen',
        JSON.stringify(ids) === JSON.stringify([...Array(12)].map((_, i) => i + 1)),
        ids.join(','));

    log('\n--- raycast wijst een edge rechtstreeks aan ---');
    const group = new THREE.Group();
    for (const e of edges) {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(e.points, 3));
        const line = new THREE.Line(g, new THREE.LineBasicMaterial());
        line.userData.edge = e;
        group.add(line);
    }
    group.updateMatrixWorld(true);

    const raycaster = new THREE.Raycaster();
    raycaster.params.Line.threshold = maxDim / 120;

    let picked = 0;
    for (const target of edges) {
        const p = target.points;
        const mid = new THREE.Vector3((p[0] + p[3]) / 2, (p[1] + p[4]) / 2, (p[2] + p[5]) / 2);
        const from = mid.clone()
            .add(new THREE.Vector3(1, 1, 1).normalize().multiplyScalar(maxDim * 5));
        raycaster.set(from, mid.clone().sub(from).normalize());
        const rayHits = raycaster.intersectObjects(group.children, false);
        if (rayHits.length > 0 && rayHits[0].object.userData.edge.edgeId === target.edgeId) picked++;
    }
    check('het midden van elke ribbe levert die ribbe op', picked === 12, picked + '/12');

    const inside = new THREE.Vector3(-10, 10, 150);
    const faceCenter = new THREE.Vector3(140, 10, 150);
    raycaster.set(inside, faceCenter.clone().sub(inside).normalize());
    check('het midden van een vlak raakt geen ribbe',
        raycaster.intersectObjects(group.children, false).length === 0);

    log('\n--- geometrie is bruikbaar als railing path ---');
    const first = edges[0];
    check('start en eind verschillen',
        first.points.slice(0, 3).join() !== first.points.slice(-3).join(),
        `[${first.points.slice(0, 3)}] -> [${first.points.slice(-3)}]`);
    check('lengte klopt met de punten',
        Math.abs(first.length - Math.hypot(
            first.points[3] - first.points[0],
            first.points[4] - first.points[1],
            first.points[5] - first.points[2])) < 1e-9);

    // ======================= DEEL C: STEP exporteren ========================
    log('\n\n======== DEEL C: STEP exporteren ========\n');

    const { exportStep } = api;
    const uit = await exportStep();
    const tekst = new TextDecoder().decode(uit);
    log('geschreven:', uit.length.toLocaleString('nl'), 'bytes');

    const tel = (naald) => (tekst.match(new RegExp(naald.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length;

    check('het is een STEP-bestand', tekst.startsWith('ISO-10303-21;'),
        tekst.slice(0, 20));
    check('het is afgesloten', tekst.trimEnd().endsWith('END-ISO-10303-21;'));

    // De topologie moet er ongeschonden doorheen komen. cube.stp had
    // 6 ADVANCED_FACE, 12 EDGE_CURVE, 8 VERTEX_POINT.
    log('\ntopologie in het geschreven bestand:');
    for (const [naam, verwacht] of [['ADVANCED_FACE', 6], ['EDGE_CURVE', 12],
                                    ['VERTEX_POINT', 8], ['MANIFOLD_SOLID_BREP', 1]]) {
        const n = tel(naam);
        check(`${naam}: ${verwacht}`, n === verwacht, n);
    }

    // Geen driehoeken: als hier een tessellatie in zou zitten, stikte het van
    // de POLY_LOOP / TRIANGULATED_ entiteiten.
    check('geen tessellatie in het bestand',
        tel('POLY_LOOP') === 0 && tel('TRIANGULATED') === 0,
        `POLY_LOOP=${tel('POLY_LOOP')} TRIANGULATED=${tel('TRIANGULATED')}`);

    // De echte proef: het geschreven bestand er weer inlezen.
    const opnieuw = await readBrepEdges(uit, maxDim);
    log('\nheringelezen:', JSON.stringify(opnieuw.counts));
    check('heringelezen: 6 faces', opnieuw.counts.FACE === 6, opnieuw.counts.FACE);
    check('heringelezen: 12 edges', opnieuw.counts.EDGE === 12, opnieuw.counts.EDGE);
    check('heringelezen: 8 vertices', opnieuw.counts.VERTEX === 8, opnieuw.counts.VERTEX);
    check('heringelezen: alle edges nog recht',
        opnieuw.edges.every(e => e.curveType === 'Line'),
        [...new Set(opnieuw.edges.map(e => e.curveType))].join(','));

    // Maten mogen niet verlopen zijn.
    const lengtesVoor = edges.map(e => +e.length.toFixed(6)).sort((a, b) => a - b);
    const lengtesNa = opnieuw.edges.map(e => +e.length.toFixed(6)).sort((a, b) => a - b);
    check('alle ribbelengtes identiek na de rondgang',
        JSON.stringify(lengtesVoor) === JSON.stringify(lengtesNa),
        `voor ${lengtesVoor[0]} … na ${lengtesNa[0]}`);

    // ======================= DEEL D: balustrade bouwen ======================
    log('\n\n======== DEEL D: balustrade genereren ========\n');

    const { bouwBalustrade } = await win.eval("import('/build-balustrade.js')");
    const regels = await win.eval("import('/balustrade-rules.js')");

    // ÉÉN veld afdwingen. Sinds er tussenstaanders bijkomen zou een balustrade
    // van 2 meter uit drie velden bestaan, en dan meten de controles hieronder
    // iets anders dan waarvoor ze geschreven zijn: die gaan over de
    // spijlverdeling en de hoekgeometrie in één veld, niet over staanderafstand.
    // Het verdichten zelf wordt in deel M getest.
    //
    // 6000 is de bovengrens die de validatie toestaat, en ruim boven het langste
    // pad in deze tests (3354 mm). Komt er ooit een langer testpad bij, dan gaat
    // dit alsnog verdichten en valt de bijbehorende controle om - wat beter is
    // dan dat hij stilletjes iets anders meet.
    const EEN_VELD = 6000;

    // Ook het handregeloverstek uitzetten. Deze controles gaan over de
    // spijlverdeling, de hoekgeometrie en de plaatsing op een rand; laat je het
    // overstek aan staan, dan steekt de handregel 100 mm buiten het model uit en
    // meten ze iets anders dan waarvoor ze geschreven zijn. Het overstek zelf
    // wordt in deel M getest.
    //
    // Om dezelfde reden geen voetplaten: dit deel controleert dat de balustrade
    // uit rechte blokken van zes vlakken bestaat. Een voetplaat heeft gaten, dus
    // ronde ribben en acht vlakken. Dat is geen fout maar een ander onderdeel,
    // en dat krijgt in deel O zijn eigen controles.
    const maten = { ...regels.STANDAARD, maxStaanderAfstand: EEN_VELD,
                    handregelOverstek: 0, voetplaatDikte: 0, vulraamwerk: 0 };
    const gebouwd = await bouwBalustrade(maten);
    log('maten     :', JSON.stringify(maten));
    log('berekend  :', `${gebouwd.spijlen.aantal} spijlen, `
        + `doorgang ${gebouwd.spijlen.doorgang.toFixed(3)} mm`);
    // De bouwer geeft een OCCT-vorm terug, geen bytes. Hier schrijven we hem
    // bewust wel weg: dan test deze controle ook de STEP-export.
    const balBytes = await schrijfStep(gebouwd.shape);
    log('geschreven:', balBytes.length.toLocaleString('nl'), 'bytes');

    check('doorgang blijft onder het maximum',
        gebouwd.spijlen.doorgang <= maten.maxDoorgang + 1e-9,
        gebouwd.spijlen.doorgang.toFixed(3));

    // Het gegenereerde model er weer inlezen: dan meet je wat er echt gebouwd is,
    // niet wat de berekening beweert.
    const bal = await readBrepEdges(balBytes, maten.lengte);
    log('topologie :', JSON.stringify(bal.counts));

    // De viewer tekent de vorm nu rechtstreeks, zonder STEP ertussen. Dat is
    // alleen goed als die korte weg hetzelfde oplevert als de lange. Zodra dat
    // uit elkaar loopt, kijk je in beeld naar iets anders dan je exporteert.
    const direct = await laadVorm(gebouwd.shape);
    check('directe weg geeft dezelfde topologie als via STEP',
        JSON.stringify(direct.counts) === JSON.stringify(bal.counts),
        `direct ${JSON.stringify(direct.counts)} tegenover STEP ${JSON.stringify(bal.counts)}`);
    check('directe weg geeft evenveel randen als via STEP',
        direct.edges.length === bal.edges.length,
        `${direct.edges.length} tegenover ${bal.edges.length}`);

    const lengteSom = (e) => e.reduce((s, r) => s + r.length, 0);
    check('directe weg geeft dezelfde totale randlengte',
        Math.abs(lengteSom(direct.edges) - lengteSom(bal.edges)) < 1e-6,
        `${lengteSom(direct.edges).toFixed(6)} tegenover ${lengteSom(bal.edges).toFixed(6)}`);
    check('de directe weg levert driehoeken op',
        direct.meshes[0].index.array.length > 0,
        `${direct.meshes[0].index.array.length / 3} driehoeken`);

    // 16 spijlen + 2 staanders + 1 handregel = 19 losse blokken.
    //
    // Er stond +5: er zaten ook twee afdekkappen bij. Die zijn weg sinds de
    // handregel over de staanderkoppen heen loopt - er is geen vrije kop meer
    // om een kap op te zetten. Zie regelOverDeKop in pad.js.
    const verwachteDelen = gebouwd.spijlen.aantal + 3;
    check(`${verwachteDelen} losse solids`, bal.counts.SOLID === verwachteDelen,
        bal.counts.SOLID);
    check('elk blok heeft 6 vlakken', bal.counts.FACE === verwachteDelen * 6,
        `${bal.counts.FACE} (verwacht ${verwachteDelen * 6})`);
    check('elk blok heeft 12 ribben', bal.counts.EDGE === verwachteDelen * 12,
        `${bal.counts.EDGE} (verwacht ${verwachteDelen * 12})`);
    check('alle ribben recht', bal.edges.every(e => e.curveType === 'Line'),
        [...new Set(bal.edges.map(e => e.curveType))].join(','));

    // De maat waar het om draait: staan de spijlen echt op de berekende afstand?
    // We meten dat aan de geometrie, niet aan de formule.
    const spijlHoogte = maten.hoogte - maten.handregelHoogte;
    const xWaardenVanSpijlen = new Set();
    for (const e of bal.edges) {
        const p = e.points;
        const verticaal = Math.abs(p[0] - p[3]) < 1e-6 && Math.abs(p[1] - p[4]) < 1e-6;
        const hoog = Math.abs(e.length - spijlHoogte) < 1e-6;
        // De staanders eruit filteren op hun x-positie. Dat moest scherper:
        // sinds de handregel over de koppen loopt is een staander NET ZO LANG
        // als een spijl (hoogte - handregelhoogte, hier allebei 960 mm), dus
        // `hoog` zeeft hem niet meer weg. Met `p[0] > 0` bleven zijn binnenste
        // ribben op x = 20 en x = 1980 in de lijst staan, en dan schoof de
        // berekende opening 76,5 mm op. De harten liggen op 0 en op `lengte`,
        // dus alles binnen een halve staanderbreedte daarvan hoort er niet bij.
        const halveStaander = maten.staanderBreedte / 2;
        if (verticaal && hoog
            && p[0] > halveStaander + 1e-6
            && p[0] < maten.lengte - halveStaander - 1e-6) {
            xWaardenVanSpijlen.add(+p[0].toFixed(4));
        }
    }
    const xSorted = [...xWaardenVanSpijlen].sort((a, b) => a - b);
    // Elke spijl levert 4 verticale ribben op 2 x-waarden (links en rechts).
    const gemetenDoorgangen = [];
    for (let i = 0; i + 3 < xSorted.length; i += 2) {
        gemetenDoorgangen.push(xSorted[i + 2] - xSorted[i + 1]);
    }
    const afwijking = gemetenDoorgangen.length
        ? Math.max(...gemetenDoorgangen.map(d => Math.abs(d - gebouwd.spijlen.doorgang)))
        : Infinity;
    // Marge van een duizendste millimeter. Strenger kan niet: deze maten zijn
    // door een STEP-bestand heen geweest, en dat is een TEKSTbestand waarin
    // getallen met een beperkt aantal cijfers staan. Een duizendste mm is nog
    // altijd duizend keer nauwkeuriger dan wat een werkplaats haalt.
    check('gemeten openingen komen overeen met de berekening',
        afwijking < 1e-3,
        `${gemetenDoorgangen.length} openingen, grootste afwijking ${afwijking.toExponential(2)} mm`);

    // ======================= DEEL E: zinnen ontleden ========================
    log('\n\n======== DEEL E: opdracht in woorden ========\n');

    const { parseer } = await win.eval("import('/command-parser.js')");

    const zinnen = [
        ['maak een kubus van 300 mm', 'blok', { breedte: 300, diepte: 300, hoogte: 300 }],
        ['kubus van 50 cm', 'blok', { breedte: 500, diepte: 500, hoogte: 500 }],
        ['blok van 300 bij 200 bij 150', 'blok', { breedte: 300, diepte: 200, hoogte: 150 }],
        ['maak een blok 300x200x150', 'blok', { breedte: 300, diepte: 200, hoogte: 150 }],
        ['blok van 300 breed, 200 diep en 150 hoog', 'blok',
            { breedte: 300, diepte: 200, hoogte: 150 }],
        ['een balk van 1 meter lang', 'blok', { breedte: 1000, diepte: 1000, hoogte: 1000 }],
        ['balustrade van 2 meter lang en 1 meter hoog', 'balustrade',
            { lengte: 2000, hoogte: 1000 }],
        ['balustrade van 2,5 meter lang', 'balustrade', { lengte: 2500, hoogte: 1000 }],
        ['maak een leuning van 3000 lang en 1100 hoog', 'balustrade',
            { lengte: 3000, hoogte: 1100 }],
        ['hekwerk 2000 1050', 'balustrade', { lengte: 2000, hoogte: 1050 }],
        ['trap van 3 meter hoog', 'trap', { hoogte: 3000 }],
        ['maak een trap van 2600 hoog en 1200 breed', 'trap',
            { hoogte: 2600, breedte: 1200 }],
        ['steektrap 2800', 'trap', { hoogte: 2800 }],
    ];

    for (const [zin, verwachteActie, verwachteMaten] of zinnen) {
        const r = parseer(zin);
        if (r.fout) {
            check(`"${zin}"`, false, r.fout);
            continue;
        }
        const goed = r.actie === verwachteActie
            && Object.entries(verwachteMaten).every(([k, v]) => r.params[k] === v);
        check(`"${zin}"`, goed,
            goed ? r.uitleg
                 : `kreeg ${r.actie} ${JSON.stringify(r.params)}`);
    }

    log('\n--- "met leuning" bij een trap ---');
    // Let op: 'leuning' is ook het woord voor een balustrade. In een zin met
    // 'trap' erin moet het een trap MET leuning worden, geen losse leuning.
    for (const [zin, verwachteLeuning] of [
        ['trap van 3 meter hoog', 'geen'],
        ['trap van 3 meter hoog met leuning', 'beide'],
        ['trap van 3 meter met leuning links', 'links'],
        ['trap van 3 meter met leuning rechts', 'rechts'],
        ['maak een trap van 2,8 meter met balustrade aan beide zijden', 'beide'],
    ]) {
        const r = parseer(zin);
        check(`"${zin}"`, r.actie === 'trap' && r.leuning === verwachteLeuning,
            r.fout || `${r.actie}, leuning ${r.leuning}`);
    }
    // En zonder het woord 'trap' blijft het gewoon een balustrade.
    check('"leuning van 2 meter lang" blijft een balustrade',
        parseer('leuning van 2 meter lang').actie === 'balustrade',
        parseer('leuning van 2 meter lang').actie);

    log('\n--- vervolgopdrachten: "maak hem hoger" ---');
    // Zonder iets ervoor kan het niet.
    check('zonder vorige opdracht wordt "maak hem hoger" geweigerd',
        !!parseer('maak hem hoger').fout,
        parseer('maak hem hoger').fout);

    const blokje = parseer('blok van 300 bij 200 bij 150');
    const hoger = parseer('maak hem 200 hoger', blokje);
    check('200 hoger verandert alleen de hoogte',
        hoger.params.hoogte === 350 && hoger.params.breedte === 300
        && hoger.params.diepte === 200,
        JSON.stringify(hoger.params));

    const breder = parseer('breder', blokje);
    check('zonder maat wordt er 100 mm gebruikt',
        breder.params.breedte === 400, breder.params.breedte);
    check('en dat wordt er wel bij gezegd',
        /100 mm/.test(breder.uitleg), breder.uitleg);

    const smaller = parseer('maak hem 50 smaller', blokje);
    check('smaller gaat de andere kant op',
        smaller.params.breedte === 250, smaller.params.breedte);

    // Doorstapelen: elke bijstelling gaat uit van de vorige.
    const stap2 = parseer('nog 200 hoger', hoger);
    check('bijstellen stapelt op de vorige', stap2.params.hoogte === 550,
        stap2.params.hoogte);

    const trapje = parseer('trap van 3 meter hoog met leuning');
    const trapHoger = parseer('maak hem 400 hoger', trapje);
    check('werkt ook op een trap',
        trapHoger.actie === 'trap' && trapHoger.params.hoogte === 3400,
        `${trapHoger.actie} ${trapHoger.params.hoogte}`);
    check('de leuningkeuze blijft behouden', trapHoger.leuning === 'beide',
        trapHoger.leuning);

    const balustradeje = parseer('balustrade van 2 meter lang');
    const langer = parseer('maak hem 500 langer', balustradeje);
    check('langer werkt op de lengte van een balustrade',
        langer.params.lengte === 2500, langer.params.lengte);

    // Een maat die de vorm niet heeft.
    const geenDiepte = parseer('maak hem dieper', balustradeje);
    check('een balustrade heeft geen diepte om bij te stellen',
        !!geenDiepte.fout, geenDiepte.fout);

    // Kleiner dan niets kan niet.
    const teKlein = parseer('maak hem 5000 lager', blokje);
    check('een bijstelling tot onder nul wordt geweigerd',
        !!teKlein.fout, teKlein.fout);

    log('\n--- zinnen die geweigerd horen te worden ---');
    for (const zin of ['', 'maak iets moois', 'kubus', 'hallo', '300 bij 200']) {
        const r = parseer(zin);
        check(`"${zin}" wordt geweigerd`, !!r.fout,
            r.fout ? r.fout : `werd geaccepteerd als ${r.actie}`);
    }

    // ======================= DEEL F: balustrade op een rand =================
    log('\n\n======== DEEL F: balustrade op een rand ========\n');

    const { beoordeelRanden, bouwBalustradeOpRanden } =
        await win.eval("import('/build-balustrade.js')");
    // Ook hier één veld en geen overstek; zie de opmerking bij EEN_VELD in deel D.
    const standaard = { ...regels.STANDAARD, maxStaanderAfstand: EEN_VELD,
                        handregelOverstek: 0 };
    let randNr = 0;
    const rand = (punten) => ({ edgeId: ++randNr, points: punten, curveType: 'Line' });

    log('--- welke randen worden geweigerd ---');
    const liggend = rand([0, 0, 0, 2000, 0, 0]);
    check('liggende rand van 2000 mm wordt geaccepteerd',
        !beoordeelRanden([liggend], standaard).fout,
        beoordeelRanden([liggend], standaard).fout || 'ok');

    for (const [omschrijving, e] of [
        ['rechtopstaande rand', rand([0, 0, 0, 0, 0, 1000])],
        ['rand zonder lengte', rand([5, 5, 5, 5, 5, 5])],
        ['gebogen rand (3 punten)', rand([0, 0, 0, 100, 5, 0, 200, 0, 0])],
        ['te korte rand (250 mm)', rand([0, 0, 0, 250, 0, 0])],
    ]) {
        const r = beoordeelRanden([e], standaard);
        check(`${omschrijving} wordt geweigerd`, !!r.fout, r.fout || 'werd geaccepteerd');
    }

    // Een schuine rand mag sinds de trapleuning wel.
    const schuineRand = beoordeelRanden([rand([0, 0, 0, 3000, 0, 1500])], standaard);
    check('schuine rand wordt nu wél geaccepteerd (trapleuning)',
        !schuineRand.fout, schuineRand.fout || 'ok');

    log('\n--- de lengte komt van de rand ---');
    const beoordeeld = beoordeelRanden([liggend], standaard);
    check('randlengte 2000 mm', Math.abs(beoordeeld.totaleLengte - 1960) < 1e-9,
        `${beoordeeld.totaleLengte} (hart op hart, na inschuiven van de uiteinden)`);
    // De uiteinden schuiven een halve staander naar binnen, daarna gaat er aan
    // beide kanten nog een halve staander af: samen 2 x 40 = 80 mm.
    check('veldlengte 1920 mm',
        Math.abs(beoordeeld.velden[0].vrijeLengte - 1920) < 1e-9,
        beoordeeld.velden[0].vrijeLengte);
    check('één veld, geen hoeken',
        beoordeeld.velden.length === 1 && beoordeeld.hoeken === 0,
        `${beoordeeld.velden.length} veld, ${beoordeeld.hoeken} hoeken`);

    log('\n--- de gebouwde balustrade staat echt op de rand ---');
    // Rand van 2000 mm langs de X-as, op 500 mm hoogte.
    //
    // Zonder voetplaat, want die is 150 lang en steekt dus 55 mm voorbij de
    // buitenste staander. Dat is geen fout - een voetplaat hoort breder te zijn
    // dan de staander - maar het maakt "begint bij het begin van de rand" een
    // andere vraag. De plaat wordt een paar regels verderop apart gemeten.
    // Ook zonder vulraamwerk: dit gaat over WAAR de leuning staat, niet over
    // hoe het vulveld in elkaar zit. Het raamwerk heeft deel P.
    //
    // En zonder afdekkap, om dezelfde reden als de voetplaat: die steekt 3 mm
    // rondom over de staander uit, dus dan begint het model op x = -3 in
    // plaats van op 0, en is het 5 mm hoger dan de opgegeven leuninghoogte.
    // Allebei klopt - een kap hoort over te steken en boven de handregel te
    // zitten - maar het maakt deze meting een andere vraag. De kap wordt
    // verderop in deel O apart gemeten.
    const opRandMaten = { ...standaard, voetplaatDikte: 0, vulraamwerk: 0,
        paalkapDikte: 0 };
    const opRand = await bouwBalustradeOpRanden(
        [rand([0, 0, 500, 2000, 0, 500])], opRandMaten, null);
    const geplaatst = await readBrepEdges(await schrijfStep(opRand.shape), 2000);
    log('topologie :', JSON.stringify(geplaatst.counts));

    const verwacht = opRand.velden[0].spijlen.aantal + 3;
    check(`${verwacht} losse solids`, geplaatst.counts.SOLID === verwacht,
        geplaatst.counts.SOLID);

    // Waar staat het? Alle hoekpunten van alle ribben aflopen.
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (const e of geplaatst.edges) {
        for (let i = 0; i < e.points.length; i += 3) {
            minX = Math.min(minX, e.points[i]); maxX = Math.max(maxX, e.points[i]);
            minZ = Math.min(minZ, e.points[i + 2]); maxZ = Math.max(maxZ, e.points[i + 2]);
        }
    }
    log(`x van ${minX.toFixed(2)} tot ${maxX.toFixed(2)}, `
        + `z van ${minZ.toFixed(2)} tot ${maxZ.toFixed(2)}`);

    check('begint bij het begin van de rand', Math.abs(minX) < 1e-3, minX);
    check('eindigt bij het eind van de rand', Math.abs(maxX - 2000) < 1e-3, maxX);
    check('staat OP de rand, niet eronder', Math.abs(minZ - 500) < 1e-3, minZ);
    check('is zo hoog als opgegeven',
        Math.abs(maxZ - (500 + standaard.hoogte)) < 1e-3, maxZ);

    // En nu MET voetplaat: de plaat steekt aan weerszijden uit, en de bovenkant
    // van de leuning blijft op dezelfde hoogte. Dat tweede is het punt - de
    // plaat gaat van de staander af en komt er niet bovenop.
    // Zonder kap, net als hierboven: die zit bewust 5 mm bóven de handregel en
    // zou dus meetellen in de hoogte die hier gemeten wordt. Het gaat er hier
    // om dat de VOETPLAAT niets aan de hoogte verandert.
    const opRandPlaat = await bouwBalustradeOpRanden(
        [rand([0, 0, 500, 2000, 0, 500])], { ...standaard, paalkapDikte: 0 }, null);
    const metPlaat = await readBrepEdges(await schrijfStep(opRandPlaat.shape), 2000);
    let pMinX = Infinity, pMaxZ = -Infinity, pMinZ = Infinity;
    for (const e of metPlaat.edges) {
        for (let i = 0; i < e.points.length; i += 3) {
            pMinX = Math.min(pMinX, e.points[i]);
            pMinZ = Math.min(pMinZ, e.points[i + 2]);
            pMaxZ = Math.max(pMaxZ, e.points[i + 2]);
        }
    }
    const uitsteek = (regels.VOETPLAAT.lengte - standaard.staanderBreedte) / 2;
    log(`met voetplaat: x vanaf ${pMinX.toFixed(2)}, z van ${pMinZ.toFixed(2)} `
        + `tot ${pMaxZ.toFixed(2)}`);
    check(`de voetplaat steekt ${uitsteek} mm voorbij de buitenste staander`,
        Math.abs(pMinX + uitsteek) < 1e-3, pMinX);
    check('de plaat ligt OP de rand, niet erin',
        Math.abs(pMinZ - 500) < 1e-3, pMinZ);
    check('en de leuning is nog steeds even hoog, want de staander is korter',
        Math.abs(pMaxZ - (500 + standaard.hoogte)) < 1e-3, pMaxZ);

    // ======================= DEEL G: stuklijst ==============================
    log('\n\n======== DEEL G: stuklijst ========\n');

    const { balustradeDelen, stuklijst } = await win.eval("import('/build-balustrade.js')");

    const delen = balustradeDelen(standaard);
    const lijst = stuklijst(delen);

    log(`${'onderdeel'.padEnd(12)} ${'profiel'.padEnd(12)} ${'lengte'.padStart(9)} ${'st'.padStart(4)}`);
    log('-'.repeat(42));
    for (const r of lijst) {
        log(`${r.soort.padEnd(12)} ${r.profiel.padEnd(12)} `
            + `${r.lengte.toFixed(1).padStart(9)} ${String(r.aantal).padStart(4)}`);
    }

    const spijlenNu = regels.berekenSpijlen(standaard).aantal;
    // Vier sinds de voetplaat erbij kwam: staander, handregel, spijl, voetplaat.
    // Vijf sinds het vulraamwerk erbij kwam: + vulregel.
    // Zes was het even met de afdekkap erbij. Die staat er niet meer in: sinds
    // de handregel over de staanderkoppen loopt is er geen vrije kop om een kap
    // op te zetten. Zie regelOverDeKop in pad.js.
    check('vijf soorten onderdelen', lijst.length === 5, lijst.map(r => r.soort).join(','));
    check('en de voetplaat staat erbij, één per staander',
        lijst.find(r => r.soort === 'voetplaat')?.aantal === 2,
        lijst.find(r => r.soort === 'voetplaat')?.aantal);
    check('en er staat geen afdekkap meer in',
        !lijst.some(r => r.soort === 'paalkap'),
        lijst.map(r => r.soort).join(','));
    check('en twee vulregels, één veld dus een onder- en een bovenregel',
        lijst.find(r => r.soort === 'vulregel')?.aantal === 2,
        lijst.find(r => r.soort === 'vulregel')?.aantal);

    const totaalStuks = lijst.reduce((s, r) => s + r.aantal, 0);
    check('aantal stuks klopt met het aantal delen',
        totaalStuks === delen.length, `${totaalStuks} vs ${delen.length}`);
    check(`${spijlenNu} spijlen in de lijst`,
        lijst.find(r => r.soort === 'spijl')?.aantal === spijlenNu,
        lijst.find(r => r.soort === 'spijl')?.aantal);
    check('2 staanders', lijst.find(r => r.soort === 'staander')?.aantal === 2);
    check('1 handregel', lijst.find(r => r.soort === 'handregel')?.aantal === 1);

    // De zaaglengte is de langste maat van een onderdeel, niet dx of dy of dz.
    //
    // Met het vulraamwerk loopt een spijl niet meer van de vloer tot onder de
    // handregel, maar tussen de twee regels: van de bovenkant van de onderregel
    // tot de onderkant van de bovenregel.
    const spijlRegel = lijst.find(r => r.soort === 'spijl');
    const vrw = regels.VULRAAMWERK;
    const raamTop = standaard.hoogte - standaard.handregelHoogte - vrw.opening;
    const spijlLengte = (raamTop - vrw.dikte) - (vrw.onder + vrw.dikte);
    check('zaaglengte van een spijl loopt van regel tot regel',
        Math.abs(spijlRegel.lengte - spijlLengte) < 1e-9,
        `${spijlRegel.lengte} (verwacht ${spijlLengte})`);
    check('profiel van een spijl is 20 × 20', spijlRegel.profiel === '20 × 20',
        spijlRegel.profiel);

    // De handregel loopt OVER de staanders heen, van hart tot hart. Hiervoor
    // liep hij ertussen en was hij een staanderbreedte korter (1960); dat was
    // de oude opbouw, waarin twee doorlopende regels in een hoek elkaar zouden
    // overlappen. Dat is nu met verstek opgelost, zie handregelStukken.
    //
    // Zonder overstek stopt hij op het HART van de buitenste staander. Dat is
    // geen halve staander te kort: de helft van de kop ligt eronder, en de
    // andere helft is waar het verstek of het overstek begint.
    const handregel = lijst.find(r => r.soort === 'handregel');
    check('handregel loopt van hart tot hart over de staanders',
        Math.abs(handregel.lengte - standaard.lengte) < 1e-9,
        `${handregel.lengte} (verwacht ${standaard.lengte})`);

    // De staander loopt NIET meer over de volle hoogte. Twee dingen gaan er af:
    // de voetplaat waar hij op staat, en de handregel die op hem ligt. Zo zit
    // het ook in de voorbeeldbalustrade: vloer op z = 457, staander vanaf
    // z = 467, handregel van z = 1408,7 tot 1457.
    const staander = lijst.find(r => r.soort === 'staander');
    const staanderLengte = standaard.hoogte - standaard.voetplaatDikte
        - standaard.handregelHoogte;
    check('staander loopt tot ONDER de handregel, bovenop de voetplaat',
        Math.abs(staander.lengte - staanderLengte) < 1e-9,
        `${staander.lengte} (verwacht ${staanderLengte})`);
    check('staander plus voetplaat plus handregel is samen de volle hoogte',
        Math.abs(staander.lengte + standaard.voetplaatDikte
                 + standaard.handregelHoogte - standaard.hoogte) < 1e-9,
        staander.lengte + standaard.voetplaatDikte + standaard.handregelHoogte);

    check('totale lengte per regel = lengte × aantal',
        lijst.every(r => Math.abs(r.totaalLengte - r.lengte * r.aantal) < 1e-9));

    // De echte controle: komt de lijst overeen met wat er GEBOUWD is? De
    // geometrie en de lijst komen uit dezelfde beschrijving, maar dat moet je
    // meten en niet aannemen.
    const uitBouw = await bouwBalustrade(standaard);
    const nagelezen = await readBrepEdges(
        await schrijfStep(uitBouw.shape), standaard.lengte);
    const stuksInLijst = uitBouw.stuklijst.reduce((s, r) => s + r.aantal, 0);
    check('evenveel stuks in de lijst als solids in het model',
        stuksInLijst === nagelezen.counts.SOLID,
        `lijst ${stuksInLijst} vs model ${nagelezen.counts.SOLID}`);

    // ======================= DEEL H: randen tot een pad =====================
    log('\n\n======== DEEL H: randen aaneenrijgen ========\n');

    const pad = await win.eval("import('/pad.js')");
    let volgnr = 0;
    const R = (x1, y1, z1, x2, y2, z2) =>
        ({ edgeId: ++volgnr, points: [x1, y1, z1, x2, y2, z2], curveType: 'Line' });

    log('--- welke verzamelingen vormen een pad ---');

    const enkel = pad.maakPad([R(0, 0, 0, 2000, 0, 0)]);
    check('één rand geeft een pad van 2 punten',
        !enkel.fout && enkel.punten.length === 2 && !enkel.gesloten,
        enkel.fout || `${enkel.punten.length} punten`);

    // Een L, maar in omgekeerde volgorde aangeklikt en met omgedraaide randen.
    // De gebruiker klikt nu eenmaal niet netjes op volgorde.
    const L = pad.maakPad([
        R(2000, 1500, 0, 2000, 0, 0),
        R(2000, 0, 0, 0, 0, 0),
    ]);
    check('twee randen door elkaar geklikt vormen een L',
        !L.fout && L.punten.length === 3 && !L.gesloten,
        L.fout || `${L.punten.length} punten`);
    check('de hoek ligt in het midden van het pad',
        !L.fout && Math.abs(L.punten[1][0] - 2000) < 1e-9
                && Math.abs(L.punten[1][1]) < 1e-9,
        L.fout || JSON.stringify(L.punten[1]));

    const rechthoek = pad.maakPad([
        R(0, 0, 0, 2000, 0, 0),
        R(2000, 1500, 0, 0, 1500, 0),
        R(2000, 0, 0, 2000, 1500, 0),
        R(0, 1500, 0, 0, 0, 0),
    ]);
    check('vier randen rondom vormen een gesloten lus',
        !rechthoek.fout && rechthoek.gesloten && rechthoek.punten.length === 4,
        rechthoek.fout || `${rechthoek.punten.length} punten, gesloten=${rechthoek.gesloten}`);

    log('\n--- wat geen pad is ---');
    for (const [omschrijving, randen] of [
        ['twee losse stukken', [R(0, 0, 0, 100, 0, 0), R(500, 0, 0, 600, 0, 0)]],
        ['een T-splitsing', [R(0, 0, 0, 1000, 0, 0), R(1000, 0, 0, 2000, 0, 0),
                             R(1000, 0, 0, 1000, 800, 0)]],
        ['een rechtopstaande rand', [R(0, 0, 0, 0, 0, 1000)]],
        ['niets', []],
    ]) {
        const r = pad.maakPad(randen);
        check(`${omschrijving} wordt geweigerd`, !!r.fout, r.fout || 'werd geaccepteerd');
    }

    const schuin = pad.maakPad([R(0, 0, 0, 3000, 0, 1500)]);
    check('een hellende rand mag wel (trapleuning)', !schuin.fout,
        schuin.fout || 'ok');

    log('\n--- hoe ver blijft een veld van het hart van de staander ---');
    const w = 40;
    const hoekL = pad.staanderGegevens(L.punten, false, w);

    // Aan een uiteinde staat de staander in de richting van de rand: w/2.
    check('uiteinde: inzet is w/2 = 20 mm',
        Math.abs(hoekL[0].inzetNaarVolgende - w / 2) < 1e-9,
        hoekL[0].inzetNaarVolgende.toFixed(4));

    // In een hoek van 90 graden loop je schuin door het vierkant: w/2 * sqrt(2).
    const verwachtHoek = (w / 2) * Math.SQRT2;
    check('hoek van 90°: inzet is w/2·√2 = 28,284 mm',
        Math.abs(hoekL[1].inzetNaarVolgende - verwachtHoek) < 1e-9,
        `${hoekL[1].inzetNaarVolgende.toFixed(4)} (verwacht ${verwachtHoek.toFixed(4)})`);
    check('in een hoek is de inzet naar beide kanten gelijk',
        Math.abs(hoekL[1].inzetNaarVolgende - hoekL[1].inzetNaarVorige) < 1e-9);
    check('een hoek kost meer dan een recht stuk',
        hoekL[1].inzetNaarVolgende > hoekL[0].inzetNaarVolgende);

    // Twee randen in elkaars verlengde zijn geen hoek: dan gewoon w/2.
    const recht = pad.maakPad([R(0, 0, 0, 1000, 0, 0), R(1000, 0, 0, 2500, 0, 0)]);
    const hoekRecht = pad.staanderGegevens(recht.punten, false, w);
    check('twee randen in elkaars verlengde: inzet blijft w/2',
        Math.abs(hoekRecht[1].inzetNaarVolgende - w / 2) < 1e-9,
        hoekRecht[1].inzetNaarVolgende.toFixed(4));

    log('\n--- het pad evenwijdig opzij schuiven ---');
    // Een recht stuk: elk punt schuift precies de opgegeven afstand.
    const rechtOp = pad.verschuifPad([[0, 0, 0], [2000, 0, 0]], false, 50);
    check('recht pad: beide punten 50 mm opzij',
        Math.abs(Math.abs(rechtOp[0][1]) - 50) < 1e-9
        && Math.abs(Math.abs(rechtOp[1][1]) - 50) < 1e-9,
        `y = ${rechtOp[0][1]}, ${rechtOp[1][1]}`);
    check('de lengte van het rechte stuk verandert niet',
        Math.abs((rechtOp[1][0] - rechtOp[0][0]) - 2000) < 1e-9);

    // Een hoek van 90 graden: het hoekpunt moet VERDER opschuiven dan 50 mm,
    // namelijk 50·√2. Anders is het verschoven pad niet meer evenwijdig.
    const hoekPad = [[0, 0, 0], [2000, 0, 0], [2000, 1500, 0]];
    const hoekOp = pad.verschuifPad(hoekPad, false, 50);
    const verplaatsing = Math.hypot(hoekOp[1][0] - hoekPad[1][0],
                                    hoekOp[1][1] - hoekPad[1][1]);
    check('hoekpunt schuift 50·√2 = 70,7 mm op',
        Math.abs(verplaatsing - 50 * Math.SQRT2) < 1e-9,
        verplaatsing.toFixed(4));

    // De echte proef: is het verschoven pad overal even ver van het origineel?
    const afstandTotLijn = (p3, a, b) => {
        const dx = b[0] - a[0], dy = b[1] - a[1];
        const l = Math.hypot(dx, dy);
        return Math.abs((p3[0] - a[0]) * dy - (p3[1] - a[1]) * dx) / l;
    };
    const afstanden = [
        afstandTotLijn(hoekOp[0], hoekPad[0], hoekPad[1]),
        afstandTotLijn(hoekOp[1], hoekPad[0], hoekPad[1]),
        afstandTotLijn(hoekOp[1], hoekPad[1], hoekPad[2]),
        afstandTotLijn(hoekOp[2], hoekPad[1], hoekPad[2]),
    ];
    check('het verschoven pad loopt overal 50 mm van het origineel',
        afstanden.every(d => Math.abs(d - 50) < 1e-9),
        afstanden.map(d => d.toFixed(3)).join(', '));

    check('verschuiving 0 laat het pad ongemoeid',
        pad.verschuifPad(hoekPad, false, 0) === hoekPad);

    const anderskant = pad.verschuifPad([[0, 0, 0], [2000, 0, 0]], false, -50);
    check('een min-teken zet het pad aan de andere kant',
        Math.sign(anderskant[0][1]) === -Math.sign(rechtOp[0][1]),
        `${rechtOp[0][1]} tegenover ${anderskant[0][1]}`);

    log('\n--- onderdelen langs het pad ---');
    const padMaten = { ...standaard };
    const resultaatL = pad.padDelen(L.punten, false, padMaten);

    check('drie staanders bij twee velden',
        resultaatL.delen.filter(d => d.soort === 'staander').length === 3,
        resultaatL.delen.filter(d => d.soort === 'staander').length);
    check('twee handregels',
        resultaatL.delen.filter(d => d.soort === 'handregel').length === 2);
    check('twee velden', resultaatL.velden.length === 2);

    // Beide velden hebben aan de ene kant een uiteinde (w/2 eraf) en aan de
    // andere kant de hoek (w/2·√2 eraf). Welk veld als eerste komt hangt af van
    // waar het pad begint, en dat hangt weer af van de klikvolgorde - dus we
    // vergelijken de verzameling lengtes, niet de volgorde.
    const gemeten = resultaatL.velden.map(v => +v.vrijeLengte.toFixed(6)).sort((a, b) => a - b);
    const verwachtLengtes = [1500, 2000]
        .map(l => +(l - w / 2 - verwachtHoek).toFixed(6)).sort((a, b) => a - b);
    check('vrije lengtes kloppen: randlengte min uiteinde min hoek',
        JSON.stringify(gemeten) === JSON.stringify(verwachtLengtes),
        `${gemeten.join(', ')} (verwacht ${verwachtLengtes.join(', ')})`);

    for (const v of resultaatL.velden) {
        check(`veld ${v.index + 1}: doorgang ${v.spijlen.doorgang.toFixed(1)} mm `
            + `blijft onder ${padMaten.maxDoorgang}`,
            v.spijlen.doorgang <= padMaten.maxDoorgang + 1e-9);
    }

    // Bij een lus zijn er evenveel velden als staanders.
    const resultaatLus = pad.padDelen(rechthoek.punten, true, padMaten);
    check('gesloten lus: evenveel velden als staanders',
        resultaatLus.velden.length === 4
        && resultaatLus.delen.filter(d => d.soort === 'staander').length === 4,
        `${resultaatLus.velden.length} velden`);

    // ======================= DEEL I: hellend veld (trapleuning) =============
    log('\n\n======== DEEL I: hellend veld ========\n');

    // Een trap van 3000 mm horizontaal met 1500 mm hoogteverschil: 26,57 graden.
    const trapA = [0, 0, 0];
    const trapB = [3000, 0, 1500];
    const trapRand = { edgeId: 900, points: [...trapA, ...trapB], curveType: 'Line' };

    const trapPad = pad.maakPad([trapRand]);
    check('een hellende rand wordt geaccepteerd', !trapPad.fout,
        trapPad.fout || 'ok');

    // Zonder vulraamwerk: dit deel gaat over de MEETKUNDE van een hellend
    // veld - staan de spijlen verticaal, klopt de doorgang op de helling. Het
    // raamwerk verandert alleen waar een spijl begint en eindigt, en dat heeft
    // deel P.
    const trapMaten = { ...standaard, vulraamwerk: 0 };
    const trap = pad.padDelen(trapPad.punten, false, trapMaten);
    const trapVeld = trap.velden[0];

    log(`helling            : ${trapVeld.helling.toFixed(2)}°`);
    log(`lengte langs rand  : ${trapVeld.randLengte.toFixed(1)} mm`);
    log(`horizontaal        : ${trapVeld.horizontaleLengte.toFixed(1)} mm`);
    log(`vrij horizontaal   : ${trapVeld.vrijeLengte.toFixed(1)} mm`);
    log(`spijlen            : ${trapVeld.spijlen.aantal}`);
    log(`doorgang           : ${trapVeld.spijlen.doorgang.toFixed(3)} mm\n`);

    check('helling is 26,57°', Math.abs(trapVeld.helling - 26.565051) < 1e-4,
        trapVeld.helling.toFixed(6));
    check('lengte langs de rand is 3354 mm',
        Math.abs(trapVeld.randLengte - Math.hypot(3000, 1500)) < 1e-9,
        trapVeld.randLengte.toFixed(3));
    check('de regel rekent met de HORIZONTALE lengte, niet de schuine',
        Math.abs(trapVeld.vrijeLengte - (3000 - 2 * (trapMaten.staanderBreedte / 2))) < 1e-9,
        `${trapVeld.vrijeLengte} (3000 min twee halve staanders)`);

    // Dit is waar het om draait: meet de werkelijke horizontale afstand tussen
    // de spijlen die gebouwd zijn, en kijk of die onder het maximum blijft.
    // Niet de formule narekenen, maar de geometrie opmeten.
    const trapSpijlen = trap.delen.filter(d => d.soort === 'spijl');
    check(`${trapVeld.spijlen.aantal} spijlen gebouwd`,
        trapSpijlen.length === trapVeld.spijlen.aantal, trapSpijlen.length);

    // Horizontale positie van elk spijlhart langs de looprichting.
    const langsX = trapSpijlen
        .map(d => d.oorsprong[0] + trapMaten.spijlBreedte / 2)
        .sort((a, b) => a - b);

    const openingen = [];
    for (let i = 1; i < langsX.length; i++) {
        openingen.push(langsX[i] - langsX[i - 1] - trapMaten.spijlBreedte);
    }
    const grootste = Math.max(...openingen);
    check('gemeten horizontale openingen blijven onder het maximum',
        grootste <= trapMaten.maxDoorgang + 1e-6,
        `grootste ${grootste.toFixed(3)} mm, maximum ${trapMaten.maxDoorgang}`);
    check('alle openingen even breed',
        Math.max(...openingen) - Math.min(...openingen) < 1e-6,
        `${Math.min(...openingen).toFixed(3)} tot ${grootste.toFixed(3)}`);
    check('gemeten opening komt overeen met de berekening',
        Math.abs(grootste - trapVeld.spijlen.doorgang) < 1e-6,
        `${grootste.toFixed(6)} vs ${trapVeld.spijlen.doorgang.toFixed(6)}`);

    log('\n--- de spijlen staan verticaal, de handregel loopt schuin ---');
    check('elke spijl staat verticaal',
        trapSpijlen.every(d => Math.abs(d.zAs[0]) < 1e-9 && Math.abs(d.zAs[1]) < 1e-9
                            && Math.abs(d.zAs[2] - 1) < 1e-9));
    check('de spijlvoeten volgen de helling',
        Math.abs((trapSpijlen[trapSpijlen.length - 1].oorsprong[2]
                - trapSpijlen[0].oorsprong[2])
            - (langsX[langsX.length - 1] - langsX[0]) * 0.5) < 1e-6,
        'stijging per spijl klopt met 1500/3000');

    const trapRegel = trap.delen.find(d => d.soort === 'handregel');
    check('de handregel loopt schuin mee', Math.abs(trapRegel.xAs[2] - 0.4472136) < 1e-6,
        trapRegel.xAs[2].toFixed(6));

    log('\n--- de leuninghoogte wordt verticaal gemeten ---');
    // De rand loopt van (0,0,0) naar (3000,0,1500), dus z = x/2.
    // We pakken twee hoekpunten van het BOVENVLAK van de handregel en kijken
    // hoe hoog die boven de rand liggen, recht naar beneden gemeten.
    const randZ = (x) => x * 0.5;
    const topHoek = [0, 1, 2].map(k =>
        trapRegel.oorsprong[k] + trapRegel.zAs[k] * trapMaten.handregelHoogte);
    const topEind = [0, 1, 2].map(k =>
        topHoek[k] + trapRegel.xAs[k] * trapRegel.dx);

    check('bovenkant handregel ligt aan het begin 1000 mm boven de rand',
        Math.abs((topHoek[2] - randZ(topHoek[0])) - trapMaten.hoogte) < 1e-6,
        `${(topHoek[2] - randZ(topHoek[0])).toFixed(3)} mm`);
    check('bovenkant handregel ligt aan het eind 1000 mm boven de rand',
        Math.abs((topEind[2] - randZ(topEind[0])) - trapMaten.hoogte) < 1e-6,
        `${(topEind[2] - randZ(topEind[0])).toFixed(3)} mm`);
    // Van HART tot HART van de buitenste staanders, en dus niet meer over de
    // vrije lengte tussen hun binnenvlakken: de regel ligt er nu bovenop.
    check('de handregel loopt van hart tot hart over de staanders',
        Math.abs((topEind[0] - topHoek[0]) - trapVeld.horizontaleLengte) < 1e-6,
        `${(topEind[0] - topHoek[0]).toFixed(3)} mm horizontaal, `
        + `hart op hart ${trapVeld.horizontaleLengte.toFixed(3)}`);

    log('\n--- het voorbeeld in het paneel klopt met wat er gebouwd wordt ---');
    // Het kader 'Berekend' laat zien wat je gaat krijgen. Als dat langs een
    // andere weg gerekend wordt dan het bouwen zelf, gaan de twee uit elkaar
    // lopen zodra er iets aan de meetkunde verandert - en dan staat er een
    // getal op het scherm dat niet klopt.
    const { voorspelBalustrade } = await win.eval("import('/build-balustrade.js')");
    for (const testLengte of [500, 1200, 2000, 3500, 6000]) {
        const m = { ...standaard, lengte: testLengte };
        const voorspeld = voorspelBalustrade(m);
        const gebouwdVeld = pad.padDelen([[0, 0, 0], [testLengte, 0, 0]], false, m).velden[0];
        check(`lengte ${testLengte}: voorbeeld = werkelijkheid`,
            voorspeld.spijlen.aantal === gebouwdVeld.spijlen.aantal
            && Math.abs(voorspeld.spijlen.doorgang - gebouwdVeld.spijlen.doorgang) < 1e-9,
            `${voorspeld.spijlen.aantal} spijlen, `
            + `doorgang ${voorspeld.spijlen.doorgang.toFixed(2)} mm`);
    }

    log('\n--- hoogteverschil in het paneel geeft een trapleuning ---');
    const schuinVeld = voorspelBalustrade(
        { ...standaard, lengte: 3000, hoogteverschil: 1500 });
    check('3000 lang met 1500 stijging geeft 26,6°',
        Math.abs(schuinVeld.helling - 26.565051) < 1e-4,
        schuinVeld.helling.toFixed(3) + '°');
    check('de horizontale lengte blijft 3000',
        Math.abs(schuinVeld.horizontaleLengte - 3000) < 1e-9,
        schuinVeld.horizontaleLengte);
    check('doorgang blijft onder het maximum',
        schuinVeld.spijlen.doorgang <= standaard.maxDoorgang + 1e-9,
        schuinVeld.spijlen.doorgang.toFixed(3));

    const vlakZelfde = voorspelBalustrade(
        { ...standaard, lengte: 3000, hoogteverschil: 0 });
    check('bij dezelfde horizontale lengte evenveel spijlen als vlak',
        schuinVeld.spijlen.aantal === vlakZelfde.spijlen.aantal,
        `schuin ${schuinVeld.spijlen.aantal} vs vlak ${vlakZelfde.spijlen.aantal}`);

    let teSteil = null;
    try { voorspelBalustrade({ ...standaard, lengte: 1000, hoogteverschil: 5000 }); }
    catch (e) { teSteil = e.message; }
    check('een te steile helling wordt geweigerd', teSteil !== null, teSteil);

    log('\n--- vlak veld blijft zich hetzelfde gedragen ---');
    const vlakVeld = pad.padDelen([[0, 0, 0], [3000, 0, 0]], false, trapMaten);
    check('helling van een vlak veld is 0°',
        Math.abs(vlakVeld.velden[0].helling) < 1e-9, vlakVeld.velden[0].helling);
    check('vlak veld: spijlhoogte is hoogte min regelhoogte',
        Math.abs(vlakVeld.delen.find(d => d.soort === 'spijl').dz
            - (trapMaten.hoogte - trapMaten.handregelHoogte)) < 1e-9);

    // ======================= DEEL J: trapregels =============================
    log('\n\n======== DEEL J: rechte trap ========\n');

    const trapRegels = await win.eval("import('/trap-regels.js')");
    const [minOptrede, maxOptrede] = trapRegels.NORMEN.optrede;
    const [minAantrede, maxAantrede] = trapRegels.NORMEN.aantrede;

    log(`regels: optrede ${minOptrede}–${maxOptrede} mm, `
        + `aantrede ${minAantrede}–${maxAantrede} mm, `
        + `loopregel 2×optrede + aantrede ≈ ${trapRegels.NORMEN.loopregelDoel} mm\n`);

    log(`  ${'hoogte'.padStart(7)} ${'optr'.padStart(5)} ${'treden'.padStart(7)}`
        + ` ${'optrede'.padStart(9)} ${'aantrede'.padStart(9)}`
        + ` ${'aanzet'.padStart(8)} ${'helling'.padStart(8)}`);
    log('  ' + '-'.repeat(60));
    for (const h of [300, 1000, 2600, 3000, 4500]) {
        const t = trapRegels.berekenTrap({ hoogte: h });
        log(`  ${String(h).padStart(7)} ${String(t.optreden).padStart(5)}`
            + ` ${String(t.treden).padStart(7)} ${t.optrede.toFixed(2).padStart(9)}`
            + ` ${t.aantrede.toFixed(2).padStart(9)} ${t.aanzet.toFixed(0).padStart(8)}`
            + ` ${(t.helling.toFixed(1) + '°').padStart(8)}`);
    }

    log('\n--- ijkpunten ---');
    for (const punt of trapRegels.IJKPUNTEN) {
        const t = trapRegels.berekenTrap({ hoogte: punt.hoogte });
        const goed = t.optreden === punt.optreden
            && t.treden === punt.treden
            && Math.abs(t.optrede - punt.optrede) < 1e-6
            && Math.abs(t.aantrede - punt.aantrede) < 1e-6;
        check(`hoogte ${punt.hoogte}`, goed,
            `${t.optreden} optreden, ${t.treden} treden, `
            + `optrede ${t.optrede.toFixed(6)}, aantrede ${t.aantrede.toFixed(6)}`);
    }

    log('\n--- de veiligheidseis over het hele bereik ---');
    // De optrede mag nergens boven het maximum uitkomen. Dat is de eis waar het
    // om gaat, dus die controleren we niet op vijf losse waarden maar overal.
    const [minH, maxH] = trapRegels.GRENZEN.hoogte;
    const teHoog = [];
    const teDiep = [];
    const verkeerdAantal = [];
    for (let h = minH; h <= maxH; h += 1) {
        const t = trapRegels.berekenTrap({ hoogte: h });
        if (t.optrede > maxOptrede + 1e-9) teHoog.push(h);
        if (t.aantrede < minAantrede - 1e-9 || t.aantrede > maxAantrede + 1e-9) teDiep.push(h);
        if (t.treden !== t.optreden - 1) verkeerdAantal.push(h);
    }
    check(`optrede blijft overal onder ${maxOptrede} mm (hoogte ${minH}–${maxH})`,
        teHoog.length === 0, teHoog.slice(0, 3).join(', '));
    check(`aantrede blijft overal binnen ${minAantrede}–${maxAantrede} mm`,
        teDiep.length === 0, teDiep.slice(0, 3).join(', '));
    check('aantal treden is altijd één minder dan het aantal optreden',
        verkeerdAantal.length === 0, verkeerdAantal.slice(0, 3).join(', '));

    // Zuinigheid: één trede minder moet de optrede WEL te hoog maken.
    const teVeel = [];
    for (let h = minH; h <= maxH; h += 1) {
        const t = trapRegels.berekenTrap({ hoogte: h });
        if (t.optreden <= 1) continue;
        if (h / (t.optreden - 1) <= maxOptrede + 1e-9) teVeel.push(h);
    }
    check('nooit meer treden dan nodig', teVeel.length === 0,
        teVeel.slice(0, 3).join(', '));

    log('\n--- de loopregel klopt met de uitkomst ---');
    for (const h of [1000, 2600, 3000]) {
        const t = trapRegels.berekenTrap({ hoogte: h });
        check(`hoogte ${h}: 2×optrede + aantrede = ${t.loopregel.toFixed(1)} mm`,
            Math.abs(t.loopregel - (2 * t.optrede + t.aantrede)) < 1e-9);
    }

    log('\n--- waarschuwingen bij een trap die net buiten het comfort valt ---');
    // Bij sommige hoogtes valt de optrede ONDER het minimum. Bijvoorbeeld 380
    // mm: dat is net te veel voor twee stappen, dus worden het er drie van
    // 126,7 mm. Dat is geen fout - de trap is veilig - maar hij loopt flauw, en
    // dat hoort de gebruiker te horen.
    const flauweTrap = trapRegels.berekenTrap({ hoogte: 380 });
    const flauw = trapRegels.beoordeelTrap(flauweTrap);
    check('een flauwe trap levert een waarschuwing op', flauw.length > 0,
        `optrede ${flauweTrap.optrede.toFixed(1)} mm — ${flauw.join(' | ')}`);

    const nette = trapRegels.beoordeelTrap(trapRegels.berekenTrap({ hoogte: 3000 }));
    check('een normale trap levert geen waarschuwing op', nette.length === 0,
        nette.join(' | '));

    log('\n--- invoer die geweigerd wordt ---');
    for (const [omschrijving, invoer] of [
        ['hoogte 10 m', { ...trapRegels.STANDAARD, hoogte: 10000 }],
        ['breedte 200 mm', { ...trapRegels.STANDAARD, breedte: 200 }],
        ['hoogte als tekst', { ...trapRegels.STANDAARD, hoogte: 'drie meter' }],
    ]) {
        const f = trapRegels.valideer(invoer);
        check(`${omschrijving} wordt geweigerd`, f.length > 0, f.join('; '));
    }
    check('normale invoer wordt geaccepteerd',
        trapRegels.valideer(trapRegels.STANDAARD).length === 0,
        trapRegels.valideer(trapRegels.STANDAARD).join('; '));

    // ======================= DEEL K: trapgeometrie ==========================
    log('\n\n======== DEEL K: trapgeometrie ========\n');

    const trapBouw = await win.eval("import('/build-trap.js')");
    const trapInvoer = { ...trapRegels.STANDAARD };
    const { delen: trapOnderdelen, trap: trapMaat } = trapBouw.trapDelen(trapInvoer);

    const treden = trapOnderdelen.filter(d => d.soort === 'trede');
    const bomen = trapOnderdelen.filter(d => d.soort === 'trapboom');

    log(`hoogte ${trapInvoer.hoogte} mm -> ${trapMaat.treden} treden, `
        + `optrede ${trapMaat.optrede} mm, aantrede ${trapMaat.aantrede} mm\n`);

    check(`${trapMaat.treden} treden gebouwd`, treden.length === trapMaat.treden,
        treden.length);
    check('2 trapbomen', bomen.length === 2, bomen.length);

    log('--- de treden sluiten op elkaar aan ---');
    // In bovenaanzicht lijken er openingen tussen de treden te zitten, maar dat
    // is perspectief: ze liggen op verschillende hoogtes. Hier meten we na of
    // de achterkant van de ene trede precies de voorkant van de volgende raakt.
    const opVolgorde = [...treden].sort((a, b) => a.oorsprong[0] - b.oorsprong[0]);
    const gaten = [];
    const stappen = [];
    for (let i = 1; i < opVolgorde.length; i++) {
        const achterVorige = opVolgorde[i - 1].oorsprong[0] + opVolgorde[i - 1].dx;
        const voorDeze = opVolgorde[i].oorsprong[0] + trapInvoer.tredeOverstek;
        gaten.push(voorDeze - achterVorige);
        stappen.push(opVolgorde[i].oorsprong[2] - opVolgorde[i - 1].oorsprong[2]);
    }
    check('geen gat tussen twee opeenvolgende treden',
        gaten.every(g => Math.abs(g) < 1e-9),
        `grootste ${Math.max(...gaten.map(Math.abs)).toExponential(2)} mm`);
    check('elke trede ligt precies één optrede hoger',
        stappen.every(s => Math.abs(s - trapMaat.optrede) < 1e-9),
        `${stappen[0].toFixed(3)} mm`);

    check('de eerste trede begint op x = 0',
        Math.abs(opVolgorde[0].oorsprong[0] + trapInvoer.tredeOverstek) < 1e-9,
        opVolgorde[0].oorsprong[0]);
    check('de bovenkant van de laatste trede ligt één optrede onder de vloer',
        Math.abs((opVolgorde.at(-1).oorsprong[2] + opVolgorde.at(-1).dz)
            - (trapInvoer.hoogte - trapMaat.optrede)) < 1e-9,
        opVolgorde.at(-1).oorsprong[2] + opVolgorde.at(-1).dz);

    log('\n--- de trapboom volgt de lijn door de tredeneuzen ---');
    const boom = bomen[0];
    log('omtrek:', boom.omtrek.map(([x, z]) =>
        `(${x.toFixed(1)}, ${z.toFixed(1)})`).join(' '));

    // De eerste twee punten van de omtrek zijn de bovenvoor- en bovenachterhoek.
    check('bovenkant boom begint bij de eerste tredeneus (x=0, z=optrede)',
        Math.abs(boom.omtrek[0][0]) < 1e-9
        && Math.abs(boom.omtrek[0][1] - trapMaat.optrede) < 1e-9,
        `(${boom.omtrek[0][0].toFixed(3)}, ${boom.omtrek[0][1].toFixed(3)})`);
    check('bovenkant boom eindigt op de bovenvloer (x=aanzet, z=hoogte)',
        Math.abs(boom.omtrek[1][0] - trapMaat.aanzet) < 1e-6
        && Math.abs(boom.omtrek[1][1] - trapInvoer.hoogte) < 1e-6,
        `(${boom.omtrek[1][0].toFixed(3)}, ${boom.omtrek[1][1].toFixed(3)})`);

    // Dit was de openstaande vereenvoudiging: de boom stak onder de vloer uit.
    const laagstePunt = Math.min(...boom.omtrek.map(pt => pt[1]));
    check('niets van de boom steekt onder vloerpeil',
        laagstePunt > -1e-9, `laagste punt ${laagstePunt.toFixed(3)} mm`);
    check('de boom is op de vloer afgeknipt: er liggen punten op z = 0',
        boom.omtrek.some(pt => Math.abs(pt[1]) < 1e-9),
        boom.omtrek.filter(pt => Math.abs(pt[1]) < 1e-9).length + ' punten op de vloer');
    check('door het afknippen heeft de omtrek meer dan vier hoeken',
        boom.omtrek.length > 4, boom.omtrek.length + ' hoeken');

    // Bij een lage boom steekt er niets uit en blijft de omtrek een vierhoek.
    const lageBoom = trapBouw.trapDelen({ ...trapInvoer, boomHoogte: 150 })
        .delen.find(d => d.soort === 'trapboom');
    check('een lage boom hoeft niet afgeknipt te worden',
        lageBoom.omtrek.length === 4, lageBoom.omtrek.length + ' hoeken');

    log('\n--- de treden passen tussen de bomen ---');
    const halveBreedte = trapInvoer.breedte / 2;
    check('trede loopt van boom tot boom',
        Math.abs(treden[0].oorsprong[1] + (halveBreedte - trapInvoer.boomDikte)) < 1e-9
        && Math.abs(treden[0].dy - 2 * (halveBreedte - trapInvoer.boomDikte)) < 1e-9,
        `y van ${treden[0].oorsprong[1]} over ${treden[0].dy} mm`);
    check('bomen liggen aan de buitenkant',
        Math.abs(bomen[0].y + halveBreedte) < 1e-9
        && Math.abs(bomen[1].y - (halveBreedte - trapInvoer.boomDikte)) < 1e-9,
        `y = ${bomen[0].y} en ${bomen[1].y}`);
    check('de stuklijst noemt nog steeds het ruwe plat staal',
        Math.abs(bomen[0].dz - trapInvoer.boomHoogte) < 1e-9
        && Math.abs(bomen[0].dy - trapInvoer.boomDikte) < 1e-9,
        `${bomen[0].dy} × ${bomen[0].dz} mm`);

    log('\n--- trap met leuning in één keer ---');
    const balMaten = { ...standaard };
    const metLeuning = trapBouw.trapDelen(trapInvoer, balMaten, 'beide');
    const staanders = metLeuning.delen.filter(d => d.soort === 'staander');
    const leuningSpijlen = metLeuning.delen.filter(d => d.soort === 'spijl');

    check('leuning aan beide zijden geeft 4 staanders',
        staanders.length === 4, staanders.length);
    check('er zitten spijlen in', leuningSpijlen.length > 0, leuningSpijlen.length);

    // De staander moet met zijn binnenkant tegen de buitenkant van de trapboom
    // staan. De boom loopt tot y = ±breedte/2.
    const buitenkantBoom = trapInvoer.breedte / 2;
    // Een staander is een balk; welke hoek de 'oorsprong' is hangt af van de
    // richting van het pad. Dus meten we het BEREIK dat hij inneemt, niet één
    // hoekpunt - dat is wat er fysiek toe doet.
    const bereikY = (d) => {
        const a = d.oorsprong[1];
        const b = a + d.yAs[1] * d.dy;
        return [Math.min(a, b), Math.max(a, b)];
    };
    const bereiken = staanders.map(bereikY);
    log('staanders liggen op y: '
        + bereiken.map(([a, b]) => `${a}…${b}`).join('  '));

    const linker = bereiken.filter(([a]) => a < 0);
    const rechter = bereiken.filter(([a]) => a > 0);

    check('linkerstaander sluit aan op de buitenkant van de boom',
        linker.length > 0 && linker.every(([, b]) => Math.abs(b + buitenkantBoom) < 1e-9),
        linker.map(([a, b]) => `${a}…${b}`).join(' '));
    check('rechterstaander sluit aan op de buitenkant van de boom',
        rechter.length > 0 && rechter.every(([a]) => Math.abs(a - buitenkantBoom) < 1e-9),
        rechter.map(([a, b]) => `${a}…${b}`).join(' '));
    check('geen staander steekt over de trede heen',
        bereiken.every(([a, b]) => a >= buitenkantBoom - 1e-9 || b <= -buitenkantBoom + 1e-9));

    // De leuning volgt de trap, dus dezelfde helling.
    const links = trapBouw.trapDelen(trapInvoer, balMaten, 'links');
    const leuningVeld = padDelenVanLeuning(links.delen);
    check('de leuning heeft dezelfde helling als de trap',
        leuningVeld === null || Math.abs(leuningVeld - trapMaat.helling) < 1e-6,
        `${leuningVeld?.toFixed(3)}° tegenover ${trapMaat.helling.toFixed(3)}°`);

    check('leuning links geeft de helft van het aantal staanders van beide',
        links.delen.filter(d => d.soort === 'staander').length === 2);
    check('geen leuning laat de trap zoals hij was',
        trapBouw.trapDelen(trapInvoer, balMaten, 'geen').delen.length
            === trapOnderdelen.length);

    // De spijlen van een trapleuning staan verticaal, ook al loopt hij schuin.
    check('de spijlen van de leuning staan verticaal',
        leuningSpijlen.every(d => Math.abs(d.zAs[2] - 1) < 1e-9));

    function padDelenVanLeuning(alle) {
        const regel = alle.find(d => d.soort === 'handregel');
        if (!regel) return null;
        return Math.atan2(regel.xAs[2], Math.hypot(regel.xAs[0], regel.xAs[1]))
            * 180 / Math.PI;
    }

    log('\n--- trap met bordes ---');
    const metBordes = { ...trapInvoer, bordesNa: 8, bordesLengte: 1000 };
    const bordesTrap = trapRegels.berekenTrap(metBordes);
    log(`${bordesTrap.optreden} optreden, bordes na ${bordesTrap.bordes?.na}, `
        + `vluchten ${bordesTrap.vluchten.map(v => v.treden).join(' + ')} treden, `
        + `aanzet ${Math.round(bordesTrap.aanzet)} mm`);

    check('het bordes zit erin', bordesTrap.bordes !== null);
    check('twee vluchten', bordesTrap.vluchten.length === 2,
        bordesTrap.vluchten.length);
    check('de vluchten plus het bordes zijn samen alle stappen',
        bordesTrap.vluchten.reduce((s, v) => s + v.treden, 0) + 1 === bordesTrap.treden,
        `${bordesTrap.vluchten.map(v => v.treden).join('+')}+1 = ${bordesTrap.treden}`);
    check('het bordes ligt op de juiste hoogte',
        Math.abs(bordesTrap.bordes.hoogte - 8 * bordesTrap.optrede) < 1e-9,
        bordesTrap.bordes.hoogte);
    // Het bordes is langer dan een trede, dus de trap wordt langer.
    const zonderBordes = trapRegels.berekenTrap(trapInvoer);
    check('een bordes maakt de trap langer',
        bordesTrap.aanzet > zonderBordes.aanzet,
        `${Math.round(bordesTrap.aanzet)} tegenover ${Math.round(zonderBordes.aanzet)} mm`);

    log('\n--- wanneer kan er geen bordes ---');
    for (const [omschrijving, invoer] of [
        ['na stap 1', { ...trapInvoer, bordesNa: 1 }],
        ['na de op één na laatste stap', { ...trapInvoer, bordesNa: 15 }],
        ['bij een trap van maar 3 optreden', { ...trapInvoer, hoogte: 500, bordesNa: 2 }],
    ]) {
        const f = trapRegels.controleerBordes(invoer);
        check(`${omschrijving} wordt geweigerd`, f.length > 0, f.join('; '));
    }
    check('bordesNa 0 is gewoon geen bordes',
        trapRegels.controleerBordes({ ...trapInvoer, bordesNa: 0 }).length === 0);

    log('\n--- de geometrie van een trap met bordes ---');
    const bordesDelen = trapBouw.trapDelen(metBordes, standaard, 'links').delen;
    const bordesPlaat = bordesDelen.filter(d => d.soort === 'bordes');
    const bordesBomen = bordesDelen.filter(d => d.soort === 'bordesboom');
    const alleBomen = bordesDelen.filter(d => d.soort === 'trapboom');

    check('één bordesplaat', bordesPlaat.length === 1, bordesPlaat.length);
    check('twee zijplaten onder het bordes', bordesBomen.length === 2, bordesBomen.length);
    check('vier trapbomen: twee per vlucht', alleBomen.length === 4, alleBomen.length);
    check('de bordesplaat is zo lang als opgegeven',
        Math.abs(bordesPlaat[0].dx - 1000) < 1e-9, bordesPlaat[0].dx);

    // De leuning moet over het bordes vlak lopen en aan weerszijden schuin.
    const bordesRegels = bordesDelen.filter(d => d.soort === 'handregel');
    const hellingen = bordesRegels.map(d =>
        Math.atan2(d.xAs[2], Math.hypot(d.xAs[0], d.xAs[1])) * 180 / Math.PI);
    log('leuninghellingen: ' + hellingen.map(h => h.toFixed(1) + '°').join(', '));
    check('de leuning heeft drie stukken', bordesRegels.length === 3, bordesRegels.length);
    check('het middelste stuk is vlak',
        hellingen.filter(h => Math.abs(h) < 1e-6).length === 1,
        hellingen.map(h => h.toFixed(2)).join(', '));
    // Dit is de reden dat het vlakke stuk een aantrede korter is dan het bordes:
    // anders zou de tweede vlucht steiler worden dan de trap eronder.
    const schuineStukken = hellingen.filter(h => Math.abs(h) > 1e-6);
    check('beide schuine stukken hebben dezelfde helling als de trap',
        schuineStukken.every(h => Math.abs(h - bordesTrap.helling) < 1e-6),
        `${schuineStukken.map(h => h.toFixed(3)).join(', ')} tegenover `
        + `${bordesTrap.helling.toFixed(3)}`);

    log('\n--- de gebouwde trap ---');
    const trapUit = await trapBouw.bouwTrap(trapInvoer);
    const trapGelezen = await readBrepEdges(
        await schrijfStep(trapUit.shape), trapInvoer.hoogte);
    log('topologie :', JSON.stringify(trapGelezen.counts));
    check(`${trapOnderdelen.length} losse solids`,
        trapGelezen.counts.SOLID === trapOnderdelen.length,
        trapGelezen.counts.SOLID);
    check('stuklijst telt evenveel stuks als het model',
        trapUit.stuklijst.reduce((s, r) => s + r.aantal, 0) === trapGelezen.counts.SOLID,
        trapUit.stuklijst.map(r => `${r.soort} ${r.aantal}`).join(', '));

    // ======================= DEEL L: profielcatalogus =======================
    log('\n\n======== DEEL L: profielcatalogus ========\n');

    const cat = await win.eval("import('/profielen.js')");

    log('--- getallen: nullen achter de komma eraf ---');
    for (const [in_, uit] of [
        [2.0, '2'], [21.3, '21.3'], [6.3, '6.3'], [0.5, '0.5'], [1620, '1620'],
        [12.50, '12.5'], [100.0, '100'], [3, '3'], [null, ''], ['', ''],
    ]) {
        check(`${JSON.stringify(in_)} -> "${uit}"`, cat.getalTekst(in_) === uit,
            `"${cat.getalTekst(in_)}"`);
    }

    log('\n--- de nominale maat van een gasbuis uit SIZE ---');
    // De opdracht geeft hier een voorbeeld: R 1 1/4 " moet 1 1/4" worden.
