    log('\n\n======== DEEL AM: vulling — spijlen, horizontaal, geen ========\n');

    // Tot nu toe kende de app maar één vulling: verticale spijlen. Alles aan de
    // leuning was instelbaar behalve waarmee hij gevuld is.
    log('--- 1. dezelfde veiligheidsregel, andere richting ---');
    // DIT IS DE KERN. berekenSpijlen weet niet dat hij over een horizontale
    // richting gaat; hij verdeelt staven over een lengte zonder dat de opening
    // te groot wordt. Met de vrije HOOGTE en de DIKTE van een regel erin komt
    // de verdeling van liggende regels eruit. Eén formule, twee toepassingen.
    const amR = regelsNu.berekenSpijlen(
        { lengte: 698, maxDoorgang: 100, spijlBreedte: 6 });
    // Met de hand: ceil((698-100)/(100+6)) = ceil(5,64) = 6 regels.
    // Opening: (698 - 6x6) / 7 = 662/7 = 94,571...
    check('698 mm vrije hoogte met regels van 6 geeft 6 regels',
        amR.aantal === 6, amR.aantal);
    check('en een opening van 94,57 mm',
        Math.abs(amR.doorgang - 662 / 7) < 1e-9, amR.doorgang.toFixed(3));
    check('die opening blijft ONDER het maximum van 100',
        amR.doorgang < 100, amR.doorgang.toFixed(2));
    check('de maximale opening voor liggende regels staat APART in de regels',
        typeof regelsNu.VULLING.maxDoorgangHorizontaal === 'number',
        regelsNu.VULLING.maxDoorgangHorizontaal);
    check('er zijn vier soorten vulling',
        regelsNu.VULLING.soorten.join(',') === 'spijlen,horizontaal,glas,geen',
        regelsNu.VULLING.soorten.join(','));
    // Een onbekende waarde mag de bouw niet laten vastlopen.
    // Let op bij het uitbreiden: 'glas' stond hier als voorbeeld van een
    // ONBEKENDE soort, en werd een bekende. De controle sloeg daarna aan op
    // iets wat juist goed ging. Daarom nu een naam die er niet in zit.
    check('een onbekende soort valt terug op spijlen',
        regelsNu.vullingSoort('rvs-gaas') === 'spijlen'
        && regelsNu.vullingSoort(undefined) === 'spijlen'
        && regelsNu.vullingSoort('') === 'spijlen');
    check('en een bekende blijft staan',
        regelsNu.vullingSoort('horizontaal') === 'horizontaal');

    log('\n--- 2. wat er gebouwd wordt ---');
    const amMaten = (soort) => ({ ...regelsNu.STANDAARD, lengte: 2000,
                                  hoogte: 1000, vulling: soort });
    const amTel = (delen, soort) =>
        delen.filter(d => d.soort === soort).length;

    for (const [soort, verwacht] of [
        ['spijlen', { spijl: true, vulregel: 'raam' }],
        ['horizontaal', { spijl: false, vulregel: 'meer' }],
        ['glas', { spijl: false, vulregel: 'raam' }],
        ['geen', { spijl: false, vulregel: 'niets' }],
    ]) {
        const r = await bouwMod.bouwBalustrade(amMaten(soort));
        const sp = amTel(r.delen ?? [], 'spijl');
        const vr = amTel(r.delen ?? [], 'vulregel');
        log(`   ${soort.padEnd(12)}: ${r.aantalDelen} delen, `
            + `${sp} spijlen, ${vr} vulregels`);
        if (verwacht.spijl) {
            check(`${soort}: er staan spijlen`, sp > 0, sp);
        } else {
            check(`${soort}: GEEN spijlen`, sp === 0, sp);
        }
        if (verwacht.vulregel === 'niets') {
            // Geen vulling betekent ook geen raam: een leeg raampje tussen de
            // staanders hangen heeft geen functie.
            check(`${soort}: ook geen vulregels — het raam gaat mee uit`,
                vr === 0, vr);
        } else {
            check(`${soort}: er zijn vulregels`, vr > 0, vr);
        }
    }

    // Drie velden tussen vier staanders. Bij spijlen twee regels per veld,
    // bij horizontaal die twee plus zes tussenregels.
    const amSp = await bouwMod.bouwBalustrade(amMaten('spijlen'));
    const amHo = await bouwMod.bouwBalustrade(amMaten('horizontaal'));
    check('horizontaal geeft per veld zes regels MEER dan spijlen',
        amTel(amHo.delen, 'vulregel') - amTel(amSp.delen, 'vulregel')
        === 6 * amSp.velden.length,
        `${amTel(amHo.delen, 'vulregel')} tegenover `
        + `${amTel(amSp.delen, 'vulregel')} over ${amSp.velden.length} velden`);

    log('\n--- 3. wat het veld terugmeldt ---');
    check('bij spijlen staat de vulling erbij',
        amSp.velden[0].vulling === 'spijlen' && amSp.velden[0].liggend === null);
    check('bij horizontaal komt er een eigen telling bij',
        amHo.velden[0].vulling === 'horizontaal'
        && amHo.velden[0].liggend.aantal === 6,
        amHo.velden[0].liggend && amHo.velden[0].liggend.aantal);
    // GEEN SPIJLEN BETEKENT NIET "0 SPIJLEN OP HET SCHERM". Het paneel leest
    // dit uit; stond hier een aantal dat er niet is, dan toont het paneel een
    // getal over iets wat niet bestaat.
    check('en het spijlenaantal staat dan op nul in plaats van op een rest',
        amHo.velden[0].spijlen.aantal === 0
        && amHo.velden[0].spijlen.doorgang === 0);

    log('\n--- 3b. glas: een derde soort onderdeel ---');
    const amGlas = await bouwMod.bouwBalustrade(amMaten('glas'));
    const amRuiten = amGlas.delen.filter(d => d.soort === 'ruit');
    check('er komt één ruit per veld',
        amRuiten.length === amGlas.velden.length,
        `${amRuiten.length} ruiten over ${amGlas.velden.length} velden`);
    const amR0 = amRuiten[0];
    check('de ruit is van glas en niet van staal',
        amR0.materiaal === 'glas', amR0.materiaal);
    check('en zo dik als het gelaagde glas uit de regels',
        amR0.dy === regelsNu.GLAS.dikte, amR0.dy);
    // DE BESTELMAAT IS GROTER DAN WAT JE ZIET. De ruit steekt boven en onder
    // in de klem; dat stuk hoort wel bij de bestelling maar niet bij de
    // opening. Wie dat vergeet bestelt een ruit die er doorheen valt.
    const amV = amGlas.velden[0].glas;
    check('de bestelhoogte is de vrije opening plus twee keer de inklemming',
        Math.abs(amV.hoogte - (amV.vrijeHoogte + 2 * regelsNu.GLAS.inklemming)) < 1e-9,
        `${amV.hoogte.toFixed(2)} tegenover `
        + `${(amV.vrijeHoogte + 2 * regelsNu.GLAS.inklemming).toFixed(2)}`);
    check('en de vrije opening is kleiner dan het veld, door de speling',
        amV.vrijeHoogte < amV.hoogte, amV.vrijeHoogte.toFixed(1));

    // DE DERDE BAK. Tot nu toe gold: elk onderdeel wordt gezaagd of gesneden.
    // Glas is geen van beide - dat bestel je op maat bij de glashandel - en
    // zonder deze uitzondering zou de app een ruit op een stalen stang
    // inplannen en zijn gewicht bij de staalkilo's optellen.
    const amZl = await win.eval("import('/zaaglijst.js')");
    const amDxf = await win.eval("import('/dxf.js')");
    check('een ruit wordt NIET gezaagd', amZl.wordtGezaagd(amR0) === false);
    check('een ruit wordt WEL op maat besteld', amZl.wordtBesteld(amR0) === true);
    check('en levert geen DXF op — glas gaat niet naar de snijtafel',
        amDxf.maakDxf(amR0) === null);
    const amStaal = amGlas.delen.find(d => d.soort === 'staander');
    check('een stalen staander wordt nog gewoon gezaagd',
        amZl.wordtGezaagd(amStaal) === true
        && amZl.wordtBesteld(amStaal) === false);

    const amLijst = amZl.maakZaaglijst(amGlas.onderdelen);
    const amRuitRegel = amLijst.besteld.find(b => b.soort === 'ruit');
    check('de zaaglijst zet de ruit apart onder "besteld"', !!amRuitRegel,
        JSON.stringify(amLijst.besteld));
    check('met de bestelmaat erbij',
        /\d+(\.\d+)? × \d+/.test(amRuitRegel.maat), amRuitRegel.maat);
    check('en de ruit staat NIET tussen de te zagen stukken',
        amLijst.groepen.every(g => !/ruit/i.test(g.profiel)),
        amLijst.groepen.map(g => g.profiel).join(', '));
    // Elk onderdeel in precies één bak: gezaagd, gesneden of besteld.
    const amG = amGlas.onderdelen.filter(u => amZl.wordtGezaagd(u.deel)).length;
    const amS = amGlas.onderdelen.filter(u => amDxf.maakDxf(u.deel) !== null).length;
    const amB = amGlas.onderdelen.filter(u => amZl.wordtBesteld(u.deel)).length;
    check('gezaagd + gesneden + besteld is samen alles, zonder dubbeltelling',
        amG + amS + amB === amGlas.onderdelen.length,
        `${amG} + ${amS} + ${amB} = ${amGlas.onderdelen.length}`);

    log('\n--- 3c. de klemmen ---');
    // Een ruit hangt niet in de lucht. Zonder klemmen in de stuklijst kun je
    // een glazen leuning niet bestellen, en is het pakket dus onvolledig.
    const amKlem = amGlas.delen.filter(d => d.soort === 'glasklem');
    // Per veld: twee randen x twee klemmen x TWEE WANGEN.
    check('vier klemwangen per rand per veld',
        amKlem.length === amGlas.velden.length * 2 * regelsNu.GLAS.klem.perRand * 2,
        `${amKlem.length} over ${amGlas.velden.length} velden`);
    check('en de helft zit aan de onderregel, de helft aan de bovenregel',
        amKlem.filter(d => d.klemRand === 'onder').length
        === amKlem.filter(d => d.klemRand === 'boven').length,
        amKlem.filter(d => d.klemRand === 'onder').length);
    // EEN KLEM IS TWEE WANGEN, en dat is geen opmaak maar meetkunde: als één
    // massief blok zou hij dwars door de ruit staan. Precies de fout die bij
    // de ruit zelf 240 421 mm3 opleverde.
    const amWangen = [...new Set(amKlem.map(d => Math.round(
        d.oorsprong[1] * 1000)))];
    check('de wangen staan aan WEERSZIJDEN van het glas, niet erdoorheen',
        amWangen.length === 2, amWangen.length + ' verschillende dwarsposities');
    check('een glasklem wordt BESTELD en niet gezaagd',
        amZl.wordtBesteld(amKlem[0]) === true
        && amZl.wordtGezaagd(amKlem[0]) === false);
    check('de zaaglijst zet ruit én klem bij "besteld"',
        amLijst.besteld.length === 2
        && amLijst.besteld.some(b => b.soort === 'glasklem'),
        amLijst.besteld.map(b => b.soort).join(', '));

    log('\n--- 4. staal op twee plekken ---');
    // Nieuwe meetkunde is precies waar dit in dit project telkens misging:
    // op een VLAK stuk valt niets op, op een HELLING wel.
    //
    // BIJ GLAS GING HET HIER OOK MIS, en het was de moeite waard: de ruit
    // stond op het hart van het veld, net als de spijlen, en stak dus dwars
    // door de onder- en bovenregel heen - 240 421 mm3. Dat was geen
    // tekenfoutje maar een constructiefout: een ruit gaat niet TUSSEN de
    // regels maar wordt er met klemmen TEGENAAN gezet.
    for (const soort of ['horizontaal', 'glas', 'geen']) {
        adMeet(`vlak, vulling ${soort}`,
            await bouwMod.bouwPad([[0, 0, 0], [2000, 0, 0]], false,
                { ...adMaten, vulling: soort }));
        adMeet(`helling 1:2, vulling ${soort}`,
            await bouwMod.bouwPad([[0, 0, 0], [1600, 0, 800]], false,
                { ...adMaten, vulling: soort }));
    }

    log('\n--- 5. in de app ---');
    const amKeuze = doc.getElementById('p_vulling');
    check('de keuzelijst staat in het paneel', !!amKeuze);
    check('met de drie soorten uit de regels',
        [...amKeuze.options].map(o => o.value).join(',')
        === regelsNu.VULLING.soorten.join(','),
        [...amKeuze.options].map(o => o.value).join(','));

    amKeuze.value = 'horizontaal';
    amKeuze.dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(120);
    const amLet = doc.getElementById('vullingLet');
    // DE WAARSCHUWING MOET ER STAAN. Horizontale regels zijn beklimbaar, en
    // de app mag niet de indruk wekken dat dit zomaar overal mag.
    check('bij horizontale regels verschijnt een waarschuwing',
        amLet.style.display === 'block' && /beklimbaar/.test(amLet.textContent));
    check('die zegt dat het een AANNAME is en geen getoetste norm',
        /aanname/.test(amLet.textContent) && /norm/.test(amLet.textContent));
    check('en dat het vulraamwerk vanzelf aangaat',
        /vulraamwerk/.test(amLet.textContent));
    check('Berekend heet nu "liggende regels" in plaats van "aantal spijlen"',
        doc.getElementById('a_aantalKop').textContent === 'liggende regels',
        doc.getElementById('a_aantalKop').textContent);
    check('en de opening heet er uitdrukkelijk VERTICAAL bij',
        doc.getElementById('a_doorgangKop').textContent === 'opening verticaal',
        doc.getElementById('a_doorgangKop').textContent);

    amKeuze.value = 'glas';
    amKeuze.dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(120);
    // DE APP MAG NIET SUGGEREREN DAT HET GLAS STERK GENOEG IS. Welke dikte
    // nodig is hangt af van de ruitmaat en de belasting, en die berekening
    // maakt de app niet.
    check('bij glas waarschuwt de app dat het GELAAGD moet zijn',
        amLet.style.display === 'block' && /GELAAGD/.test(amLet.textContent));
    check('en zegt uitdrukkelijk dat er GEEN sterkteberekening is',
        /GEEN sterkteberekening/.test(amLet.textContent));
    check('en dat de ruit op maat besteld wordt, niet gezaagd of gesneden',
        /besteld/.test(amLet.textContent) && /zaaglijst/.test(amLet.textContent));
    // EN DE KOPJES ERNAAST MOETEN MEEBEWEGEN. Alleen de getallen laten
    // meebewegen gaf "hart op hart: 621 × 728 × 10,76 mm" - het getal klopte,
    // maar je leest het verkeerd.
    check('Berekend toont de bestelmaat van de ruit',
        /\d+ × \d+ × [\d.]+ mm/.test(doc.getElementById('a_steek').textContent),
        doc.getElementById('a_steek').textContent);
    check('en het kopje ernaast heet dan "bestelmaat ruit"',
        doc.getElementById('a_steekKop').textContent === 'bestelmaat ruit',
        doc.getElementById('a_steekKop').textContent);
    check('de eerste rij heet "ruiten" en niet "aantal spijlen"',
        doc.getElementById('a_aantalKop').textContent === 'ruiten',
        doc.getElementById('a_aantalKop').textContent);

    amKeuze.value = 'geen';
    amKeuze.dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(120);
    check('bij geen vulling verdwijnt de waarschuwing',
        amLet.style.display === 'none');
    // Het kopje heet dan "vulling" en de waarde "geen" — die twee samen, niet
    // de tekst "geen vulling" in één van de twee.
    check('en Berekend zegt: vulling — geen',
        doc.getElementById('a_aantalKop').textContent === 'vulling'
        && doc.getElementById('a_aantal').textContent === 'geen',
        doc.getElementById('a_aantalKop').textContent + ': '
        + doc.getElementById('a_aantal').textContent);

    amKeuze.value = 'spijlen';
    amKeuze.dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(120);
    check('terug naar spijlen geeft weer een aantal',
        Number(doc.getElementById('a_aantal').textContent) > 0,
        doc.getElementById('a_aantal').textContent);
    check('en de kopjes staan weer zoals ze altijd stonden',
        doc.getElementById('a_aantalKop').textContent === 'aantal spijlen'
        && doc.getElementById('a_doorgangKop').textContent === 'vrije doorgang'
        && doc.getElementById('a_steekKop').textContent === 'hart op hart');
    check('de vulling geeft geen fout in de console',
        errors.length === agVoor, errors.slice(agVoor).join(' | '));

    // ============ DEEL AN: hoeken intypen ===================================
    log('\n\n======== DEEL AN: hoeken intypen ========\n');

    // De hoekmeetkunde zat er al lang in - verstek, een staander in de
    // deelhoek, gesloten rondes - maar je kon er alleen bij door randen in een
    // ingeladen model aan te klikken. Nu kun je hem intypen.
    log('--- 1. het ontleden ---');
    const anO = regelsNu.ontleedVervolg;
    check('leeg betekent recht, precies zoals het was', anO('').length === 0
        && anO(null).length === 0 && anO('   ').length === 0);
    check('"90, 1500" is één knik van 90 graden en dan 1500 mm',
        JSON.stringify(anO('90, 1500')) === '[{"hoek":90,"lengte":1500}]',
        JSON.stringify(anO('90, 1500')));
    check('"90,1500,-90,800" zijn er twee, de tweede de andere kant op',
        anO('90,1500,-90,800').length === 2
        && anO('90,1500,-90,800')[1].hoek === -90);

    const anGooit = (t) => { try { anO(t); return null; } catch (e) { return e.message; } };
    // DE KOMMA SCHEIDT DE PAREN, dus een komma kan geen decimaalteken zijn. Een
    // punt wel. Dat is geen smaakkwestie: "90; 1500,5" zijn drie getallen, en
    // dat moet GEWEIGERD worden met uitleg in plaats van stil 5 mm te worden.
    check('een punt als decimaalteken mag',
        anO('90, 1500.5')[0].lengte === 1500.5, anO('90, 1500.5')[0].lengte);
    check('een komma als decimaalteken wordt geweigerd, met uitleg',
        /punt/.test(anGooit('90; 1500,5') || ''), anGooit('90; 1500,5'));
    check('en de melding laat zien wat hij gelezen heeft',
        /90, 1500, 5/.test(anGooit('90; 1500,5') || ''), anGooit('90; 1500,5'));
    check('een los getal wordt geweigerd', !!anGooit('90'), anGooit('90'));
    check('onzin wordt geweigerd', !!anGooit('links, ver'));
    check('een te korte zijde wordt geweigerd', !!anGooit('90, 50'), anGooit('90, 50'));
    // EN DE MELDING MOET ZEGGEN WAT ERAAN TE DOEN IS, niet alleen dat het fout is.
    check('de melding noemt de grenzen', /200.6000/.test(anGooit('90, 50') || ''),
        anGooit('90, 50'));

    log('\n--- 2. alleen rechte hoeken, en waarom ---');
    // DIT IS EEN BEPERKING MET EEN REDEN, en die reden is gemeten. De inzet van
    // een hoekstaander wordt berekend voor de HARTLIJN van het veld, terwijl
    // een vulregel 30 mm breed is en zijn buitenste hoek er eerder uit komt.
    // Bij 90 graden valt dat toevallig goed uit, daarbuiten niet.
    check('90 en -90 mogen', anO('90, 1500').length === 1
        && anO('-90, 1500').length === 1);
    for (const h of [135, 120, 60, 45, 89]) {
        check(`${h}° wordt geweigerd zolang de hoekinzet niet klopt`,
            !!anGooit(`${h}, 1500`), anGooit(`${h}, 1500`));
    }
    check('en de melding noemt het gemeten bewijs',
        /682/.test(anGooit('135, 1500') || ''), anGooit('135, 1500'));

    log('\n--- 3. wat er gebouwd wordt ---');
    const anBouw = (vervolg, extra = {}) => bouwMod.bouwBalustrade(
        { ...regelsNu.STANDAARD, lengte: 2000, hoogte: 1000, vervolg, ...extra });
    const anRecht = await anBouw('');
    const anL = await anBouw('90, 1500');
    const anU = await anBouw('90, 1500, 90, 2000');
    const anTel = (r, s) => r.delen.filter(d => d.soort === s).length;
    log(`   recht ${anRecht.delen.length} delen · L ${anL.delen.length} · `
        + `U ${anU.delen.length}`);
    check('een L-vorm heeft meer staanders dan een recht stuk',
        anTel(anL, 'staander') > anTel(anRecht, 'staander'),
        `${anTel(anL, 'staander')} tegenover ${anTel(anRecht, 'staander')}`);
    check('en een U-vorm weer meer dan een L',
        anTel(anU, 'staander') > anTel(anL, 'staander'),
        `${anTel(anU, 'staander')} tegenover ${anTel(anL, 'staander')}`);
    check('een L-vorm heeft meer velden dan een recht stuk',
        anL.velden.length > anRecht.velden.length,
        `${anL.velden.length} tegenover ${anRecht.velden.length}`);
    // EN HET MOET OM DE HOEK GAAN, niet alleen langer worden. Twee handregels
    // die elkaar in verstek raken is precies wat een hoek onderscheidt.
    check('er zijn twee handregels die in de hoek bij elkaar komen',
        anTel(anL, 'handregel') === 2, anTel(anL, 'handregel'));

    log('\n--- 4. staal op twee plekken, om de hoek ---');
    // Het hoekpad met de hand, zodat de meting niet van de invoer afhangt.
    const anHoekPad = (graden, l1, l2) => {
        const r = graden * Math.PI / 180;
        return [[0, 0, 0], [l1, 0, 0],
                [l1 + Math.cos(r) * l2, Math.sin(r) * l2, 0]];
    };
    for (const vulling of ['spijlen', 'horizontaal', 'glas']) {
        adMeet(`hoek 90°, vulling ${vulling}`,
            await bouwMod.bouwPad(anHoekPad(90, 2000, 1500), false,
                { ...adMaten, vulling }));
    }
    adMeet('U-vorm met glas', await bouwMod.bouwPad(
        [[0, 0, 0], [2000, 0, 0], [2000, 1500, 0], [0, 1500, 0]], false,
        { ...adMaten, vulling: 'glas' }));

    // DE RUIT IN EEN HOEK, apart genoemd omdat hij hier zelf is misgegaan: een
    // ruit ligt NAAST de hartlijn van zijn veld, en twee ruiten die elk tot aan
    // hun eigen hartlijn doorlopen snijden elkaar in de hoek. Gemeten voor de
    // reparatie: 14 583 mm3 bij 90 graden.
    const anGlasHoek = await bouwMod.bouwPad(anHoekPad(90, 2000, 1500), false,
        { ...adMaten, vulling: 'glas' });
    const anRuiten = anGlasHoek.delen
        .map((d, i) => ({ d, i })).filter(x => x.d.soort === 'ruit');
    check('er is één ruit per veld, ook om de hoek',
        anRuiten.length === anGlasHoek.velden.length,
        `${anRuiten.length} ruiten over ${anGlasHoek.velden.length} velden`);
    const anSolids = adSolids(anGlasHoek.shape);
    const anVerschuiving = anSolids.length - anGlasHoek.delen.length;
    let anRuitRuit = 0;
    for (let i = 0; i < anRuiten.length; i++) {
        for (let j = i + 1; j < anRuiten.length; j++) {
            const a = anSolids[anRuiten[i].i + anVerschuiving];
            const b = anSolids[anRuiten[j].i + anVerschuiving];
            if (a && b) anRuitRuit += adSamen(a, b);
        }
    }
    log(`   ruit in ruit: ${anRuitRuit.toFixed(2)} mm3 (was 14 583)`);
    check('twee ruiten raken elkaar in de hoek NIET meer',
        anRuitRuit < 1e-6, anRuitRuit.toFixed(4) + ' mm3');

    // ============ DEEL AO: zoeken in het paneel =============================

    // Zeven tabbladen, vijfendertig velden, zeventien knoppen. "Waar is de

    log('\n--- 2. zoeken op woorden die je zelf zou typen ---');

    // De lege, verborgen #vullingLet staat tussen de uitleg en het volgende

    check('een leeg zoekveld geeft niets',

    // De volgorde is de hele truc: een veld dat zo HEET boven een uitleg waar

    check('een exacte naam staat boven een toevallige vermelding',

    log('\n--- 3. in de app ---');
    const aoVeld = doc.getElementById('zoek');
    check('het zoekveld staat in de bovenbalk', !!aoVeld);
    aoVeld.value = 'zaaglijst';

    await sleep(140);
    const aoLijst = doc.getElementById('zoekLijst');
    check('er verschijnt een lijst met treffers',

    check('en bij elke treffer staat WAAR hij staat',

    const aoOpen = () => [...doc.querySelectorAll('#panel details.groep')]
        .filter(g => g.open).map(g => g.querySelector('summary').textContent.trim());
    // Eerst ergens ANDERS gaan staan, anders bewijst de klik hieronder niets:

    const aoTerug = [...doc.querySelectorAll('.tabknop')]

    await sleep(100);
    check('we staan nu op Balustrade, niet op Resultaat',

    // EEN TREFFER IN EEN INGEKLAPTE SECTIE. Het sierpunt staat onder "meer

    const aoSub = doc.getElementById('p_sierpuntHoogte').closest('details.subgroep');
    if (aoSub) {

    aoVeld.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(140);
    aoLijst.children[0].dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
    await sleep(250);
    // DIT IS WAAR HET OM GAAT: niet alleen vinden, maar er ook naartoe.
    check('een treffer aanklikken opent het tabblad waar hij op staat',
        aoOpen().includes('Resultaat'), aoOpen().join(', '));
    check('en de lijst gaat daarna dicht', aoLijst.hidden);

    aoVeld.value = 'ribbedebie';
    aoVeld.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(140);
    check('bij niets gevonden staat dat er, in plaats van een lege lijst',
        !aoLijst.hidden && /Niets gevonden/.test(aoLijst.textContent),
        aoLijst.textContent.slice(0, 50));
    aoVeld.value = '';
    aoVeld.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(140);
    check('leeg maken sluit de lijst', aoLijst.hidden);

    check('zoeken geeft geen fout in de console',
        errors.length === agVoor, errors.slice(agVoor).join(' | '));

    // ============ DEEL AP: sierpunten en paalkoppen =========================
    log('\n\n======== DEEL AP: sierpunten en paalkoppen ========\n');

    // Een bibliotheek decoratieve koppen, gebouwd op de vormfamilies van
    // geran.nl en consepto.nl. Eigen meetkunde: niets nagemaakt, alles
    // parametrisch uit bol, kegel, torus, wig en - vooral - omwentelingen van
    // een silhouet. Zie sierpunten.js.
    const sp = await win.eval("import('/sierpunten.js')");
    const apVolume = (vorm) => {
        const g = new aiOc.GProp_GProps_1();
        aiOc.BRepGProp.VolumeProperties_1(vorm, g, false, false, false);
        const v = g.Mass(); g.delete(); return v;
    };
    log(`   ${sp.MODELLEN.length} modellen in ${sp.perGroep().length} groepen`);
    check('er is een flinke bibliotheek, geen handvol',
        sp.MODELLEN.length >= 12, sp.MODELLEN.length);
    check('elk model heeft een nummer, naam, groep en uitleg',
        sp.MODELLEN.every(m => m.id && m.naam && m.groep && m.omschrijving
            && m.hoogteFactor > 0),
        sp.MODELLEN.filter(m => !m.omschrijving).map(m => m.id).join());
    check('de nummers zijn uniek',
        new Set(sp.MODELLEN.map(m => m.id)).size === sp.MODELLEN.length);

    log('--- 1. elk model is één solide vorm ---');
    // DIT IS DE CONTROLE DIE ERTOE DOET. Twee vormen die elkaar alleen RAKEN
    // versmelten niet tot één solid; er komt dan een compound met twee
    // lichamen uit. Dat is geen onderdeel maar twee losse stukken: de
    // stuklijst telt het dubbel en de STEP bevat twee lichamen. Gemeten bij
    // de piramide, de kogel op spil en de bol met kraag - alle drie opgelost
    // door de delen elkaar een klein stukje te laten doorsteken.
    const apSlecht = [];
    for (const m of sp.MODELLEN) {
        const op = [];
        try {
            const b = 40, h = sp.hoogteVoor(m, b);
            const vorm = sp.maakSierpunt(aiOc, m.id,
                { b, h, rond: m.voet !== 'vierkant' }, op);
            const n = adSolids(vorm).length;
            const d = adDoos(vorm);
            const breed = Math.max(d[3] - d[0], d[4] - d[1]);
            if (n !== 1) apSlecht.push(`${m.id}: ${n} solids`);
            else if (Math.abs(d[2]) > 0.01) apSlecht.push(`${m.id}: voet op ${d[2]}`);
            else if (breed > b * regelsNu.SIERPUNT.maxBreedte) {
                apSlecht.push(`${m.id}: ${breed.toFixed(1)} breed`);
            }
        } catch (e) {
            apSlecht.push(`${m.id}: ${e.message}`);
        } finally {
            for (let i = op.length - 1; i >= 0; i--) { try { op[i].delete(); } catch {} }
        }
    }
    check('alle modellen: één solid, voet op z=0, binnen de maximale breedte',
        apSlecht.length === 0, apSlecht.join('; '));

    log('\n--- 1b. de hals eronder ---');
    // ZONDER HALS LIGT EEN BOLLE KAP ALS EEN KNOBBEL OP DE REGEL. Met hals
    // staat er een sierpunt op. Dat was op de foto het verschil.
    check('er is een hals ingesteld', regelsNu.SIERPUNT.sokkel.hoogte > 0);
    check('de hals is smaller dan de paal — een hals hoort dat te zijn',
        regelsNu.SIERPUNT.sokkel.breedte < 1,
        regelsNu.SIERPUNT.sokkel.breedte);
    check('op een staander van 40 wordt de hals 48 mm',
        sp.sokkelHoogte(40, 200) === 48, sp.sokkelHoogte(40, 200));
    // EN HIJ KRIMPT MEE. Zet iemand de hoogte op 60, dan mag de hals niet de
    // hele punt opeten.
    check('bij een lage totale hoogte krimpt de hals mee',
        sp.sokkelHoogte(40, 60) === 27, sp.sokkelHoogte(40, 60));
    check('de opgegeven hoogte is de TOTALE hoogte, hals inbegrepen',
        sp.hoogteVoor(sp.modelVan('dennenappel-rond'), 40)
        === Math.round(40 * (2.2 + regelsNu.SIERPUNT.sokkel.hoogte)),
        sp.hoogteVoor(sp.modelVan('dennenappel-rond'), 40));

    // DE GEVRAAGDE HOOGTE MOET JE OOK KRIJGEN. Een paar modellen begrenzen hun
    // eigen maat - een sierbol houdt zijn straal op hoogstens 0,62 keer de
    // voet, anders wordt het een ei - en bouwden dan 16 mm te laag. De hals
    // vult dat verschil aan.
    const apTeLaag = [];
    for (const m of sp.MODELLEN) {
        const op = [];
        try {
            const b = 40, h = sp.hoogteVoor(m, b);
            const v = sp.maakSierpunt(aiOc, m.id,
                { b, h, rond: m.voet !== 'vierkant' }, op);
            const d = adDoos(v);
            const echt = d[5] - d[2];
            if (Math.abs(echt - h) > 0.5) {
                apTeLaag.push(`${m.id}: ${echt.toFixed(1)} tegenover ${h}`);
            }
        } finally {
            for (let i = op.length - 1; i >= 0; i--) { try { op[i].delete(); } catch {} }
        }
    }
    check('elk model wordt precies zo hoog als gevraagd',
        apTeLaag.length === 0, apTeLaag.join('; '));

    log('\n--- 2. parametrisch en schaalbaar ---');
    // Vier keer zo groot hoort vierenzestig keer het volume te geven. Is dat
    // niet zo, dan zit er ergens een vaste maat in plaats van een verhouding -
    // precies de fout die de lelie 515 mm breed maakte op een staander van 40.
    const apScheef = [];
    for (const m of sp.MODELLEN) {
        const meet = (b) => {
            const op = [];
            try {
                return apVolume(sp.maakSierpunt(aiOc, m.id,
                    { b, h: b * m.hoogteFactor, rond: m.voet !== 'vierkant' }, op));
            } finally {
                for (let i = op.length - 1; i >= 0; i--) { try { op[i].delete(); } catch {} }
            }
        };
        const v = meet(100) / meet(25);
        if (!(v > 57 && v < 71)) apScheef.push(`${m.id}: ${v.toFixed(1)}x`);
    }
    check('viermaal zo groot geeft overal ongeveer 64x het volume',
        apScheef.length === 0, apScheef.join('; '));

    log('\n--- 3. rond of vierkant ---');
    const apRond = sp.MODELLEN.filter(m => sp.pastOp(m, true)).length;
    const apVierk = sp.MODELLEN.filter(m => sp.pastOp(m, false)).length;
    log(`   ${apRond} passen op een buis, ${apVierk} op een koker`);
    check('er zijn modellen voor allebei de staandervormen',
        apRond >= 5 && apVierk >= 4, `${apRond} / ${apVierk}`);
    // EEN RONDE VOET OP EEN KOKER laat een kier rondom, een vierkante op een
    // buis steekt in de hoeken over de paal heen. Allebei geen product.
    check('een ronde voet past niet op een vierkante staander',
        sp.pastOp(sp.modelVan('bol-rond'), false) === false
        && sp.pastOp(sp.modelVan('bol-rond'), true) === true);
    check('en andersom ook niet',
        sp.pastOp(sp.modelVan('piramide'), true) === false);
    check('een model voor beide past altijd',
        sp.pastOp(sp.modelVan('kap-vlak'), true)
        && sp.pastOp(sp.modelVan('kap-vlak'), false));

    log('\n--- 4. in een echte balustrade ---');
    // Alle modellen, want nieuwe meetkunde in het model is precies waar het in
    // dit project telkens misging.
    const apVuil = [];
    for (const m of sp.MODELLEN) {
        const r = await bouwMod.bouwBalustrade(
            { ...regelsNu.STANDAARD, sierpunt: m.id });
        const lijst = adSolids(r.shape);
        const verschuiving = lijst.length - r.delen.length;
        const met = r.delen.map((d, i) => ({ d, s: lijst[i + verschuiving] }))
            .filter(x => x.s).map(x => ({ ...x, doos: adDoos(x.s) }));
        let overlap = 0;
        for (let i = 0; i < met.length; i++) {
            for (let j = i + 1; j < met.length; j++) {
                if (!adRaken(met[i].doos, met[j].doos)) continue;
                overlap += adSamen(met[i].s, met[j].s);
            }
        }
        if (overlap > 1e-6) apVuil.push(`${m.id}: ${overlap.toFixed(1)}`);
        if (r.delen.filter(d => d.soort === 'sierpunt').length !== 4) {
            apVuil.push(`${m.id}: geen 4 sierpunten`);
        }
    }
    check(`alle ${sp.MODELLEN.length} modellen staan schoon in de balustrade`,
        apVuil.length === 0, apVuil.join('; '));

    log('\n--- 4b. recht boven de staander ---');
    // DIT STOND SCHEEF, en het was op de foto te zien. De oorsprong ligt in de
    // HOEK van het omhullende doosje, en dat doosje is maxBreedte keer de
    // voet - bij een staander van 40 dus 58 en niet 40. Er werd maar een halve
    // VOETmaat teruggeschoven, zodat het ornament 9 mm uit het hart stond, in
    // beide richtingen tegelijk.
    const apR2 = await bouwMod.bouwBalustrade(
        { ...regelsNu.STANDAARD, sierpunt: 'dennenappel-vierkant' });
    const apHart = (d) => [0, 1, 2].map(i =>
        d.oorsprong[i] + d.xAs[i] * d.dx / 2 + d.yAs[i] * d.dy / 2);
    const apStaanders = apR2.delen.filter(d => d.soort === 'staander');
    const apPunten = apR2.delen.filter(d => d.soort === 'sierpunt');
    let apScheefst = 0;
    for (const punt of apPunten) {
        const h = apHart(punt);
        const dichtst = Math.min(...apStaanders.map(st => {
            const s = apHart(st);
            return Math.hypot(h[0] - s[0], h[1] - s[1]);
        }));
        apScheefst = Math.max(apScheefst, dichtst);
    }
    check('elk sierpunt staat recht boven het hart van zijn staander',
        apScheefst < 0.01, apScheefst.toFixed(3) + ' mm ernaast');
    // En zijn voet ligt op de bovenkant van de handregel, niet erin of erboven.
    check('de voet ligt precies op de bovenkant van de handregel',
        apPunten.every(d => Math.abs(d.oorsprong[2] - regelsNu.STANDAARD.hoogte) < 0.01),
        apPunten.map(d => d.oorsprong[2].toFixed(1)).join(', '));

    log('\n--- 5. op welke staanders, en hoe hoog ---');
    const apBouw = (extra) => bouwMod.bouwBalustrade(
        { ...regelsNu.STANDAARD, sierpunt: 'bol-rond', ...extra });
    const apTel = (r) => r.delen.filter(d => d.soort === 'sierpunt').length;
    check('op alle staanders zijn het er vier',
        apTel(await apBouw({ sierpuntWaar: 'alle' })) === 4);
    // ALLEEN DE EINDSTAANDERS is de gewone keuze op een hek: daar staan de
    // punten op de hoekpalen en niet op elke tussenpaal.
    check('op alleen de eindstaanders zijn het er twee',
        apTel(await apBouw({ sierpuntWaar: 'eind' })) === 2);
    check('zonder model staat er geen enkele',
        apTel(await bouwMod.bouwBalustrade(
            { ...regelsNu.STANDAARD, sierpunt: 'geen' })) === 0);
    const apVast = await apBouw({ sierpuntHoogte: 150 });
    check('een eigen hoogte wordt overgenomen',
        apVast.delen.find(d => d.soort === 'sierpunt').dz === 150);
    const apAfgeleid = await apBouw({ sierpuntHoogte: 0 });
    check('0 leidt de hoogte af uit het model',
        apAfgeleid.delen.find(d => d.soort === 'sierpunt').dz
        === sp.hoogteVoor(sp.modelVan('bol-rond'),
                          regelsNu.STANDAARD.staanderBreedte));

    log('\n--- 6. meedoen met de rest van de app ---');
    const apR = await bouwMod.bouwBalustrade(
        { ...regelsNu.STANDAARD, sierpunt: 'dennenappel-vierkant' });
    const apUniek = apR.onderdelen.filter(u => u.deel.soort === 'sierpunt');
    // IDENTIEKE SIERPUNTEN ZIJN ÉÉN ONDERDEEL. Dat komt niet uit extra code
    // maar doordat het ornament gewoon een deel in dezelfde lijst is: de
    // herkenning kijkt naar de lokale vorm en ziet vier keer hetzelfde.
    check('vier identieke sierpunten zijn één productieonderdeel met aantal 4',
        apUniek.length === 1 && apUniek[0].aantal === 4,
        apUniek.map(u => `${u.aantal}x`).join());
    check('en staan als één regel in de stuklijst',
        apR.stuklijst.filter(x => x.soort === 'sierpunt').length === 1);
    check('de samenstellingsboom kent ze ook',
        JSON.stringify(apR.boom).includes('sierpunt'));
    // Een sierpunt is gekocht beslag: niet zagen, niet snijden.
    check('een sierpunt wordt BESTELD',
        amZl.wordtBesteld(apUniek[0].deel) === true
        && amZl.wordtGezaagd(apUniek[0].deel) === false);
    check('en levert geen DXF op', amDxf.maakDxf(apUniek[0].deel) === null);
    check('de zaaglijst zet hem bij "besteld"',
        amZl.maakZaaglijst(apR.onderdelen).besteld
            .some(b => b.soort === 'sierpunt'));
    const apStep = await api.schrijfStep(apUniek[0].vorm);
    check('en hij is als los STEP-bestand te schrijven',
        apStep && apStep.length > 500, apStep && apStep.length + ' bytes');
    // De coating geldt voor het hele werk, dus ook hiervoor.
    const apRal = await bouwMod.bouwBalustrade(
        { ...regelsNu.STANDAARD, sierpunt: 'bol-rond', afwerking: '9005' });
    check('een gekozen RAL-kleur geldt ook voor het sierpunt',
        apRal.delen.filter(d => d.soort === 'sierpunt')
            .every(d => d.afwerking === '9005'));

    log('\n--- 7. in de app ---');
    check('er is een rij voor het sierpunt met een kies- en een wisknop',
        !!doc.getElementById('pr_sierpunt') && !!doc.getElementById('kies_sierpunt')
        && !!doc.getElementById('wis_sierpunt'));
    check('en velden voor de hoogte en de plaatskeuze',
        !!doc.getElementById('p_sierpuntHoogte')
        && !!doc.getElementById('p_sierpuntWaar'));
    check('het keuzevenster staat in de pagina',
        !!doc.getElementById('sierDialoog')
        && doc.getElementById('sierDialoog').tagName === 'DIALOG');
    // ZOEKBAAR, net als de rest. De zoekmachine leest het paneel, dus dit
    // volgt vanzelf - maar als het niet zo was zou je het nooit vinden.
    const apZoek = zk.zoek(zk.maakIndex(doc), 'sierpunt');
    check('"sierpunt" is te vinden met de zoekmachine',
        apZoek.length > 0 && /sierpunt/i.test(apZoek[0].titel),
        apZoek.slice(0, 2).map(x => x.titel).join(' | '));
    // HET STAAT ONDER "MEER OPTIES", dus ingeklapt. De index leest het paneel
    // en niet wat zichtbaar is, dus het is gewoon te vinden - en gaNaar klapt
    // de sectie open. Zonder dat stuur je iemand naar iets wat dicht zit.
    check('en het staat onder een ingeklapte sectie, dus dat moet opengaan',
        !!doc.getElementById('p_sierpuntHoogte').closest('details.subgroep'));

    check('de sierpunten geven geen fout in de console',
        errors.length === agVoor, errors.slice(agVoor).join(' | '));

    // ============ DEEL AQ: doorgestoken spijlen met een punt ================
    log('\n\n======== DEEL AQ: doorgestoken spijlen ========\n');

    // DIT IS WAT ER OP DE VOORBEELDFOTO'S STAAT, en wat er drie keer naast zat.
    // Op een smeedijzeren hek staat op ELKE SPIJL een punt en niet alleen op de
    // palen: de staaf loopt door de bovenste regel heen, steekt er een stuk
    // bovenuit en eindigt in een bol of een speerpunt. Een ornament op de paal
    // blijft laag hoeveel hals je er ook onder zet - het stond simpelweg op het
    // verkeerde onderdeel.
    //
    // Een staaf die ergens doorheen gaat vraagt een GAT. Dat is hier geen
    // netheid maar de kern van de zaak: zonder gat staat er staal in staal.
    const aqVoor = errors.length;
    const aqBasis = { ...regelsNu.STANDAARD, lengte: 1700, handregelOverstek: 0 };
    const aqRecht = [[0, 0, 0], [1700, 0, 0]];

    log('--- 1. wat pad.js beschrijft ---');
    const aqUit = padMod.padDelen(aqRecht, false, aqBasis);
    const aqDoor = padMod.padDelen(aqRecht, false,
        { ...aqBasis, spijlOverstek: 80, spijlSierpunt: 'speerpunt' });
    const aqTel = (uit, soort) => uit.delen.filter(d => d.soort === soort).length;

    // EERST: ZONDER OVERSTEK VERANDERT ER NIETS. Een nieuwe mogelijkheid mag de
    // bestaande leuning niet stilletjes anders maken.
    check('zonder overstek staat er geen enkel gat in de regels',
        aqUit.delen.every(d => !(d.doorsteken || []).length));
    check('en geen enkele punt op een spijl',
        aqTel(aqUit, 'sierpunt') === 0);

    const aqSpijl0 = aqUit.delen.find(d => d.soort === 'spijl');
    const aqSpijl1 = aqDoor.delen.find(d => d.soort === 'spijl');
    check('met overstek worden het er evenveel - de veiligheidsregel verandert niet',
        aqTel(aqUit, 'spijl') === aqTel(aqDoor, 'spijl'),
        `${aqTel(aqUit, 'spijl')} tegenover ${aqTel(aqDoor, 'spijl')}`);
    // DE STAAF WORDT LANGER EN STOPT 80 MM BOVEN DE LEUNINGHOOGTE. Niet boven
    // de bovenregel, en niet boven de onderkant van de handregel: boven de
    // leuninghoogte zelf, want dat is wat je buiten ziet.
    const aqTop = aqSpijl1.oorsprong[2] + aqSpijl1.dz;
    check('de spijl eindigt 80 mm boven de leuninghoogte',
        Math.abs(aqTop - (aqBasis.hoogte + 80)) < 1e-9, aqTop.toFixed(2));
    check('en is dus langer dan hij was',
        aqSpijl1.dz > aqSpijl0.dz, `${aqSpijl0.dz} -> ${aqSpijl1.dz}`);

    // EEN GAT PER SPIJL, in de handregel én in de bovenregel. Niet in de
    // onderregel: daar staat de staaf gewoon op.
    const aqHand = aqDoor.delen.find(d => d.soort === 'handregel');
    const aqRegels = aqDoor.delen.filter(d => d.soort === 'vulregel');
    check('de handregel krijgt een gat per spijl',
        (aqHand.doorsteken || []).length === aqTel(aqDoor, 'spijl'),
        `${(aqHand.doorsteken || []).length} gaten, ${aqTel(aqDoor, 'spijl')} spijlen`);
    check('de ONDERregels blijven dicht, de bovenregels krijgen gaten',
        aqRegels.filter((d, k) => k % 2 === 0).every(d => !(d.doorsteken || []).length)
        && aqRegels.filter((d, k) => k % 2 === 1).every(d => (d.doorsteken || []).length > 0),
        aqRegels.map(d => (d.doorsteken || []).length).join(','));
    check('en alle gaten samen in de bovenregels zijn er ook net zoveel',
        aqRegels.reduce((s, d) => s + (d.doorsteken || []).length, 0)
            === aqTel(aqDoor, 'spijl'));

    // DE PUNT STAAT PRECIES OP DE STAAF en zweeft er niet boven.
    const aqPunt = aqDoor.delen.find(d => d.soort === 'sierpunt');
    check('er staat een punt op elke spijl',
        aqTel(aqDoor, 'sierpunt') === aqTel(aqDoor, 'spijl'),
        `${aqTel(aqDoor, 'sierpunt')} punten, ${aqTel(aqDoor, 'spijl')} spijlen`);
    check('en hij begint precies op de kop van de staaf',
        Math.abs(aqPunt.oorsprong[2] - aqTop) < 1e-9,
        `${aqPunt.oorsprong[2].toFixed(2)} tegenover ${aqTop.toFixed(2)}`);
    // DE MAAT VOLGT DE SPIJLBREEDTE EN NIET DE STAANDERBREEDTE. Zet je ze
    // allebei op de paalmaat, dan staat er een kolos van 172 mm op een staafje
    // van 20. Speerpunt is 4,3 x de voet: 86 op 20, 172 op 40.
    check('de punt is op de SPIJLBREEDTE geschaald, niet op de staander',
        Math.abs(aqPunt.dz - 86) < 1e-9, aqPunt.dz);
    check('en zijn doosje is maxBreedte keer de spijl',
        Math.abs(aqPunt.dx - aqBasis.spijlBreedte * regelsNu.SIERPUNT.maxBreedte) < 1e-9,
        aqPunt.dx);
    // De punt op de PAAL blijft zijn eigen maat houden; het zijn twee keuzes.
    const aqBeide = padMod.padDelen(aqRecht, false,
        { ...aqBasis, spijlOverstek: 80, spijlSierpunt: 'speerpunt',
          sierpunt: 'bol-rond' });
    const aqHoogtes = [...new Set(aqBeide.delen.filter(d => d.soort === 'sierpunt')
        .map(d => Math.round(d.dz)))].sort((a, b) => a - b);
    check('punt op de paal en punt op de spijl zijn twee verschillende maten',
        aqHoogtes.length === 2, aqHoogtes.join(' en '));

    // ALLEEN BIJ SPIJLEN. Bij glas of liggende regels staat er niets om een
    // punt op te zetten; dan hoort er ook geen gat in de regels te komen.
    for (const soort of ['horizontaal', 'glas', 'geen']) {
        const aqAnders = padMod.padDelen(aqRecht, false,
            { ...aqBasis, vulling: soort, spijlOverstek: 80,
              spijlSierpunt: 'speerpunt' });
        check(`bij vulling "${soort}" gebeurt er niets met het overstek`,
            aqAnders.delen.every(d => !(d.doorsteken || []).length)
            && aqAnders.delen.every(d => d.soort !== 'sierpunt'),
            aqAnders.delen.filter(d => d.soort === 'sierpunt').length + ' punten');
    }

    // DE VERBINDING MOET HET OOK ZEGGEN. Een spijl die ergens doorheen steekt
    // zit niet "tussen" twee regels ingeklemd. Dat verschil hoort in de lijst
    // te staan en niet alleen in de meetkunde - dat is de hele reden dat die
    // lijst bestaat.
    check('de verbinding heet "doorheen" en niet "tussen"',
        aqDoor.verbindingen.some(v => v.soort === 'doorheen')
        && !aqUit.verbindingen.some(v => v.soort === 'doorheen'));

    log('\n--- 2. en wat er gebouwd wordt ---');
    const aqGebouwd = await bouwMod.bouwPad(aqRecht, false,
        { ...aqBasis, spijlOverstek: 80, spijlSierpunt: 'speerpunt' });
    check('elk onderdeel is nog één stuk staal',
        adSolids(aqGebouwd.shape).length === aqGebouwd.delen.length,
        `${adSolids(aqGebouwd.shape).length} solids, ${aqGebouwd.delen.length} delen`);

    // HET GAT IS ER ECHT. Zonder deze meting zou een gat dat niet gesneden
    // werd nergens opvallen: de spijl staat er, de regel staat er, en de
    // doorsnijdingsmeting hieronder zou het wel vangen maar niet uitleggen.
    const aqZonder = await bouwMod.bouwPad(aqRecht, false, aqBasis);
    const aqVolume = (vorm) => {
        const g = new adOc.GProp_GProps_1();
        adOc.BRepGProp.VolumeProperties_1(vorm, g, false, false, false);
        const m = g.Mass(); g.delete(); return m;
    };
    const aqRegelVorm = (r) => {
        const lijst = adSolids(r.shape);
        const versch = lijst.length - r.delen.length;
        const i = r.delen.findIndex(d => d.soort === 'handregel');
        return lijst[i + versch];
    };
    const aqVol0 = aqVolume(aqRegelVorm(aqZonder));
    const aqVol1 = aqVolume(aqRegelVorm(aqGebouwd));
    // 12 gaten van 20 x 20 door een regel van 40 hoog = 192 000 mm3, plus de
    // speling rondom. Niet op de millimeter natellen - de speling en de
    // kopsneden zitten erin - maar de orde van grootte moet kloppen, anders is
    // er iets heel anders gebeurd dan twaalf gaten boren.
    const aqWeg = aqVol0 - aqVol1;
    check('er is echt staal uit de handregel gehaald',
        aqWeg > 150000 && aqWeg < 260000, Math.round(aqWeg) + ' mm3 weg');

    // EN NERGENS STAAL OP TWEE PLEKKEN. Dit is de meting die telt: hij liep op
    // een helling in één keer mis toen de gaten op de VOET van de spijl werden
    // gezocht in plaats van halverwege de regel. Bij 1:2 schuift een punt dat
    // een meter lager ligt 447 mm op langs een schuine regel, en daardoor
    // kreeg driekwart van de spijlen geen gat: gemeten 53 666 mm3
    // handregel n spijl en 16 100 mm3 spijl n vulregel.
    const aqMaten = { ...aqBasis, spijlOverstek: 80, spijlSierpunt: 'speerpunt' };
    for (const [naam, punten] of [
        ['doorsteek vlak', aqRecht],
        ['doorsteek helling 1:2', [[0, 0, 0], [1600, 0, 800]]],
        ['doorsteek hoek 90', [[0, 0, 0], [1200, 0, 0], [1200, 1200, 0]]],
        ['doorsteek zonder raamwerk', aqRecht],
    ]) {
        const extra = naam.endsWith('raamwerk') ? { vulraamwerk: 0 } : {};
        adMeet(naam, await bouwMod.bouwPad(punten, false,
            { ...aqMaten, ...extra }));
    }

    // OP EEN HELLING WORDT DE KOP RECHT AFGEZAAGD. Boven de regel zit niets
    // meer waar hij tussen moet passen, en de punt die erop komt staat
    // rechtop - die hoort niet op een schuin afgezaagde kop te staan. Zonder
    // overstek is de kop juist wél schuin, want dan past hij onder de regel.
    const aqHel = padMod.padDelen([[0, 0, 0], [1600, 0, 800]], false, aqMaten);
    const aqHelUit = padMod.padDelen([[0, 0, 0], [1600, 0, 800]], false, aqBasis);
    const aqHelSpijl = aqHel.delen.find(d => d.soort === 'spijl');
    check('op een helling heeft een doorgestoken spijl één schuine snede, niet twee',
        (aqHelSpijl.verstek || []).length === 1,
        (aqHelSpijl.verstek || []).length + ' sneden');
    check('en zonder overstek nog steeds twee',
        (aqHelUit.delen.find(d => d.soort === 'spijl').verstek || []).length === 2);
    // De zaaglengte is dan het hele blok: met één rechte en één schuine kop
    // zijn de vlakken niet evenwijdig, en dan is de langste zijde wat je
    // afzaagt. Zou hier de oude formule staan, dan bestelt de stuklijst een
    // paar millimeter te kort.
    check('de zaaglengte van zo’n spijl is zijn volle lengte',
        Math.abs(aqHelSpijl.zaaglengte - aqHelSpijl.dz) < 1e-9,
        `${aqHelSpijl.zaaglengte.toFixed(2)} tegenover ${aqHelSpijl.dz.toFixed(2)}`);

    log('\n--- 3. in de stuklijst en de zaaglijst ---');
    // EEN REGEL MET GATEN IS EEN ANDER STUK STAAL dan een regel zonder. De
    // onderdeelherkenning kijkt naar de lokale vorm, en daar zitten de gaten
    // in - precies waarom het snijden op de lokale vorm gebeurt en niet na het
    // plaatsen.
    const aqOnd = aqGebouwd.onderdelen.filter(o => o.deel.soort === 'vulregel');
    check('onderregel en bovenregel zijn nu TWEE productieonderdelen',
        aqOnd.length === 2, aqOnd.map(o => `${o.aantal}x`).join(' '));
    const aqZonderOnd = aqZonder.onderdelen.filter(o => o.deel.soort === 'vulregel');
    check('en zonder gaten waren het er één',
        aqZonderOnd.length === 1, aqZonderOnd.map(o => `${o.aantal}x`).join(' '));
    // De punten zijn gekocht beslag, net als die op de paal.
    const aqPuntOnd = aqGebouwd.onderdelen.find(o => o.deel.soort === 'sierpunt');
    check('de punten op de spijlen zijn één onderdeel met aantal 12',
        aqPuntOnd && aqPuntOnd.aantal === 12, aqPuntOnd && aqPuntOnd.aantal);
    check('en worden BESTELD, niet gezaagd',
        amZl.wordtBesteld(aqPuntOnd.deel) === true
        && amZl.wordtGezaagd(aqPuntOnd.deel) === false);
    check('de zaaglijst zet ze bij "besteld"',
        amZl.maakZaaglijst(aqGebouwd.onderdelen).besteld
            .some(b => b.soort === 'sierpunt'));

    log('\n--- 4. in de app ---');
    check('er is een rij voor de punt op de spijlen',
        !!doc.getElementById('pr_spijlSierpunt')
        && !!doc.getElementById('kies_spijlSierpunt')
        && !!doc.getElementById('wis_spijlSierpunt'));
    const aqVeld = doc.getElementById('p_spijlOverstek');
    check('en een veld voor het overstek', !!aqVeld && aqVeld.type === 'number');
    check('dat op 0 staat, dus uit', Number(aqVeld.value) === 0, aqVeld.value);
    // EEN KEUZE DIE NIETS DOET MOET DAT ZEGGEN. Een punt kiezen zonder
    // overstek bouwt niets - de punt zou in de handregel staan - en zonder
    // melding druk je op Genereer en zie je niet waarom er niets gebeurt.
    const aqLet = doc.getElementById('spijlPuntLet');
    check('er is een plek voor de melding eronder', !!aqLet);
    aqVeld.value = '80';
    aqVeld.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(120);
    check('overstek zonder punt meldt dat de spijlen kaal uitsteken',
        aqLet.style.display === 'block' && /kaal/.test(aqLet.textContent),
        aqLet.textContent.slice(0, 70));
    const aqKeuze = doc.getElementById('p_vulling');
    aqKeuze.value = 'glas';
    aqKeuze.dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(120);
    check('en bij glas meldt hij dat er geen spijlen zijn',
        aqLet.style.display === 'block' && /geen spijlen/.test(aqLet.textContent),
        aqLet.textContent.slice(0, 70));
    // Netjes terugzetten: de delen hierna rekenen op het gewone paneel.
    aqKeuze.value = 'spijlen';
    aqKeuze.dispatchEvent(new Event('change', { bubbles: true }));
    aqVeld.value = '0';
    aqVeld.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(120);
    check('alles weer uit zet de melding ook weer uit',
        aqLet.style.display === 'none', aqLet.textContent.slice(0, 40));

    const aqZoek = zk.zoek(zk.maakIndex(doc), 'overstek');
    check('"overstek" vindt de twee overstekvelden',
        aqZoek.some(x => x.titel === 'spijloverstek')
        && aqZoek.some(x => x.titel === 'handregeloverstek'),
        aqZoek.slice(0, 3).map(x => x.titel).join(' | '));

    check('de doorgestoken spijlen geven geen fout in de console',
        errors.length === aqVoor, errors.slice(aqVoor).join(' | '));

    // ============ DEEL AR: één zin met alles erin ===========================
    log('\n\n======== DEEL AR: profiel, hoek, overstek en punt in één zin ========\n');

    // DEEL E controleert de maten uit een zin. Daar bleef het ook bij: een
    // profielnaam, een hoek, een overstek of een sierpunt werden STIL
    // weggegooid. Je typte "staanders CHS 48,3x3,2" en kreeg een massief blok,
    // zonder dat er iets over te lezen viel. Dat is precies het soort stille
    // halve begrip waar deze app niet van houdt.
    //
    // Nu worden die vier eerst uit de zin gehaald en weggepoetst, en pas daarna
    // gaat de maatlezer erop los. Hier wordt beide kanten nagemeten: dat de
    // extra's aankomen, én dat ze de MATEN niet hebben vervuild.
    const arVoor = errors.length;
    const arMod = await win.eval("import('/command-parser.js')");
    const arVoorraad = cat.alleProfielen(catBoom);
    log(`   catalogus: ${arVoorraad.length} profielen`);

    log('--- 1. de hele zin in één keer ---');
    const arZin = 'balustrade van 3 meter lang en 1100 hoog, staanders '
        + 'CHS 48,3x3,2, 90 graden na 1500 mm, 80 mm spijloverstek en een '
        + 'speerpunt op de spijlen';
    const arR = arMod.parseer(arZin, null, { profielen: arVoorraad });
    check('de zin wordt begrepen', !arR.fout, arR.fout || arR.uitleg);
    // DE MATEN MOGEN NIET VERVUILD ZIJN. Hier zit de hele winst: "CHS 48,3x3,2"
    // bevat 48,3 en 3,2, en "90 graden na 1500" nog eens twee getallen. Zonder
    // wegpoetsen wordt een daarvan de lengte of de hoogte.
    check('lengte en hoogte komen uit de ECHTE maatwoorden, niet uit het profiel',
        arR.params.lengte === 3000 && arR.params.hoogte === 1100,
        `lengte ${arR.params.lengte}, hoogte ${arR.params.hoogte}`);
    check('de hoek staat in het vervolgveld',
        arR.params.vervolg === '90, 1500', arR.params.vervolg);
    check('het spijloverstek is 80', arR.params.spijlOverstek === 80,
        arR.params.spijlOverstek);
    check('het staanderprofiel is gevonden',
        arR.profielen.staander && arR.profielen.staander.label === 'CHS 48.3x3.2',
        arR.profielen.staander && arR.profielen.staander.label);
    // Mét zijn norm erbij, net als een profiel uit de kiezer. Zonder dat staat
    // er "undefined" in het tooltip van het paneel.
    check('en hij heeft zijn norm bij zich',
        /EN 10/.test((arR.profielen.staander || {}).normLabel || ''),
        (arR.profielen.staander || {}).normLabel);
    check('de punt gaat op de SPIJLEN en niet op de palen',

    // ÉÉN KEER ECHT BOUWEN om de knop bij te laten werken. main.js is een

    for (let i = 0; i < 1200; i++) {

    }

    check('met geleerde voorkeuren gaat hij aan', !asKnop.disabled);

    // DE HOEKKNOPJES, op dezelfde momenten bijgewerkt. "90, 1200" is een

    // WAAR HET OP GEBASEERD IS MOET ERBIJ. Een knop die ongevraagd twintig

    check('en de uitleg noemt hoe vaak en wat',

    check('de geleerde maten worden ingevuld',

    check('en de geleerde sierpunten',

    // NIETS AANRAKEN WAAR NIETS OVER GELEERD IS. Dit is de controle die

    check('de lengte blijft staan — die wordt niet geleerd',

    check('een onderdeel zonder voorkeur blijft een massief blok',
        /massief blok/.test(doc.getElementById('pr_handregel').textContent),
        doc.getElementById('pr_handregel').textContent.trim());

    // VERGETEN MOET KUNNEN, en het hoort een vraag te stellen: dit is het enige
    // in de app dat je niet uit een bestand kunt terughalen.
    const asOudeConfirm = win.confirm;
    win.confirm = () => false;
    doc.getElementById('gw_vergeet').click();
    check('weigeren bij de vraag laat alles staan', !asKnop.disabled);
    win.confirm = () => true;
    doc.getElementById('gw_vergeet').click();
    check('en bevestigen wist het, waarna de knop weer uit gaat',
        asKnop.disabled && gw.top(gw.lees().hoek).length === 0);
    check('en de uitleg zegt weer dat er niets geleerd is',
        /nog niets geleerd/i.test(asHint.textContent),
        asHint.textContent.slice(0, 60));
    check('en de hoekknopjes verdwijnen mee',
        doc.getElementById('gw_hoeken').hidden,
        doc.getElementById('gw_hoeken').textContent.trim());
    win.confirm = asOudeConfirm;

    // En terugleggen wat er stond, zodat een echte gebruiker die deze test
    // draait zijn geleerde voorkeuren niet kwijt is.
    try {
        if (asBewaard === null) gw.vergeet();
        else win.localStorage.setItem(gw.SLEUTEL, asBewaard);
    } catch { /* opslag weigert: dan was er ook niets te bewaren */ }

    check('de gewoonten geven geen fout in de console',
        errors.length === asVoor, errors.slice(asVoor).join(' | '));

    // ============ DEEL AT: gedraaide balusters ==============================
    log('\n\n======== DEEL AT: gedraaide balusters ========\n');

    // De klassieke stenen baluster: vierkant voetblok, een buik, een hals. Het
    // DRAAIWERK hiervoor bestond al - omwenteling, blok, ring - en wordt uit
    // sierpunten.js hergebruikt. Wat nieuw is, is dat de spijl zélf zo'n vorm
    // kan zijn in plaats van een rechte staaf.
    const atVoor = errors.length;
    const balMod = await win.eval("import('/balusters.js')");
    const atOc = adOc;

    log('--- elk model wordt één stuk, precies op maat ---');
    const atTel = (vorm) => {
        let n = 0;
        const v = new atOc.TopExp_Explorer_2(vorm,
            atOc.TopAbs_ShapeEnum.TopAbs_SOLID, atOc.TopAbs_ShapeEnum.TopAbs_SHAPE);
        for (; v.More(); v.Next()) n++;
        v.delete();
        return n;
    };
    const atDoos = (vorm) => {
        const d = new atOc.Bnd_Box_1();
        atOc.BRepBndLib.Add(vorm, d, false);
        const a = d.CornerMin(), b = d.CornerMax();
        const uit = { dx: b.X() - a.X(), dy: b.Y() - a.Y(),
                      dz: b.Z() - a.Z(), z0: a.Z() };
        d.delete();
        return uit;
    };
    const atFout = [];
    for (const m of balMod.MODELLEN) {
        for (const [b, h] of [[100, 700], [80, 900]]) {
            const op = [];
            try {
                const vorm = balMod.maakBaluster(atOc, m.id, { b, h }, op);
                const d = atDoos(vorm);
                const n = atTel(vorm);
                // ÉÉN STUK: een baluster die uit losse blokken bestaat is in
                // de werkplaats geen baluster maar een stapel.
                if (n !== 1) atFout.push(`${m.id} ${n} stukken`);
                if (Math.abs(d.dz - h) > 0.5) atFout.push(`${m.id} hoogte ${d.dz}`);
                if (d.dx > b + 0.01) atFout.push(`${m.id} breedte ${d.dx}`);
                if (Math.abs(d.z0) > 0.01) atFout.push(`${m.id} voet op ${d.z0}`);
            } catch (e) {
                atFout.push(`${m.id}: ${e.message}`);
            } finally {
                for (const o of op) { try { o.delete(); } catch { /* al weg */ } }
            }
        }
    }
    check(`alle ${balMod.MODELLEN.length} modellen: één stuk, op maat, voet op nul`,
        atFout.length === 0, atFout.join('; '));

    // TE GEDRONGEN IS GEEN BALUSTER. Onder een bepaalde slankheid zit de buik
    // zo dicht bij het voetblok dat er geen vorm meer in te zien is.
    check('te breed voor de hoogte wordt geweigerd, met de benodigde maat erbij',
        /minstens 250 mm/.test(balMod.pastBij(100, 200) || ''), balMod.pastBij(100, 200));
    check('en een gewone verhouding niet', balMod.pastBij(100, 700) === null);
    // DE VERHOUDING IS IETS ANDERS DAN DE PASVORM. Een baluster van 20 mm bij
    // 660 BOUWT prima; hij wordt alleen een breinaald met een bultje. Dat is
    // precies wat er op het scherm stond toen de standaard spijlbreedte van 20
    // bleef staan, en de app zei er niets over.
    check('een veel te slanke baluster bouwt wél, maar krijgt advies',
        balMod.pastBij(20, 660) === null
        && /1 op 33/.test(balMod.slankheidsadvies(20, 660) || ''),
        balMod.slankheidsadvies(20, 660));
    check('en het advies noemt een breedte om op te zetten',
        /\d+ mm voor de verhouding/.test(balMod.slankheidsadvies(20, 660) || ''),
        balMod.slankheidsadvies(20, 660));
    check('bij een klassieke verhouding is er niets te adviseren',
        balMod.slankheidsadvies(100, 660) === null,
        balMod.slankheidsadvies(100, 660));
    check('bouwen weigert het ook, niet alleen pastBij',
        (() => { try { balMod.maakBaluster(atOc, 'klassiek', { b: 100, h: 200 }, []);
                       return false; } catch { return true; } })());
    check('een onbekend model geeft een leesbare fout',
        (() => { try { balMod.maakBaluster(atOc, 'bestaat-niet', { b: 100, h: 700 }, []);
                       return false; } catch (e) { return /Onbekende baluster/.test(e.message); } })());

    log('\n--- in de balustrade ---');
    const atMaten = { ...regelsNu.STANDAARD, lengte: 2400, hoogte: 1000,
                      spijlBreedte: 90, maxDoorgang: 160, handregelOverstek: 0 };
    const atRecht = [[0, 0, 0], [2400, 0, 0]];
    const atUit = padMod.padDelen(atRecht, false, atMaten);
    const atMet = padMod.padDelen(atRecht, false,
        { ...atMaten, spijlModel: 'klassiek' });
    const atSp = atMet.delen.find(d => d.soort === 'spijl');
    check('de spijl weet dat hij een baluster is',
        atSp.baluster === 'klassiek', atSp.baluster);
    // EEN BALUSTER WORDT BESTELD, NIET GEZAAGD. Je zaagt hem niet uit een
    // stang van zes meter; hij wordt gedraaid of gegoten. Hetzelfde spoor als
    // de glasklemmen en de sierpunten.
    check('en dat hij besteld wordt in plaats van gezaagd',
        atSp.besteld === true && amZl.wordtGezaagd(atSp) === false);
    // HET STALEN PROFIEL WORDT GENEGEERD, en dat is geen slordigheid: een
    // gedraaide baluster IS de vorm, er zit geen catalogusprofiel in.
    const atProf = padMod.padDelen(atRecht, false,
        { ...atMaten, spijlModel: 'klassiek', spijlProfiel: fl205 });
    const atProfSp = atProf.delen.find(d => d.soort === 'spijl');
    check('een gekozen stalen profiel wordt genegeerd',
        atProfSp.profiel === null && atProfSp.dx === 90 && atProfSp.dy === 90,
        `${atProfSp.dx} x ${atProfSp.dy}, profiel ${atProfSp.profiel}`);
    check('en zonder balustervorm telt dat profiel gewoon mee',
        padMod.padDelen(atRecht, false, { ...atMaten, spijlProfiel: fl205 })
            .delen.find(d => d.soort === 'spijl').profiel !== null);
    // Zonder keuze verandert er NIETS aan wat er altijd al gebouwd werd.
    check('zonder balustervorm blijft alles zoals het was',
        !atUit.delen.some(d => d.baluster) && !atUit.delen[0].besteld
        && atUit.delen.length === atMet.delen.length,
        `${atUit.delen.length} tegenover ${atMet.delen.length}`);

    // De VRIJE HOOGTE moet uit dezelfde berekening komen als waarmee gebouwd
    // wordt; het paneel zegt ermee of een baluster hier nog in past.
    check('het veld meldt de vrije hoogte die een baluster krijgt',
        Math.abs(atMet.velden[0].vrijeHoogte - atSp.dz) < 1e-9,
        `${atMet.velden[0].vrijeHoogte} tegenover ${atSp.dz}`);

    log('\n--- en wat er echt gebouwd wordt ---');
    for (const [naam, model, punten] of [
        ['baluster vlak', 'klassiek', atRecht],
        ['baluster dubbel', 'dubbel', atRecht],
        ['baluster op helling 1:2', 'klassiek', [[0, 0, 0], [2000, 0, 1000]]],
    ]) {
        adMeet(naam, await bouwMod.bouwPad(punten, false,
            { ...atMaten, spijlModel: model }));
    }

    log('\n--- in de app ---');
    const atKeuze = doc.getElementById('p_spijlModel');
    check('de keuzelijst staat in het paneel', !!atKeuze);
    check('met een optie per model, plus "rechte spijlen"',
        atKeuze.querySelectorAll('option').length === balMod.MODELLEN.length + 1,
        atKeuze.querySelectorAll('option').length);
    // UIT DE BIBLIOTHEEK ZELF GEVULD, geen tweede lijst met namen die achter
    // kan gaan lopen. Komt er morgen een model bij, dan staat het er vanzelf.
    check('en die namen komen uit balusters.js zelf',
        [...atKeuze.options].some(o => o.value === 'klassiek')
        && [...atKeuze.options].some(o => o.value === 'getapt'),
        [...atKeuze.options].map(o => o.value).join(','));
    check('"steen" is een materiaal dat de app kent',
        !!mat.MATERIALEN.steen, Object.keys(mat.MATERIALEN).join(','));

    log('\n--- het materiaal van een baluster ---');
    const atSteen = padMod.padDelen(atRecht, false,
        { ...atMaten, spijlModel: 'klassiek' }).delen.find(d => d.soort === 'spijl');
    check('een baluster is standaard van steen',
        mat.materiaalVanDeel(atSteen) === 'steen', mat.materiaalVanDeel(atSteen));
    check('en dat is te kiezen, want gedraaid metaal bestaat ook',
        mat.materiaalVanDeel(padMod.padDelen(atRecht, false,
            { ...atMaten, spijlModel: 'klassiek', spijlMateriaal: 'staal' })
            .delen.find(d => d.soort === 'spijl')) === 'staal');
    // EEN RECHTE SPIJL WORDT NOOIT STILLETJES STEEN. Het veld staat op 'steen'
    // in de standaardwaarden; zou het zonder balustervorm meegelegd worden,
    // dan stond er stalen staafwerk als steen in de stuklijst.
    check('een rechte spijl blijft staal, wat er ook in dat veld staat',
        mat.materiaalVanDeel(atUit.delen.find(d => d.soort === 'spijl')) === 'staal',
        mat.materiaalVanDeel(atUit.delen.find(d => d.soort === 'spijl')));
    // En steen hoort niet overal op te kunnen komen: een stenen voetplaat of
    // vulregel bestaat in deze app niet.
    //
    // HIER STOND "ALLEEN OP EEN SPIJL", en dat klopte tot de dekband erbij
    // kwam. Een stenen dekband is net zo echt als een stenen baluster, dus de
    // regel is verruimd en deze controle mee. Wat blijft staan is de GRENS:
    // alleen waar het voorkomt, niet overal. Deel AW meet de handregel apart.
    check('steen mag op een spijl, maar niet op een voetplaat of vulregel',
        mat.mag('spijl', 'steen') === true
        && mat.mag('voetplaat', 'steen') === false
        && mat.mag('vulregel', 'steen') === false);
    check('een stenen baluster ziet er ook anders uit dan staal',
        mat.uiterlijkVanDeel(atSteen).sleutel === 'steen',
        mat.uiterlijkVanDeel(atSteen).sleutel);
    const atMatVeld = doc.getElementById('p_spijlMateriaal');
    check('het keuzeveld staat in het paneel met twee opties',
        atMatVeld && atMatVeld.options.length === 2,
        atMatVeld && [...atMatVeld.options].map(o => o.value).join(','));

    check('de balusters geven geen fout in de console',
        errors.length === atVoor, errors.slice(atVoor).join(' | '));

    // ============ DEEL AU: kostenraming =====================================
    log('\n\n======== DEEL AU: kostenraming ========\n');

    // HOEVEELHEDEN ZIJN HARD, TARIEVEN NIET. Het staalgewicht komt uit het
    // gemeten volume en het te coaten oppervlak uit het gemeten oppervlak -
    // allebei door OCCT uitgerekend. De prijzen komen van internet, lopen per
    // bron uiteen en veranderen per maand. Deze controles gaan er vooral over
    // dat die twee niet door elkaar gehaald worden.
    const auVoor = errors.length;
    const ks = await win.eval("import('/kosten.js')");
    const tar = await (await fetch('/tarieven.json')).json();
    await ks.laadTarieven();

    log('--- de hoeveelheden komen uit de geometrie ---');
    const auMaten = { ...regelsNu.STANDAARD, lengte: 2400, hoogte: 1000,
                      handregelOverstek: 0 };
    const auKaal = await bouwMod.bouwBalustrade(auMaten);
    const auH = ks.hoeveelheden(auKaal.onderdelen, tar.dichtheid.staal);
    // Narekenen met de hand: volume maal dichtheid. Een leuning van 2,4 m in
    // massieve blokken ligt rond de 120 kg; ver daarbuiten is er iets mis met
    // de eenheden - mm3 tegenover m3 scheelt een factor miljard.
    check('het staalgewicht is een geloofwaardig getal',
        auH.staalKg > 60 && auH.staalKg < 300, auH.staalKg.toFixed(1) + ' kg');
    const auSom = auKaal.onderdelen.reduce((s, o) =>
        s + (o.kenmerken.volume / 1e9 * tar.dichtheid.staal * o.aantal), 0);
    check('en hij is precies de som van volume x dichtheid',
        Math.abs(auH.staalKg - auSom) < 1e-6,
        `${auH.staalKg} tegenover ${auSom}`);
    // ZONDER KLEUR VALT ER NIETS TE COATEN. Anders staat er een post op de
    // rekening voor werk dat niemand besteld heeft.
    check('zonder gekozen kleur is er niets te coaten', auH.coatM2 === 0,
        auH.coatM2);
    const auGecoat = await bouwMod.bouwBalustrade({ ...auMaten, afwerking: '7016' });
    check('met een kleur wel, en dat is het gemeten oppervlak',
        ks.hoeveelheden(auGecoat.onderdelen).coatM2 > 1,
        ks.hoeveelheden(auGecoat.onderdelen).coatM2 + ' m2');

    log('\n--- gekocht werk telt niet als eigen staal ---');
    // DEZELFDE REGEL ALS DE ZAAGLIJST. Hier ging het mis: de ruit draagt geen
    // vlaggetje `besteld` maar is besteld OMDAT hij van glas is. Met

        const d = new awOc.Bnd_Box_1();

        const a = d.CornerMin(), b = d.CornerMax();
        const uit = { dx: b.X() - a.X(), dy: b.Y() - a.Y(), dz: b.Z() - a.Z(),
                      y0: a.Y(), z0: a.Z() };
        d.delete();
        return uit;
    };
    const awTel = (vorm) => {
        let n = 0;
        const v = new awOc.TopExp_Explorer_2(vorm,
            awOc.TopAbs_ShapeEnum.TopAbs_SOLID, awOc.TopAbs_ShapeEnum.TopAbs_SHAPE);
        for (; v.More(); v.Next()) n++;
        v.delete();
        return n;
    };

            // doorsnijdingscontrole, de tekeningen en het zadel in de paal.
            // Steekt de vorm daarbuiten, dan klopt geen van die vier meer.
